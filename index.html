條件句形式嘅邏輯真句（<strong>P → P 的代換個例除外</strong>）。</li>\n</ul>\n</li>\n<li>每個條件句都有對應論證：<strong>前項作前提，後項作結論</strong>。⭐ <strong>S2 是一個（邏輯地）對確的論證 (valid argument)，如果且僅當 S1 是邏輯真句</strong>。<ul>\n<li><strong>論證 N</strong>：沒有人能夠活一萬歲，而所有獨裁者都是人，∴ 沒有獨裁者能夠活一萬歲。（阿門）→ 結論冇增加超出前提嘅內容，但能將隱含內容明顯披露。</li>\n</ul>\n</li>\n<li>⭐⭐ <strong>「雖不能增加新的內容，但能把既有的隱含的內容明顯地披露出來」——這正是邏輯論證的一個最基本而重要的性能所在。</strong>（複雜論證一眼睇唔出前提是否涵蘊結論 → 需要邏輯方法檢定）</li>\n<li>總括：藉析合區分，掌握邏輯一個基本特性：<strong>邏輯真句沒有實質內容</strong>（因為佢係分析語句嘅一種）；但<strong>唔能推論邏輯冇用</strong>——邏輯真句或對確論證嘅重要功用 = <strong>把既有的隱含的內容明顯地披露出來</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m33-h11\">4. 三、意義區分 ⭐⭐⭐</h2>\n<h3 id=\"m33-h12\">(A) 真假條件與認知意義</h3>\n<p><strong>X 君故事</strong> ⭐：X 君（Y 省人氏，性好哲學）一日走火入魔，話有<strong>魔鬼躲在屋隅向他獰笑</strong>。</p>\n<ul>\n<li>醫生：「點解別人睇唔到？」X：「<strong>因魔鬼非目所能見之故。</strong>」醫生：「你摸過？聽過聲？嗅過氣味？」X：「<strong>非也。此魔無形無質，無聲無味，非吾人經驗所能察知者也。他只是自存自在，躲在屋隅向我獰笑耳。</strong>」</li>\n<li>診斷：<strong>X 君患嚴重精神病</strong>；建議：<strong>速送精神病院治療</strong>。</li>\n<li><strong>醫學角度</strong>：X 君患精神病；<strong>邏輯經驗論角度</strong>：X 君嘅句子係「<strong>沒有認知意義的 (cognitively meaningless)</strong>」。</li>\n<li>⭐ 邏輯經驗論最顯著特色：一針見血點出——歷來好多「思想」或言論<strong>在認知上並不優於 X 君那種毫無意義的說法</strong>，例：<strong>柏拉圖主義者</strong>嘅「<strong>現實世界是理型世界的影象</strong>」。呢類學說披上<strong>看似嚴肅高深的言辭外衣</strong>，但語理分析可顯示佢哋<strong>不外是一堆堆沒有認知意義的句子</strong>。</li>\n</ul>\n<p><strong>咩係認知意義？</strong></p>\n<ul>\n<li>例 P：「<strong>香港中文大學有學生五千名</strong>」→ 有認知意義：知道點樣算係中大學生（校方規定、檔案、身份證明書、樣貌、指紋、簽名），原則上可以分辨 → 知道 P 喺咩情況下真、咩情況下假 → 原則上可以進一步考查。</li>\n<li>例 Q：「<strong>某甲是某乙的嫡親弟弟</strong>」→ 真嘅條件：(1) <strong>甲和乙有共同的親生父母</strong>，(2) <strong>甲是男性</strong>，(3) <strong>甲的年紀小於乙</strong>；(1)–(3) 之否定 = 令 Q 為假嘅條件。</li>\n<li>推廣：知道語句喺咩情況下真/假 → 先有可能判定真假；連咩情況下真/假都唔知 → <strong>無從着手</strong>。</li>\n<li>⭐ <strong>真假條件 (truth-conditions)</strong>：令語句為真或為假嘅情況。設 C1 令 S 為真、C2 令 S 為假 → C1、C2 就係 S 嘅真假條件。</li>\n<li>⭐⭐⭐ <strong>定義：如果一個語句 S 有真假條件，那麼 S 是有認知意義的；並且只有當 S 有真假條件時，S 才是有認知意義的。合起來說：如果且僅當 S 有真假條件，則 S 有認知意義。</strong></li>\n<li>據此：<strong>沒有認知意義的語句是說不上「真」或「假」的</strong>，即<strong>無所謂真假</strong>，乃係「<strong>假都不如</strong>」的，或說係「<strong>連『假』的資格都沒有的</strong>」。⭐ <strong>一言以蔽之，沒有認知意義的語句就是沒有真假可言的語句。</strong></li>\n</ul>\n<h3 id=\"m33-h13\">(B) 從檢證原則到印證原則 ⭐⭐⭐</h3>\n<p><strong>檢證原則 (verification principle)</strong>：</p>\n<ul>\n<li>原型 <strong>(VP)：「語句的意義在於它的檢證方法。」</strong></li>\n<li>疏解：<ol>\n<li>原則所提到嘅「語句」<strong>只限於綜合語句</strong>（分析語句不是恒真便是恒假 → <strong>皆有真假可言</strong> → 任何分析語句都有認知意義）；</li>\n<li>「意義」指「<strong>認知意義</strong>」；</li>\n<li>「檢證」= 「<strong>由經驗證明為真</strong>」（註⑭：「證明」取日常用法，<strong>不限於</strong>邏輯/數學上嘅形式推證 formal demonstration）；</li>\n<li>⚠️ <strong>很大的誤解</strong>：以為檢證原則將「<strong>實際上已證實為真</strong>」規定為有認知意義嘅必要條件 → <strong>冇咁嘅要求</strong>！只規定「<strong>原則上有可能被證明為真</strong>」係綜合語句有認知意義嘅<strong>必要條件</strong>；</li>\n<li>⭐ 縱使某語句<strong>實際上已被證明為假</strong>，都<strong>無礙</strong>佢原則上有可能被證明為真（「原則上有可能被證明為真」= 「具有被證明為真之<strong>可能性</strong>」）。例：「<strong>本人（筆者）飛刀，例不虛發</strong>」→ 事實上已證明為假，但仍然有可能（不管幾細）百發百中；</li>\n<li>「被經驗證明為真之可能性」簡稱「<strong>可檢證性 (verifiability)</strong>」→ ⭐ <strong>檢證原則只係要排斥缺乏可檢證性的綜合語句，而唔係要排斥假的語句</strong>——因為<strong>假的語句也是有認知意義的</strong>（冇認知意義嘅語句根本稱不上「真」或「假」）。</li>\n</ol>\n<ul>\n<li>註⑮：「<strong>原則上有可能</strong>」= 「<strong>最低限度是邏輯地可能</strong>」。⚠️ <strong>「技術上沒有可能」並不涵蘊「原則上沒有可能」</strong>。</li>\n</ul>\n</li>\n<li><strong>(VP*)</strong> (a) <strong>所有分析語句皆有認知意義</strong>。(b) 設 S 是綜合語句：如果 S <strong>在原則上有可能由經驗的途徑被證明為真</strong>，則 S 有認知意義；否則冇。簡言之，<strong>如果且僅當 S 有可檢證性，則 S 有認知意義。</strong></li>\n<li>應用：柏拉圖主義者「<strong>現實世界是理型世界的影象</strong>」→ <strong>既不是分析的，又冇可檢證性</strong> → 冇認知意義；「<strong>某某人有一個腦</strong>」→ 原則上可通過經驗方法證明為真 → 有認知意義。</li>\n</ul>\n<p><strong>檢證原則的問題：全稱語句</strong></p>\n<ul>\n<li><strong>全稱語句</strong>：「一切（任何、所有、凡是）X 皆如此如此」。X 係：<ul>\n<li><strong>封閉集合</strong>（包含已知有限個分子）：「<strong>凡是某某果園內的蘋果都有蟲</strong>」→ 可逐一檢查 → 檢證原則冇問題；</li>\n<li><strong>開放集合</strong>（非封閉）：「人」→ 唔能排斥「過去現在和將來的宇宙間有無限多個可稱為『人』的生物」→ 即使證實到目前每個人都有腦，<strong>都唔能證明</strong>「<strong>一切人皆有腦</strong>」（<strong>U</strong>）。</li>\n<li>U 唔可能由經驗途徑「證明」為真 → 檢證原則會判 U <strong>冇認知意義</strong> → ⚠️ <strong>荒謬</strong>！連邏輯經驗論者都唔願意咁講；⭐ <strong>極大多數科學定律都好似 U 一樣，係涉及開放集合的全稱語句，而呢種定律卻正好是「有認知意義」的典範。</strong></li>\n</ul>\n</li>\n</ul>\n<p><strong>解決：以「印證」代替「檢證」</strong> ⭐⭐⭐</p>\n<ul>\n<li>倘若能顯示某句子<strong>被經驗證據支持</strong> → 該句子（或多或少地）得到「<strong>印證</strong>」；原則上有可能被經驗證據支持 → 「<strong>可印證的</strong>」/「<strong>具有可印證性</strong>」。</li>\n<li>U：「一切人皆有腦」→ <strong>唔可能「證明」為真</strong>，但<strong>有可能被經驗證據支持</strong>（有關人腦嘅觀察構成支持 U 嘅證據，令我哋有理由「相信」U 為真）→ ⭐ <strong>儘管 U 不是可檢證的，但它仍是可印證的。</strong></li>\n<li><strong>(CP) 印證原則 (confirmation principle)</strong>：(a) <strong>所有分析語句都有認知意義</strong>。(b) 設 S 是綜合語句：如果 S <strong>在原則上有可能被經驗證據支持</strong>，那麼 S 有認知意義；反之冇。簡言之，<strong>如果且僅當 S 有可印證性，則 S 有認知意義。</strong><ul>\n<li>註⑯：任何綜合語句 S 都<strong>唔係必然地真</strong> → S 如果原則上有可能被經驗證據<strong>支持</strong>，亦有可能被經驗證據<strong>否駁</strong>。支持 S 嘅證據 = <strong>正面證據</strong>；否駁 S 嘅證據 = <strong>反面證據</strong>。前者<strong>印證 S 為真</strong>（簡稱「<strong>印證 S</strong>」）；後者<strong>印證 S 為假</strong>（簡稱「<strong>非證 S</strong>」）。⭐ <strong>「有可印證性」等於「有可非證性」</strong>——即有可能受到正面或反面證據嘅支持或否駁。</li>\n<li>註⑰：<strong>卡納普 (Carnap) 及函寶 (Hempel)</strong> 等喺印證原則嘅形式陳構做咗精細工作；形式陳構屬細節專技問題，<strong>唔影響印證原則喺方法學上嘅重大實效價值</strong>——艾耶 (Ayer)：&quot;a principle may be intuitively clear and effective even though you don&#39;t get a water-tight formal statement of it.&quot;</li>\n</ul>\n</li>\n<li>⭐⭐ <strong>比較</strong>：<strong>印證原則較檢證原則寬容得多。任何經由檢證原則鑑定為有認知意義的語句都會給印證原則鑑定為有認知意義，但反之不然</strong>（例如 U）。換句話說，**凡是通得過檢證原則的句子都通得過印證原則，然而有些通得過印證原則的句子卻通不過檢證原則。**作為「認知意義」的判準，<strong>印證原則比檢證原則更為適當合用</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m33-h14\">5. 四、意義區分的應用 ⭐⭐⭐</h2>\n<ul>\n<li>根據印證原則，<strong>玄學（即「超驗的」玄想形上學）是沒有認知意義的</strong>：玄學家聲稱研究題材係<strong>經驗範圍以外的對象</strong>，但任何關於「<strong>超驗界</strong>」嘅言論都<strong>缺乏可印證性</strong>（冇任何可能嘅經驗觀察可以算係正面或反面證據）→ <strong>冇客觀真假可言</strong>。<ul>\n<li>註⑱：「<strong>客觀真假</strong>」嘅「客觀」原是<strong>冗詞</strong>（真假本來就係客觀嘅）；用嚟提醒：綜合語句嘅真假係由<strong>客觀的經驗證據</strong>決定，唔係憑主觀意願。</li>\n</ul>\n</li>\n<li>亦適用於<strong>含有玄學成份的神學</strong>：「<strong>上帝是超越的，祂超出一切可能經驗的界限。</strong>」→ 中古時代好多人接受；近代以來趨勢認為呢類論調「<strong>不可信</strong>」→ 用印證原則可以提出<strong>更徹底的批評</strong>：唔係「不可信」，而係「<strong>無所謂可信不可信</strong>」、「<strong>無從信起</strong>」——根本稱唔上喺咩可能經驗情況下算真或假 → <strong>毫無認知意義</strong>。</li>\n</ul>\n<h3 id=\"m33-h15\">(A) 玄學的評例：齊白石的畫 ⭐⭐</h3>\n<ul>\n<li>一幅畫，有人猜係<strong>齊白石</strong>作品，有人話唔係 → 有一定程序處理：鑑畫專家檢查同公認作品嘅相似性、有冇贗品特徵、查閱作品紀錄 → 意見可能仍分歧，但<strong>知道咩經驗資料算正面或反面證據</strong>（註⑲：Ayer, <em>Language, Truth and Logic</em>, pp. 54–55）。</li>\n<li>專家讀咗哲學：有人宣稱「<strong>那幅畫只是認知者（觀畫的人）底心中的一堆觀念</strong>」（<strong>觀念論</strong>）；有人反對：「那幅畫是<strong>客觀地獨立存在的</strong>」（<strong>實在論</strong>）→ <strong>觀念論與實在論之爭</strong>。</li>\n<li>問：有咩可能嘅經驗資料可作為解決爭論嘅最後根據？<strong>冇</strong>——實在論者認為「客觀獨立存在」嘅經驗資料，觀念論者會說成「一堆觀念的集合」。</li>\n<li>依照「觀念」慣常用法，「那幅畫是觀畫者心中的一堆觀念」<strong>顯明是假的</strong>（可以摸到幅畫，摸唔到觀念）→ 觀念論者嘅「觀念」<strong>意義同通常用法唔同</strong>（僻義）→ 我哋亦無法按慣常用法了解句子意思。</li>\n<li>⭐ 作者回答觀念論者：「<strong>我不會像實在論者那樣反對你的說法，但我也不會贊同你的說法——我只是不知道你究竟說了些甚麼。</strong>」只有知道斷言陳述咗乜，先有所謂「接受」或「不接受」；你要我同意或不同意，你要先表明那說法嘅<strong>認知意義</strong>——即<strong>甚麼樣的經驗資料可能用來印證你的見解</strong>？</li>\n<li>邏輯經驗論者指出：觀念論者<strong>根本無法回答</strong> → <strong>觀念論缺乏可印證性</strong>，最多只能算係一種<strong>沒有認知意義的偽贗理論</strong>。<ul>\n<li>註⑳：倘若將實在論視為觀念論嘅否定，<strong>實在論也沒有認知意義</strong>——因為<strong>如果 P 冇認知意義，則非 P 亦然</strong>。</li>\n</ul>\n</li>\n</ul>\n<p><strong>附述：形上學的門類</strong> ⭐</p>\n<ul>\n<li><strong>觀念論是玄學的一派，玄學則是形上學的一種</strong>。形上學門類：<table>\n<thead>\n<tr>\n<th>門類</th>\n<th>內容</th>\n<th>代表</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>描述形上學</strong></td>\n<td>展示概念架構</td>\n<td><strong>史特勞遜 (Strawson)</strong> 等</td>\n</tr>\n<tr>\n<td><strong>形式存有論</strong></td>\n<td>倡議範疇系統</td>\n<td><strong>古德曼 (Goodman)</strong> 等</td>\n</tr>\n<tr>\n<td><strong>歸納形上學</strong></td>\n<td>推定宇宙模型</td>\n<td><strong>藍伯特</strong> 等</td>\n</tr>\n<tr>\n<td><strong>玄想形上學</strong></td>\n<td>研究「超驗界」或「絕對本體」</td>\n<td><strong>黑格爾 (Hegel)</strong> 等</td>\n</tr>\n</tbody></table>\n</li>\n<li>兩點注意：① 「<strong>玄學</strong>」同「<strong>形上學</strong>」有時當同義詞，但本文限定「玄學」<strong>專指玄想的形上學</strong>；② <strong>早期邏輯實徵論者</strong>對形上學一律排斥（認為任何形上學系統都缺乏認知意義），但發展到<strong>成熟階段</strong>以後，邏輯經驗論者對形上學態度<strong>越來越趨於寬容</strong>——<strong>並冇排斥形上學的全體</strong>，要批判和清除嘅主要係<strong>玄學</strong>以及任何理論、學說、主義裏面嘅<strong>玄學成份</strong>。</li>\n</ul>\n<h3 id=\"m33-h16\">(B) 神學的評例 ⭐⭐</h3>\n<ul>\n<li>神學家：「<strong>上帝是智慧的、慈愛的、全能的；他會發號施令，聽我們的禱告，希望我們有幸福，寬恕我們的罪過……</strong>」</li>\n<li>「智慧」「慈愛」「聽」「希望」「寬恕」原是描述<strong>有機體</strong>嘅能力、傾向、心理狀態；但神學家大都<strong>唔願意話上帝係有機體</strong>（有機體有繁殖、生長、吸收、排泄……對上帝太過不雅）→ 咁用嚟形容「上帝」<strong>究竟係乜意思</strong>？一個非有機體點樣「慈愛」、「聽」禱告、「寬恕」世人……<strong>難以想像</strong>。</li>\n<li>神學家答辯：「<strong>當然難以想像，因為上帝是全知全善全能的至高存有。在渺小的人類看來，上帝是不可思議的。我們那麼卑微，不能妄想用自己有限的概念去捕捉無限的上帝。</strong>」</li>\n<li>分析：顯露「<strong>講話不加思索、只憑一時心血來潮即信口開河</strong>」嘅頑劣習慣：<ul>\n<li><strong>集合論</strong>裏「有限」「無限」有嚴格定義，形容集合嘅<strong>基數（分子數）</strong>；但「<strong>有限的概念</strong>」「<strong>無限的上帝</strong>」——並非形容概念或上帝嘅集合基數（答辯者唔願意講「有無限多個上帝」）→ <strong>冇清晰嚴格說明</strong>；點樣算有限概念能否「捕捉」無限上帝，更冇交待。</li>\n<li>「<strong>全知全善全能</strong>」等話頭講多咗好似好清楚，但請佢闡明 → 只會用<strong>愈講愈胡塗</strong>嘅字眼裝作答咗 → 實係<strong>分散注意的詭策</strong>。</li>\n<li>結論：<strong>冇任何可能嘅經驗觀察可用嚟印證</strong> → 按印證原則，<strong>冇認知意義</strong>。</li>\n</ul>\n</li>\n</ul>\n<p><strong>附述：退一萬步</strong> ⭐</p>\n<ul>\n<li>就算假定答辯有認知意義，仍有極大毛病：⭐ <strong>「有認知意義」只等於「有真假可言」，並不等於「真」</strong>；答辯者既聲稱上帝<strong>不可思議</strong>，別人自然質詢：「你又點知有咁樣一個不可思議嘅上帝存在，甚至知道祂係『至高的』、『全知全善全能的』？一方面說祂不可思議，同時又長篇大論地講述祂，<strong>豈非自打咀巴</strong>？」</li>\n<li>詞窮理拙時嘅<strong>最後絕招</strong>：「<strong>你的質問反映出心裏的傲慢。如果你在上帝面前謙卑，你就不會問那種問題。如果你相信，你便不會懷疑。讓我替你祈禱，你自己也要祈禱，讓我們一起多多祈禱。</strong>」→ 「<strong>太極推手</strong>」/「<strong>下台秘訣</strong>」/「<strong>保留面子的最佳妙策</strong>」→ 實係<strong>狡猾而不負責任的詭辯</strong>：<ol>\n<li>「如果你在上帝面前謙卑，你就不會問那種問題」→ <strong>預設了「上帝是存在的」</strong>，但呢個正係爭論範圍之內 → 假定咗正待審查嘅論點 → <strong>犯了循環的謬誤</strong>。</li>\n<li>「如果你相信，你便不會懷疑」→ <strong>只是一句廢話</strong>（懷疑就唔算相信，相信自然唔會懷疑）；向懷疑嘅人講廢話 = <strong>滑頭做法</strong>。😂 傳教士懷疑太太喺外面嘅行為時，太太答：「如果你相信，你便不會懷疑。」佢會滿意咩？</li>\n<li>「多多祈禱」絕招嘅「精華」在於「<strong>兜圈子</strong>」嘅、<strong>永遠搖擺不定的兩面性格</strong>：答得到就講道理，答唔到就唔講道理，要求人<strong>以祈禱代替發問、以盲信代替懷疑</strong>。→ 你究竟打唔打算講道理？打算就唔應以「多多祈禱」作<strong>遁詞</strong>逃避理性討論；唔打算，又何必到處向人「講道」？</li>\n</ol>\n</li>\n</ul>\n<hr>\n<h2 id=\"m33-h17\">6. 五、進一步的細分 ⭐⭐⭐</h2>\n<h3 id=\"m33-h18\">(A) 方法學的次區分</h3>\n<p><strong>圖四</strong>：</p>\n<pre><code>| 分析語句 |    綜合語句     |\n|    X    |   Y   |   Z    |\n|   有認知意義     | 無認知意義 |\n</code></pre>\n<ul>\n<li><strong>X</strong>：分析語句 → 全部說得上真/假 → <strong>全部有認知意義</strong>。</li>\n<li><strong>Y</strong>：<strong>有認知意義的綜合語句</strong>（例：<strong>經驗科學的語句</strong>——有真假可言，但唔能僅靠語言分析決定）。</li>\n<li><strong>Z</strong>：<strong>沒有認知意義的綜合語句</strong>（例：「<strong>牆上那幅畫只是認知者心中的一堆觀念</strong>」）。</li>\n<li><strong>次區分 (subdistinction)</strong>：「恒真句 vs 矛盾句」及「綜合真句 vs 綜合假句」係析合區分之下嘅次一步細分。</li>\n<li>有認知意義嘅語句再分：分析語句所具有嘅意義 = ⭐ <strong>邏輯意義</strong>；有認知意義嘅綜合語句所具有嘅意義 = ⭐ <strong>經驗意義</strong>。</li>\n<li>冇認知意義嘅語句再分兩個<strong>次類 (subclasses)</strong>：① 雖無認知意義但仍有「<strong>非知意義 (non-cognitive meaning)</strong>」；② 既無認知意義也冇非知意義 = <strong>全無意義</strong>。</li>\n</ul>\n<h3 id=\"m33-h19\">(B) 「非知意義」與「全無意義」⭐⭐⭐</h3>\n<ul>\n<li>比較：<ul>\n<li><strong>K1</strong>：「<strong>任何人的壽命或超過一百歲或不超過一百歲</strong>」→ <strong>分析語句</strong></li>\n<li><strong>K2</strong>：「<strong>任何人的壽命都超過一百歲</strong>」→ <strong>有可印證性的綜合語句</strong>（雖然係假）</li>\n<li><strong>K3</strong>：「<strong>任何人都應該每月祈禱至少一百次</strong>」→ 唔係分析（真假唔能靠語言分析決定）；亦唔係有可印證性嘅綜合語句——「<strong>X 應該如何如何</strong>」形式一般只表示<strong>對行為所作的規範</strong>，<strong>唔陳述經驗事態</strong>。即使同意所有關於人嘅經驗性質，仍可能對「應否每月祈禱一百次」持相反意見 → <strong>冇可印證性</strong> → <strong>冇認知意義</strong>。</li>\n</ul>\n</li>\n<li>⭐ <strong>唔能從「某語句沒有認知意義」推論「該語句沒有意義」</strong>：依慣常用法，<strong>認知意義只是意義的一種，而不是意義的全部</strong>（好比<strong>動物只是生物的一種</strong>）。我哋可能唔接受 K3，但唔會話佢不可理解或冇意義 → K3 有 ⭐ <strong>規範意義</strong>。</li>\n<li><strong>非知意義</strong>包括：<strong>規範意義、情感意義、評價意義、美學意義</strong>……<table>\n<thead>\n<tr>\n<th>非知意義</th>\n<th>定義</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>情感意義</strong></td>\n<td>主要用嚟<strong>表露情感或引起情感反應</strong></td>\n<td>「<strong>春花秋月何時了，往事知多少</strong>」；「<strong>風蕭蕭兮易水寒，壯士一去兮不復還</strong>」</td>\n</tr>\n<tr>\n<td><strong>評價意義</strong></td>\n<td>主要用嚟<strong>陳述對事物的價值評判</strong></td>\n<td>「<strong>鐘鼓饌玉不足貴，但願長醉不願醒</strong>」；「<strong>萬般皆下品，惟有讀書高</strong>」</td>\n</tr>\n<tr>\n<td><strong>美學意義</strong></td>\n<td>主要用嚟<strong>傳達或營造藝術性的意象、境界或感受</strong></td>\n<td>「<strong>大江東去，浪淘盡、千古風流人物</strong>」；「<strong>錦江春色來天地，玉壘浮雲變古今</strong>」；「<strong>今宵酒醒何處？楊柳岸，曉風殘月</strong>」</td>\n</tr>\n</tbody></table>\n</li>\n<li>⭐ <strong>各種非知意義不是互相排斥的</strong>：同一句子往往具多過一種，例：「<strong>某甲是一個混蛋</strong>」→ 既表露厭惡（情感），又陳述貶抑評判（評價）。「<strong>將軍百戰身名裂，向河梁，回頭萬里，故人長絕</strong>」→ 營造藝術意境（美學）+ 引起悲壯蒼涼情懷（情感）。</li>\n<li>⭐⭐ <strong>就連認知意義和非知意義也不是互相排斥的</strong>：有啲語句<strong>同時兼有</strong>：「<strong>西風殘照，漢家陵闕</strong>」「<strong>十步殺一人，千里不留行</strong>」「<strong>千山鳥飛絕，萬徑人蹤滅</strong>」「<strong>落霞與孤鶩齊飛，秋水共長天一色</strong>」→ 以美學意義為主，但亦多多少少對<strong>經驗事態作出描述</strong> → 亦可視為具有認知意義。<ul>\n<li>⚠️ 但「有的語句可能同時具有認知意義和非知意義」<strong>並不涵蘊</strong>「所有語句皆有認知意義和非知意義」：<strong>泰戈爾 (Tagore)</strong> 詩句「<strong>塵土被侮辱，卻報以鮮花</strong>」「<strong>小花躺在塵土裡，尋覓那蝴蝶的路徑</strong>」「<strong>乾涸的河床覺得毋需感謝它的過去</strong>」「<strong>蜘網要捕捉蒼蠅，卻假裝在捕捉露珠</strong>」→ <strong>冇描述經驗事態、缺乏可印證性 → 冇認知意義</strong>，但有非知意義（至少<strong>美學意義</strong>）。</li>\n</ul>\n</li>\n<li><strong>全無意義的語句</strong>：既無認知意義、亦無非知意義：「<strong>算術的質量是三十寸</strong>」「<strong>同一性在磁場上蹓冰</strong>」「<strong>正方形喝了半副撲克牌</strong>」→ 冇規範、情感、評價、美學或其他非知意義。<ul>\n<li>註㉒：呢啲字詞組合雖無意義，但仍具有作為一個語句嘅<strong>文法形式</strong>，所以稱為「全無意義的語句」。仲有<strong>連「語句」都稱不上</strong>嘅字詞組合：「<strong>的質量算術寸三十是</strong>」「<strong>於者同一性也不乎之不</strong>」。批評語句冇意義<strong>唔等於</strong>話唔可能約定地「賦給」佢某個意義（任何聲音或筆劃都「可能」通過約定而「獲得」意義），但同評定某語句為無意義<strong>毫不相干</strong>。</li>\n<li>註㉑：(1) 決定句子有咩意義，每每要考慮<strong>脈絡</strong>；(2) 本文談到嘅非知意義<strong>不必窮盡</strong>全部，只係較重要嘅幾種；(3) ⭐ <strong>邏輯經驗論者如艾耶、卡納普</strong>將任何非知意義都<strong>籠統稱為「情感意義」</strong>→ <strong>實過於粗略</strong>（參 R. M. Hare <em>The Language of Morals</em>；G. J. Warnock）。</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m33-h20\">(C) 圖五：一個概括性的圖解 → 見本筆記第 0 節 ⭐⭐⭐</h3>\n<hr>\n<h2 id=\"m33-h21\">7. 六、總結：避免兩個思想上的泥沼 ⭐⭐⭐</h2>\n<p>掌握兩個方法學區分（及次區分）= 掌握現代哲學思考兩項極有效用嘅利器 → 避免兩個常見<strong>思想上的泥沼</strong>：</p>\n<p><strong>第一、「析合區分」能夠使我們認清各式各樣狂熱而獨斷的「教條主義」的盲目態度之所在。</strong></p>\n<ul>\n<li>教條主義者以為所奉教條係關於宇宙和人生嘅「<strong>最高、最根本的真理</strong>」→ 咁就必須係<strong>有實質內容的綜合語句</strong>；但佢哋又<strong>不能容忍任何人有半分懷疑</strong>，堅信教條係「<strong>必然地真的</strong>」。</li>\n<li>⭐⭐ 可惜冇咁便宜：<strong>一個語句如有實質內容，它就不會是分析的，因而也就不會是必然的；一個語句如果要有必然性，它就只有是分析的，因而也就只有是一個缺乏實質內容的句子。一言以蔽之，沒有任何語句能夠既有實質內容，又有必然性。</strong></li>\n</ul>\n<p><strong>第二、「意義區分」可以使我們辨識「有認知意義」與「無認知意義」的不同性質，並對缺乏認知意義的一類語句有銳利的警覺。</strong></p>\n<ul>\n<li>喺<strong>認知性的探討</strong>中（註㉓：指探究、討論等思考性活動），我哋便唔會提出不相干、冇認知意義嘅說法，例如：<ul>\n<li><strong>黑格爾</strong>：「『<strong>有』深入於其自身……『絕對』乃是『有』……『絕對』即是『無』</strong>」（註㉔：《小邏輯》第一部第一篇第 84–87 節）</li>\n<li>某些「<strong>現象學家</strong>」：「<strong>意向性地不存在的本質之內在性乃在於它們在純粹直覺之前的自我給與性</strong>」</li>\n<li>「<strong>作為一個即興詩人的我</strong>」夢囈般吟哦：「<strong>信仰騎着懷疑在有限與無限以及祈禱與睡覺之間兜圈子</strong>」</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h2 id=\"m33-h22\">8. 考試速攻 ⚠️⭐</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>講法</th>\n<th>答案</th>\n<th>理由</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>邏輯經驗論早期稱為邏輯實徵論</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>艾耶同萊興巴赫係維也納學圈成員</td>\n<td><strong>F</strong></td>\n<td>唔屬於，但有密切聯繫；施里克、卡納普先係</td>\n</tr>\n<tr>\n<td>兩個方法學區分：析合區分、意義區分</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析語句 = 其意義（用法）足以決定其真假</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>綜合語句 = 不是分析語句嘅語句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「香港有所中文大學」係分析語句</td>\n<td><strong>F</strong></td>\n<td>綜合（要經驗考察）</td>\n</tr>\n<tr>\n<td>「凡物熱縮冷脹」係綜合假句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「光的入射角等於反射角」係必然地真</td>\n<td><strong>F</strong></td>\n<td>事實上真、<strong>適然</strong>；所以科學家要做實驗</td>\n</tr>\n<tr>\n<td>綜合真句 + 綜合假句窮盡全部綜合語句</td>\n<td><strong>F</strong></td>\n<td>仲有冇真假可言嘅（E、F）</td>\n</tr>\n<tr>\n<td>必然地真 = 在任何可能的情況下皆為真</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「P 必然為真」=「P 不可能為假」</td>\n<td><strong>T</strong></td>\n<td>註⑧</td>\n</tr>\n<tr>\n<td>「李天命有兩隻手」係必然地真</td>\n<td><strong>F</strong></td>\n<td>事實上真</td>\n</tr>\n<tr>\n<td>分析地真嘅語句容納一切可能情況，所以冇實質內容</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析地假嘅語句容納一切可能情況</td>\n<td><strong>F</strong></td>\n<td><strong>排斥</strong>一切可能情況</td>\n</tr>\n<tr>\n<td>句子有實質內容就一定係綜合語句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「人皆有理性」喺辯護者嘅解釋下變成分析語句，真但空洞無物</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「歷史的潮流不可抵擋」中「不可」至少有「不應該」「不能夠」兩個意思</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析語句冇實質內容，所以分析語句都冇用</td>\n<td><strong>F</strong></td>\n<td>要睇邊個、喺咩脈絡</td>\n</tr>\n<tr>\n<td>一切邏輯真句都係分析地真</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>邏輯真句冇實質內容，所以邏輯冇用</td>\n<td><strong>F</strong></td>\n<td>可<strong>將隱含內容明顯地披露出來</strong></td>\n</tr>\n<tr>\n<td>對確論證嘅結論增加咗前提以外嘅新內容</td>\n<td><strong>F</strong></td>\n<td>冇增加，只係<strong>披露</strong></td>\n</tr>\n<tr>\n<td>S2 係對確論證若且唯若 S1（對應條件句）係邏輯真句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「現實世界是理型世界的影象」冇認知意義</td>\n<td><strong>T</strong></td>\n<td>柏拉圖主義；冇可檢證性</td>\n</tr>\n<tr>\n<td>如果且僅當 S 有真假條件，則 S 有認知意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>冇認知意義嘅語句係「假都不如」</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>檢證原則要求語句「實際上已證實為真」先有認知意義</td>\n<td><strong>F</strong></td>\n<td><strong>很大的誤解</strong>；只要「<strong>原則上有可能</strong>」</td>\n</tr>\n<tr>\n<td>實際上已證明為假嘅語句冇認知意義</td>\n<td><strong>F</strong></td>\n<td>「本人飛刀，例不虛發」仍有可能被證明為真</td>\n</tr>\n<tr>\n<td>檢證原則要排斥假嘅語句</td>\n<td><strong>F</strong></td>\n<td>只排斥<strong>缺乏可檢證性</strong>嘅綜合語句；假語句有認知意義</td>\n</tr>\n<tr>\n<td>「技術上沒有可能」涵蘊「原則上沒有可能」</td>\n<td><strong>F</strong></td>\n<td>原則上可能 = <strong>最低限度邏輯地可能</strong></td>\n</tr>\n<tr>\n<td>檢證原則所講嘅語句只限於綜合語句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「凡是某某果園內的蘋果都有蟲」用檢證原則冇問題</td>\n<td><strong>T</strong></td>\n<td><strong>封閉集合</strong></td>\n</tr>\n<tr>\n<td>「一切人皆有腦」可檢證</td>\n<td><strong>F</strong></td>\n<td>開放集合；<strong>不可檢證但可印證</strong></td>\n</tr>\n<tr>\n<td>科學定律多數係涉及開放集合嘅全稱語句</td>\n<td><strong>T</strong></td>\n<td>有認知意義嘅典範</td>\n</tr>\n<tr>\n<td>通得過印證原則嘅句子一定通得過檢證原則</td>\n<td><strong>F</strong></td>\n<td><strong>反過嚟</strong>：通得過檢證 → 一定通得過印證</td>\n</tr>\n<tr>\n<td>印證原則比檢證原則更適當合用</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「有可印證性」等於「有可非證性」</td>\n<td><strong>T</strong></td>\n<td>註⑯</td>\n</tr>\n<tr>\n<td>「客觀真假」嘅「客觀」係冗詞</td>\n<td><strong>T</strong></td>\n<td>註⑱</td>\n</tr>\n<tr>\n<td>玄學（超驗玄想形上學）冇認知意義</td>\n<td><strong>T</strong></td>\n<td>缺乏可印證性</td>\n</tr>\n<tr>\n<td>用印證原則批評神學：上帝論調係「不可信」</td>\n<td><strong>F</strong></td>\n<td>更徹底：「<strong>無所謂可信不可信</strong>」「<strong>無從信起</strong>」</td>\n</tr>\n<tr>\n<td>觀念論同實在論之爭可以用經驗資料解決</td>\n<td><strong>F</strong></td>\n<td>冇可能經驗資料可作最後根據</td>\n</tr>\n<tr>\n<td>作者會反對觀念論者嘅說法</td>\n<td><strong>F</strong></td>\n<td>「不反對也不贊同——<strong>只是不知道你究竟說了些甚麼</strong>」</td>\n</tr>\n<tr>\n<td>如果 P 冇認知意義，非 P 都冇</td>\n<td><strong>T</strong></td>\n<td>實在論亦然（註⑳）</td>\n</tr>\n<tr>\n<td>玄學係形上學嘅一種，觀念論係玄學一派</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>描述形上學代表係史特勞遜</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>成熟期邏輯經驗論者排斥全部形上學</td>\n<td><strong>F</strong></td>\n<td>越趨寬容，主要清除<strong>玄學</strong></td>\n</tr>\n<tr>\n<td>「有認知意義」等於「真」</td>\n<td><strong>F</strong></td>\n<td>只等於「<strong>有真假可言</strong>」</td>\n</tr>\n<tr>\n<td>「如果你在上帝面前謙卑，你就不會問那種問題」犯循環謬誤</td>\n<td><strong>T</strong></td>\n<td>預設上帝存在</td>\n</tr>\n<tr>\n<td>「如果你相信，你便不會懷疑」係廢話</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析語句嘅意義 = 邏輯意義；有認知意義嘅綜合語句 = 經驗意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「任何人的壽命都超過一百歲」冇認知意義</td>\n<td><strong>F</strong></td>\n<td>有可印證性嘅綜合語句（假但有認知意義）</td>\n</tr>\n<tr>\n<td>「任何人都應該每月祈禱至少一百次」有認知意義</td>\n<td><strong>F</strong></td>\n<td>冇可印證性；有<strong>規範意義</strong></td>\n</tr>\n<tr>\n<td>冇認知意義就係冇意義</td>\n<td><strong>F</strong></td>\n<td>認知意義只係意義嘅一種（動物/生物）</td>\n</tr>\n<tr>\n<td>「萬般皆下品，惟有讀書高」有評價意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「大江東去，浪淘盡、千古風流人物」有美學意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「風蕭蕭兮易水寒」有情感意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>各種非知意義互相排斥</td>\n<td><strong>F</strong></td>\n<td>「某甲是一個混蛋」：情感 + 評價</td>\n</tr>\n<tr>\n<td>認知意義同非知意義互相排斥</td>\n<td><strong>F</strong></td>\n<td>「西風殘照，漢家陵闕」兼有</td>\n</tr>\n<tr>\n<td>泰戈爾「塵土被侮辱，卻報以鮮花」有認知意義</td>\n<td><strong>F</strong></td>\n<td>只有非知（美學）意義</td>\n</tr>\n<tr>\n<td>「正方形喝了半副撲克牌」全無意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「的質量算術寸三十是」係全無意義的語句</td>\n<td><strong>F</strong></td>\n<td><strong>連語句都稱不上</strong></td>\n</tr>\n<tr>\n<td>艾耶、卡納普將非知意義籠統稱為情感意義，作者認同</td>\n<td><strong>F</strong></td>\n<td>作者認為<strong>過於粗略</strong></td>\n</tr>\n<tr>\n<td>冇任何語句能夠既有實質內容又有必然性</td>\n<td><strong>T</strong></td>\n<td>總結第一點</td>\n</tr>\n<tr>\n<td>析合區分使我們認清教條主義嘅盲目態度</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「無自無」係海德格語，全無意義</td>\n<td><strong>T</strong></td>\n<td>圖五 F</td>\n</tr>\n</tbody></table>\n"},"tocs":{"m21":[{"id":"m21-h2","lvl":2,"text":"0. 一句總結（先記呢句）"},{"id":"m21-h3","lvl":2,"text":"1. 引言：點解要語理分析？"},{"id":"m21-h4","lvl":2,"text":"2. 一、當代西方哲學概況 —— 英美哲學 vs 歐陸哲學的對壘"},{"id":"m21-h5","lvl":3,"text":"2.1 兩大陣營 ⭐"},{"id":"m21-h6","lvl":3,"text":"2.2 分析哲學家嘅批評"},{"id":"m21-h7","lvl":3,"text":"2.3 馬色爾 (Gabriel Marcel) 的故事 ⭐"},{"id":"m21-h8","lvl":3,"text":"2.4 「邊個境界高？」⭐"},{"id":"m21-h9","lvl":2,"text":"3. 二、分析哲學的方法進路 —— 從古代思想到現代分析思考"},{"id":"m21-h10","lvl":3,"text":"3.1 分析哲學四個階段／種別 ⭐（20 世紀初「哲學的革命」萌芽）"},{"id":"m21-h11","lvl":3,"text":"3.2 西方哲學發展線索（圖一）⭐⭐"},{"id":"m21-h12","lvl":3,"text":"3.3 「預設」(Presupposition) 的例子 ⭐"},{"id":"m21-h13","lvl":3,"text":"3.4 點解語理分析比知識論更基本？⭐⭐"},{"id":"m21-h14","lvl":3,"text":"3.5 語理分析處理問題嘅步驟 ⭐"},{"id":"m21-h15","lvl":2,"text":"4. 三、對文字把戲的破解 —— 四類最易惑人心思的文字把戲 ⭐⭐⭐"},{"id":"m21-h16","lvl":3,"text":"(A) 無中生有派 ⭐"},{"id":"m21-h17","lvl":3,"text":"(B) 跳高一層派（某個意義派／觀點角度派）⭐"},{"id":"m21-h18","lvl":3,"text":"(C) 另一種 X 派 ⭐"},{"id":"m21-h19","lvl":3,"text":"(D) 空洞派 ⭐⭐"},{"id":"m21-h20","lvl":2,"text":"5. 四、澄清與定位"},{"id":"m21-h21","lvl":3,"text":"5.1 語理分析的方法進路（最簡略講法）⭐"},{"id":"m21-h22","lvl":3,"text":"5.2 (A) 有關語理分析的五項澄清（對語理分析嘅誤解）⭐⭐"},{"id":"m21-h23","lvl":3,"text":"5.3 (B) 語理分析的定位：思考方法學的起點 ⭐⭐⭐"},{"id":"m21-h24","lvl":3,"text":"5.4 其他註釋（細節題）"},{"id":"m21-h25","lvl":2,"text":"6. 考試速攻：MC / T-F 高危考點 ⚠️"}],"m2a":[{"id":"m2a-h2","lvl":2,"text":"0. 一句總結"},{"id":"m2a-h3","lvl":2,"text":"1. 開場引言（slide 1–2）"},{"id":"m2a-h4","lvl":2,"text":"2. 西方哲學中的理性傳統（slide 3）⭐"},{"id":"m2a-h5","lvl":2,"text":"3. 語理分析 Logico-linguistic Analysis（slide 4–6）⭐⭐"},{"id":"m2a-h6","lvl":3,"text":"3.1 定義／特徵"},{"id":"m2a-h7","lvl":3,"text":"3.2 基本步驟 ⭐⭐（背次序）"},{"id":"m2a-h8","lvl":3,"text":"3.3 起點 &amp; 終點 ⭐⭐⭐"},{"id":"m2a-h9","lvl":2,"text":"4. 問題分類 Classification of Questions ⭐⭐⭐"},{"id":"m2a-h10","lvl":3,"text":"4.1 判斷技巧（考試用）⭐"},{"id":"m2a-h11","lvl":3,"text":"4.2 ⚠️ 易錯位"},{"id":"m2a-h12","lvl":2,"text":"5. 三類問題有高低嗎？（slide 13）⭐⭐"},{"id":"m2a-h13","lvl":2,"text":"5½. 課堂補充：講者點樣判斷（考試以此為準）⭐⭐⭐"},{"id":"m2a-h14","lvl":2,"text":"6. 考試速攻 ⚠️"}],"m22":[{"id":"m22-h2","lvl":2,"text":"0. 總覽：六大語言陷阱（必背）⭐⭐⭐"},{"id":"m22-h3","lvl":2,"text":"1. 闕義 (Meaning-incomplete) ⭐⭐"},{"id":"m22-h4","lvl":3,"text":"(A) 定義"},{"id":"m22-h5","lvl":3,"text":"(B) 例釋：政制與生命"},{"id":"m22-h6","lvl":3,"text":"(C) 闕義的原則 ⭐⭐"},{"id":"m22-h7","lvl":2,"text":"2. 歧義 (Ambiguous) ⭐⭐⭐"},{"id":"m22-h8","lvl":3,"text":"(A) 定義"},{"id":"m22-h9","lvl":3,"text":"歧義嘅成因 ⭐"},{"id":"m22-h10","lvl":3,"text":"(B) 例釋：勝敗與自由 ⭐⭐"},{"id":"m22-h11","lvl":3,"text":"(C) 歧義的原則 ⭐⭐"},{"id":"m22-h12","lvl":2,"text":"3. 含混 (Vague) ⭐⭐⭐"},{"id":"m22-h13","lvl":3,"text":"(A) 定義"},{"id":"m22-h14","lvl":3,"text":"⭐⭐ 含混 vs 歧義（必考對比）"},{"id":"m22-h15","lvl":3,"text":"(B) 例釋：善惡與貧富 ⭐⭐"},{"id":"m22-h16","lvl":3,"text":"(C) 含混的原則 ⭐⭐"},{"id":"m22-h17","lvl":2,"text":"4. 著色 (Coloured Expression / Emotive Expression) ⭐⭐⭐"},{"id":"m22-h18","lvl":3,"text":"(A) 定義"},{"id":"m22-h19","lvl":3,"text":"(B) 例釋：堅定與固執 ⭐⭐⭐"},{"id":"m2 21-mc-5-67uje","type":"mc","topic":"m21","q":"「近視眼爭匾額」的笑話主要說明：","opts":["爭論之前，要先確定我們的認知能力能達到所爭論的目的物","近視的人不宜參與哲學討論","匾額上的字詞具有歧義","爭論應由在場多數人決定"],"ans":0,"exp":"明眼人：「亭子上面根本沒有任何匾額哩！」→ 導向知識論：人的認知能力有甚麼限度？","tags":[],"src":"mc"},{"id":"m21-mc-6-zk58x","type":"mc","topic":"m21","q":"Q 先生問女朋友：「我們結婚時舉行西式還是中式的婚禮？」此例用來說明：","opts":["預設 (presupposition)：此問題預設了更基本的問題「你會跟我結婚嗎？」","歧義：「婚禮」有兩個意思","含混：「西式」「中式」沒有明確界線","著色：「婚禮」帶有情感色彩"],"ans":0,"exp":"前一種問題預設着後一種問題 → 解釋為何近代哲學轉向知識論。","tags":[],"src":"mc"},{"id":"m21-mc-7-m2cgx","type":"mc","topic":"m21","q":"柏烈得萊 (Bradley)：「絕對進入演進和進步裏，而它自己卻不能演進和進步。」按語理分析，這句話：","opts":["缺乏認知意義，連假語句的資格都沒有","是一個假語句","是真但多餘的語句","是一個分析地真的語句"],"ans":0,"exp":"屬「無中生有派」：驟眼似有認知意義，分析後原來沒有。","tags":[],"src":"mc"},{"id":"m21-mc-8-edzkl","type":"mc","topic":"m21","q":"「黑格爾之謎」（X 是物質在它的無形性及其液化性之中的自我復元……）中的 X 是：","opts":["熱","光","電","時間"],"ans":0,"exp":"引自白連沙德 (Blanshard)，他懷疑這段是無意義的字面堆砌；白連沙德本身不算分析哲學家。","tags":[],"src":"mc"},{"id":"m21-mc-9-1qeuy","type":"mc","topic":"m21","q":"對於黑格爾之謎那段話，李天命認為恰當的處理是：","opts":["先檢查它是否有認知意義，因為贊同或反對都假定了它是確定的斷述","應該反對，因為它是假的","應該贊同，因為黑格爾是大哲學家","應該存而不論，因為它屬於宗教"],"ans":0,"exp":"贊同或反對都有問題。","tags":[],"src":"mc"},{"id":"m21-mc-10-1lf0w","type":"mc","topic":"m21","q":"「在平常意義下你的批評正確，但在某個更深的意義之下我的說法才正確。」這屬於哪一類文字把戲？","opts":["跳高一層派（某個意義派／觀點角度派）","無中生有派","另一種X派","空洞派"],"ans":0,"exp":"以「層次」「意義」「觀點」「角度」作擋箭牌；破解：以子之矛，攻子之盾。","tags":[],"src":"mc"},{"id":"m21-mc-11-1phxt","type":"mc","topic":"m21","q":"「通常說的自由民主是假自由假民主，我們所說的才是真自由真民主。」屬於：","opts":["另一種X派","跳高一層派","無中生有派","空洞派"],"ans":0,"exp":"「指鹿為馬」的翻版，用在「自由」「民主」等抽象名詞上，較易逃過覺察。","tags":[],"src":"mc"},{"id":"m21-mc-12-1bq06","type":"mc","topic":"m21","q":"根據李天命，a 可說是「另一種 b」的必要條件是：","opts":["a 與 b 的類屬性徵 (generic characteristics) 大致相同","a 與 b 的名稱相同","a 比 b 更真實","a 與 b 被同一群人使用"],"ans":0,"exp":"斑馬是另一種馬、化石是另一種石；但鹿不是另一種馬、石頭不是另一種蛋糕。","tags":[],"src":"mc"},{"id":"m21-mc-13-4ml70","type":"mc","topic":"m21","q":"江湖神棍說：「其實你已經得到上帝保佑了，不然你遭到的不幸會更多。」這種說法屬於：","opts":["空洞派（油腔滑調）","另一種X派","跳高一層派","無中生有派"],"ans":0,"exp":"任何情形下都能被解釋成正確，避開否證。","tags":[],"src":"mc"},{"id":"m21-mc-14-gaeo3","type":"mc","topic":"m21","q":"李天命指「油腔滑調」的言論最大的代價是：","opts":["不能提供任何確定的知識或具體的指引","很容易被別人否證","用語太過精密，一般人看不明","會激發強烈情緒"],"ans":0,"exp":"例：工程學教授「所取的材料要合用，所用的圖則要適宜」。","tags":[],"src":"mc"},{"id":"m21-mc-15-1gpz0","type":"mc","topic":"m21","q":"以下哪一項「不」屬於李天命所講的現代思考方法學四種方法？","opts":["語意學 (semantics)","語理分析","邏輯方法","謬誤剖析"],"ans":0,"exp":"四種：語理分析、邏輯方法、科學方法、謬誤剖析。語意學是一門學科。","tags":[],"src":"mc"},{"id":"m21-mc-16-1l4oy","type":"mc","topic":"m21","q":"為何「謬誤剖析」不是思考方法學最基本的部份？","opts":["因為它是其他三種方法（語理分析、邏輯方法、科學方法）的引申","因為它只處理日常生活問題","因為它不需要語言","因為它比科學方法更晚出現"],"ans":0,"exp":"判斷謬誤要依據語理分析、邏輯方法、科學方法。","tags":[],"src":"mc"},{"id":"m21-mc-17-cskhx","type":"mc","topic":"m21","q":"語理分析與語意學 (semantics) 的關係，李天命的結論是：","opts":["語理分析是語意學的基礎方法，語意學可作為語理分析的輔助工具","語理分析就是語意學","語意學是語理分析的基礎方法","兩者毫無關係"],"ans":0,"exp":"語意學是「學科」；語理分析是探究問題的「方法」或「進路」。","tags":[],"src":"mc"},{"id":"m21-mc-18-19ouq","type":"mc","topic":"m21","q":"「宇宙是否在膨脹？」按李天命：","opts":["屬經驗問題，主要憑藉科學方法，語理分析只是最起碼的工夫","屬概念問題，分析清楚概念就等於解決","屬偽贗問題，應被解消","屬評價問題，要靠個人價值觀"],"ans":0,"exp":"對比：「甚麼是真、善、美？」是概念問題。","tags":[],"src":"mc"},{"id":"m21-mc-19-1cfzv","type":"mc","topic":"m21","q":"語理分析在思考方法學中的定位是：","opts":["起點，但不是終點","終點，但不是起點","既是起點亦必然是終點","可有可無的輔助"],"ans":0,"exp":"知識系統的建構更有賴其他方法（特別是科學方法）。","tags":[],"src":"mc"},{"id":"m21-mc-20-1gfv8","type":"mc","topic":"m21","q":"以下哪位是「日常語言學派」的代表？","opts":["奧斯丁 (Austin)","卡納普 (Carnap)","塔斯基 (Tarski)","函寶 (Hempel)"],"ans":0,"exp":"日常語言學派：後期維根斯坦、韋斯登、懷士曼、萊爾、奧斯丁、史特勞遜。","tags":[],"src":"mc"},{"id":"m21-mc-21-au2gv","type":"mc","topic":"m21","q":"以下哪位「不」是邏輯實徵論 (Logical Positivism) 的代表人物？","opts":["萊爾 (Ryle)","卡納普 (Carnap)","施里克 (Schlick)","艾耶 (Ayer)"],"ans":0,"exp":"萊爾屬日常語言學派。邏輯實徵論：卡納普、施里克、艾耶、函寶、萊興巴赫。","tags":[],"src":"mc"},{"id":"m21-mc-22-gqooe","type":"mc","topic":"m21","q":"邏輯實徵論由「維也納學圈」衍發，以甚麼著稱？","opts":["反對玄學、強調科學","強調直覺、描述本質結構","強調人的自主性與獨特性","以日常用法解消哲學問題"],"ans":0,"exp":"後來又稱「邏輯經驗論 (Logical Empiricism)」。","tags":[],"src":"mc"},{"id":"m21-mc-23-195a9","type":"mc","topic":"m21","q":"分析哲學最主要的特點是：","opts":["它處理問題時所用的方法——語理分析","它只研究英語","它反對一切科學","它重視人的情感與存在"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m21-mc-24-yb2q5","type":"mc","topic":"m21","q":"用柏斯摩爾 (Passmore) 的話，分析家指責歐陸哲學家：","opts":["糟蹋人的思想（「沒有腦」）","糟蹋人的靈魂（「沒有心」）","瑣碎冷硬而忽略人的情感","把人變成機器"],"ans":0,"exp":"歐陸哲學家則指責分析哲學「糟蹋人的靈魂」（沒有心）。","tags":[],"src":"mc"},{"id":"m21-mc-25-1029z","type":"mc","topic":"m21","q":"對於沒有意義的偽贗問題 (pseudo-problem)，語理分析的工作是：","opts":["解消 (dissolve) 它","解答它","用科學實驗檢驗它","用投票決定答案"],"ans":0,"exp":"有意義的問題才進一步作精細審定。","tags":[],"src":"mc"},{"id":"m21-mc-26-tmruq","type":"mc","topic":"m21","q":"分析「人是否命定？」時，語理分析應首先分析哪個關鍵用語？","opts":["命定","人","是","否"],"ans":0,"exp":"語理分析只分析論題中的關鍵用語，並不是「執着文字」。","tags":[],"src":"mc"},{"id":"m21-mc-27-u0gfm","type":"mc","topic":"m21","q":"馬色爾 (Marcel) 說「假如有一架鋼琴在這裏的話，我倒可以把我的意思彈奏出來」。作者設想的分析家反駁重點是：","opts":["哲學是思考的學問，不可或缺的工具是語言；音樂的工具才是樂器","鋼琴比語言更精確","哲學家應該學習音樂","歐陸哲學比分析哲學境界更高"],"ans":0,"exp":"哲學家不善用自己的工具，反而想用樂器思考 → 注定失敗。","tags":[],"src":"mc"},{"id":"m21-mc-28-1e6yv","type":"mc","topic":"m21","q":"有人說「釐清是不足夠的！語理分析是有其一定限度的！」作者的回應要旨是：","opts":["任何東西都可以說是「不足夠」，這句話本身也不足夠；有毛病的是對方對語理分析的看法","語理分析確實沒有任何價值","語理分析可以解決一切問題","應改用語意學"],"ans":0,"exp":"數學不能醫人、醫學不能烹飪……","tags":[],"src":"mc"},{"id":"m21-mc-29-swh0u","type":"mc","topic":"m21","q":"李天命所講的思考方法學，主要考慮的是：","opts":["各種思考的審查與核證 (justification) 問題","發現的過程 (discovery)","管理的方法","教育的方法"],"ans":0,"exp":"發現過程很多時沒有定則可循；狹義的方法學＝科學方法學。","tags":[],"src":"mc"},{"id":"m21-mc-30-1thnr","type":"mc","topic":"m21","q":"以下哪一項「不」是陷於「封閉系統」的人的特徵？","opts":["樂於接受別人對其信仰的懷疑","到處發現「證實」其信仰的例子","充滿「作見証」的衝動甚至狂熱","不能忍受任何懷疑"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m21-mc-31-8b125","type":"mc","topic":"m21","q":"「信就得神恩，不信就遭神罰」被批評的問題是：","opts":["「神恩」與「神罰」之間的使用界線模糊不清、遊移不定","它是一個矛盾句","它使用了實化","它是規創定義"],"ans":0,"exp":"封閉系統例子：屋燒了——敵人就話是懲罰，朋友就話是恩典。","tags":[],"src":"mc"},{"id":"m21-mc-32-rosfy","type":"mc","topic":"m21","q":"「孔子的體重超過五百磅……倘若孔子揹着南子，南子揹着子路……」這個例子用來諷刺：","opts":["跳高一層派（某個意義派）","另一種X派","空洞派","無中生有派"],"ans":0,"exp":"「在某個更高的意義之下我說的就很對」。","tags":[],"src":"mc"},{"id":"m21-mc-33-zu49f","type":"mc","topic":"m21","q":"「成功的秘訣是在最恰當的時刻做最恰當的事。」被李天命列為：","opts":["封閉系統（空洞、不着邊際）的例子","分析地假的矛盾句","另一種X派","精確化定義"],"ans":0,"exp":"打交輸了，回去唸一千次都沒用。","tags":[],"src":"mc"},{"id":"m2a-mc-1-1pw4x","type":"mc","topic":"m2a","q":"「4 + 5 = 8?」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"只須分析概念就能回答——答案是「錯」也仍然是概念問題。","tags":[],"src":"mc"},{"id":"m2a-mc-2-1yj0y","type":"mc","topic":"m2a","q":"「明年香港會出現財政赤字嗎？」屬於：","opts":["事實問題","概念問題","評價問題"],"ans":0,"exp":"原則上可以用經驗方法回答；現在答不到不影響分類。","tags":[],"src":"mc"},{"id":"m2a-mc-3-15o8d","type":"mc","topic":"m2a","q":"「香港政府延後推行垃圾徵費的決定是正確的嗎？」屬於：","opts":["評價問題","事實問題","概念問題"],"ans":0,"exp":"「正確」帶評價意義。","tags":[],"src":"mc"},{"id":"m2a-mc-4-183r1","type":"mc","topic":"m2a","q":"「你的生父年齡比你大嗎？」屬於：","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"由「生父」的概念已可回答，不用查身份證。","tags":[],"src":"mc"},{"id":"m2a-mc-5-1vb23","type":"mc","topic":"m2a","q":"「K2-18b 上有生物嗎？」屬於：","opts":["事實問題","概念問題","評價問題"],"ans":0,"exp":"原則上必須通過經驗方法回答，即使技術上暫時答不到。","tags":[],"src":"mc"},{"id":"m2a-mc-6-1gm34","type":"mc","topic":"m2a","q":"「科大看到的日出比日落美嗎？」屬於：","opts":["評價問題","事實問題","概念問題"],"ans":0,"exp":"「美」是評價概念。","tags":[],"src":"mc"},{"id":"m2a-mc-7-1pcxh","type":"mc","topic":"m2a","q":"「何謂反對黨？」屬於：","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m2a-mc-8-g0dz8","type":"mc","topic":"m2a","q":"「日本是第二次世界大戰中的戰勝國嗎？」屬於：","opts":["事實問題","概念問題","評價問題"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m2a-mc-9-na39w","type":"mc","topic":"m2a","q":"「事實問題」的定義是：","opts":["原則上必須通過經驗方法才能回答的問題","只須分析概念、用語就能回答的問題","須以個人價值觀回答的問題","現在已經有答案的問題"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m2a-mc-10-k3ot5","type":"mc","topic":"m2a","q":"關於「評價問題」，以下哪項最正確？","opts":["了解問題的概念及相關經驗事實後，還須以個人的價值觀去回答","只需個人價值觀就能回答，不需了解事實","只需分析概念就能回答","原則上必須通過經驗方法才能回答"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m2a-mc-11-1l1kf","type":"mc","topic":"m2a","q":"語理分析的基本步驟中，第一步是：","opts":["分辨語句中哪些 h no clear boundary","technical terms in science"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-3-1tlfu","type":"mc","topic":"m23","q":"&quot;Janitors → maintenance workers → custodians&quot; illustrates:","opts":["the creation of euphemisms","ambiguity","a merely verbal dispute","a lexical definition"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-4-19xwh","type":"mc","topic":"m23","q":"The labels &quot;pro-life&quot; and &quot;pro-choice&quot; are cited to show that:","opts":["it is sometimes nearly impossible to avoid emotive content","abortion is a merely verbal dispute","emotive language is always manipulative","neutral language is always available"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-5-sykhb","type":"mc","topic":"m23","q":"According to Copi, whether we should avoid emotive language or rely on it depends on:","opts":["the purpose language is intended to serve in the context","the social status of the speaker","the length of the sentence","whether the words come from Latin"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-6-1o43h","type":"mc","topic":"m23","q":"The best defense against verbal trickery, for voters as for consumers, is:","opts":["awareness of the real uses to which the language before us is being put","refusing to listen to any advertisement","using only technical language","trusting experts"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-7-1cmpk","type":"mc","topic":"m23","q":"&quot;With words we govern men.&quot; was said by:","opts":["Benjamin Disraeli","William Shakespeare","Vince Lombardi","Grantland Rice"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-8-10i5u","type":"mc","topic":"m23","q":"X and Y agree that capital punishment deters murder, but disagree about whether it is right for the state to execute criminals. This is:","opts":["agreement in belief, disagreement in attitude","disagreement in belief, agreement in attitude","a merely verbal dispute","disagreement in both belief and attitude"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-9-f6wap","type":"mc","topic":"m23","q":"If a death-penalty dispute arises from conflicting convictions about the rightness of state-authorized executions, then:","opts":["coming to agreement about the facts is likely to prove insufficient to resolve it","agreeing on the deterrence facts will surely resolve it","it is a merely verbal dispute","a dictionary will settle it"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-10-2324w","type":"mc","topic":"m23","q":"F says a tree falling in the wilderness with no one to hear it makes no sound; G insists it does. Copi classifies this as:","opts":["a merely verbal dispute","an obviously genuine dispute","an apparently verbal but really genuine dispute","a disagreement in attitude"],"ans":0,"exp":"&quot;sound&quot; = human auditory sensation vs vibrations in the air.","tags":[],"src":"mc"},{"id":"m23-mc-11-w4plf","type":"mc","topic":"m23","q":"A roots for the Yankees and B for the Red Sox. Their dispute is:","opts":["obviously genuine, mainly a disagreement in attitude","merely verbal","apparently verbal but really genuine","purely about facts"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-12-1l5do","type":"mc","topic":"m23","q":"C believes Miami is south of Honolulu and D denies it. Copi says:","opts":["it is a genuine dispute about facts that a good map can settle","it is merely verbal","it is a disagreement in attitude","it can never be resolved"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-13-1m7ac","type":"mc","topic":"m23","q":"J says a sexually explicit film is &quot;pornography&quot;; K says its beauty makes it art. According to Copi this dispute is:","opts":["apparently verbal but really genuine","merely verbal","obviously genuine about geographic facts","not a dispute at all"],"ans":0,"exp":"After the ambiguity of &quot;pornography&quot; is exposed, they will likely still disagree in their judgment of the film.","tags":[],"src":"mc"},{"id":"m23-mc-14-1maal","type":"mc","topic":"m23","q":"When confronting a dispute, Copi says we must FIRST ask:","opts":["whether there is some ambiguity that can be eliminated by clarifying the alternative meanings in play","who has more supporters","whether the dispute is about money","what the speaker feels"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-15-1k8j0","type":"mc","topic":"m23","q":"If clearing up the linguistic issue resolves the matter, the dispute was:","opts":["merely verbal","genuine","emotive","factual"],"ans":0,"exp":"If it does not, the dispute was genuine, although it may have appeared merely verbal.","tags":[],"src":"mc"},{"id":"m23-mc-16-8bv9c","type":"mc","topic":"m23","q":"&quot;Winning isn&#39;t everything. It&#39;s the only thing.&quot; was said by:","opts":["Vince Lombardi, a football coach","Grantland Rice, a sports journalist","Benjamin Disraeli","Thomas Jefferson"],"ans":0,"exp":"Rice: &quot;He marks—not that you won or lost— But how you played the game.&quot;","tags":[],"src":"mc"},{"id":"m23-mc-17-1yclc","type":"mc","topic":"m23","q":"The &quot;seven dirty words&quot; may not be used on US broadcast media because:","opts":["they have unacceptable emotive meanings sharply distinguishable from their literal meanings","they are ambiguous","they are too vague","they have no literal meaning"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-18-lnmp8","type":"mc","topic":"m23","q":"&quot;A rose by any other name would smell as sweet&quot; — yet being told a flower is commonly called &quot;skunkweed&quot; would likely:","opts":["influence our response to the flower","change the smell of the flower","make the word ambiguous","turn the matter into a merely verbal dispute"],"ans":0,"exp":"Words can affect attitudes.","tags":[],"src":"mc"},{"id":"m23-mc-19-s2hng","type":"mc","topic":"m23","q":"In logic, according to Copi, we generally strive for language that is:","opts":["as free as possible of the distortion that emotive meanings
