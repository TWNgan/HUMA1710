有規範意義","有可印證性的綜合語句","分析語句","全無意義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-47-1a0vs","type":"mc","topic":"m33","q":"「任何人的壽命都超過一百歲」(K2) 是：","opts":["有可印證性的綜合語句（有認知意義，雖然是假的）","分析語句","沒有認知意義","有規範意義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-48-1ca1y","type":"mc","topic":"m33","q":"「任何人的壽命或超過一百歲或不超過一百歲」(K1) 是：","opts":["分析語句","綜合真句","沒有認知意義","有規範意義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-49-1tjmz","type":"mc","topic":"m33","q":"「西風殘照，漢家陵闕」說明：","opts":["認知意義和非知意義並不互相排斥","美學意義與認知意義互相排斥","所有語句都有認知意義","它全無意義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-50-1shdl","type":"mc","topic":"m33","q":"泰戈爾「塵土被侮辱，卻報以鮮花」：","opts":["無認知意義，但有非知（美學）意義","有認知意義","全無意義","是分析語句"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-51-14wjh","type":"mc","topic":"m33","q":"「正方形喝了半副撲克牌」是：","opts":["全無意義的語句","有美學意義的語句","綜合假句","矛盾句"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-52-1mb15","type":"mc","topic":"m33","q":"「的質量算術寸三十是」與「算術的質量是三十寸」的分別是：","opts":["前者連「語句」都稱不上；後者是全無意義的語句（仍有文法形式）","兩者都是綜合假句","前者有美學意義","後者有認知意義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-53-1xjai","type":"mc","topic":"m33","q":"分析語句所具有的意義稱為：","opts":["邏輯意義","經驗意義","規範意義","情感意義"],"ans":0,"exp":"有認知意義的綜合語句 → 經驗意義。","tags":[],"src":"mc"},{"id":"m33-mc-54-tfys3","type":"mc","topic":"m33","q":"「某甲是一個混蛋」說明：","opts":["各種非知意義不互相排斥：兼有情感意義與評價意義","它全無意義","它只有規範意義","它是分析語句"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-55-x0i7g","type":"mc","topic":"m33","q":"李天命總結「析合區分」能使我們認清：","opts":["教條主義的盲目態度——沒有任何語句能既有實質內容又有必然性","所有語句都有認知意義","科學定律是必然的","形上學都有認知意義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-56-1bae0","type":"mc","topic":"m33","q":"邏輯經驗論者艾耶、卡納普把任何非知意義都籠統稱為：","opts":["情感意義（李天命認為過於粗略）","規範意義","美學意義","評價意義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-57-1lige","type":"mc","topic":"m33","q":"「有可印證性」等於：","opts":["有可非證性（可能受到正面或反面證據的支持或否駁）","有可檢證性","有必然性","已被證實"],"ans":0,"exp":"註⑯。","tags":[],"src":"mc"},{"id":"m33-mc-58-1n3b4","type":"mc","topic":"m33","q":"「信仰騎着懷疑在有限與無限以及祈禱與睡覺之間兜圈子」在文中是作為：","opts":["在認知性探討中不應提出的、沒有認知意義的說法的例子","綜合真句的例子","分析真句的例子","規範意義的例子"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m33-mc-59-7xer1","type":"mc","topic":"m33","q":"以下哪一句是黑格爾在《小邏輯》中的話，被用作缺乏認知意義的例子？","opts":["「『有』深入於其自身……『絕對』即是『無』」","「無自無」","「現實世界是理型世界的影象」","「真理是醜惡的」"],"ans":0,"exp":"「無自無」是海德格語；「真理是醜惡的」是尼采。","tags":[],"src":"mc"},{"id":"m33-mc-60-1o8di","type":"mc","topic":"m33","q":"邏輯經驗論早期的名稱是：","opts":["邏輯實徵論 (Logical Positivism)","日常語言學派","特構語言學派","實用主義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m2a-mc-24-18q6o","type":"mc","topic":"m2a","q":"根據講者在課堂上的分析，以下哪一條屬於<strong>事實問題</strong>？","opts":["甚麼是由治及興？","李家超（特首）會如何定義「由治及興」？","甚麼是國家的根本？","若 y = x²，dy/dx 是甚麼？"],"ans":1,"exp":"講者指「甚麼是由治及興？」是概念問題；但「李特首會怎樣 define 由治及興」要查他實際怎樣說，「不是概念問題，事實」。「甚麼是國家的根本」與 dy/dx 皆為概念問題。（課堂 2026-09-14 [69:12]–[70:37]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tf-15-o5tzb","type":"tf","topic":"m2a","q":"「主席說國家的根本是甚麼？」與「甚麼是國家的根本？」屬於同一類問題。","ans":1,"exp":"講者強調兩者「是兩類問題」：「甚麼是國家的根本」只須分析概念（概念問題）；問某人說過甚麼，則與「李特首會如何定義由治及興」一樣，要靠經驗方法查證（事實問題）。（課堂 2026-09-14 [70:00]–[70:37]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tf-16-lak9p","type":"tf","topic":"m2a","q":"「4 + 5 = 8？」這個問題本身是錯的，因此它不屬於概念問題。","ans":1,"exp":"講者：「4 + 5 = 8」（句號，陳述）是錯的；但「4 + 5 = 8？」（問號）這個問題本身不是錯，只是答案錯。答案對（5 + 5 = 10？）或錯（4 + 5 = 8？）都是概念問題；考試要看清楚是句號還是問號。（課堂 2026-09-14 [62:02]–[63:13]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mc-25-zyzy7","type":"mc","topic":"m2a","q":"講者教五歲兒子「5 + 5 = 10」時可以數手指。這個例子說明了概念問題的甚麼特性？","opts":["概念問題原則上必須通過經驗方法（如數手指）才能回答，否則答案沒有根據","數手指證明了「5 + 5 = 10？」其實是事實問題，因為答案要靠觀察得出","經驗方法（如數手指）可用來展示，但並非必要；明白「5」「加」「等於」「10」等符號就能回答","只要有人曾用經驗方法回答，概念問題就會變成事實問題，兩者界線取決於答法"],"ans":2,"exp":"講者：可以用經驗方法（數手指、Lego）展示，但「數手指學習過程，非必要」——這正是概念問題與事實問題（原則上必須用經驗方法）的分別。（課堂 2026-09-14 [65:39]–[66:45]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tf-17-193d4","type":"tf","topic":"m2a","q":"講者指出，「若 y = x²，dy/dx 是甚麼？」不用畫 slope 或計算方格面積也能回答，屬純粹的概念分析。","ans":0,"exp":"講者：不用畫 slope、間格仔再展示給你看，這是純粹的概念分析 → 概念問題。（課堂 2026-09-14 [63:57]–[65:11]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mc-26-1anf2","type":"mc","topic":"m2a","q":"有議員聲稱某些人「皮膚燒傷超過十成」。講者用這個例子主要想說明甚麼？","opts":["必須做醫學實驗量度燒傷面積，以經驗證據判斷是否屬實，所以是事實問題","燒傷程度涉及傷者的主觀痛楚感受，所以最終是評價問題","這類醫學問題要交給專家判斷，語理分析在此幫不上忙，只能存而不論","釐清關鍵字眼（「超過十成」）後，就發覺不需要任何證據支持——概念上已不可能"],"ans":3,"exp":"講者：大部分時候釐清後會知道下一步要找甚麼證據；但有些情況釐清後發覺根本不需要證據——超過十成皮膚燒傷不可能發生，申請基金做研究也不可能成功（FYP 第一句聲明就錯）。（課堂 2026-09-14 [47:50]–[49:41]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tf-18-phxnk","type":"tf","topic":"m2a","q":"根據講者，學生因病（有病假紙）獲延期後才交功課，這份功課就算是「準時交」。","ans":1,"exp":"講者：過了 deadline 就是遲交，「這個事實是不用任何經驗證據的」；有病假紙獲 extend，仍然是遲交，只是 penalty 被 waive 了——「定義釐清得很清楚」。（課堂 2026-09-14 [56:50]–[57:20]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mc-27-ib5i3","type":"mc","topic":"m2a","q":"就「日本是第二次世界大戰的戰勝國嗎？」，甲以「戰後 20 年 GDP」定義戰勝，乙以「國際和約的簽署雙方」定義戰勝。根據講者，以下哪項正確？","opts":["兩人對「戰勝」的定義不同，但這仍然是一個事實問題","因為兩人定義不同，問題變成了評價問題，各自表述即可","只有乙的定義下才是事實問題，甲的定義下屬概念問題","兩人的結論互相矛盾，所以必定有一方對「戰勝」的理解是錯的"],"ans":0,"exp":"講者：「我和你在溝通的時候，可以對於贏和輸不同，但不影響它是一個事實問題」——在各自定義下都是看實際資料（GDP、和約）。（課堂 2026-09-14 [73:40]–[74:51]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tf-19-ocqeh","type":"tf","topic":"m2a","q":"講者指出：事實問題如果沒有特別標明時間，理論上就是在談「現在」；考試中沒有標明年份的題目，就是指考試當日（2026 年 10 月 23 日）的情況。","ans":0,"exp":"講者：考試不會每條都標年份，標出來全部都是重複的「2026 年 10 月 23 日」；不特別標，就是在談現在——你答卷那一刻。（課堂 2026-09-14 [77:06]–[77:39]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mc-28-8e0ad","type":"mc","topic":"m2a","q":"講者以「中國是否世界第二大經濟體？」為例，主要想帶出事實問題的哪一個特性？","opts":["普遍性：無論哪一年問，答案都應該一樣","時間性：答案會因年份不同而改變，要講明是甚麼時間的數據","主觀性：經濟體大小最終要靠個人價值觀判斷","必然性：只要定義清楚「中國」，答案就必然確定，毋須數據"],"ans":1,"exp":"講者：無論怎樣定義「中國」和經濟體大小，最後都是看實際數據，而數據有時間性；「時間性也是與事實問題有一個很相關的特性」。（課堂 2026-09-14 [74:51]–[78:09]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m21-tf-23-bkka8","type":"tf","topic":"m21","q":"講者強調，語理分析與人文學部語言學同事的研究一樣，都是以分析語言本身為目的。","ans":1,"exp":"講者：「我們不是分析語言本身，我們是分析思維」——會牽涉語言，但主要講人類思維。（課堂 2026-09-14 [38:55]–[39:24]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m21-mc-34-zqy7b","type":"mc","topic":"m21","q":"根據講者，李天命的語理分析與（已高度數理化的）西方分析哲學相比，最主要的特點是：","opts":["全面採用符號邏輯，以人工語言取代含糊的日常語言","以研究廣東話、普通話等日常語言的文法和用法為目的","強調不採用任何人工語言（如 not、imply、equivalence 等符號），將邏輯融入日常語言","只適用於大學學術研究，不適合在日常生活中與人傾談"],"ans":2,"exp":"講者：李天命把西方分析哲學改造成與普通人聊天也用得上的思維方法（他當時教的對象很多不是大學生），強調不採用任何人工語言，將邏輯融入日常語言。（課堂 2026-09-14 [37:55]–[38:55]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m21-tf-24-1upvd","type":"tf","topic":"m21","q":"講者指出，討論時要釐清到多嚴謹、證據要多少，並沒有固定答案，要視乎當下討論的 context 與目的（例如閒聊與學術研究不同）。","ans":0,"exp":"講者回應同學提問時說「我不知道答案」——釐清到多嚴謹、證據多少，要看你在談的 context：閒聊的目的不是釐清真理；學術研究則總有 reviewer／supervisor 說不夠。（課堂 2026-09-14 [41:23]–[47:16]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mc-29-16wz0","type":"mc","topic":"m2a","q":"根據講者，為甚麼思考時第一步要先想清楚對方在問甚麼（即進行問題分類）？","opts":["因為所有問題最終都要靠經驗方法回答，先分類才知道去哪裏找證據","因為評價問題比概念問題更高級，要先把它們排除","因為這樣可以確保每個問題最後都有一個標準答案","因為想清楚後，可能發覺有些問題根本不用浪費時間去找證據"],"ans":3,"exp":"講者：分析哲學家「聰明又懶」——第一部分是想對方在問甚麼，因為想完之後發覺有些問題不用浪費時間找證據；所以李天命把問題分成三類。（課堂 2026-09-14 [57:54]–[59:31]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mc-30-1n7zb","type":"mc","topic":"m2a","q":"講者問「甚麼是反對黨？」時強調，這個問題問的是：","opts":["「反對黨」這個概念的意思（概念問題）","某國家現時哪個政黨是反對黨（事實問題）","反對黨的存在對社會是好是壞（評價問題）","香港現時有沒有反對黨（事實問題）"],"ans":0,"exp":"講者：「我不是在問你誰是反對黨，我在問你什麼叫做反對黨」——屬概念問題（釐清後亦發覺通常的定義不太準確）。（課堂 2026-09-14 [66:45]–[68:33]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tf-20-1ekp6","type":"tf","topic":"m2a","q":"講者指出，問題三分類（概念／事實／評價問題）是李天命的創建，其所代表的傳統西方分析哲學並沒有這個三分類。","ans":0,"exp":"講者：問題分類可以說是李天命先生的創建，他所代表的傳統西方分析哲學沒有講問題的三分類。（課堂 2026-09-18 [01:04]–[01:29]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-31-wmjmk","type":"mc","topic":"m2a","q":"根據講者，運用李天命的問題分類時，思考應按甚麼次序進行？","opts":["先判斷是否評價問題 → 再看事實 → 最後才看概念","先問是否概念問題 → 概念答不到，再想是否事實問題 → 事實也答不到，才是評價問題","先判斷是否事實問題 → 再看概念 → 最後才看評價","三類沒有先後之分，見到評價字眼就直接判為評價問題"],"ans":1,"exp":"講者：三類在思考過程中應有先後——不要見到問題就直接說是評價；首先問是否概念，概念答不到就想事實，事實答不到才是評價。（課堂 2026-09-18 [12:06]–[12:34]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tf-21-5z3nm","type":"tf","topic":"m2a","q":"「明年香港會出現財政赤字嗎？」由於現在無法回答，所以不屬於事實問題。","ans":1,"exp":"講者：原則上未來發生的事都要等經驗、事實出來後才能判斷，所以批判思考教你這是事實問題——只是 at this point we can&#39;t answer it（要等到 2027 年）。（課堂 2026-09-18 [16:08]–[17:35]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-32-9t0gw","type":"mc","topic":"m2a","q":"有人說：「支持度現在這麼低，明年一定上升」、「恒指跌到這麼低，一定會反彈」。講者稱這種思維為：","opts":["將概念問題事實化","將評價問題概念化","將事實問題概念化","將概念問題評價化"],"ans":2,"exp":"講者：這些叫做「將事實問題概念化」——把要等經驗證據的事實問題，當成像 5 + 5 = 10 般一定的概念問題；批判思考教你千萬不要這樣。（課堂 2026-09-18 [24:40]–[25:16]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tf-22-vagpo","type":"tf","topic":"m2a","q":"根據講者，對於未來的事實問題（如明年經濟），以「我認為／我預測」的方式表達個人判斷，屬「評價問題式的答法」，是李天命可以接受的。","ans":0,"exp":"講者：如果你覺得今天答得到，那是你個人的評價（你有一堆數據、預測明年會怎樣）；「這個叫評價問題式的答法，李天命接受得到」——但不能說成「一定」。（課堂 2026-09-18 [18:10]–[18:46]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-33-p6d9j","type":"mc","topic":"m2a","q":"「K2-18b 上有生物嗎？」根據講者，以下哪項分析正確？","opts":["宇宙這麼大，一定有其他生物，所以是概念問題","因為人類可能永遠無法到達，只能憑個人看法回答，所以是評價問題","因為現時技術做不到，所以暫時不屬於三類問題中任何一類","技術上現在無法到達，但原則上必須而且可以用經驗方法找到答案，所以是事實問題"],"ans":3,"exp":"講者：現在技術上不能透過經驗方法找到答案，但原則上必須和可以找到答案（宇宙航行能力提高便可）；在此之前，李天命框架下只能等答案。（課堂 2026-09-18 [28:01]–[29:25]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tf-23-1hc1m","type":"tf","topic":"m2a","q":"講者認為，「地球有生物，所以宇宙某處也有生物」這個推論有一定合理性，因此可以把「宇宙中一定有其他生物」當作概念上必然為真。","ans":1,"exp":"講者：這個推論有根據、有合理性，但不是絕對的，只是一個假設；你可以說「我認為有」（變成評價），但千萬不要當作概念——就像「經濟這麼差，一定反彈」一樣太有自信。（課堂 2026-09-18 [29:57]–[32:18]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-34-ss1bw","type":"mc","topic":"m2a","q":"「獵人開槍打死樹上三隻小鳥中的一隻，樹上還剩多少隻？」講者用這條 IQ 題主要想說明甚麼？","opts":["這條題目只有一個標準答案：3 − 1 = 2","語理分析第一步最重要的是確認討論雙方是否在同一個平台、討論同一個問題（概念上答 2，事實上答 0）","答「0」的人沒有掌握基本數學，屬概念錯誤","IQ 題屬評價問題，任何答案都沒有對錯可言"],"ans":1,"exp":"講者：當概念（數學）問題答是 3 − 1 = 2；當事實問題答是 0（其餘兩隻會飛走）；重點是先釐清討論雙方是否在同一平台談同一問題。（課堂 2026-09-18 [35:54]–[40:32]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tf-24-1wgem","type":"tf","topic":"m2a","q":"根據講者，要確定「你的生父年齡比你大」，必須查看身份證等證據，所以這是事實問題。","ans":1,"exp":"講者：你認得他是你親生父母，就已承認他年紀比你大——可以拿身份證出來，但「可以而已，不是必須」；概念先於事實。（課堂 2026-09-18 [08:17]–[10:04]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m32-mc-29-1wa53","type":"mc","topic":"m32","q":"講者在討論李天命對科學的要求時預告 Module 3 會再談的觀念：科學的核心在於甚麼？","opts":["可以被背誦和引用的教科書答案","由權威（如教授或諾貝爾獎得主）確認","可否證（falsifiability）——即使證明了很多次是對的，也要容許有一天被其他經驗證據證明為錯","必然為真、在任何情況下都不能被推翻"],"ans":2,"exp":"講者：李天命跟隨實驗精神——無論證明多少次是對的，都要容許它有一日被另外的經驗證據支持是錯；「科學的核心在於可否證」，Module 3 會再講。（課堂 2026-09-18 [53:36]–[54:06]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-35-7o3ib","type":"mc","topic":"m2a","q":"「我家養的貓是否用四隻腳走路？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":1,"exp":"講者：平時講貓貓狗狗是講肉眼見到的實體，你家的貓真實存在——在經驗世界找答案，是事實問題；「貓」一字並非 by default 等於健全。（課堂 2026-09-18 [64:21]–[69:59]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-36-1r9gv","type":"mc","topic":"m2a","q":"「一年有多少秒？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"講者：一年有多少秒數學上計得到（看是否閏年，365 × 24 再拆分到秒），肯定是概念問題。（課堂 2026-09-18 [60:46]–[61:18]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-37-1syny","type":"mc","topic":"m2a","q":"就「香港政府明年的支持度會上升嗎？」，講者認為要有效討論，第一步應怎樣處理？","opts":["先釐清：以某個民意調查量化的分數為準，分數高了就當支持度高了，再等數據判斷","「支持度」無法量化，所以這題只能是評價問題，各自表述即可","現在支持度已經這麼低，概念上明年一定會反彈，毋須等數據","支持度涉及人心，原則上無法以任何方法釐清，不應討論"],"ans":0,"exp":"講者：如果當支持度是事實問題，就要以某民調量化的分數為平台（例如今年 50、明年 75 → 當支持度高了）；「數字高了是否等於支持度高了」是衍生的第二個問題。（課堂 2026-09-18 [24:06]–[24:40]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-38-eofnw","type":"mc","topic":"m2a","q":"根據講者，回答「香港科技大學美嗎？」這類評價問題的過程是：","opts":["只需要個人價值觀，毋須釐清概念或找事實","找齊相片、平面圖等經驗事實後，就能客觀地回答，屬事實問題","只要釐清「美」的定義就能回答，所以屬概念問題","先釐清概念（如指哪個 campus、建築還是環境），再找相關經驗事實（相片、平面圖），最後仍要加上個人價值觀"],"ans":3,"exp":"講者：評價問題包含「美」「好」等評價概念；先釐清概念（Google Map 座標、包不包 Business School、建築風格或周圍環境）、找相關經驗事實（拍照、平面圖），之後仍答不到，要用個人價值觀。（課堂 2026-09-18 [69:59]–[74:05]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mc-39-1fpdl","type":"mc","topic":"m2a","q":"講者比較「5 + 5 = 10？」與「甚麼是真善美／國家／由治及興？」時，以下哪項最符合他的說法？","opts":["兩者都是概念問題；數學、邏輯的答案有普遍性，而真善美、國家等抽象概念則有討論空間，是較難答的概念問題","只有數學問題是概念問題；真善美、國家等因有爭議，屬評價問題","真善美、國家等沒有標準答案，要靠觀察社會才知道，所以屬事實問題","數學符號是人創造的，所以數學答案和真善美一樣沒有普遍性"],"ans":0,"exp":"講者：數學、邏輯的答案有普遍性（正確就正確、錯就錯）；真善美、反對黨、國家、由治及興等抽象概念有討論空間——在李天命系統中算是難回答的概念問題。（課堂 2026-09-18 [04:24]–[07:19]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tf-25-170kt","type":"tf","topic":"m2a","q":"在李天命的問題分類架構中，一個問題可以同時屬於概念、事實和評價問題（All of the above）。","ans":1,"exp":"講者：問題一層一層下——是概念問題就停在概念問題；事實根據答得到就不會是評價；只會是三類其中一個，也沒有 None of the above。考試分類題只會有 A 概念／B 事實／C 評價三個選項。（課堂 2026-09-21 [03:30]–[05:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mc-40-wm098","type":"mc","topic":"m2a","q":"根據講者，若你無法判斷一個問題屬於概念、事實還是評價問題，應該怎樣做？","opts":["一律當作評價問題","選「None of the above」","回到第一步，釐清問題中牽涉的關鍵字眼；釐清後它必屬三類之一","一律當作事實問題"],"ans":2,"exp":"講者：如果解釋不到一個問題是概念、事實還是評價，其實要回到第一步，釐清問題裏面牽涉的關鍵字眼；釐清完之後就是三類問題的其中一個——「考試時也是這樣想」。（課堂 2026-09-21 [04:31]–[05:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tf-26-11xy0","type":"tf","topic":"m2a","q":"講者澄清：在本課程中，數學問題都是概念問題。","ans":0,"exp":"講者：「我澄清一次，數學問題在這課程中都是概念問題」。（課堂 2026-09-21 [05:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mc-41-1am74","type":"mc","topic":"m2a","q":"「甚麼是思考？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"講者：「什麼是思考」這個問題是概念問題——「不要錯，考試就這樣想，不要太複雜」。（課堂 2026-09-21 [34:40]–[35:29]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mc-42-c5jfi","type":"mc","topic":"m2a","q":"「你有沒有學習過思考？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":1,"exp":"講者：「你們有沒有學習過思考？事實啦」——要看你實際上有沒有學過。（課堂 2026-09-21 [35:29]–[36:10]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mc-43-14rph","type":"mc","topic":"m2a","q":"「QS 排名第 47 的大學，是否比排名第 52 的大學排名較高？」講者認為這屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"講者：一經 formulate 成排名數字，就直接是概念問題——47 是一個小於 52 的自然數；至於 47 與 52 是否真有那麼大分別，就「不敢說了」。（課堂 2026-09-21 [31:35]–[32:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tf-27-19mst","type":"tf","topic":"m2a","q":"講者指出，把「政府政策是否正確」量化成 KPI（例如減少了多少膠袋消耗）並得出數據後，就等於回答了該政策是否正確。","ans":1,"exp":"講者：政策成效可以量化成事實問題（減低了多少膠袋消耗）；但量化完之後要留意——你其實不是在問它是否正確，只是問它有沒有減少膠袋消耗。（課堂 2026-09-21 [32:51]–[33:28]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mc-44-9m4yp","type":"mc","topic":"m2a","q":"講者以「2020 年夏季奧運會」為例，想提醒同學甚麼？","opts":["名稱已寫明 2020 年，所以必然在 2020 年舉行，屬概念問題","舉行時間視乎個人看法，屬評價問題","名稱與舉行時間必然一致，毋須查證","它因疫情而在 2021 年夏季舉行；「何時舉行」是事實問題，不能單憑名稱（概念）斷定"],"ans":3,"exp":"講者：2020 年夏季奧運會在 2021 年夏季舉行（因為疫情）；要分清名稱與「歷史事件何時發生」的客觀事實。（課堂 2026-09-21 [44:31]–[48:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tf-28-1xxyz","type":"tf","topic":"m2a","q":"講者指出：未來的事（例如 2027 年會否有美國總統大選）屬事實問題，不應因為「常識上不可能」就 take it for granted 地當作已有定論。","ans":0,"exp":"講者：很有 common sense 的人容易說「2027 年沒有美國大選」，但誰敢說 2027 年一定沒有？涉及人的事總之不確定；「我再講一次，未來的事是事實」。（課堂 2026-09-21 [39:59]–[41:11]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tf-29-1g9j4","type":"tf","topic":"m2a","q":"講者指出：極端的懷疑論者認為世界上沒有事實問題，只有概念問題。","ans":1,"exp":"剛好相反——講者：極端的懷疑論者覺得所有東西都可以透過經驗方法被推翻，所以從這個角度，世界上沒有概念問題（「極端」二字哲學家是 neutral 地用）。（課堂 2026-09-21 [02:28]–[03:30]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tf-30-lqss6","type":"tf","topic":"m2a","q":"講者指出：如果一個人把人際關係（如擇偶、交朋友）完全 KPI 化、量化，那麼在他的價值體系中就沒有評價問題。","ans":0,"exp":"講者：同理於極端懷疑論者沒有概念問題，如果處理人際關係不涉及任何評價、全都可以 KPI 化，在你的價值體系就沒有評價問題；正常在李天命框架下應拆成三類。（課堂 2026-09-21 [23:52]–[25:28]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mc-45-l0fdp","type":"mc","topic":"m2a","q":"根據講者，在李天命眼中所有價值判斷都屬於哪一類問題？而日常生活中人與人溝通最多的又是哪一類？","opts":["事實問題；評價問題","評價問題；評價問題","評價問題；事實問題","概念問題；事實問題"],"ans":1,"exp":"講者：在李天命眼中所有價值判斷都是評價問題（整個思考方法很有目的性——要推高科學的地位）；日常生活人和人溝通，最多是評價問題。（課堂 2026-09-21 [11:24]–[12:45]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m21-tf-25-1vyxe","type":"tf","topic":"m21","q":"講者認為，李天命的問題分類／思考方法有其時代目的：在當時社會思考不太科學化的背景下，把這套方法工具化，提高事實問題與科學的地位。","ans":0,"exp":"講者：整個思考方法很有目的性，要推高科學的地位；李天命推行時社會想東西不是很科學化，所以把問題分類、整個思考方法工具化，提高了事實問題和科學。（課堂 2026-09-21 [12:07]、[33:28]–[34:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mc-46-c4h8h","type":"mc","topic":"m2a","q":"李天命雖想把所有價值判斷歸入評價問題，卻以「甚麼是真、善、美？」作為概念問題的例子。講者解釋的原因是：","opts":["有些哲學家（如柏拉圖）及宗教視真善美為絕對、普遍，而非個人評價；而且談真善美時大家有一個「合約」——至少同意談的是正面、想要的東西","因為真善美可以用經驗方法量度，有客觀數據支持","因為李天命認為所有價值判斷其實都是概念問題","因為真善美屬於數學和邏輯概念，答案有普遍性"],"ans":0,"exp":"講者給兩個原因：①不想打死所有哲學家——柏拉圖、宗教的真善美是絕對、普遍的，不是個人評價；②形容詞（如美）的界線釐清不到，但談的時候有「合約」：美 = 吸引的，善 = 應該做的，真 = 值得相信。（課堂 2026-09-21 [55:52]–[59:50]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m33-mc-61-1spwp","type":"mc","topic":"m33","q":"講者預告 Module 3：一些「必然地真」的東西，李天命會把它們放在哪一類？","opts":["經驗科學那一類","評價那一類","宗教信仰那一類","數學那一類"],"ans":3,"exp":"講者：「去到 Module 3，一些必然地真的東西，李天命會將它擺在數學那類。」（課堂 2026-09-21 [17:08]）","tags":["lecture"],"src":"lecture 2026-09-21"}],"cards":[{"id":"c0-12f7v","topic":"m21","front":"語理分析 Logico-linguistic analysis 的定義？","back":"<p>釐清主要用語的意思，辨明關鍵論點的義理，由此着手去分析問題。</p>\n<p>又叫 <strong>linguistic analysis（語言分析）</strong>；是思考方法學的<strong>起點（不是終點）</strong>。</p>\n"},{"id":"c1-1hb7h","topic":"m21","front":"語理分析最鮮明尖銳的標記？","back":"<p>「<strong>你所說的『X』是甚麼意思？</strong>」</p>\n"},{"id":"c2-xc3u4","topic":"m21","front":"西方哲學三階段的中心問題？","back":"<p>古代：<strong>甚麼是 X？</strong>（玄學、倫理學）</p>\n<p>→ 近代：<strong>X 在人類知識的限度以內嗎？</strong>（知識論）</p>\n<p>→ 現代分析哲學：<strong>「X」一辭究竟是甚麼意思？</strong>（語理分析）</p>\n"},{"id":"c3-1yd7n","topic":"m21","front":"分析哲學四個支派？","back":"<p>(1) <strong>早期分析哲學</strong>：羅素、慕爾、維根斯坦（先驅：裴爾士、詹姆斯）</p>\n<p>(2) <strong>邏輯實徵論</strong>：維也納學圈；反玄學、重科學；卡納普、施里克、艾耶、函寶、萊興巴赫</p>\n<p>(3) <strong>特構語言學派</strong>：符號邏輯；塔斯基、瑰英、波柏、古德曼</p>\n<p>(4) <strong>日常語言學派</strong>：後期維根斯坦、萊爾、奧斯丁、史特勞遜</p>\n"},{"id":"c4-pf0lf","topic":"m21","front":"四類文字把戲？","back":"<p><strong>無中生有派</strong>：似有實無認知意義（柏烈得萊「絕對」、黑格爾之謎＝熱）</p>\n<p><strong>跳高一層派</strong>：某個意義、觀點角度（孔子五百磅）</p>\n<p><strong>另一種X派</strong>：指鹿為馬（真自由真民主）</p>\n<p><strong>空洞派</strong>：油腔滑調、封閉系統（江湖神棍、工程學教授）</p>\n"},{"id":"c5-fe3oh","topic":"m21","front":"「另一種 X」成立的必要條件？","back":"<p>a 與 b 的<strong>類屬性徵 (generic characteristics) 大致相同</strong>。斑馬→另一種馬 ✔；鹿→另一種馬 ✘。</p>\n"},{"id":"c6-1apli","topic":"m21","front":"油腔滑調的特色和代價？","back":"<p>任何情形都可被解釋成正確；用籠統字眼<strong>避開否證</strong>，把一切事例說成證據 → <strong>不能提供任何確定的知識或具體的指引</strong>。</p>\n"},{"id":"c7-w33vy","topic":"m21","front":"現代思考方法學四種方法？","back":"<p><strong>語理分析、邏輯方法、科學方法、謬誤剖析</strong>。謬誤剖析＝其他三種的引申；語理分析＝起點（不是終點）。</p>\n"},{"id":"c8-eph8q","topic":"m21","front":"語理分析 vs 語意學？","back":"<p>語意學是<strong>學科 (discipline)</strong>；語理分析是<strong>方法／進路 (method / approach)</strong>。</p>\n<p>語理分析是語意學的<strong>基礎方法</strong>；語意學可作語理分析的<strong>輔助工具</strong>。</p>\n"},{"id":"c9-5zz6z","topic":"m21","front":"概念問題 vs 經驗問題（李天命）？","back":"<p><strong>概念問題</strong>：分析清楚關鍵概念，原則上就解決（甚麼是真、善、美？）</p>\n<p><strong>經驗問題</strong>：主要靠<strong>科學方法</strong>（宇宙是否在膨脹？）</p>\n"},{"id":"c10-1mu40","topic":"m21","front":"對語理分析的五項誤解（澄清）？","back":"<p>(1) 以為很簡單——其實是精微技巧</p>\n<p>(2) 以為＝語意學 ✘</p>\n<p>(3) 清晰＝膚淺 ✘（清晰 ≠ 清淺 ≠ 膚淺）</p>\n<p>(4)「釐清是不足夠的」——講了等於沒講</p>\n<p>(5)「執着文字」✘——只分析<strong>關鍵用語</strong>（人是否命定 → 分析「命定」）</p>\n"},{"id":"c11-z5bvz","topic":"m2a","front":"三類問題及定義？","back":"<p><strong>概念問題</strong>：只須分析概念、用語就能回答。</p>\n<p><strong>事實問題</strong>：原則上必須通過<strong>經驗方法</strong>才能回答。</p>\n<p><strong>評價問題</strong>：含「美、好、偉大」等評價概念；了解概念＋經驗事實後，<strong>還須以個人價值觀</strong>回答。</p>\n"},{"id":"c12-gq2xd","topic":"m2a","front":"語理分析三個基本步驟？","back":"<ol>\n<li><p>分辨「<strong>關鍵用語</strong>」</p>\n</li>\n<li><p>釐清關鍵用語的<strong>內容與意義</strong></p>\n</li>\n<li><p>未能釐清時，<strong>視情況去回答（或不作回答）</strong></p>\n</li>\n</ol>\n"},{"id":"c13-wdctx","topic":"m2a","front":"語理分析是起點還是終點？（slides）","back":"<p><strong>總是解決問題的起點，也可以是終點，視乎問題的性質</strong>（概念問題：起點兼終點）。</p>\n"},{"id":"c14-1xuxz","topic":"m2a","front":"「4+5=8?」「你的生父年齡比你大嗎？」是甚麼問題？","back":"<p><strong>概念問題</strong>。分類看「用甚麼方法回答」，不看答案真假。</p>\n"},{"id":"c15-9ogp2","topic":"m2a","front":"「明年香港會出現財政赤字嗎？」「K2-18b 上有生物嗎？」是甚麼問題？","back":"<p><strong>事實問題</strong>——關鍵：「<strong>原則上</strong>」可用經驗方法回答；現在答不到不影響分類。</p>\n"},{"id":"c16-8cfb0","topic":"m22","front":"李天命六大語言陷阱（口訣）？","back":"<p><strong>闕歧含，著實僻</strong>：闕義、歧義、含混、著色、實化、僻義。</p>\n"},{"id":"c17-1h6xf","topic":"m22","front":"闕義 Meaning-incomplete？","back":"<p>語法完整但<strong>語意欠整</strong>：「講老實話是最有利的做法」「生命是有價值的」。</p>\n<p>⚠️ 闕義 ≠ 沒有意義（所以用「闕」不用「缺」）。脈絡足以提示欠缺意義時<strong>無害</strong>，而且令用語簡潔。</p>\n"},{"id":"c18-1qh3b","topic":"m22","front":"歧義 Ambiguous？","back":"<p>語辭有<strong>多過一個意義</strong>（做夢、天、風流、敗、自由）。</p>\n<p>好處：<strong>語言的經濟</strong>。⚠️ 即使脈絡清楚，<strong>利用歧義玩文字遊戲</strong>仍是混淆思想。</p>\n"},{"id":"c19-4er8c","topic":"m22","front":"語法歧義 vs 非語法歧義？","back":"<p><strong>語法歧義 (syntactic ambiguity)</strong>：語法結構造成——「路不通行不得在此小便」「士可殺不可辱」（Chomsky 注意）。</p>\n<p><strong>非語法（語意）歧義</strong>：「新血」「東西」。</p>\n"},{"id":"c20-1bjje","topic":"m22","front":"含混 Vague？","back":"<p>應用範圍<strong>沒有截然明確的界線</strong>（禿子、好人、資本家、神蹟、很熱）。</p>\n<p>⭐「X 沒有分明的界線」<strong>不涵蘊</strong>「X 沒有約略的界線」。好處：彈性、表達概略知識；壞處：廢話、空話、大話。</p>\n"},{"id":"c21-1qw4l","topic":"m22","front":"著色 Coloured / Emotive expression？","back":"<p>帶<strong>情感意含</strong>的語辭；雙重功能：引起聽者情感＋表露說者喜怒。</p>\n<p>⭐ 情感意含不同但<strong>描述的事態可相同</strong>（羅素：堅定／固執／愚頑）。</p>\n<p><strong>濫用</strong>＝沒有客觀證據或邏輯推演，只靠情感意含誘使別人接受。</p>\n"},{"id":"c22-571q2","topic":"m22","front":"實化 Reification？","back":"<p><strong>把非具體名項當作具體名項來使用</strong>（社會是魔鬼、服從國家的意志、真理是醜惡的）。</p>\n<p>文藝寫作可隨意；思考討論要問：<strong>能否用有認知意義的語句轉譯</strong>？</p>\n"},{"id":"c23-1wry9","topic":"m22","front":"僻義 Idiosyncratic sense？","back":"<p>違離慣常用法（通義 stock sense）的意義。</p>\n<p>流弊：難懂＋⭐「<strong>真，但多餘</strong>」（懷黑德「世界在我們之內」、「一切都是虛幻」、華嚴「一在一切中」）。</p>\n<p>使用時要<strong>聲明＋以定義或例釋清楚闡釋</strong>。</p>\n"},{"id":"c24-1t2fz","topic":"m22","front":"六陷阱的例釋主題？","back":"<p>闕義—<strong>政制與生命</strong>；歧義—<strong>勝敗與自由</strong>；含混—<strong>善惡與貧富</strong>；著色—<strong>堅定與固執</strong>；實化—<strong>國家與真理</strong>；僻義—<strong>佛學與虛實</strong></p>\n"},{"id":"c25-1idl7","topic":"m22","front":"六陷阱各自的「利」？","back":"<p>闕義：簡潔；歧義：語言的經濟；含混：彈性／概略知識；著色：表露情感、心理平衡、態度齊一；實化：生動、濃縮、優美；僻義：補充通義之不足</p>\n"},{"id":"c26-1ykoa","topic":"m2b","front":"講者 4 種語言陷阱？","back":"<p><strong>歧義 Ambiguity</strong>、<strong>含混 Vagueness</strong>、<strong>著色字詞 Coloured Word</strong>、<strong>言辭空廢 Empty Verbalism</strong></p>\n"},{"id":"c27-3qlsz","topic":"m2b","front":"Equivocation vs Amphiboly？","back":"<p><strong>字詞歧義</strong> → 模稜兩可的謬誤 <strong>Equivocation</strong>（同一條河；室友 vs 女朋友；爭取自由徒勞）</p>\n<p><strong>語句歧義</strong> → 歧義句構的謬誤 <strong>Amphiboly</strong>（反對美國的單邊主義提倡者；兒子生性病母倍感安慰）</p>\n"},{"id":"c28-1hmd2","topic":"m2b","front":"歧義的四個好處（slides）？","back":"<ol>\n<li><p>免除增加新字詞的麻煩</p>\n</li>\n<li><p><strong>語言避諱</strong></p>\n</li>\n<li><p><strong>創作</strong>（因荷而得藕；東邊日出西邊雨；缺衣少食沒有東西）</p>\n</li>\n<li><p><strong>避重就輕</strong>（下雨天留客天留我不留；人多病少財富；誰都看不上）</p>\n</li>\n</ol>\n"},{"id":"c29-1scyo","topic":"m2b","front":"Continuum Fallacy vs Slippery Slope Fallacy？","back":"<p><strong>連續體謬誤</strong>：利用含混，將能約略區分的事物視為不能區分（有錢人和窮人沒有大分別；我和拿 A- 的室友差不多）。</p>\n<p><strong>滑坡謬誤</strong>：環環相扣的因果，每一環只是「<strong>可能</strong>」而非「必然」（主動安樂死 → 草菅人命；上莊 → 找不到工作）。</p>\n"},{"id":"c30-ipd1i","topic":"m2b","front":"Appeal to Pity？","back":"<p><strong>訴諸憐憫</strong> ⊂ <strong>訴諸情感 (Appeal to Emotion)</strong>：不以證據，用情緒手段博取同情（殺害雙親後以「孤兒」求情；作弊求合格）。</p>\n"},{"id":"c31-1f975","topic":"m2b","front":"言辭空廢 Empty Verbalism？","back":"<p>以<strong>重言命題 (tautological proposition)</strong> 冒充<strong>事實陳述 (factual statement)</strong>。</p>\n"},{"id":"c32-661s1","topic":"m2b","front":"絕對空廢 vs 相對空廢？","back":"<p><strong>絕對</strong>：重言句形式＋冒充事實陳述（做生意就是做生意；鍾意就係鍾意；財政司財赤）。分辨靠兩個條件，不靠真假。</p>\n<p><strong>相對</strong>：不要求重言句形式，分析內容＋語境後發現必然為真（父在母先亡；明年市場會動盪；發動戰爭將摧毀強國）。</p>\n"},{"id":"c33-ov5ot","topic":"m2b","front":"著色字詞好處／壞處（slides）？","back":"<p>好處：心理平衡、帶動別人情緒（文學）。</p>\n<p>壞處：影響冷靜客觀思考——用著色字詞而非<strong>經驗證據或邏輯推論</strong>說服人（唔買就笨、政治宣傳）。</p>\n"},{"id":"c34-1j4my","topic":"m23","front":"Copi: three categories of disputes?","back":"<ol>\n<li><p><strong>Obviously genuine</strong> (Yankees vs Red Sox – attitude; Miami/Honolulu – facts, settled by a map)</p>\n</li>\n<li><p><strong>Merely verbal</strong> (falling tree &amp; &quot;sound&quot;)</p>\n</li>\n<li><p><strong>Apparently verbal but really genuine</strong> (&quot;pornography&quot; film)</p>\n</li>\n</ol>\n"},{"id":"c35-za3w3","topic":"m23","front":"Disagreement in belief vs in attitude?","back":"<p><strong>Belief</strong> = about the <strong>facts</strong> (does the death penalty deter?).</p>\n<p><strong>Attitude</strong> = about facts actually agreed upon (is it <strong>right</strong> for the state to execute?).</p>\n<p>Any combination is possible.</p>\n"},{"id":"c36-1v8ew","topic":"m23","front":"Copi&#39;s procedure facing a dispute?","back":"<p>First ask: is there <strong>ambiguity</strong> that can be eliminated by clarifying meanings?</p>\n<p>If yes — does clearing it <strong>resolve</strong> the matter? Yes → <strong>merely verbal</strong>; No → <strong>genuine</strong> (though it appeared verbal).</p>\n"},{"id":"c37-1dwth","topic":"m23","front":"When is emotive language OK?","back":"<p>Depends on <strong>the purpose language is intended to serve in the context</strong>: fine in <strong>poetry</strong>, highly inappropriate in <strong>survey research</strong>. Logic strives to be free of emotive distortion.</p>\n"},{"id":"c38-h3wfi","topic":"m23","front":"Euphemism?","back":"<p><strong>Gentle words for harsh realities</strong>: janitors → maintenance workers → custodians; waiters → waitpersons → servers.</p>\n"},{"id":"c39-1ov3x","topic":"m23","front":"Quotes: Disraeli / Lombardi / Rice / Shakespeare?","back":"<p><strong>Disraeli</strong>: &quot;With words we govern men.&quot;</p>\n<p><strong>Lombardi</strong> (coach): &quot;Winning isn&#39;t everything. It&#39;s the only thing.&quot;</p>\n<p><strong>Grantland Rice</strong> (journalist): &quot;…not that you won or lost— But how you played the game.&quot;</p>\n<p><strong>Shakespeare</strong>: &quot;A rose by any other name would smell as sweet.&quot;</p>\n"},{"id":"c40-18ho6","topic":"m31","front":"Definiendum vs Definiens？","back":"<p><strong>被界定端 definiendum</strong>：要下定義的語辭（人）</p>\n<p><strong>界定端 definiens</strong>：用來解釋的語辭（理性的動物），可超過一組。</p>\n"},{"id":"c41-eoa20","topic":"m31","front":"內涵 Intension vs 外延 Extension？","back":"<p>內涵＝詞項的<strong>特徵</strong>（偶數：可被 2 整除的自然數）</p>\n<p>外延＝詞項的<strong>組成份子</strong>（2, 4, 6…）</p>\n<p>Copi：內涵＝意涵 connotation；外範＝指涉 denotation。</p>\n"},{"id":"c42-jtfme","topic":"m31","front":"完整外延 vs 非完整外延？","back":"<p><strong>完整</strong>：指稱集合中<strong>所有</strong>份子（七大洲）</p>\n<p><strong>非完整</strong>：未指稱所有份子（哲學家包括柏拉圖、康德、尼采、釋迦牟尼、孔子等）</p>\n"},{"id":"c43-1luw3","topic":"m31","front":"內涵與外延的四個關係？","back":"<p>(1) <strong>外延被內涵決定，反之不然</strong>（等邊/等角三角形；Forbes 全球/美國首富）；外延不同 → 內涵必不同（中國人/香港人/上海人/華人）</p>\n<p>(2) 內涵遞增 → 外延<strong>不遞增</strong></p>\n<p>(3) <strong>內涵固定則外延固定</strong>（「人」不變，「活人」才變）〔⚠️ 講者話<strong>唔考</strong>〕</p>\n<p>(4) 外延變動 → 內涵<strong>反向</strong>改變（合資格申請獎學金學生）</p>\n"},{"id":"c44-1qwib","topic":"m31","front":"三種定義（slides）及其評價？","back":"<p><strong>規創 Stipulative</strong>：創新；冇真假，只有<strong>接受與否</strong>（佛系、0尊、67 → 日後可轉字詞定義：王老五、蘇絲黃、Gen Z）</p>\n<p><strong>釐定 Precising</strong>：為「太快」等含混字眼定界線；冇真假，但可判斷<strong>恰當與否</strong>（法定年齡、超速、貧窮線、十大傑出青年）</p>\n<p><strong>字詞 Lexical</strong>：消除歧義、描述既有意義；<strong>有真假</strong>，須依規則</p>\n"},{"id":"c45-1x0d7","topic":"m31","front":"字詞定義三條規則（slides）？","back":"<ol>\n<li><p>不可<strong>太闊</strong>（鳥＝有翅膀的動物）</p>\n</li>\n<li><p>不可<strong>太窄</strong>（鳥＝有羽毛會飛的動物）</p>\n</li>\n<li><p>不可<strong>循環</strong>（心理學＝研究心理相關的學科）</p>\n</li>\n</ol>\n"},{"id":"c46-92mn7","topic":"m31","front":"Copi 五種定義？","back":"<p><strong>規創</strong>（g 因子、googol、Pragmaticism）· <strong>詞典性</strong>（山；有對錯）· <strong>精確化</strong>（腦死亡；減含混）· <strong>理論性</strong>（熱；蘇格拉底；最多爭論）· <strong>說服性</strong>（社會主義＝伸延至經濟領域的民主）</p>\n"},{"id":"c47-71k6d","topic":"m31","front":"Copi 三種爭論？","back":"<p>① <strong>真正分歧</strong>：態度（阿根廷世界杯）或事實（杭州/上海近黃山 → 地圖）</p>\n<p>② <strong>言詞之爭</strong>（占姆士松鼠）</p>\n<p>③ <strong>表面言詞之爭、實際真正分歧</strong>（性愛鏡頭電影算不算色情電影）</p>\n"},{"id":"c48-b6ovy","topic":"m31","front":"Copi 種差定義五條法則？","back":"<ol>\n<li><p>說明<strong>本質屬性</strong>（＝約定俗成的意涵）</p>\n</li>\n<li><p>不可<strong>循環</strong>（不能自我節制的賭徒）</p>\n</li>\n<li><p>不可<strong>過寬/過窄</strong>（無毛兩足 → 拔毛雞；皮製的鞋）</p>\n</li>\n<li><p>不可用<strong>歧義、晦澀、比喻</strong>（Spencer 進化；結婚戒指止血環）</p>\n</li>\n<li><p>可用肯定就不用<strong>否定</strong>（長沙發；但孤兒、禿頭可以）</p>\n</li>\n</ol>\n"},{"id":"c49-orwwj","topic":"m31","front":"種差定義的兩步？","back":"<p>先指出<strong>屬 (genus)</strong>，再指出<strong>種差 (specific difference)</strong>。</p>\n<p>例：六角形＝具有六條邊（種差）的多邊形（屬）。屬／種在邏輯中是<strong>相對</strong>術語（生物學：絕對）。</p>\n"},{"id":"c50-1660f","topic":"m31","front":"意涵的三種意思？","back":"<p><strong>主觀的</strong>（因人因時而異 ✘）· <strong>客觀的</strong>（要無所不知 ✘，例：圓形面積最大）· <strong>約定俗成的</strong>（公共、不用無所不知 ✔ → 下定義用）</p>\n"},{"id":"c51-1gyg7","topic":"m31","front":"指涉性定義 &amp; 實指定義的局限？","back":"<p>列舉例子：<strong>心理上有用，邏輯上不足</strong>（不同內涵可同外延；陳大文可作很多通名的例子）。</p>\n<p>實指：只能指看得見的；<strong>姿勢本身含糊</strong>。學語言的根本之道是<strong>觀察和模仿</strong>。</p>\n"},{"id":"c52-mxue6","topic":"m31","front":"運作定義 operational definition？","back":"<p><strong>P. W. Bridgeman</strong>《現代物理學的邏輯》：若且唯若特定運作得出特定結果，字詞便正確應用；只有<strong>公開、可重複</strong>的運作才用得上。</p>\n"},{"id":"c53-1g7av","topic":"m31","front":"「獨角獸」例子說明甚麼？","back":"<p>有意義但<strong>外範是空的</strong> → 意義關於<strong>內涵多過外範</strong>；內涵才是定義的關鍵。</p>\n<p>另外：定義與被界定端是否指涉存在事物無關。</p>\n"},{"id":"c54-10lip","topic":"m32","front":"認知意義 cognitive meaning（slides）？","back":"<p>語句<strong>至少要談得上真假</strong>（有真值 truth-value）才有認知意義。問句沒有真值 → 不是述句。</p>\n"},{"id":"c55-z8xd3","topic":"m32","front":"分析述句 vs 綜合述句？","back":"<p><strong>分析</strong>：單從語句分析判定真假（恆真句、矛盾句、語義界定：王老五是未婚漢、神奇女俠是男性）→ <strong>必然、先驗、沒有信息內容</strong></p>\n<p><strong>綜合</strong>：要經驗事實（綜合真句：地球上有生命；綜合假句：地球是平的）→ <strong>適然、後驗、有信息內容</strong></p>\n"},{"id":"c56-1u9p0","topic":"m32","front":"四個驗證原則？","back":"<p><strong>檢證 Verification</strong>：原則上可<strong>證明為真</strong></p>\n<p><strong>印證 Confirmation</strong>：可被證據<strong>支持為真</strong>（檢證的寬鬆版；非封閉全稱語句）</p>\n<p><strong>否證 Falsification</strong>：可<strong>證明為假</strong>（全稱語句；科學 vs 偽科學）</p>\n<p><strong>非證 Disconfirmation</strong>：可被證據<strong>支持為假</strong>（否證的寬鬆版；特稱語句；品質保證）</p>\n"},{"id":"c57-nq3x7","topic":"m32","front":"否證原則下的偽科學例子？","back":"<p>「人是理性的」、孟子性善論、<strong>S. Freud&#39;s psychoanalytic theory</strong>、<strong>K. Marx&#39;s theory of history</strong></p>\n"},{"id":"c58-onj4l","topic":"m32","front":"非知意義四種（slides 例子）？","back":"<p><strong>規範</strong>：孟子性善論</p>\n<p><strong>情感</strong>：煮豆燃豆萁，豆在釜中泣…</p>\n<p><strong>評價</strong>：萬般皆下品，惟有讀書高</p>\n<p><strong>美學</strong>：天街小雨潤如酥，草色遙看近卻無</p>\n"},{"id":"c59-1t2zg","topic":"m33","front":"兩個基要的方法學區分？","back":"<p><strong>析合區分</strong>（分析 vs 綜合語句）＋ <strong>意義區分</strong>（有 vs 無認知意義）——邏輯經驗論（早期稱邏輯實徵論）；維也納學圈：施里克、卡納普。</p>\n"},{"id":"c60-1vhhm","topic":"m33","front":"析合區分三要點？","back":"<p>分析語句：<strong>先驗、必然、沒有實質內容</strong></p>\n<p>綜合語句：<strong>後驗、適然、有實質內容</strong></p>\n<p>必然地真＝在任何可能的情況下皆為真。</p>\n"},{"id":"c61-hmade","topic":"m33","front":"認知意義的定義（李天命）？","back":"<p><strong>若且唯若 S 有真假條件 (truth-conditions)，S 有認知意義</strong>。沒有認知意義＝沒有真假可言＝「假都不如」。</p>\n"},{"id":"c62-1uzur","topic":"m33","front":"檢證原則 VP* 要點？","back":"<p>只限<strong>綜合語句</strong>（分析語句全部有認知意義）；要求「<strong>原則上有可能</strong>被經驗證明為真」——不是實際已證實（已證明為假都可以：飛刀例不虛發）；只排斥<strong>缺乏可檢證性</strong>的語句，不排斥假語句。</p>\n"},{"id":"c63-5uhyk","topic":"m33","front":"為何由檢證原則轉向印證原則？","back":"<p><strong>開放集合的全稱語句</strong>（一切人皆有腦 U）不可能被證明為真 → 會被判沒有認知意義（荒謬，大多數科學定律都是這樣）。</p>\n<p>U <strong>不可檢證但可印證</strong>。通得過檢證 ⇒ 通得過印證，反之不然。</p>\n"},{"id":"c64-1un68","topic":"m33","front":"圖五六類？","back":"<p><strong>A</strong> 恒真句（凡王老五都是未婚漢）· <strong>B</strong> 矛盾句（有些王老五是已婚婦）→ 邏輯意義</p>\n<p><strong>C</strong> 綜合真句（太陽質量大過地球）· <strong>D</strong> 綜合假句 → 經驗意義</p>\n<p><strong>E</strong> 有非知意義（人應該愛國；你是我的靈魂；智者人生更可貴；白日放歌須縱酒）</p>\n<p><strong>F</strong> 全無意義（無自無；代數的肚皮安慰電子的大腿）</p>\n"},{"id":"c65-nn4e2","topic":"m33","front":"K1 / K2 / K3？","back":"<p><strong>K1</strong> 壽命或超過或不超過一百歲 → 分析</p>\n<p><strong>K2</strong> 壽命都超過一百歲 → 有可印證性的綜合語句（假，但有認知意義）</p>\n<p><strong>K3</strong> 應該每月祈禱至少一百次 → 無認知意義，有<strong>規範意義</strong></p>\n"},{"id":"c66-1l0cq","topic":"m33","front":"邏輯論證的性能？","back":"<p><strong>雖不能增加新的內容，但能把既有的隱含的內容明顯地披露出來</strong>。一切邏輯真句分析地真、沒有實質內容，但邏輯不是沒有用。</p>\n"},{"id":"c67-1983v","topic":"m33","front":"「人皆有理性」辯護的問題？","back":"<p>把綜合語句<strong>解釋成分析語句</strong>（沒有理性就不叫人）→ <strong>真但空洞無物</strong>。同法剖析「處女不是真正的女人」。</p>\n"},{"id":"c68-14pdw","topic":"m33","front":"總結：避免兩個思想泥沼？","back":"<p>① 析合區分 → 認清<strong>教條主義</strong>：沒有任何語句可以<strong>既有實質內容又有必然性</strong></p>\n<p>② 意義區分 → 警覺<strong>沒有認知意義</strong>的說法（黑格爾「絕對即是無」、現象學家、「信仰騎着懷疑兜圈子」）</p>\n"},{"id":"c69-cb7md","topic":"m33","front":"非知意義的重點？","back":"<p>認知意義只是意義的一種（動物/生物）；各種非知意義<strong>不互相排斥</strong>（某甲是一個混蛋）；認知與非知意義<strong>也不互相排斥</strong>（西風殘照，漢家陵闕）；泰戈爾詩句只有非知意義。</p>\n"}],"pages":{"method":"<h1>點樣用最少時間攞最高分？（有研究根據）</h1>\n<blockquote>\n<p><strong>結論先講</strong>：唔好淨係「睇」筆記。<strong>做題 → 對答案睇解釋 → 錯題隔一陣再做</strong>，係研究證實最有效嘅方法。呢個網站成個設計都係圍繞呢點。</p>\n</blockquote>\n<h2>1. 研究講咩？</h2>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>研究結果</th>\n<th>呢個網站點用</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Practice testing / Retrieval practice（做題、主動回憶）</strong></td>\n<td>Dunlosky et al. (2013) 評估 10 種常用溫書方法，只有<strong>兩種</strong>評為「<strong>high utility</strong>」：practice testing 同 distributed practice。Rowland (2014) meta-analysis：做測驗比重讀效果大（g ≈ 0.50）；<strong>有 feedback</strong> 時效果更大（g ≈ 0.73 vs 0.39）。</td>\n<td>✍️ 練習：每題即時對答案 + 解釋</td>\n</tr>\n<tr>\n<td><strong>同真考試格式一致</strong></td>\n<td>Adesope et al. (2017)：practice test 整體 g ≈ 0.61；練習題型同真考試題型<strong>一致</strong>時效果更好；MC 練習效果好（g ≈ 0.70）。</td>\n<td>題庫全部係 <strong>MC + T/F</strong>（同 midterm 一樣）；⏱️ 模擬考計時 50 分鐘</td>\n</tr>\n<tr>\n<td><strong>Distributed / spaced practice（間隔重溫）</strong></td>\n<td>Dunlosky 評為 high utility：同一份嘢分開幾次溫，好過一次過。</td>\n<td>答錯嘅題目會喺<strong>幾題之後自動再出現</strong>；錯題本要<strong>連續答啱兩次</strong>先算掌握</td>\n</tr>\n<tr>\n<td><strong>Interleaving（混合練習）</strong></td>\n<td>Dunlosky 評為 moderate：混合唔同類型嘅題目，訓練你<strong>分辨</strong>相似概念。</td>\n<td>智能練習會<strong>混合課題</strong>；🔀 易混淆頁專攻 歧義/含混、檢證/印證……</td>\n</tr>\n<tr>\n<td><strong>Elaboration / self-explanation（解釋點解）</strong></td>\n<td>Dunlosky 評為 moderate。</td>\n<td>每題都有「💡 點解」；筆記有 ⚠️ 陷阱提示</td>\n</tr>\n<tr>\n<td><strong>Rereading / highlighting / summarizing（重讀、間螢光筆）</strong></td>\n<td>Dunlosky 評為 <strong>low utility</strong>。</td>\n<td>筆記已經幫你濃縮好；<strong>唔好花時間抄筆記</strong></td>\n</tr>\n<tr>\n<td><strong>Pretesting（未讀先考）</strong></td>\n<td>先嘗試答（就算答錯）會令之後學得更牢。</td>\n<td>🎯 一開始先做診斷測驗</td>\n</tr>\n<tr>\n<td><strong>Sleep（瞓覺）</strong></td>\n<td>學完之後瞓一晚，記憶保留明顯較好（例：一項 52 人研究，sleep 組保留顯著較多，d ≈ 0.72）。</td>\n<td>計劃明確叫你<strong>瞓覺</strong>；通頂會蝕底</td>\n</tr>\n</tbody></table>\n<h2>2. 今晚 + 明早嘅衝刺計劃（首頁可以逐項剔）</h2>\n<p><strong>今晚（約 3–4 個鐘，之後一定要瞓）</strong></p>\n<ol>\n<li>🎯 <strong>診斷測驗</strong>（10 分鐘）：未溫都做，估錯都有用。</li>\n<li>⚡ <strong>速記表</strong> + 🔀 <strong>易混淆</strong>（20 分鐘）：先搭好成科嘅框架。</li>\n<li>📚 <strong>Module 2 逐章</strong>（60 分鐘）：每章睇「0. 一頁總覽／一句總結」→ 撳「測試呢章」→ 睇錯題解釋 → 先至返去睇筆記入面你唔識嘅部分。</li>\n<li>📚 <strong>Module 3 逐章</strong>（50 分鐘）：同上。</li>\n<li>🎙️ <strong>課堂補充</strong>（10 分鐘）：講者喺堂上講過嘅考試提示同例子。</li>\n<li>⏱️ <strong>模擬考</strong>（45 分鐘）：40 題、50 分鐘，當真咁做。</li>\n<li>❌ <strong>錯題本</strong>（20 分鐘）：重做到全部清晒。</li>\n<li>😴 <strong>瞓覺</strong>。</li>\n</ol>\n<p><strong>明早（考試前 30–45 分鐘）</strong></p>\n<ol>\n<li>🃏 <strong>閃卡</strong>（只溫「未熟」）</li>\n<li>❌ 錯題本最後一 round；⚡ 速記表掃一次</li>\n<li>🎒 帶 <strong>Student ID、鉛筆、擦膠</strong>；LT-B，<strong>09:30 開考，09:45 後唔准入場</strong></li>\n</ol>\n<h2>3. 考場答題技巧（MC + T/F）</h2>\n<ul>\n<li>⭐ <strong>答錯唔扣分</strong>（講者堂上講：「答對有分，答錯冇分」）→ <strong>每一題都要答，唔好留白</strong>。</li>\n<li>⭐ <strong>睇清楚句號定問號</strong>：「4 + 5 = 8。」（陳述句）係錯；「4 + 5 = 8？」係一條<strong>概念問題</strong>（問題本身冇錯）。</li>\n<li><strong>T/F 陷阱字眼</strong>：「<strong>一定</strong>」「<strong>永遠</strong>」「<strong>唯一</strong>」「<strong>所有</strong>」「<strong>完全</strong>」「<strong>只要…就</strong>」——課程好多重點都係「<strong>不一定</strong>」（例：歧義不一定有問題；含混不一定是缺憾；闕義不一定有害；冇認知意義不一定冇意義）。</li>\n<li><strong>方向反轉題</strong>：好多 T/F 會將關係倒轉：實化（非具體 → 具體）、Appeal to Pity ⊂ Appeal to Emotion、內涵決定外延（唔係反過嚟）、通得過檢證 ⇒ 通得過印證（唔係反過嚟）。</li>\n<li><strong>分類題</strong>：先搵<strong>關鍵字</strong> → 對應概念（例：「應該／美／正確」→ 評價問題；「就是…就是」→ 絕對空廢；「每一步可能導致」→ 滑坡）。</li>\n<li><strong>英文題</strong>（Copi reading 部分可能用英文出）：genuine / merely verbal / apparently verbal but really genuine；belief vs attitude。</li>\n<li><strong>事實問題冇講年份</strong>：講者喺堂上提過，考卷上冇標年份嘅事實問題，理解為**考試當日（現在）**嘅事實。</li>\n<li>時間：50 分鐘，唔肯定就先估一個答案、用標記遲啲返嚟睇——<strong>唔好留白</strong>。</li>\n</ul>\n<h2>4. 網站使用貼士</h2>\n<ul>\n<li>進度自動儲存喺呢部機（localStorage），換機或者清 browser data 會冇咗。</li>\n<li>鍵盤：<strong>1–4 / A–D</strong> 揀答案、<strong>T / F</strong> 判斷題、<strong>Enter</strong> 下一題；閃卡 <strong>Space</strong> 揭卡、<strong>1/2/3</strong> 評分。</li>\n<li>筆記章尾「考試速攻」表嘅答案會<strong>模糊化</strong>，撳一下先睇——逼自己先諗。</li>\n<li>右上角 <strong>A− / A+</strong> 調字體大小，<strong>🌓</strong> 切換深色模式。</li>\n<li>呢個係一個獨立 HTML 檔案，可以 send 去手機用（WhatsApp / AirDrop / email 俾自己），喺手機 browser 開就得。</li>\n</ul>\n<h2>參考文獻</h2>\n<ul>\n<li>Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., &amp; Willingham, D. T. (2013). Improving students&#39; learning with effective learning techniques. <em>Psychological Science in the Public Interest, 14</em>(1), 4–58. <a href=\"https://iverson.cm.utexas.edu/courses/310M/Handouts/Dunlosky%20et%20al.%20-%202013%20-%20Improving%20Students%E2%80%99%20Learning%20With%20Effective%20Learni.pdf\">PDF</a></li>\n<li>Rowland, C. A. (2014). The effect of testing versus restudy on retention: A meta-analytic review of the testing effect. <em>Psychological Bulletin, 140</em>(6), 1432–1463.</li>\n<li>Adesope, O. O., Trevisan, D. A., &amp; Sundararajan, N. (2017). Rethinking the use of tests: A meta-analysis of practice testing. <em>Review of Educational Research, 87</em>(3), 659–701. <a href=\"https://www.researchgate.net/publication/315706448_Rethinking_the_Use_of_Tests_A_Meta-Analysis_of_Practice_Testing\">ResearchGate</a></li>\n<li>Donoghue, G. M., &amp; Hattie, J. A. C. (2021). A meta-analysis of ten learning techniques. <em>Frontiers in Education</em>. <a href=\"https://www.frontiersin.org/journals/education/articles/10.3389/feduc.2021.581216/full\">Link</a></li>\n<li>Sleep after learning aids the consolidation of factual knowledge, but not relearning (2021). <a href=\"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7953205/\">PMC7953205</a></li>\n</ul>\n","cheat":"<h1>⚡ 速記表：Modules 2 &amp; 3 一頁過</h1>\n<blockquote>\n<p>考前最後 10 分鐘掃呢頁。每一行都係高頻考點。</p>\n</blockquote>\n<h2>Module 2 — 語理分析 &amp; 語言的陷阱</h2>\n<h3>語理分析（李天命 I + slides 2a）</h3>\n<ul>\n<li><strong>定義</strong>：釐清主要用語的意思，辨明關鍵論點的義理，由此着手去分析問題（又叫 <em>linguistic analysis</em>）。</li>\n<li><strong>標記</strong>：「你所說的『X』是甚麼意思？」</li>\n<li><strong>slides</strong>：不採用人工語言，將邏輯融入日常語言；<strong>不是研究語言用法</strong>，而是分析思維合理性。</li>\n<li><strong>步驟</strong>：①分辨<strong>關鍵用語</strong> ②釐清其內容與意義 ③未能釐清 → 視情況回答（或不作回答）。</li>\n<li><strong>起點 vs 終點</strong>：李天命：方法學的<strong>起點，不是終點</strong>（知識建構靠科學方法）；slides：解決問題<strong>總是起點，也可以是終點，視乎問題性質</strong>。</li>\n<li><strong>方法學四種</strong>：語理分析 → 邏輯方法、科學方法 → 謬誤剖析（＝其餘三種的引申）。</li>\n<li><strong>語理分析是方法/進路；語意學是學科</strong>；語理分析＝語意學的基礎方法，語意學＝輔助工具。</li>\n<li><strong>哲學史</strong>：古代「甚麼是X」（玄學、倫理學）→ 近代「X在知識限度內嗎」（<strong>知識論</strong>）→ 現代「『X』一辭是甚麼意思」。</li>\n<li><strong>英美（分析哲學）vs 歐陸（現象學、存在主義）</strong>：分析家話歐陸「<strong>沒有腦</strong>／糟蹋人的思想」；歐陸話分析家「<strong>沒有心</strong>／糟蹋人的靈魂」。</li>\n<li><strong>分析哲學四支</strong>：早期（羅素、慕爾、維根斯坦）／<strong>邏輯實徵論</strong>（維也納學圈；反玄學重科學：卡納普、施里克、艾耶、函寶、萊興巴赫）／特構語言（符號邏輯：塔斯基、瑰英、波柏、古德曼）／<strong>日常語言</strong>（後期維根斯坦、萊爾、奧斯丁、史特勞遜）。</li>\n<li><strong>四類文字把戲</strong>：無中生有（柏烈得萊「絕對」、黑格爾之謎＝<strong>熱</strong>）／跳高一層（某個意義、觀點角度；孔子五百磅）／另一種X（類屬性徵要大致相同；真自由民主）／空洞派（油腔滑調、封閉系統 → <strong>無確定知識、無具體指引</strong>）。</li>\n<li><strong>偽贗問題</strong> → <strong>解消 (dissolve)</strong>，唔係解答。</li>\n</ul>\n<h3>問題分類（slides 2a）</h3>\n<table>\n<thead>\n<tr>\n<th>類別</th>\n<th>判斷</th>\n<th>例</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>概念</strong></td>\n<td>只分析概念、用語</td>\n<td>4+5=8?、生父比你大嗎、dy/dx、何謂反對黨、準時交功課？、超過十成燒傷？</td>\n</tr>\n<tr>\n<td><strong>事實</strong></td>\n<td><strong>原則上</strong>要經驗方法</td>\n<td>明年財赤？K2-18b 有生物？日本戰勝國？iPhone 17 銷量？</td>\n</tr>\n<tr>\n<td><strong>評價</strong></td>\n<td>概念 + 事實 + <strong>個人價值觀</strong></td>\n<td>科大美嗎？日出比日落美？同性戀不道德？延後垃圾徵費正確？</td>\n</tr>\n</tbody></table>\n<h3>李天命 6 陷阱：「闕歧含，著實僻」</h3>\n<table>\n<thead>\n<tr>\n<th>陷阱</th>\n<th>一句定義</th>\n<th>招牌例子</th>\n<th>利</th>\n<th>原則重點</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>闕義</strong></td>\n<td>語法完整、語意欠整（≠冇意義）</td>\n<td>講老實話最有利；生命有價值</td>\n<td>簡潔</td>\n<td>脈絡足以提示 → 無害</td>\n</tr>\n<tr>\n<td><strong>歧義</strong></td>\n<td>多過一個意義</td>\n<td>做夢；戰爭冇勝方（敗）；自由</td>\n<td>語言的經濟</td>\n<td>利用歧義玩文字遊戲 → 仍屬混淆</td>\n</tr>\n<tr>\n<td><strong>含混</strong></td>\n<td>冇截然明確界線</td>\n<td>禿子；好人；資本家；神蹟；善有善報</td>\n<td>彈性、概略知識</td>\n<td>無分明界線 ⇏ 無約略界線；廢話空話大話</td>\n</tr>\n<tr>\n<td><strong>著色</strong></td>\n<td>帶情感意含</td>\n<td>堅定/固執/愚頑（羅素）；尋芳/嫖妓</td>\n<td>表露情感、態度齊一</td>\n<td>唔准<strong>濫用</strong>（冇證據只靠情感）</td>\n</tr>\n<tr>\n<td><strong>實化</strong></td>\n<td>非具體名項 → 當具體</td>\n<td>社會是魔鬼；國家的意志；真理……</td>\n<td>生動濃縮優美</td>\n<td>思考時要可<strong>轉譯</strong>成有認知意義語句</td>\n</tr>\n<tr>\n<td><strong>僻義</strong></td>\n<td>違離通義 (stock sense)</td>\n<td>懷黑德「世界在我們之內」；一切都是虛幻；華嚴</td>\n<td>補充通義不足</td>\n<td>要<strong>聲明＋定義/例釋</strong>；流弊「<strong>真但多餘</strong>」</td>\n</tr>\n</tbody></table>\n<h3>講者 4 陷阱 + 謬誤（slides 2b）</h3>\n<ul>\n<li><strong>歧義</strong>：字詞歧義（欠、發夢、掛號）→ <strong>Equivocation</strong>；語句歧義（路不通行…、練跑減慢性病風險）→ <strong>Amphiboly</strong>。好處：免增新詞、避諱、創作（因荷而得藕）、避重就輕（下雨天留客）。</li>\n<li><strong>含混</strong>：高矮貧富、成功快樂…；立法要避免。→ <strong>Continuum Fallacy</strong>（窮人富人冇大分別）；<strong>Slippery Slope</strong>（每環只係<strong>可能</strong>非必然：上莊→搵唔到工）。</li>\n<li><strong>著色字詞</strong>：參考/抄襲、冷血殺人/英勇殺敵、只剩/還有；情緒意義會隨時間變（鬼佬）；唔買就笨。→ <strong>Appeal to Pity ⊂ Appeal to Emotion</strong>（殺父母求情孤兒）。</li>\n<li><strong>言辭空廢</strong>＝<strong>重言命題冒充事實陳述</strong>。<strong>絕對</strong>（有重言形式：做生意就是做生意；財政司）／<strong>相對</strong>（冇重言形式，要睇內容語境：父在母先亡；摧毀強國）。</li>\n</ul>\n<h3>Copi: Language（2.3）</h3>\n<ul>\n<li>一句話可以 <strong>express feelings while reporting facts</strong>；<strong>euphemisms</strong> = gentle words for harsh realities；emotive language OK in <strong>poetry</strong>, not in <strong>survey research</strong> — depends on <strong>purpose in context</strong>.</li>\n<li><strong>Disagreement in belief vs in attitude</strong>（死刑：阻嚇與否 = belief；國家應否處決 = attitude）。</li>\n<li><strong>3 disputes</strong>：obviously genuine（Yankees/Red Sox；Miami/Honolulu → map）／<strong>merely verbal</strong>（falling tree &quot;sound&quot;）／<strong>apparently verbal but really genuine</strong>（&quot;pornography&quot; film）。</li>\n<li>程序：先問有冇 <strong>ambiguity</strong> → 澄清後解決到 = merely verbal；解決唔到 = genuine。</li>\n</ul>\n<h2>Module 3 — 定義 &amp; 意義判準</h2>\n<h3>定義（slides 3a + Copi）</h3>\n<ul>\n<li><strong>被界定端 definiendum</strong> ↔ <strong>界定端 definiens</strong>（人 ↔ 理性的動物）。</li>\n<li><strong>內涵</strong>＝特徵（connotation）；<strong>外延</strong>＝組成份子（denotation）。完整外延（七大洲）／非完整外延（哲學家包括…）。</li>\n<li><strong>內涵決定外延，反之不然</strong>：等邊/等角三角形；Forbes 全球/美國首富 → 內涵唔同外延同；外延唔同 → 內涵必唔同。內涵↑ → 外延<strong>不遞增</strong>。內涵固定 → 外延固定（「人」唔變，「活人」先變）〔⚠️ 講者話<strong>唔考</strong>〕。外延變 → 內涵反向變（獎學金）。</li>\n<li><strong>slides 3 種</strong>：規創（冇真假，<strong>接受與否</strong>；佛系/0尊/67 → 王老五/Gen Z）｜釐定（冇真假，<strong>恰當與否</strong>；法定年齡/超速/貧窮線）｜字詞（<strong>有真假</strong>；消除歧義，冇增加意義）。</li>\n<li><strong>slides 3 規則</strong>：不可太闊（鳥＝有翅膀）／太窄（鳥＝有羽毛會飛）／循環（心理學＝研究心理）。</li>\n<li><strong>Copi 5 種</strong>：規創（g 因子、googol）／詞典性（山）／精確化（腦死亡；<strong>減含混</strong>）／理論性（熱；蘇格拉底；<strong>最多爭論</strong>）／說服性（社會主義＝經濟領域的民主）。</li>\n<li><strong>Copi 5 法則</strong>：本質（約定俗成意涵）／不循環／不過寬過窄（拔毛雞＝過寬；皮製鞋＝過窄）／不用歧義晦澀比喻（Spencer、止血環）／能肯定就唔否定（長沙發 ✘；孤兒 ✔）。</li>\n<li>意涵：主觀 ✘、客觀 ✘、<strong>約定俗成 ✔</strong>。種差定義：<strong>屬 + 種差</strong>（六角形＝六條邊的多邊形）。實指定義：姿勢含糊；學語言靠<strong>觀察和模仿</strong>。運作定義：<strong>Bridgeman</strong>。獨角獸：冇外延但有意義 → <strong>內涵先係關鍵</strong>。</li>\n<li><strong>定義解決唔到</strong>：色情電影低俗定藝術？人生苦定樂？</li>\n</ul>\n<h3>意義判準（slides 3b）</h3>\n<ul>\n<li>認知意義＝<strong>談得上真假</strong>（問句冇真值）。</li>\n<li><strong>分析</strong>（恆真句、矛盾句、語義界定）＝必然、先驗、冇信息內容；<strong>綜合</strong>（綜合真句/假句）＝適然、後驗、有信息內容。</li>\n<li><strong>四原則（只判斷綜合語句有冇認知意義）</strong>：<ul>\n<li>檢證＝原則上可<strong>證明為真</strong>；印證＝可<strong>支持為真</strong>（寬鬆版；<strong>非封閉全稱</strong>：所有天鵝都是白色）</li>\n<li>否證＝原則上可<strong>證明為假</strong>（<strong>非封閉全稱</strong>；<strong>科學 vs 偽科學</strong>：人是理性的、孟子性善論、Freud、Marx）</li>\n<li>非證＝可<strong>支持為假</strong>（寬鬆版；<strong>特稱</strong>：有一隻天鵝是黑色；<strong>品質保證</strong>）</li>\n</ul>\n</li>\n<li><strong>非知意義</strong>：規範（孟子性善論）／情感（煮豆燃豆萁）／評價（萬般皆下品）／美學（天街小雨潤如酥）。冇認知意義 ≠ 冇意義/價值。</li>\n</ul>\n<h3>李天命：兩個基要的方法學區分（3.2）</h3>\n<ul>\n<li>邏輯經驗論（＝邏輯實徵論）：<strong>析合區分</strong>＋<strong>意義區分</strong>；維也納學圈：施里克、卡納普（艾耶、萊興巴赫<strong>唔屬於</strong>）。</li>\n<li>分析語句＝<strong>意義足以決定真假</strong>；恒真句／矛盾句；綜合真句（光入射角＝反射角）／綜合假句（凡物熱縮冷脹）。</li>\n<li>三要點：分析＝<strong>先驗、必然、冇實質內容</strong>；綜合＝後驗、適然、有實質內容。必然地真＝<strong>任何可能情況下皆真</strong>。</li>\n<li>應用：「人皆有理性」→ 變分析 → <strong>真但空洞</strong>；「歷史潮流不可抵擋」→「不可」= 不應該／不能夠；邏輯：<strong>唔增加新內容，但披露隱含內容</strong>。</li>\n<li>認知意義 ⟺ 有<strong>真假條件</strong>。檢證原則：原則上可能（≥ <strong>邏輯地可能</strong>）；飛刀例不虛發；<strong>唔排斥假語句</strong>。開放集合全稱（一切人皆有腦）→ 不可檢證但<strong>可印證</strong>；通得過檢證 ⇒ 通得過印證。</li>\n<li>玄學（超驗玄想形上學）、超越的上帝、觀念論（齊白石的畫）→ 冇認知意義：「<strong>唔反對亦唔贊同，只係唔知你講乜</strong>」；非 P 亦然。</li>\n<li><strong>圖五</strong>：A 恒真／B 矛盾（邏輯意義）／C 綜合真／D 綜合假（經驗意義）／E 非知意義／F 全無意義（無自無）。</li>\n<li>K1 分析；K2 可印證綜合（假）；K3「應該祈禱一百次」→ 規範意義。非知意義之間、認知與非知之間都<strong>唔互相排斥</strong>。</li>\n<li>總結：<strong>冇任何語句可以既有實質內容又有必然性</strong>（教條主義）。</li>\n</ul>\n","confuse":"<h1>🔀 易混淆概念對照（MC 最鍾意考呢啲）</h1>\n<blockquote>\n<p>研究話「interleaving（混合對比）」可以訓練你<strong>分辨相似概念</strong>。每組先遮住右邊諗一諗，再睇答案。</p>\n</blockquote>\n<h2>1. 歧義 vs 含混 vs 闕義</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>歧義 Ambiguity</th>\n<th>含混 Vagueness</th>\n<th>闕義 Meaning-incomplete</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>問題</td>\n<td><strong>多過一個意義</strong></td>\n<td><strong>冇明確界線</strong></td>\n<td><strong>語意欠整</strong>（漏咗比較對象／對誰／一切定某些）</td>\n</tr>\n<tr>\n<td>測試問題</td>\n<td>「你指邊個意思？」</td>\n<td>「幾多先算？界線喺邊？」</td>\n<td>「同乜比？對邊個？」</td>\n</tr>\n<tr>\n<td>例</td>\n<td>做夢、敗、自由、欠、掛號</td>\n<td>禿子、好人、資本家、很熱、神蹟</td>\n<td>講老實話最有利；生命有價值</td>\n</tr>\n<tr>\n<td>好處</td>\n<td>語言的經濟</td>\n<td>彈性、概略知識</td>\n<td>簡潔</td>\n</tr>\n<tr>\n<td>謬誤（講者）</td>\n<td>Equivocation / Amphiboly</td>\n<td>Continuum / Slippery slope</td>\n<td>—</td>\n</tr>\n</tbody></table>\n<h2>2. Equivocation vs Amphiboly</h2>\n<table>\n<thead>\n<tr>\n<th>模稜兩可的謬誤 Equivocation</th>\n<th>歧義句構的謬誤 Amphiboly</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>字詞</strong>歧義（一個字前後轉意思）</td>\n<td><strong>語句結構</strong>歧義（句子點斷/點組合）</td>\n</tr>\n<tr>\n<td>同一條河；爭取自由徒勞；室友 vs 女朋友（沒有任何東西）</td>\n<td>反對美國的單邊主義提倡者；兒子生性病母倍感安慰；父涉姦兒子女友被捕</td>\n</tr>\n</tbody></table>\n<h2>3. Continuum Fallacy vs Slippery Slope</h2>\n<table>\n<thead>\n<tr>\n<th>連續體謬誤</th>\n<th>滑坡謬誤</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>結論：「<strong>冇分別／分唔到</strong>」</td>\n<td>結論：「<strong>最後會導致嚴重後果</strong>」</td>\n</tr>\n<tr>\n<td>利用<strong>含混</strong>、漸變</td>\n<td>一連串因果鏈，每步只係<strong>可能</strong>非必然</td>\n</tr>\n<tr>\n<td>窮人富人冇大分別；我同拿 A- 嘅室友差不多</td>\n<td>主動安樂死 → 草菅人命；上莊 → 搵唔到工</td>\n</tr>\n</tbody></table>\n<h2>4. 絕對空廢 vs 相對空廢</h2>\n<table>\n<thead>\n<tr>\n<th>絕對空廢</th>\n<th>相對空廢</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>有重言句形式</strong>（A 就是 A；如果 P 就 P）</td>\n<td><strong>唔要求</strong>重言句形式</td>\n</tr>\n<tr>\n<td>睇形式就知必然真</td>\n<td>要<strong>分析內容 + 了解語境</strong></td>\n</tr>\n<tr>\n<td>做生意就是做生意；鍾意就係鍾意；會嚟就自然會來；財政司「支出大於收入就有赤字」</td>\n<td>父在母先亡；明年感情事業不順；發動戰爭摧毀強國；明年市場動盪</td>\n</tr>\n<tr>\n<td>共通：以<strong>必然為真的內容冒充事實陳述</strong>；判斷靠<strong>兩個條件</strong>唔靠真假</td>\n<td>（係放寬定義嘅產物，提高工具可用性）</td>\n</tr>\n</tbody></table>\n<h2>5. 著色 vs 實化 vs 僻義</h2>\n<table>\n<thead>\n<tr>\n<th>著色</th>\n<th>實化</th>\n<th>僻義</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>字帶<strong>情感意含</strong></td>\n<td><strong>非具體 → 當具體名項</strong></td>\n<td><strong>違離慣常用法</strong></td>\n</tr>\n<tr>\n<td>堅定/固執/愚頑</td>\n<td>社會是魔鬼；國家的意志</td>\n<td>世界在我們之內；一切都是虛幻</td>\n</tr>\n<tr>\n<td>濫用＝冇證據只靠情感</td>\n<td>思考時要能<strong>轉譯</strong></td>\n<td>流弊：<strong>真但多餘</strong></td>\n</tr>\n</tbody></table>\n<h2>6. 李天命 6 陷阱 vs 講者 4 陷阱</h2>\n<table>\n<thead>\n<tr>\n<th>李天命（2.2）</th>\n<th>講者 slides（2b）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>闕義、<strong>歧義</strong>、<strong>含混</strong>、<strong>著色</strong>、實化、僻義</td>\n<td><strong>歧義</strong>、<strong>含混</strong>、<strong>著色字詞</strong>、<strong>言辭空廢</strong></td>\n</tr>\n<tr>\n<td>冇言辭空廢（但 2.1 有「空洞派/油腔滑調」）</td>\n<td>冇闕義、實化、僻義</td>\n</tr>\n</tbody></table>\n<h2>7. 概念 vs 事實 vs 評價問題</h2>\n<table>\n<thead>\n<tr>\n<th>概念</th>\n<th>事實</th>\n<th>評價</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>分析概念、用語就答到</td>\n<td><strong>原則上</strong>要經驗方法</td>\n<td>概念 + 事實 + <strong>個人價值觀</strong></td>\n</tr>\n<tr>\n<td>4+5=8?（答案錯都係概念題）</td>\n<td>明年財赤？（未來都係事實題）</td>\n<td>「美」「好」「應該」「正確」「道德」</td>\n</tr>\n</tbody></table>\n<h2>8. 李天命「起點」vs slides「起點／終點」</h2>\n<table>\n<thead>\n<tr>\n<th>李天命（方法學整體）</th>\n<th>slides（解決個別問題）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>語理分析係方法學<strong>起點，唔係終點</strong>（知識建構靠科學方法）</td>\n<td>語理分析<strong>總是起點，也可以是終點</strong>，視乎問題性質（概念問題可以係終點）</td>\n</tr>\n</tbody></table>\n<h2>9. Definiendum vs Definiens；內涵 vs 外延</h2>\n<table>\n<thead>\n<tr>\n<th>被界定端 <strong>definiendum</strong></th>\n<th>界定端 <strong>definiens</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>要下定義嗰個（人、民主）</td>\n<td>用嚟解釋嗰個（理性的動物；保護人權的政治體制）</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>內涵 Intension（意涵 connotation）</th>\n<th>外延 Extension（外範／指涉 denotation）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>特徵、屬性（可被 2 整除的自然數）</td>\n<td>組成份子（2, 4, 6…）</td>\n</tr>\n<tr>\n<td><strong>決定</strong>外延</td>\n<td>被內涵決定（相同外延 ⇏ 相同內涵）</td>\n</tr>\n</tbody></table>\n<h2>10. slides 三種定義 vs Copi 五種定義</h2>\n<table>\n<thead>\n<tr>\n<th>slides</th>\n<th>評價</th>\n<th>Copi 對應</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>規創 Stipulative</td>\n<td>接受與否</td>\n<td>規創（非對非錯；建議/指引）</td>\n</tr>\n<tr>\n<td>釐定 Precising</td>\n<td>恰當與否</td>\n<td><strong>精確化</strong>（減少含混）</td>\n</tr>\n<tr>\n<td>字詞 Lexical</td>\n<td><strong>有真假</strong></td>\n<td><strong>詞典性</strong>（消除歧義；有對錯）</td>\n</tr>\n<tr>\n<td>—</td>\n<td>—</td>\n<td>理論性（最多爭論）；說服性（左右態度）</td>\n</tr>\n</tbody></table>\n<h2>11. 太闊 vs 太窄 vs 循環</h2>\n<table>\n<thead>\n<tr>\n<th>太闊（過寬）</th>\n<th>太窄（過窄）</th>\n<th>循環</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>界定端指涉<strong>更多</strong></td>\n<td>界定端指涉<strong>更少</strong></td>\n<td>被界定端出現喺界定端</td>\n</tr>\n<tr>\n<td>鳥＝有翅膀的動物；人＝無毛兩足動物（拔毛雞）</td>\n<td>鳥＝有羽毛會飛；鞋＝皮製</td>\n<td>心理學＝研究心理；不能自我節制的賭徒</td>\n</tr>\n</tbody></table>\n<h2>12. 四個驗證原則</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>證明（嚴）</th>\n<th>支持（寬）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>為真</strong></td>\n<td><strong>檢證</strong> Verification</td>\n<td><strong>印證</strong> Confirmation（全稱，非封閉）</td>\n</tr>\n<tr>\n<td><strong>為假</strong></td>\n<td><strong>否證</strong> Falsification（全稱；科學 vs 偽科學）</td>\n<td><strong>非證</strong> Disconfirmation（特稱；品質保證）</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p>口訣：「<strong>檢印向真，否非向假；檢否要證明，印非只要支持</strong>」</p>\n</blockquote>\n<h2>13. 分析 vs 綜合</h2>\n<table>\n<thead>\n<tr>\n<th>分析</th>\n<th>綜合</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>意義足以決定真假</td>\n<td>要經驗考察</td>\n</tr>\n<tr>\n<td><strong>先驗、必然、冇實質內容</strong></td>\n<td><strong>後驗、適然、有實質內容</strong></td>\n</tr>\n<tr>\n<td>恒真句／矛盾句（可以係<strong>假</strong>！）</td>\n<td>綜合真句／綜合假句／<strong>冇認知意義</strong>（E、F）</td>\n</tr>\n</tbody></table>\n<h2>14. 檢證原則 vs 印證原則（李天命）</h2>\n<table>\n<thead>\n<tr>\n<th>檢證 VP*</th>\n<th>印證 CP</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>原則上可<strong>證明</strong>為真</td>\n<td>原則上可被證據<strong>支持</strong></td>\n</tr>\n<tr>\n<td>一切人皆有腦 ✘（開放集合）</td>\n<td>一切人皆有腦 ✔</td>\n</tr>\n<tr>\n<td>通得過 ⇒ 一定通得過印證</td>\n<td>通得過 ⇏ 一定通得過檢證</td>\n</tr>\n</tbody></table>\n<h2>15. 認知意義 vs 非知意義 vs 全無意義</h2>\n<table>\n<thead>\n<tr>\n<th>有認知意義</th>\n<th>冇認知意義但有非知意義</th>\n<th>全無意義</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>有真假條件（真或假都得）</td>\n<td>規範／情感／評價／美學</td>\n<td>乜都冇</td>\n</tr>\n<tr>\n<td>太陽質量 &gt; 地球；地球是平的</td>\n<td>人應該愛國；煮豆燃豆萁；萬般皆下品；天街小雨</td>\n<td>無自無；正方形喝了半副撲克牌</td>\n</tr>\n</tbody></table>\n<h2>16. Copi 三種爭論 &amp; belief vs attitude</h2>\n<table>\n<thead>\n<tr>\n<th>Obviously genuine</th>\n<th>Merely verbal</th>\n<th>Apparently verbal but really genuine</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Yankees vs Red Sox（attitude）；Miami/Honolulu（facts → map）；阿根廷世界杯（態度）；杭州/上海近黃山（地圖）</td>\n<td>Falling tree &quot;sound&quot;；占姆士松鼠</td>\n<td>&quot;Pornography&quot; film；性愛鏡頭電影係咪色情</td>\n</tr>\n</tbody></table>\n","lecture":"<h1 id=\"lec-h1\">🎙️ 課堂補充</h1>\n<blockquote>\n<p>以下內容由 10 堂課堂錄音（Module 2：9月14日–10月2日；Module 3：10月2日–10月16日）以 Whisper 自動轉錄後整理。轉錄由廣東話自動生成，可能有錯字；<strong>如與 slides / readings 有出入，以 slides / readings 為準</strong>；但講者明確講過嘅考試安排／判斷方法，以講者為準。\n⚠️ 講者話：上堂用嘅 PowerPoint 同 upload 嘅 PowerPoint「起碼差三分一以上」——堂上補充嘅嘢好重要。（2026-10-16 [62:40]）</p>\n</blockquote>\n<h2 id=\"lec-h2\">⭐ 最重要的考試提示（總覽）</h2>\n<p><strong>格式</strong></p>\n<ul>\n<li>⭐ <strong>範圍：Module 2 + 3（Module 1 唔考）</strong>；<strong>50 分鐘</strong>；<strong>只有 MC 同 True or False</strong>；題數未定，但<strong>少過 50 題</strong>（平均每題至少 1 分鐘）。（2026-10-16 [58:07]–[58:54]）</li>\n<li>⭐ <strong>三種題型</strong>：① <strong>True or False</strong>（50-50）② <strong>問題分類</strong>（A 概念／B 事實／C 評價，三選一）③ <strong>ABCD 四選一 MC</strong>；<strong>唔會有 ABCDE</strong>。（2026-10-05 [02:16]）</li>\n<li>⭐ <strong>T/F 每題分數會少過多過兩個 option 嘅 MC</strong>（因為估中機會 50%）。（2026-10-16 [59:56]–[60:24]）</li>\n<li>⭐ <strong>答錯唔扣分</strong>——「答對有分，答錯冇分」→ <strong>每題都要答</strong>；缺席 midterm 冇補考 = 0 分。（2026-09-14 [35:15]；2026-10-05 [00:43]）</li>\n<li>09:30 開考，LT-B，冇編位、隔開坐；記得帶 ID。過往有人 20 分鐘左右做完。（2026-10-16 [58:07]、[60:59]–[62:40]）</li>\n</ul>\n<p><strong>唔考／會避開</strong></p>\n<ul>\n<li>⭐ <strong>「內涵固定則外延固定」（slides 內涵與外延的關係（3）打咗 * 嗰條）唔考</strong>——講者自己對 textbook「人 vs 活人」嘅解釋只係部分同意。（2026-10-02 [67:48]；2026-10-05 [03:17]）</li>\n<li>有爭議嘅例子（水嘅化學式、「自古以來」領土問題）考試會避開。（2026-09-18；2026-09-21 [68:49]；2026-10-09 [67:19]）</li>\n<li>「重言句」係咪等於「恆真句」：唔同書講法唔同（講者自己將重言句理解為「A 就是 A」）；如果考，會加 remark 說明。（2026-10-09 [53:21]–[54:03]）</li>\n<li>東、西方文化／哲學史背景唔考。（2026-09-14 [22:59]）</li>\n</ul>\n<p><strong>答題方法</strong></p>\n<ul>\n<li>⭐ <strong>事實問題冇標年份 ＝ 考試當日（2026年10月23日）／現在</strong>嘅事實。（2026-09-14 [77:06]–[78:09]）</li>\n<li>⭐ <strong>睇清楚句號定問號</strong>：「4 + 5 = 8」（陳述）係錯；「4 + 5 = 8？」係<strong>概念問題</strong>。（2026-09-14 [62:02]）</li>\n<li>⭐ <strong>問題分類只考分類唔考答案</strong>；一條問題只屬一類；次序：<strong>先試概念 → 再試事實 → 先至評價</strong>；判斷唔到就返去釐清關鍵字眼；<strong>數學一律係概念問題</strong>。（2026-09-18 [33:36]；2026-09-21 [03:30]–[05:08]）</li>\n<li>⭐ 例題（講者親口講）：「<strong>一個理論冇認知意義，係咪代表冇意義？</strong>」→ <strong>False</strong>（可以有非知意義）。（2026-10-16 [59:24]）</li>\n<li>例題：「<strong>正方形是四條邊的圖形</strong>」呢個定義<strong>太闊</strong>（會包埋長方形）→ T/F 題型示範。（2026-10-09 [12:10]–[12:59]）</li>\n</ul>\n<h1 id=\"lec-h3\">課堂 2026-09-14（Module 1 收尾；Module 2 開始：語理分析、問題分類——概念／事實問題）</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h4\">考試提示</h2>\n<ul>\n<li>⭐ <strong>期中範圍 = Module 2 + 3</strong>：講者介紹完 Module 2（問題分類 → 日常語言嘅毛病）同 Module 3（定義 → 用框架判斷知識「有用定冇用」）之後話：「呢度就係中期嘅內容」。（[30:23]–[32:27]）</li>\n<li>⭐ <strong>全 MC</strong>：「我嘅考試真係考 MC 嘅」；作為一份 MC 考試，缺席好蝕底——「點都有啲分數」，千祈唔好唔出現。（[33:55]、[35:15]）</li>\n<li>⭐ <strong>答錯唔扣分</strong>：以前葉教授都係考 MC，但係「答對加分、答錯扣分」（平均大約 50%，最低嗰幾個通常負分）；Dr Lam 嘅做法：「好友善嘅，答對有分，答錯冇分」→ 每題都要答。（[35:15]–[36:19]）</li>\n<li><strong>日期／安排（9 月 14 日當時嘅計劃，以最新公佈為準）</strong>：「70% 機會係 10 月 23 日考，星期五」；可揀嘅日子得 10/16、10/23、10/26（10/19 係重陽）；喺上堂時間考（嗰日唔上堂），L1 同學九點；計劃借第二間房、分兩間房考；如果借唔到，可能改喺 weekday 夜晚考，或者壓縮到 35 分鐘、分上下兩班考。（[32:27]–[34:38]）</li>\n<li>⭐ <strong>睇清楚句號定問號</strong>：「你考試睇清楚嗰句話係句號定問號」——「4 + 5 = 8」（陳述句）係錯；但「4 + 5 = 8？」呢個<strong>問題本身唔係錯</strong>，只係答案錯。（[62:02]–[62:40]）</li>\n<li>⭐⭐ <strong>題目冇標年份 = 考試當日</strong>：考試唔會逐條標年份（標晒題目好長，而且全部都係重複嘅「2026 年 10 月 23 日」）；事實問題唔特別標時間，理論上就係講<strong>而家</strong>——你答卷嗰一刻（「我相信唔會無端端有個數據喺你答卷嗰半粒鐘入面唔同」）。（[77:06]–[77:39]）</li>\n<li><strong>唔考</strong>：東、西方文化／哲學史背景——「呢啲考試絕對唔會考嘅，唔使擔心，畀大家一個背景」。（[22:59]）</li>\n<li>Module 1：講者話而家先算「正式開始」呢個 course，並提到「考試會考」；Module 1 可以寫入 e-portfolio（錄音略不清；同上面「呢度就係中期嘅內容」一致）。（[17:18]–[17:52]）</li>\n</ul>\n<h2 id=\"lec-h5\">課堂例子</h2>\n<h3 id=\"lec-h6\">釐清要去到幾盡？（同學 e-portfolio 提問）</h3>\n<ul>\n<li>同學問：李天命要我哋喺討論中不斷釐清、證據越多越好——咁要釐清到幾時？證據要幾多？講者：「我唔知答案」——<strong>視乎你而家傾緊嘅 context／目的</strong>。（[40:52]–[41:57]）<ul>\n<li>閒聊：「食 tea」「LG7 金飯碗條隊咁長，一定係好好食」——傾偈嘅目的唔係釐清真理，「呢啲討論係冇真理可言嘅」；再追問落去，朋友只會叫你收聲。（[41:57]–[44:14]）</li>\n<li>學術（科學研究）：supervisor／reviewer 永遠話你「唔夠」、要你講清楚、畀證據 → 唔好俾情緒影響，人哋問係有佢嘅理據；如果大家都覺得你講到真理，你反而要諗下一個題目。（[44:14]–[47:16]）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"lec-h7\">⭐ 「皮膚燒傷超過十成」（釐清後就唔使搵證據）</h3>\n<ul>\n<li>曾經有人公開話某些人皮膚燒傷「超過十成」；有教授拎圖表解釋一成、兩成係點，燒到 99% 已經認唔出係邊個，十成已經係極限，「超過十成」冇可能。（[48:16]–[48:43]）</li>\n<li>講者：釐清關鍵字眼（被腐蝕性液體燒傷、傷勢超過十成皮膚燒傷）之後，就知道係<strong>冇可能發生</strong>——申請基金做研究冇可能成功，FYP 第一句聲明就錯；哲學家喺學術圈嘅價值：負責睇最基本嘅邏輯合理。（[49:13]–[49:41]）</li>\n<li>如果有人（政界、媒體，甚至 Dr Lam 上堂）講錯，就要再確認、延續溝通：「請問你係咪講錯咗？你係咪想講 10%（一成）？」；而且真係十成嘅話，你唔會用「燒傷」而會用「毀滅」形容。（[50:10]–[50:35]）</li>\n</ul>\n<h3 id=\"lec-h8\">⭐ 「截止時間後交功課算唔算準時？」</h3>\n<ul>\n<li>講者以 e-portfolio 嘅 deadline（12 月 5 日晚上 11:59）做例子：「deadline 之後交功課算唔算準時？唔算」——<strong>過咗 deadline 就係遲交，冇可能叫準時交</strong>；「呢個事實係唔使任何經驗證據嘅」。（[51:42]、[56:50]）</li>\n<li>⭐ 細節：deadline 前病到「七彩」、有病假紙，講者會 extend——但 extend 咗之後交，<strong>仍然係遲交</strong>，只係講者 waive 咗 penalty（特殊處理）；「定義釐清得好清楚」。（[56:50]–[57:20]）</li>\n<li>附帶：遲交扣幾多分屬講者嘅酌情權——「酌情權 belong to me；真理 belong to no one」。（[54:43]）</li>\n</ul>\n<h3 id=\"lec-h9\">⭐ 概念問題例子</h3>\n<ul>\n<li><strong>甚麼是真、善、美？</strong>——講者：「呢個例子其實有啲特別」，但李天命本書係將佢當作概念問題嘅例子。（[60:05]–[60:46]）</li>\n<li><strong>5 + 5 = 10？</strong>——你了解乜嘢叫 5、加、等於、10、問號，就知答案，唔使搵證據。講者補充：AI（LLM）其實唔知嗰啲字係乜，喺佢角度只係一堆 token。（[60:46]–[61:22]）</li>\n<li><strong>你的生父（親生父親）年齡比你大嗎？</strong>——了解乜嘢叫親生爸爸、乜嘢叫年齡比你大，就答到。（[61:22]）</li>\n<li>⭐ <strong>4 + 5 = 8？</strong>——答案錯，但問題本身唔錯：「5 + 5 = 10？」答案對、「4 + 5 = 8？」答案錯，<strong>兩個都係概念問題</strong>。（[62:02]–[63:13]）</li>\n<li><strong>若 y = x²，dy/dx 是甚麼？</strong>——唔使畫 slope、間格仔計面積再展示畀你睇，純粹概念分析。（[63:57]–[65:11]）</li>\n<li>⭐ <strong>數手指教 5 + 5 = 10</strong>：講者教佢五歲個仔可以數手指（中學老師可以用 Lego）——即係<strong>可以</strong>用經驗方法展示，但<strong>唔係必須</strong>；了解啲符號就知答案。「數手指學習過程，非必要」——呢點正正牽涉到同事實問題嘅分別。（[65:39]–[66:45]）</li>\n<li><strong>甚麼是反對黨？</strong>——「我唔係問你邊個係反對黨，我係問你乜嘢叫做反對黨」；通常定義：某國家／政體有一個執政黨，喺野而同佢想法唔同嗰班就叫反對黨；但釐清後發覺唔太準確（51% vs 49%？有啲地方反對 1% 都算，有啲地方你反對 70% 都唔當你係反對黨）；講者建議講「在野／執政」可以少啲爭拗（在野黨唔等於反對，但在野就一定係在野）。（[66:45]–[68:33]）</li>\n<li><strong>甚麼是一個國家？甚麼是國家的根本？</strong>——概念問題：理論上睇字，你知乜嘢係國家、乜嘢係根本，就答到。（[68:33]–[69:12]）</li>\n<li>⭐⭐ <strong>「主席話國家嘅根本係乜嘢」同「乜嘢係國家嘅根本」係兩類問題</strong>；<strong>「甚麼是由治及興？」係概念問題，但「李特首（李家超）會點樣 define 由治及興？」唔係概念問題，係事實問題</strong>。（[70:00]–[70:37]）</li>\n</ul>\n<h3 id=\"lec-h10\">⭐ 事實問題例子</h3>\n<ul>\n<li><strong>iPhone 17 是 2025 年全球銷量最高的智能手機系列嗎？</strong>——都要先釐清（例如包唔包所有容量、其他型號；錄音不清）；唔會有人「睇見 iPhone 17 就代表佢賣得最多」；<strong>市場調查係一種經驗方法</strong>；（上市公司）有 audit report。（[71:52]–[73:03]）</li>\n<li><strong>日本是第二次世界大戰的戰勝國嗎？</strong>——要釐清乜嘢叫「戰勝」，每人答法可以唔同：例如你睇戰後 20 年 GDP；我睇國際和約簽署雙方（投降、簽約、承認失敗嗰方係戰敗）。⭐ <strong>兩個人對贏輸嘅定義唔同，「但唔影響佢係一個事實問題」</strong>。（[73:03]–[74:51]）</li>\n<li><strong>中國是否世界第二大經濟體？</strong>——答案會因<strong>年份</strong>而唔同；「中國」可以地理上或文化上定義，經濟體大細可以睇全國或人均——但講完所有定義之後，都係睇實際數據，而實際數據有時間性。（[74:51]–[76:34]）</li>\n</ul>\n<h2 id=\"lec-h11\">重點澄清</h2>\n<ul>\n<li>⭐ <strong>語理分析唔係分析語言本身，而係分析思維</strong>：「同人文學部教語言學嘅同事唔同，我哋唔係分析語言本身，我哋係分析思維」——會牽涉語言，但主要講人類思維，從思維角度判斷人類語言嘅不足。（[38:55]–[39:24]）</li>\n<li>⭐ <strong>第一步 = 釐清關鍵字眼</strong>：釐清一個討論入面嘅關鍵字眼，係所有討論或批判思考應用嘅第一步——「重點係關鍵字眼」。（[39:24]–[39:54]）</li>\n<li>⭐ 李天命嘅語理分析：將（佢讀書時已經好數理化嘅）西方分析哲學，改造成同普通人傾偈都用得嘅思維方法（佢當時教嘅對象好多唔係大學生）；<strong>強調不採用任何人工語言</strong>（唔用 not、negation、imply、equivalence 等符號），將邏輯融入日常語言。（[37:55]–[38:55]）</li>\n<li>李天命背景：喺北美讀 PhD，受西方分析哲學訓練；分析哲學最有名、世界通行嘅內容係邏輯——好似 calculus，教科書唔同但 dy/dx 一樣，知識客觀、冇地域分野。（[21:24]–[22:59]）</li>\n<li>分析哲學家（文科傳統）向科學家學嘅<strong>唔係知識、唔係最後嘅答案，而係方法</strong>：背書只係背咗答案，未必知答案點嚟；方法係追求知識嘅路徑——思考係幫我哋搵知識嘅工具。（[26:09]–[28:12]）</li>\n<li>背景（唔考）：西方（希臘）傳統追求理性、智慧——蘇格拉底：善 = 有智慧、惡 = 無知；東方（中國哲學）近一套道德政治嘅價值判斷；華人社會嘅討論大部分同價值判斷有關 → 李天命想喺香港推廣學科學精神嘅分析哲學思考方法。（[23:28]–[25:39]）</li>\n<li>課程路線：Module 2 先釐清問緊乜（問題分類），再講日常語言嘅毛病（日常語言有流動性，冇辦法好準確描述世界）；Module 3 前半：喺呢個限制下點樣畀最準確嘅定義；Module 3 後半：用呢個框架判斷我哋研究嘅知識「有用定冇用」（講者誇張講法：喺李天命／分析哲學體系下，大部分院校嘅大部分學科都係「垃圾」）；下半學期 Module 4–5 係大約一個月嘅「數學堂」（邏輯），最後返去日常語言（謬誤）。（[30:23]–[32:27]、[36:19]–[37:55]）<ul>\n<li>🔗（筆記對照，唔係講者原話）Module 3 reading：冇認知意義唔等於冇價值，可以有「非知意義」——唔好將講者嘅誇張講法當成 reading 立場。</li>\n</ul>\n</li>\n<li>⭐ 釐清之後，大部分時候會知道下一步要搵咩證據；但有啲情況釐清咗就發覺<strong>根本唔需要證據支持</strong>（例：十成燒傷）。（[47:50]–[48:16]）</li>\n<li>⭐ 問題分類嘅動機：分析哲學家「聰明又懶」（懶 = 可以唔做就唔做）——思考第一部分係諗對方問緊乜，因為諗完可能發覺有啲問題<strong>唔使浪費時間搵證據</strong>；所以李天命將問題分三類。（[57:54]–[59:31]）</li>\n<li>⭐ <strong>概念問題</strong>：只需要分析問題裏面嘅概念或用語就答到。（[59:31]–[60:05]）</li>\n<li>⭐ <strong>事實問題</strong>：原則上必須通過經驗方法先答到。（[70:37]）</li>\n<li>⭐ 答事實問題之前，<strong>都要好似概念問題咁先釐清關鍵用字</strong>；分別在於概念問題釐清完就答到，事實問題唔得。（[71:15]）</li>\n<li>⭐ 問題分類唔睇答案啱唔啱：答案對（5 + 5 = 10？）定錯（4 + 5 = 8？）都係概念問題。（[63:13]）</li>\n<li>⭐ 「呢一堂簡單啲：唔好諗答案，諗問題」——先諗清楚係咩類型嘅問題。（[69:12]）</li>\n<li>⭐ <strong>時間性</strong>係同事實問題好相關嘅特性：要搵數據、講事實，就要講明係咩時間嘅數據。（[77:39]–[78:09]）</li>\n</ul>\n\n<hr>\n<h1 id=\"lec-h12\">課堂 2026-09-18（問題分類：概念 vs 事實 vs 評價；經驗方法；「將事實問題概念化」；水的化學式爭議）</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h13\">考試提示</h2>\n<ul>\n<li>⭐⭐ <strong>考試係叫你「分類」，唔係叫你答</strong>：做 Mentimeter 時講者話「我唔係叫你畀答案我，同考試一樣」——係問你係概念問題定事實問題；之後再講「記住唔係問你答案，係叫你分類」。（[33:36]、[41:38]）</li>\n<li>⭐ <strong>分歧極大嘅題目唔會考</strong>：IQ 題（獵人打雀）全班大約五五分——「每年分歧都咁大，考試我敢問就弊」（錄音略不清）。（[33:36]–[34:45]）</li>\n<li>⭐⭐ <strong>「水的化學式」考試會避開</strong>：「我考試一定唔會為難自己嘅，我會避開水嘅化學公式」；後來再講：「有冇人接受唔到？唔使擔心，<strong>呢類問題我一定避開，考試你唔會見到</strong>。」（[46:38]–[47:11]、[58:28]）</li>\n<li>（錄音不清）講到「我而家飲緊嗰杯嘢嘅化學式係乜」（具體個案，要攞去化驗）時，似乎提到「可能考試時會問呢啲問題」。（[56:50]）</li>\n<li>創意演繹（例如「科大人一日起碼有 36 個鐘」）——「唔使擔心，考試冇呢啲」。（[61:18]）</li>\n<li>（錄音不清）似乎提到考試唔係純中文（有需要會加英文，例如 chemical formula）。（[41:02]）</li>\n</ul>\n<h2 id=\"lec-h14\">課堂例子</h2>\n<h3 id=\"lec-h15\">概念問題：數學 vs 抽象概念</h3>\n<ul>\n<li>概念問題例子：真善美（冇人可以企出嚟畀一個好實在、冇人挑戰到嘅答案，話「This is beauty」）、5 + 5 = 15？、4 + 5 = 8？、數學符號、生父年齡比你大——全部都係講概念，而且都好抽象（數學符號抽象：你喺世界上搵唔到數學符號）。（[03:02]–[04:24]）</li>\n<li>⭐ 數學、邏輯：答案有<strong>普遍性</strong>（或者講絕對）——正確就正確、錯就錯；相對地，真善美、反對黨、國家、由治及興呢啲抽象概念有討論空間（係先出現第一個反對黨再定義概念，定係先有概念再 label 某啲政黨？國家都一樣；「2023 年係由治及興元年」係乜嚟？）——喺李天命系統都算概念問題，係「<strong>難回答嘅概念問題</strong>」。（[04:24]–[07:19]）</li>\n<li>⭐ 相對而言，<strong>事實問題反而容易答</strong>：因為你可以花努力去搵到答案。（[07:19]–[07:50]）</li>\n</ul>\n<h3 id=\"lec-h16\">生父年齡、數手指：概念先於事實</h3>\n<ul>\n<li>你認得佢係你親生父母，其實就已經承認咗佢年紀比你大——年紀高低唔需要實質事實支持；可以攞身份證出嚟，但「可以而已，唔係必須」。（[08:17]–[08:49]）</li>\n<li>講者個仔數手指數錯（數到 7、8）——數手指只係幫助，唔使真係數。背後係你同意 5 + 5 = 10：<strong>概念先於事實出現</strong>；親生父母年紀比你大，先於你喺世界搵方法證明佢。（[09:28]–[10:04]）</li>\n</ul>\n<h3 id=\"lec-h17\">事實問題：先釐清，再搵經驗方法</h3>\n<ul>\n<li>⭐ iPhone 17：答事實問題嘅第一步係語理分析，釐清佢講緊乜——<strong>每一個釐清其實都可以倒轉講成係問一個概念問題</strong>（乜嘢係 iPhone 17？乜嘢叫銷量最高？），要先有定義先判斷到；唔好喺結論度鋪定（by default 某款 iPhone 一定賣最多，好似睇波 by default 某隊一定贏）；先有準則、釐清概念，再搵事實判斷係咪同概念相符。（[10:31]–[12:06]）</li>\n<li>經驗方法例子：<strong>市場調查</strong>係一種經驗方法；二戰戰勝國——釐清「戰勝」（打完仗、簽條約）之後睇<strong>歷史文件</strong>（經驗方法）。（[12:34]–[13:45]）</li>\n<li>⭐ 戰勝國另一種定義：打輸咗，乘機放棄軍事、將錢投放喺經濟，戰後好快成為世界第二大經濟體 → 「贏」——同人傾偈時可以咁 defend（等於話《鬼滅之刃》大哥贏咗）。如果一個企歷史文件（和約）、一個睇戰後 20 年經濟 →「完全冇得傾，咁就唔好傾」；兩個人各自按自己嘅 definition 出 paper 寫邊個係戰勝國，<strong>冇矛盾，因為大家傾嘅角度唔同</strong>。（[13:45]–[15:02]）</li>\n<li>中國係咪世界第二大經濟體：都係睇數據（經驗方法）；<strong>唔特別標明，通常係問而家呢一刻</strong>——唔好突然話「日本先係」（日本係 1970 年代）。（[15:02]–[15:32]）</li>\n</ul>\n<h3 id=\"lec-h18\">⭐ 未來嘅事：明年財赤、支持度</h3>\n<ul>\n<li>「明年香港會唔會出現財政赤字？」——雖然係 prediction，但原則上未來發生嘅事都要等經驗、事實出咗嚟先判斷到 → 批判思考教你：<strong>呢個係事實問題</strong>（&quot;But at this point, we can&#39;t answer it.&quot;）。赤字最簡單定義：收入少過支出；一定要等到 2027 年，再釐清（年頭、年中、第幾季定全年平均），但無論點釐清，時間點都喺未來。（[16:08]–[17:35]）</li>\n<li>⭐ 如果你覺得今日答到：係你<strong>個人嘅評價</strong>——你有堆數據，預測明年會點（等於你覺得自己靚唔靚仔：身體客觀存在，但你主觀評價自己）；「呢個叫<strong>評價問題式嘅答法</strong>，李天命接受到嘅」。（[18:10]–[18:46]）</li>\n<li>醫生例：醫生憑徵狀話「你可能係流感」= 基於經驗嘅估計（咁講反而有醫德、有科學訓練）；要準就做快篩——快篩結果比醫生憑經驗嘅判斷準。（[19:28]–[20:03]）</li>\n<li>有啲人覺得變成評價好似 cheap 咗（俾人話斷估），就堅持「一定會」——憑咩講一定？5 + 5 = 10 先係一定。（[20:48]）</li>\n<li>兩三年前有同學話「冇可能冇赤字」——當佢好似 5 + 5 = 10 咁嘅概念問題，即係唔使等明年就肯定；李天命系統唔接受，世界有好多不確定：例如政府重新釐清「收入」「支出」概念，<strong>將發債計入收入</strong>，present 出嚟嘅數據就冇赤字。（[21:49]–[23:30]）</li>\n<li>「香港政府明年的支持度會上升嗎？」——先釐清：如果當事實問題，就要以某個民意調查量化嘅分數為準（今年 50、明年 75 → 當支持度高咗）；「數字高咗係咪等於支持度高咗」係衍生出嚟嘅第二個問題。（[23:30]–[24:40]）</li>\n<li>⭐⭐ 「而家咁低，明年一定高」「一定有反彈」「恆指咁低，一定彈」——<strong>呢啲就叫做「將事實問題概念化」，批判思考教你千祈唔好</strong>。（[24:40]–[25:16]）</li>\n<li>唔好灌輸自己「答唔到具體答案 = 我差」：有啲問題必須透過經驗方法、等下年數據先答到——批判思考其實係教大家「講少啲嘢」。（[25:45]–[26:10]）</li>\n</ul>\n<h3 id=\"lec-h19\">⭐ K2-18b 上有冇生物？</h3>\n<ul>\n<li>某星球上有冇生物：而家技術上去唔到、技術上而家唔可以透過經驗方法搵答案，但<strong>原則上必須而且可以搵到答案</strong> → 未有答案之前，李天命框架下唔可以具體答有定冇，要等答案；人係透過科技發展努力搵答案。（[28:01]–[29:25]）</li>\n<li>「地球有生物，所以宇宙某個角落都有生物」——推論有合理性（唔係無中生有），但唔係絕對，係一個<strong>假設</strong>（好似 FYP 嘅 hypothesis，要有證據支持）；你可以講「我認為有」（變成評價問題就得），但<strong>千祈唔好當作概念</strong>（「宇宙咁大，一定有」），等於「經濟咁差，一定反彈」一樣，太有自信。（[29:57]–[32:18]）</li>\n</ul>\n<h3 id=\"lec-h20\">⭐ IQ 題：獵人、三隻雀</h3>\n<ul>\n<li>「獵人開槍打死樹上三隻雀其中一隻，樹上仲有幾多隻？」Mentimeter（問分類）結果大約五五分。（[33:02]–[34:45]）</li>\n<li>當概念問題（數學）答：3 − 1 = 2；當事實問題答：0——另外兩隻唔係盲嘅，就算裝咗滅聲器都會飛走。（[35:54]–[38:35]）</li>\n<li>⭐ 重點：語理分析第一步最重要係睇<strong>討論雙方係咪喺同一個平台、講緊同一個問題</strong>；最差係幼稚園入學面試咁問小朋友，答「冇晒」嘅就話佢「數學咁差」——討論時要先釐清。（[38:35]–[41:02]）</li>\n</ul>\n<h3 id=\"lec-h21\">常識題：水的化學式、貓</h3>\n<ul>\n<li>Mentimeter：「水的化學式是甚麼？」大部分人答概念（約 3:1）；「貓是用四隻腳走路的動物嗎？」答事實略多。（[41:02]–[46:38]）</li>\n<li>⭐ 講者：<strong>喺李天命系統，水的化學式係事實問題</strong>。同學覺得佢好似 5 + 5 = 10，係概念上嘅真理、唔可以透過事實推翻；但 5 + 5 = 10 係人諗出嚟、做實驗證明唔到（xyz、加減乘除係人定義世界運作嘅框架）→ 純概念分析；<strong>化學式係實驗結果</strong>（18 世紀科學家先證明到，之前有人認為水係元素）→ 來源係事實。（[47:11]–[52:04]）</li>\n<li>⭐ 李天命跟隨實驗精神：就算證明咗幾多次係啱，都要容許佢有一日被其他經驗證據證明係錯；「Module 3 會再返嚟講呢個觀念：<strong>科學嘅核心在於可否證</strong>」（後半句錄音不清）。（[53:36]–[54:06]）</li>\n<li>「我而家飲緊嗰杯水嘅化學式係乜？」——轉答事實嘅人多咗（攞去化驗）；如果你答概念，喺李天命框架下唯一合理解釋係你當 Dr Lam 講嘅就係真理（佢話係水就係水，根據定義係 H₂O，唔使驗）——但實際上杯嘢可能係可樂。（[54:06]–[57:22]）</li>\n<li>「一年有幾多秒？」——數學上計到（睇今年係唔係閏年，365 × 24 再拆到秒）→ <strong>概念問題</strong>；「只有哲學家先會答呢個唔係概念問題」。（[60:46]–[61:18]）</li>\n<li>有人當水化學式係概念問題，係因為「背出嚟」、唔知點解係咁——即係將重點放喺科學知識嘅答案，而唔係追求知識嘅方法；教科書可以印錯（例如印成 H₂O₂），點知？同科學家實驗結果比較。（[62:03]–[63:41]）</li>\n<li>⭐ 「我屋企養嘅貓係咪用四隻腳行路？」——絕大多數同學轉答事實；講者：斷咗手嘅 Dr Lam 仲係唔係 Dr Lam？你會加形容詞「跛咗嘅」；「貓」呢個字唔係 by default 等於健全；平時講貓貓狗狗係講肉眼見到嘅實體，你屋企啲主子係真實存在——「<strong>喺經驗世界搵答案……係事實嚟嘅</strong>」。（[64:21]–[69:59]）</li>\n</ul>\n<h3 id=\"lec-h22\">⭐ 評價問題</h3>\n<ul>\n<li>定義：釐清咗說法嘅概念、搵咗相關事實之後仍然答唔到，因為問題包含「美」「好」等帶評價意義嘅概念 → 要用<strong>個人嘅價值觀</strong>去答。（[69:59]–[70:39]）</li>\n<li>「香港科技大學美嗎？好嗎？值唔值得用四年讀 UG？」——先釐清「香港科技大學」（Google Map 座標：呢個 campus，唔係廣州 campus；包唔包 Business School）、「美」（建築風格定周圍環境）；相關經驗事實：影相、平面圖（空間大細）、畫出幾何鋪排畀人睇。（[71:12]–[72:41]）</li>\n<li>「你靚唔靚？」——髮型、高度、肥瘦、五官、頭髮長度顏色等客觀條件可以講得好具體（好似 mark 座標），但「美唔美」要加主觀。（[72:41]–[74:05]）</li>\n<li>道德問題（同性戀、DEI 可唔可以接受、道唔道德）——表達嘅唔係真理，係<strong>主觀評價，冇普遍性</strong>；人有表達自由，政府最多係保障個體嘅表達自由，但冇理由將個體嘅表達自由變成科學式嘅真理。（[74:05]–[74:37]）</li>\n<li>政策批評：香港政府延後推行垃圾徵費（錄音作「然後立法經費」）嘅決定是否正確 → 價值判斷（美醜、道德善惡）。（[75:15]）</li>\n<li>留低思考題：點解「甚麼是真善美」係概念問題、「科大美唔美」係評價問題？你可以唔同意，覺得概念問題只包括 5 + 5 = 10 都得（9 月 21 日再講）。（[75:15]–[75:48]）</li>\n</ul>\n<h2 id=\"lec-h23\">重點澄清</h2>\n<ul>\n<li>⭐ <strong>問題三分類係李天命嘅創建</strong>：佢所代表嘅傳統西方分析哲學冇講問題三分類。（[01:04]–[01:29]）</li>\n<li>講者：做分類系統最好分<strong>兩類</strong>（男／非男、人／非人），唔好分三、四、五類——超過二元對立都會衍生問題、被人批評；相對後面分析哲學講嘅「析合區分」，問題三分類會產生一啲問題（喺概念問題嘅例子見到端倪）。（[01:57]–[02:29]）</li>\n<li>⭐⭐ <strong>思考有先後次序</strong>：唔好見到個問題就直接話係評價——<strong>先問係咪概念；概念答唔到，再諗事實；事實答唔到，先係評價</strong>。（[12:06]–[12:34]）</li>\n<li>⭐ 概念 vs 事實：事實問題<strong>原則上必須</strong>通過經驗方法先搵到答案；概念問題實際操作上可以數手指、攞身份證，但唔係必須。（[07:50]–[08:49]）</li>\n<li>⭐ <strong>「技術上」vs「原則上」</strong>：K2-18b 而家技術上去唔到，但原則上必須而且可以用經驗方法搵答案 → 仍然係事實問題。（[28:41]）</li>\n<li>⭐ <strong>未來嘅事 = 事實問題</strong>（原則上要等事實出咗嚟）；可以用「我認為／我預測」咁講（評價問題式答法，李天命接受），但唔可以當概念問題咁講「一定」。（[16:08]–[18:46]、[24:40]–[25:16]）</li>\n<li>⭐ 李天命對科學嘅要求：科學要實證；就算證明咗好多次，都要容許佢可能被推翻（可否證）。（[50:39]、[53:36]）</li>\n<li>DEI／文科創作：李天命系統唔係完全接受唔到——你喺度搞創意、自己發揮可以（屬你自己嘅評價），但有普遍性嘅真理（如 5 + 5 = 10）你唔應該推翻；李天命系統係釐清咗大家討論嘅角度。（[48:50]–[49:55]）</li>\n<li>⭐ 評價問題：主觀評價冇普遍性；評價字眼（美、好）係形容詞，喺人類語言入面表達唔準確——之後講語言嘅陷阱時會再講。（[72:11]、[74:37]）</li>\n</ul>\n\n<hr>\n<h1 id=\"lec-h24\">課堂 2026-09-21（問題分類總結：考試答題原則、評價問題、量化／KPI、真善美）</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h25\">考試提示</h2>\n<ul>\n<li>⭐⭐⭐ <strong>分類題只有 A／B／C</strong>：考試見到一條問題（例如「甚麼是反對黨？」），就係 A 概念問題、B 事實問題、C 評價問題——「我可以直接同你講，我唔會畀你 D 呢個答案」：冇 All of the above，亦冇 None of the above。（[03:30]–[04:31]）</li>\n<li>⭐⭐ <strong>一層一層落，只會係其中一類</strong>：「你話係概念問題，你就停喺概念問題，唔會落事實」；分析清楚、事實根據答到事實問題，就唔會係評價；都答唔到先係評價問題。分唔到類 → 返去第一步，釐清問題入面牽涉嘅關鍵字眼，釐清完就係三類其中一個——「考試時都係咁諗」。（[04:01]–[05:08]）</li>\n<li>⭐ <strong>數學問題喺本課程一律係概念問題</strong>（「我澄清一次」）。（[05:08]）</li>\n<li>⭐ <strong>考試冇咁難</strong>：「所有可以用數學模型理解嘅嘢都係概念問題」只係 for your reference——common core 唔會考咁深奧；「冷靜啲……考試冇咁難」。（[05:44]–[06:50]）</li>\n<li>⭐ （錄音略不清，大意）<strong>MC 唔會考大家冇共識嘅題目</strong>：上次已證明「水的化學式」「貓有四隻腳」大家冇共識；唯一傾向有共識嘅係「我而家飲緊嗰壺水嘅化學式」；<strong>「我屋企隻貓係咪用四隻腳行路」係事實問題——「我已經講得好安全」</strong>。（[06:50]–[07:52]）</li>\n<li>⭐⭐ <strong>考試跟 Dr Lam 嘅答案答</strong>：「你跟我嘅答案答……我負責；你跟李天命嘅答案答，我幫唔到佢負責」——「喺我嘅課程點解唔跟我？」；不過呢類有分歧嘅題目，「我講一次，考試會避開」。（[15:26]–[16:43]）</li>\n<li>⭐ 水的化學式：考試會避開；講者自己有一個較寬鬆嘅定義（似乎可以當概念問題），但冇理由強迫大家接受——Module 3 會返嚟解釋點解呢個寬鬆定義喺李天命框架下都有合理性。（[16:43]）</li>\n<li>⭐ <strong>「甚麼是思考？」= 概念問題</strong>——「唔好錯，考試就咁樣諗得㗎喇，唔好太複雜」。（[34:40]–[35:29]）</li>\n<li>「講咗啲簡單啲、考試會問嘅嘢先」，之後用 Mentimeter 做例子。（[36:10]）</li>\n<li>⭐ <strong>一定唔會考</strong>：「某城市／地方係咪自古以來屬於另一個（國家）嘅一部分」——「我考試一定唔會問，唔使擔心」；呢版 slide 只係教你點樣避開某啲問題（同一段亦講到上帝存在嘅例子）。（[68:49]）</li>\n</ul>\n<h2 id=\"lec-h26\">課堂例子</h2>\n<ul>\n<li>「e-portfolio（系統）係點運作？」——要試個 interface，「你唔試你唔知」→ 事實問題。（[00:37]–[01:05]）</li>\n</ul>\n<h3 id=\"lec-h27\">極端懷疑論者 vs KPI 化</h3>\n<ul>\n<li>⭐ 極端嘅懷疑論者（哲學家用「極端」兩個字係 neutral 嘅）：所有嘢都 questionable、都可以透過經驗方法被推翻 → 喺佢眼中<strong>世界上冇概念問題</strong>；上次大部分同學覺得水嘅化學式 H₂O 係概念問題，係因為接受唔到 H₂O 可以被推翻。（[02:28]–[03:30]）</li>\n<li>⭐ 同理，如果你將人際關係（擇偶清單 20 個 item 全部 tick 就「去」、「值得交嘅朋友」10 個 item）完全 KPI 化、量化，<strong>喺你嘅價值體系就冇評價問題</strong>；正常喺李天命框架下應該拆到三樣。（[23:52]–[25:28]）</li>\n</ul>\n<h3 id=\"lec-h28\">貓（續）</h3>\n<ul>\n<li>⭐ 「我屋企隻貓係咪用四隻腳行路？」係事實問題：DNA 角度貓係有四隻腳嘅生物，但唔包括行路（啱出世未識行、老咗行唔到）；加埋「我屋企嗰隻」就冇得拗。如果之後你同講者爭論，佢會用事實方法答你：翻查上課嘅錄影（RVC recording）。（[07:52]–[09:58]）</li>\n<li>⭐ <strong>事實問題係最易解決嘅，雖然要花功夫</strong>。（[09:25]）</li>\n<li>⭐ <strong>問題分類係教你分問題，唔好放太多時間喺答案上</strong>：同一條問題（我屋企隻貓係咪用三隻腳行路？）我可以答係、唔係、五隻、六隻、七隻——某一類問題唔一定有一個特定嘅答案。（[10:53]–[11:24]）</li>\n</ul>\n<h3 id=\"lec-h29\">⭐ 評價問題</h3>\n<ul>\n<li>喺李天命眼中，<strong>所有價值判斷都係評價問題</strong>；成套思考方法好有目的性——要<strong>推高科學嘅地位</strong>；日常生活人同人溝通，<strong>最多係評價問題</strong>。（[11:24]–[12:45]）</li>\n<li>應用（e-portfolio 可寫）：有個人你好想同佢傾但佢唔覆你？睇返你 WhatsApp 問佢嗰 10 條問題係概念、事實定評價——成日問好高深嘅概念（乜嘢係真善美）、成日問事實（咁你問 AI 得啦）、定成日問評價（我今日打扮點？你覺得我個人點？）。（[14:47]–[19:18]）</li>\n<li>講者嘅 purpose 同李天命嘅未必一樣：同一個工具，講者教嘅思考方法唔係用嚟嗌交，而係認識世界、認識自己、認識對方：「我係一個點樣嘅人」（人格設定 → 概念）、平時做咩、問咩問題（事實）、「呢個人適唔適合我」（評價，好主觀）。（[19:18]–[20:44]）</li>\n<li>「軍師」：軍師可以基於事實（對方點同你傾偈）或經驗，present 經驗事實去加強「去／唔去」嘅價值判斷；但喺李天命系統，最後都係個人價值判斷。（[20:44]–[23:52]）</li>\n</ul>\n<h3 id=\"lec-h30\">純粹概念分析：數學、邏輯、programming；LLM</h3>\n<ul>\n<li>純粹概念分析通常係數學，李天命年代就係邏輯（即本課程 Module 4、5）；講者補充近代嘅 <strong>programming</strong>（李天命冇講過）：理論上預計 input 係咁、output 一定係咁——programming 同數學模型都係概念化嘅。（[25:28]–[26:44]）</li>\n<li>AI／LLM：本身 design 係 program，但睇 training data 時係事實 → 佢所有 output 對佢嚟講係當事實問題回應；佢唔係真係概念分析知道 4 + 5 = 9，而係背出嚟、永遠 open book（講者話只係講現時嘅 LLM）。（[26:44]–[27:57]）</li>\n<li>概念問題唔一定好簡單：唔係下下 3 + 4 = 7 先叫數學——講者 Google 咗 Real Analysis（錄音作「View analysis」；佢話 4000 level 有呢類課）嘅題目展示畀大家睇。（[36:10]–[36:41]）</li>\n</ul>\n<h3 id=\"lec-h31\">⭐ 量化／KPI</h3>\n<ul>\n<li>「科大係 Asia No.1 campus」——係基於某個 KPI、某個排名機構嘅結論（校長講過）；世界向量化嘅方向行。（[29:01]–[30:35]）</li>\n<li>⭐ 「QS 排第 47 嘅學校係咪比 QS 排第 52 嘅高？」——一經 formulate 成排名，<strong>直接係概念問題</strong>：47 係一個細過 52 嘅自然數；但 47 同 52 係咪真係有咁大分別？「唔敢講」。（[31:35]–[32:08]）</li>\n<li>⭐ 政府政策做得啱唔啱、成效 → 可以變成事實問題（減少咗幾多膠袋消耗，量化到）；<strong>但量化之後要留意：你其實唔係問佢係咪正確，只係問佢有冇減少膠袋消耗</strong>。（[32:51]–[33:28]）</li>\n</ul>\n<h3 id=\"lec-h32\">未來／歷史事件</h3>\n<ul>\n<li>（錄音不清）網購（淘寶）標示為「冬蟲夏草」嘅貨品：商家標示唔代表 by default 就係——試下種下（做實驗唔一定有成果）；講者想 test 有冇人有「take it for granted」嘅諗法。（[38:32]–[39:11]）</li>\n<li>⭐ 「2027 年冇美國大選」——好有 common sense 嘅人好易 take it for granted；但「邊個夠膽講 2027 年一定冇美國大選？」涉及人嘅事總之係不確定；「<strong>我再講一次，未來嘅事係事實</strong>」。（[39:59]–[41:11]、[44:31]）</li>\n<li>⭐ 避開帶評價意味嘅字眼：講者將問題改為「特朗普喺第一次競逐連任時，得到嘅選舉人票比對手多定少？」，唔講「贏／輸」，因為有人覺得贏同輸一定係評價；結合 Module 2、3 嘅內容，講嘢要小心呢個位。（[42:46]–[43:11]）</li>\n<li>⭐ 「2020 年夏季奧運會幾時舉行？」——因疫情實際喺 <strong>2021 年夏季</strong>舉行，但仍叫「2020」→ 事實問題；唔好俾個名誤導：個名係咪客觀真理？定係歷史事件幾時發生先係客觀真理？歷史書寫嘅嘢係咪就等於件事本身？要諗清楚。（[44:31]–[48:49]）</li>\n</ul>\n<h3 id=\"lec-h33\">⭐ 「思考可以學嗎？」（Module 1 嘅問題）</h3>\n<ul>\n<li>「甚麼是思考？」→ 概念問題；「你有冇學習過思考？」→ 事實問題；「思考可以學嗎？」→ 較難，稍後解釋。（[34:40]–[36:10]）</li>\n<li>講者：先 clarify——呢題冇標準答案；要釐清乜嘢叫「學習」，以及「思考」本身係咪蘊含可學／不可學。大部分同學認為「思考」兩個字唔應該包括可以同唔可以學；有七個同學當佢係概念問題（佢哋分析「思考」時，腦入面 project 咗某種思考形態，直接得出答案）。（[48:49]–[50:37]、[67:47]–[68:17]）</li>\n<li>李天命嘅定義：思考分<strong>批判</strong>、<strong>創意</strong>兩種——批判可以學，創意唔可以學；李天命對創意思考嘅定義，其實係用批判思考再問多一個問題：「仲有咩可能性？」；可能性出唔出到嚟有偶然性；如果係喺某本書搵到嘅可能性，其實係返去批判思考第一步——嗰個係舊嘅，唔係新嘅。（[50:37]–[51:25]）</li>\n<li>事實角度：至少科大批准咗一個教 Creative Thinking 嘅課程——呢個係事實；有同學話「我上足堂、考咗試、失敗咗，所以呢樣嘢學唔到」→ 講者：事實上你上咗課、考咗試、冇分數；但「係咪學唔到」→ 評價。（[52:18]–[55:17]）</li>\n</ul>\n<h3 id=\"lec-h34\">⭐ 真、善、美：點解李天命當概念問題？</h3>\n<ul>\n<li>李天命本人想將所有價值判斷放喺評價問題，但佢（assigned reading）係用「真善美」做概念問題嘅例子——講者解釋兩個原因：（[55:52]–[56:22]）<ol>\n<li><strong>唔想打死所有哲學家</strong>：例如柏拉圖嘅真善美係絕對、普遍、形而上嘅，唔係主觀討論；宗教：主係真善美——唔係你個人評價，而係佢嘅特質，by definition 就係真善美，普遍性甚至比水嘅化學式 H₂O 更確定。可以問對方係咪咁用；如果同自己信仰唔一致，就避開唔好傾；但如果講緊人世間「我朋友好真誠、好善良、好靚」，就係世俗、評價嘅講法。（[56:22]–[58:06]）</li>\n<li><strong>牽涉 Module 2 下半（語言陷阱）</strong>：某啲字（尤其形容詞）係釐清唔到嘅——美到邊個位先叫美？大家有差異；但討論「美」時其實有一個「<strong>合約</strong>」：美代表正面、我想要嘅狀態；善相對惡；「睇咗 reading 你知㗎喇」：冇分明嘅界線，但有約略嘅界線（錄音作「冇必然嘅界線，但係有弱劣嘅界線」）——<strong>美 = 吸引嘅；善 = 應該做嘅；真 = 值得相信</strong>。（[58:06]–[59:50]）<ul>\n<li>🔗（筆記對照，唔係講者原話）對應李天命「含混」：「X 沒有分明的界線」並不涵蘊「X 沒有約略的界線」。</li>\n</ul>\n</li>\n</ol>\n</li>\n<li>小結：真善美可以評價，理論上唔可以係事實；有一種真善美係絕對性嘅，所以放喺概念；又或者大家談真善美時其實有合約——至少釐清咗大家講緊係「我想要」嘅嘢。（[59:50]）</li>\n<li>「乜嘢係 good friend？」——真誠、善良；有人「呃你錢係為你好，訓練你喺弱肉強食嘅世界生存」→ 某意義下嘅「善」；你係搵朋友，佢係搵損友——講清楚可以避免無謂爭拗；語理分析第一部就係教大家釐清討論係咪同一個 context。（[60:42]–[63:14]）</li>\n</ul>\n<h3 id=\"lec-h35\">地方歸屬、上帝存在：用釐清避開問題</h3>\n<ul>\n<li>「某地方係唔係某國家嘅一部分？」→ 事實問題；除非有人當概念問題——必然、事實推翻唔到先係概念問題（例如有同學拆國家名嘅字去解）。講者例子用「維德國」（錄音如此，疑即維德角／佛得角 Cape Verde；講者話 PowerPoint 一直用呢個名）。（[63:45]–[65:51]）</li>\n<li>可以評價（睇你點定義：地理上、人嘅行為、ideology）；但傾嘅時候唔好直接答，<strong>先同對方 clarify 佢問緊乜——透過釐清，你可以避開答好多問題</strong>：例如「培亞（錄音）係唔係自古以來屬於維德國嘅一部分？」——「我唔知，係事實問題」；再追問「乜嘢係自古以來？宇宙大爆炸？」（大爆炸只係 hypothesis）。（[65:51]–[67:47]）</li>\n<li>「上帝存在嗎？」——對某啲人係概念問題；如果你有科學精神，唔好答存在定唔存在，改問「<strong>上帝存在有甚麼根據？</strong>」→ 變成事實問題；信徒可能話「我就係上帝存在嘅證明，我係祂嘅創造物」；睇晒傳道人、聖經、教宗等痕跡之後，最後仍然牽涉主觀評價。（[68:17]–[71:12]）</li>\n</ul>\n<h2 id=\"lec-h36\">重點澄清</h2>\n<ul>\n<li>⭐ 問題分類有先後：第一步概念（純概念分析），答唔到就要按經驗方法（事實），再答唔到先係評價。（[00:06]–[00:37]）</li>\n<li>⭐ 一個問題只屬三類其中一類（冇 all／none of the above）；分唔到 → 返第一步釐清關鍵字眼。（[04:01]–[05:08]）</li>\n<li>講者（for your reference）：所有可以用數學模型理解嘅嘢都係概念問題——如果個模型 work，你唔理世界發生咩事，只係諗公式左右兩邊；如果模型描述唔到世界，就再開發另一個。（[05:44]–[06:50]）</li>\n<li>「正常」呢兩個字可能有啲<strong>著色</strong>——下一個 topic 要釐清。（[14:23]）</li>\n<li>預告 Module 3：一啲<strong>必然地真</strong>嘅嘢，李天命會將佢擺喺<strong>數學嗰類</strong>。（[17:08]）</li>\n<li>⭐ 時代背景：李天命推呢套方法時，社會諗嘢唔係好科學化，所以佢將問題分類、將成套思考方法工具化——<strong>提高咗事實問題同科學嘅地位</strong>；如果李天命重生喺現代香港，會唔會有第二個諗法？唔肯定。（[33:28]–[34:40]）</li>\n<li>⭐ 量化社會：好多問題唔再抽象，可以變成事實問題，但要留意量化之後問緊嘅已經係另一條問題。（[32:51]–[33:28]）</li>\n<li>⭐ 用字要小心：「贏／輸」可能被當成評價字眼，所以要問事實就講「選舉人票多定少」。（[43:11]）</li>\n</ul>\n"}};</script>
<script>(function () {

  let S = (() => { try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return blank(); } })();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage full or disabled */ } };

  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const app = $('#app');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
  const T = Object.fromEntries(D.topics.map((t) => [t.id, t]));
  const TIDS = D.topics.map((t) => t.id);
  const QS = D.questions;
  const QBY = Object.fromEntries(QS.map((q) => [q.id, q]));
