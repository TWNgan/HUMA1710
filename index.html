>可能</strong>」(possible)，唔係「<strong>必然</strong>」(necessary)。</li>\n</ul>\n<p><strong>⚠️ Continuum vs Slippery Slope 分辨</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Continuum Fallacy</th>\n<th>Slippery Slope Fallacy</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>結論</td>\n<td>「<strong>冇分別</strong>／分唔到」</td>\n<td>「<strong>最終會導致嚴重後果</strong>」</td>\n</tr>\n<tr>\n<td>手法</td>\n<td>利用<strong>含混</strong>、漸變冇界線</td>\n<td><strong>一連串因果鏈</strong>，每步只係可能</td>\n</tr>\n</tbody></table>\n<hr>\n<h2 id=\"m2b-h13\">4. 著色字詞 Coloured Word ⭐⭐⭐</h2>\n<ul>\n<li><strong>著色字詞不但能表露和發洩說話者的感受，亦能引起其他聽者的情感反應。</strong><ul>\n<li>例：<strong>堅定／固執</strong>；<strong>公僕／公務員</strong></li>\n</ul>\n</li>\n<li>⭐ <strong>著色字詞的情緒意義或會隨時間而改變</strong>：例「<strong>鬼佬</strong>」</li>\n<li>⭐ <strong>不同情感下形容相同的狀況可能用上不同的字眼</strong>：<ul>\n<li><strong>參考／抄襲</strong></li>\n<li><strong>冷血殺人／英勇殺敵</strong></li>\n<li><strong>只剩／還有</strong>（「只剩一半」vs「還有一半」）</li>\n</ul>\n</li>\n<li><strong>好處</strong>：<strong>有利於自身心理平衡，並帶動別人情緒</strong>，常見於<strong>文學作品</strong>之中。</li>\n<li><strong>壞處</strong>：<strong>影響冷靜和客觀的思考或討論</strong>。當人們<strong>企圖利用著色字詞去誘使別人接受自己的論點，而不是藉著經驗証據或邏輯推論去說服別人時</strong>。<ul>\n<li>例：<strong>廣告：「唔買就笨」</strong>；<strong>政治宣傳</strong>（slide 圖：「KEEP CALM AND CARRY ON」海報）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m2b-h14\">4.1 訴諸憐憫 Fallacy of Appeal to Pity ⭐⭐</h3>\n<ul>\n<li><strong>訴諸憐憫是訴諸情感 (Fallacy of Appeal to Emotion) 的一個子類。</strong></li>\n<li><strong>訴諸情感</strong>：話者<strong>不以證據</strong>，而是<strong>利用情緒用語或其他手段，博取同情或煽動情緒</strong>。</li>\n<li>例：<ul>\n<li>有個年青人被控<strong>用斧頭殺害雙親</strong>，鐵證如山、無可抵賴，佢向法官求情，理由係：<strong>佢係個孤兒</strong>。（孤兒正正係佢自己造成！）</li>\n<li>有個學生<strong>考試作弊導致不合格</strong>，向老師求情：「<strong>老師請讓我合格，否則我找工作的時候會有困難。</strong>」</li>\n</ul>\n</li>\n<li>⚠️ 層級關係：<strong>Appeal to Pity ⊂ Appeal to Emotion</strong>（憐憫係情感嘅一種，唔係反過嚟）</li>\n</ul>\n<hr>\n<h2 id=\"m2b-h15\">5. 言辭空廢 Empty Verbalism ⭐⭐⭐</h2>\n<p><strong>定義：以重言命題 (tautological proposition) 冒充事實陳述 (factual statement)，就構成空廢命題。</strong></p>\n<ul>\n<li>分為：<strong>絕對空廢</strong>、<strong>相對空廢</strong></li>\n</ul>\n<h3 id=\"m2b-h16\">5.1 絕對空廢 ⭐⭐</h3>\n<ul>\n<li><strong>兩個條件：① 重言命題 + ② 冒充事實陳述</strong><ol>\n<li>因語句嘅<strong>重言句形式</strong>令語句<strong>必然為真</strong>，所以分辨空廢命題<strong>唔係靠語句嘅真假</strong>，而係靠上面<strong>兩個條件</strong>；</li>\n<li><strong>重言句本身缺乏信息內容，但不能視之為一種弊病</strong>；但當重言句<strong>冒充事實陳述</strong>時，就成咗空廢命題。</li>\n</ol>\n</li>\n<li>例：<ul>\n<li>記者：「做生意可以不管商業道德的嗎？」商人：「<strong>做生意就是做生意。</strong>」</li>\n<li>「你聽日嚟唔嚟參加活動？」「<strong>會嚟的話就自然會來。</strong>」</li>\n<li>「點解你咁鍾意瞓覺？」「<strong>鍾意就係鍾意。</strong>」</li>\n<li>記者問：「明年會出現赤字嗎？」財政司：「<strong>若果明年總支出大於總收入的話，就會出現財政赤字。</strong>」（財赤嘅定義本身，冇提供任何預測資訊）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m2b-h17\">5.2 相對空廢 ⭐⭐</h3>\n<ol>\n<li>係<strong>對空廢命題定義放寬後的產物</strong>，令言辭空廢呢個<strong>批判工具的可用性提高</strong>；</li>\n<li><strong>不要求語句具有重言句形式</strong>，只要求<strong>經分析語句內容及了解相關語境</strong>，發現語句係以<strong>必然為真的內容來冒充事實陳述</strong>。</li>\n</ol>\n<ul>\n<li>例：<ul>\n<li>算命師：「<strong>父在母先亡。</strong>」（「父在，母先亡」或「父喺母之前亡」→ 點都中）</li>\n<li>算命師：「<strong>你明年會有感情問題，事業會不順利。</strong>」（含混到幾乎必中）</li>\n<li>國師：「<strong>假如你發動戰爭，將摧毀一個強大的國家。</strong>」（摧毀敵國定自己國家都「應驗」——古希臘 Delphi 神諭俾 Croesus 王嘅經典例子）</li>\n<li>數據分析員：「<strong>明年市場會出現動盪。</strong>」</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m2b-h18\">5.3 絕對 vs 相對空廢（必考分辨）⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>絕對空廢</th>\n<th>相對空廢</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>句子形式</td>\n<td><strong>有</strong>重言句形式（A 就是 A；如果 P 則 P）</td>\n<td><strong>唔需要</strong>重言句形式</td>\n</tr>\n<tr>\n<td>點樣發現</td>\n<td>睇<strong>形式</strong>就知必然為真</td>\n<td>要<strong>分析內容 + 了解語境</strong></td>\n</tr>\n<tr>\n<td>例</td>\n<td>「做生意就是做生意」「鍾意就係鍾意」</td>\n<td>「父在母先亡」「明年市場會動盪」</td>\n</tr>\n<tr>\n<td>共通點</td>\n<td>都係以<strong>必然為真的內容</strong>冒充<strong>事實陳述</strong> → 冇提供任何關於世界嘅資訊</td>\n<td></td>\n</tr>\n</tbody></table>\n<hr>\n<h2 id=\"m2b-h19\">6. 考試速攻 ⚠️⭐</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>講法</th>\n<th>答案</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>講者嘅語言陷阱包括歧義、含混、著色字詞、言辭空廢</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>字詞歧義導致 Fallacy of Amphiboly</td>\n<td><strong>F</strong>（字詞 → <strong>Equivocation</strong>；語句 → <strong>Amphiboly</strong>）</td>\n</tr>\n<tr>\n<td>「路不通行不得在此小便」係語句歧義</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>「欠」「發夢」「掛號」係字詞歧義</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>歧義一定有問題</td>\n<td><strong>F</strong>（不一定，可以係必需：免增新詞、避諱、創作、避重就輕）</td>\n</tr>\n<tr>\n<td>「因荷而得藕，有杏不須梅」係利用歧義創作</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>「下雨天留客天留我不留」係避重就輕嘅例子</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>「有室友勝過沒有任何東西…」係 Equivocation</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>「我們不應該支持他，他是反對美國的單邊主義提倡者」係 Equivocation</td>\n<td><strong>F</strong>（係 <strong>Amphiboly</strong>）</td>\n</tr>\n<tr>\n<td>含混語辭係語言中不能或缺嘅</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>制定法例時應避免歧義同含混</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>連續體謬誤：利用含混，將能約略區分嘅事物視為不能區分</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>「我和拿 A- 的室友差不多」係 Slippery Slope</td>\n<td><strong>F</strong>（係 <strong>Continuum Fallacy</strong>）</td>\n</tr>\n<tr>\n<td>滑坡謬誤每一環節嘅因果關係都係必然</td>\n<td><strong>F</strong>（只係<strong>可能</strong>，唔係必然）</td>\n</tr>\n<tr>\n<td>「上莊 → 冇時間讀書 → 成績差 → 搵唔到工」係 Slippery Slope</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>著色字詞嘅情緒意義或會隨時間改變（如「鬼佬」）</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>「參考／抄襲」形容相同狀況但情感唔同</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>訴諸情感係訴諸憐憫嘅子類</td>\n<td><strong>F</strong>（<strong>反轉</strong>：憐憫係情感嘅子類）</td>\n</tr>\n<tr>\n<td>殺父母嘅人以孤兒身份求情係 Appeal to Pity</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>言辭空廢 = 以重言命題冒充事實陳述</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>分辨絕對空廢靠語句嘅真假</td>\n<td><strong>F</strong>（靠<strong>兩個條件</strong>：重言命題 + 冒充事實陳述；佢<strong>必然為真</strong>）</td>\n</tr>\n<tr>\n<td>重言句本身就係一種弊病</td>\n<td><strong>F</strong>（缺乏信息內容但<strong>唔係弊病</strong>；<strong>冒充</strong>事實陳述先係問題）</td>\n</tr>\n<tr>\n<td>相對空廢要求語句有重言句形式</td>\n<td><strong>F</strong>（唔要求；分析內容 + 語境）</td>\n</tr>\n<tr>\n<td>「若果明年總支出大於總收入就會出現財赤」係絕對空廢</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>「父在母先亡」係相對空廢</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>相對空廢令言辭空廢呢個批判工具嘅可用性提高</td>\n<td><strong>T</strong></td>\n</tr>\n</tbody></table>\n","m23":"<h1 id=\"m23-h1\">M2-3 Language: Emotive Language, Disputes &amp; Ambiguity</h1>\n<blockquote>\n<p>來源：Module 2 Readings「2.3. Language」——節錄自 Copi &amp; Cohen, <em>Introduction to Logic</em>, Ch. &quot;Language and Definitions&quot; §2–§3（英文原文，6 頁）\n⭐ = 極高機會考；⚠️ = 陷阱。<strong>呢份係英文 reading，考試好可能直接用英文句子出題 → 關鍵句保留英文。</strong></p>\n</blockquote>\n<hr>\n<h2 id=\"m23-h2\">0. 一句總結 ⭐⭐⭐</h2>\n<ol>\n<li><strong>Emotive vs Neutral language</strong>：一句說話可以同時 <strong>report facts</strong> 又 <strong>express feelings</strong>；用字可以影響聽者嘅 <strong>attitudes</strong>。</li>\n<li><strong>Disagreement in belief vs Disagreement in attitude</strong>：爭論可以係關於<strong>事實的信念</strong>，或者係對<strong>已同意的事實的態度</strong>。</li>\n<li><strong>三類爭論 (Three categories of disputes)</strong>：<ul>\n<li><strong>Obviously genuine dispute</strong>（明顯真正嘅爭論）</li>\n<li><strong>Merely verbal dispute</strong>（純粹字面之爭）</li>\n<li><strong>Apparently verbal but really genuine dispute</strong>（表面係字面之爭，實際係真正爭論）</li>\n</ul>\n</li>\n</ol>\n<hr>\n<h2 id=\"m23-h3\">1. §2 Emotive Language, Neutral Language, and Disputes ⭐⭐</h2>\n<h3 id=\"m23-h4\">1.1 語言嘅多重功能</h3>\n<ul>\n<li><blockquote>\n<p>&quot;Because a given sentence, or passage, can serve <strong>several functions</strong>—that is, for example, it can <strong>express feelings while reporting facts</strong>—the <strong>clever</strong> use of language can be <strong>deceptive or manipulative</strong>, and the <strong>careless</strong> use of language can lead to <strong>needless misunderstanding and dispute</strong>.&quot;</p>\n</blockquote>\n</li>\n<li>用嚟傳達信念嘅字可以係 <strong>neutral and exact</strong>，但亦可以（無意或有意）<strong>影響聽者嘅態度 (attitudes)</strong>。</li>\n</ul>\n<h3 id=\"m23-h5\">1.2 例子 ⭐</h3>\n<table>\n<thead>\n<tr>\n<th>例子</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>&quot;A rose by any other name would smell as sweet&quot;</strong>（<strong>Shakespeare</strong>）</td>\n<td>但如果遞花俾你時話佢通常叫 <strong>&quot;skunkweed&quot;</strong>（臭鼬草），你嘅反應會受影響</td>\n</tr>\n<tr>\n<td><strong>Euphemisms（委婉語）</strong> = &quot;<strong>gentle words for harsh realities</strong>&quot;</td>\n<td>因某啲字引起負面態度而創造：<strong>Janitors → &quot;maintenance workers&quot; → &quot;custodians&quot;</strong>；<strong>&quot;Waiters&quot; → &quot;waitpersons&quot; → &quot;servers&quot;</strong></td>\n</tr>\n<tr>\n<td>醫學詞彙 vs 粗口</td>\n<td>有關生殖、排泄嘅<strong>醫學詞彙係 neutral、唔冒犯</strong>；但嗰啲 <strong>four-letter words</strong>（粗俗同義詞）令好多人震驚，因為佢哋引起嘅態度</td>\n</tr>\n<tr>\n<td><strong>&quot;Seven dirty words&quot;</strong></td>\n<td>美國廣播媒體禁用——因為佢哋有 <strong>unacceptable emotive meanings</strong>，同佢哋嘅 <strong>literal meanings</strong> 截然不同</td>\n</tr>\n</tbody></table>\n<h3 id=\"m23-h6\">1.3 幾時用 / 避免 emotive language ⭐⭐</h3>\n<ul>\n<li><strong>Emotionally colored language</strong> 喺某啲脈絡<strong>適當</strong>——例如 <strong>poetry（詩）</strong>；但喺其他脈絡<strong>非常不適當</strong>——例如 <strong>survey research（問卷調查）</strong>（回應好大程度取決於問題用字）。</li>\n<li>⭐ &gt; &quot;Whether we should avoid emotive language, or rely on it, <strong>depends on the purpose language is intended to serve in the context</strong>.&quot;</li>\n<li>如果目標係 <strong>unbiased report of facts</strong>，用帶強烈情感意義嘅字就會破壞呢個目標。</li>\n<li>有時<strong>幾乎冇可能避免</strong> emotive content：墮胎爭議雙方自稱 <strong>&quot;pro-life&quot;</strong> 或 <strong>&quot;pro-choice&quot;</strong>。</li>\n<li>⭐ &gt; &quot;<strong>In logic we generally strive for language that is, so far as possible, free of the distortion that emotive meanings introduce.</strong>&quot;</li>\n</ul>\n<h3 id=\"m23-h7\">1.4 廣告 &amp; 政治 ⭐</h3>\n<ul>\n<li><strong>Playing on the emotions</strong> 係 <strong>advertising industry</strong> 嘅核心技巧：目的係 persuade and sell，操控態度變成<strong>精密嘅專業藝術</strong>。</li>\n<li><strong>Political campaigns</strong>：rhetorical tricks 好常見，用字選擇好關鍵。</li>\n<li>⭐ <strong>最佳防禦</strong>：&gt; &quot;The best defense against trickery, for voters as for consumers, is an <strong>awareness of the real uses to which the language before us is being put</strong>.&quot;</li>\n<li>要提防嗰啲用字令 &quot;<strong>the worse appear the better cause</strong>&quot; 嘅人。</li>\n<li><strong>Benjamin Disraeli</strong>：&quot;<strong>With words we govern men.</strong>&quot;</li>\n</ul>\n<h3 id=\"m23-h8\">1.5 Disagreement in Belief vs Disagreement in Attitude ⭐⭐⭐</h3>\n<ul>\n<li>爭論雙方嘅分歧可以係：<ol>\n<li><strong>Disagreements in beliefs about the facts</strong>（對事實嘅信念有分歧）</li>\n<li><strong>Disagreements in attitude about facts that are actually agreed upon</strong>（事實上同意，但態度有分歧）</li>\n</ol>\n</li>\n<li>呢種不確定同混亂可能因為爭論用字有<strong>好唔同嘅 emotive meanings</strong>。</li>\n</ul>\n<p><strong>死刑例子 (Death penalty for murder)</strong> ⭐⭐</p>\n<ul>\n<li>X 同 Y 可以喺<strong>事實</strong>上同意或不同意：<strong>capital punishment 係咪 effective deterrent（有效阻嚇）</strong>？→ <strong>belief</strong></li>\n<li>亦可以喺<strong>態度</strong>上同意或不同意：<strong>國家處決犯人係咪 right（啱）</strong>（無論阻嚇效果如何）？→ <strong>attitude</strong></li>\n<li>四種組合：</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Agree in <strong>attitude</strong></th>\n<th>Disagree in <strong>attitude</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Agree in belief</strong></td>\n<td>（冇爭論）</td>\n<td>✔ 可能</td>\n</tr>\n<tr>\n<td><strong>Disagree in belief</strong></td>\n<td>✔ 可能</td>\n<td>✔ 可能（兩樣都唔同意）</td>\n</tr>\n</tbody></table>\n<p><strong>點樣解決？</strong> ⭐</p>\n<ul>\n<li>要<strong>確定雙方真正爭拗嘅係乜 (what really is at issue)</strong>。</li>\n<li>如果爭論真係關於<strong>死刑是否有阻嚇作用</strong> → 首先要<strong>客觀地確定事實</strong>（雖然未必容易）。</li>\n<li>如果爭論源於對<strong>國家處決是否正確</strong>嘅<strong>信念衝突</strong> → 就算<strong>事實達成共識都好可能唔足夠</strong>解決爭論。</li>\n<li>有時 attitude 上嘅分歧<strong>根源於</strong> belief 上嘅分歧；有時<strong>唔係</strong>。</li>\n</ul>\n<p><strong>Grantland Rice vs Vince Lombardi</strong> ⭐</p>\n<ul>\n<li><p>記者 <strong>Grantland Rice</strong>：&quot;For when the One Great Scorer comes / To write against your name, / He marks—<strong>not that you won or lost— / But how you played the game.</strong>&quot;</p>\n</li>\n<li><p>教練 <strong>Vince Lombardi</strong>：&quot;<strong>Winning isn&#39;t everything. It&#39;s the only thing.</strong>&quot;</p>\n</li>\n<li><p>書問：呢個 <strong>disagreement in attitude</strong> 係咪根源於 <strong>disagreement in belief</strong>？（→ 主要係<strong>態度</strong>分歧：贏嘅重要性）</p>\n</li>\n<li><p>⭐ 總結：&gt; &quot;We do not reach agreement simply by recognizing the nature of the dispute. But <strong>until we recognize the real nature of a dispute, and the differing functions of the language</strong> used by the conflicting parties, it is <strong>unlikely</strong> that the resolution of differences can be achieved.&quot;</p>\n<ul>\n<li>⚠️ T/F 陷阱：「認清爭論嘅性質就足以達成共識」→ <strong>F</strong>（係<strong>必要</strong>但<strong>唔足夠</strong>）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m23-h9\">1.6 練習題（成對句子：辨認 agreement/disagreement 類型）</h3>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>(a)</th>\n<th>(b)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>Answer a fool according to his folly (Prov. 26:5)</td>\n<td>Answer not a fool according to his folly (Prov. 26:4)</td>\n</tr>\n<tr>\n<td>2</td>\n<td>&quot;Our country… right or wrong!&quot; (<strong>Stephen Decatur</strong>)</td>\n<td>&quot;Our country, right or wrong. When right, to be kept right; when wrong, to be put right.&quot; (<strong>Carl Schurz</strong>)</td>\n</tr>\n<tr>\n<td>3</td>\n<td>&quot;A bad peace is even worse than war.&quot; (<strong>Tacitus</strong>)</td>\n<td>&quot;The most disadvantageous peace is better than the most just war.&quot; (<strong>Erasmus</strong>)</td>\n</tr>\n<tr>\n<td>4</td>\n<td>A stitch in time saves nine.</td>\n<td>Better late than never.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Absence makes the heart grow fonder.</td>\n<td>Out of sight, out of mind.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>The race is not to the swift… (Eccl. 9:11)</td>\n<td>But that&#39;s the way to bet. (Jimmy the Greek)</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Aristotle: some men by nature free, others slaves</td>\n<td>Rousseau: force made the first slaves</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Mussolini: war puts stamp of nobility</td>\n<td>Sumner: war crushes all justice</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Garfield: popular education essential</td>\n<td>George Moore: education fatal to artistic feeling</td>\n</tr>\n<tr>\n<td>10</td>\n<td>La Mettrie: atheism</td>\n<td>J. P. Smith: atheists vile</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Washington: improve agriculture</td>\n<td>Russell: agriculture brought meanness, misery, madness</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Jefferson: property laws violate natural right</td>\n<td>Pope Leo XIII: natural right to property</td>\n</tr>\n<tr>\n<td>13</td>\n<td>Grant: right of revolution</td>\n<td>Pope Leo XIII: inciting revolution is treason</td>\n</tr>\n<tr>\n<td>14</td>\n<td>Coleridge: language is the armory of the mind</td>\n<td>Hawthorne: language little better than croak of fowls</td>\n</tr>\n<tr>\n<td>15</td>\n<td>Thoreau: can&#39;t be associated with government</td>\n<td>Jefferson: best government existing</td>\n</tr>\n</tbody></table>\n<p>（第 1 頁開頭亦有 §1 練習 16–20：Prov. 17:28 &quot;Even a fool, when he holdeth his peace, is counted wise&quot;；Prov. 25:11；Jefferson &quot;eternal hostility against every form of tyranny over the mind of man&quot;；Spinoza &quot;A free man thinks of nothing less than of death&quot;；Ruskin 批評 Whistler &quot;flinging a pot of paint in the public&#39;s face&quot;。）</p>\n<hr>\n<h2 id=\"m23-h10\">2. §3 Disputes and Ambiguity ⭐⭐⭐</h2>\n<h3 id=\"m23-h11\">2.1 Genuine vs Merely Verbal</h3>\n<ul>\n<li>好多爭論（無論關於 beliefs 定 attitudes）係 <strong>genuine（真正嘅）</strong>。</li>\n<li>但有啲爭論係 <strong>merely verbal</strong>——<strong>只係因為語言誤解 (linguistic misunderstanding)</strong> 而產生。</li>\n<li>爭論雙方所用嘅詞可能有多過一個意思——即係 <strong>ambiguous</strong>——而雙方<strong>冇察覺</strong>。</li>\n<li>⭐ &gt; &quot;To uncover and to resolve verbal disagreements, <strong>ambiguities must be identified</strong>, and the <strong>alternative meanings of the critical terms</strong> in the dispute must be <strong>distinguished and clarified</strong>.&quot;（= 語理分析：釐清關鍵用語！）</li>\n</ul>\n<h3 id=\"m23-h12\">2.2 三類爭論 Three Categories of Disputes ⭐⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th>類別</th>\n<th>定義</th>\n<th>例子</th>\n<th>點解決</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>1. Obviously genuine dispute</strong></td>\n<td>明顯真正嘅分歧</td>\n<td><strong>A 支持 Yankees，B 支持 Red Sox</strong> → genuine，主要係 <strong>attitude</strong> 分歧；<strong>C 相信 Miami 喺 Honolulu 以南，D 否認</strong> → genuine，關於<strong>地理事實</strong></td>\n<td>事實爭論：<strong>a good map can settle the matter</strong>；態度分歧未必解決到</td>\n</tr>\n<tr>\n<td><strong>2. Merely verbal dispute</strong></td>\n<td><strong>表面衝突唔係真嘅</strong>，只要就<strong>某個字詞點理解</strong>達成共識就解決</td>\n<td><strong>Tree falling in the wilderness</strong>：F 話冇人聽到就<strong>冇 sound</strong>；G 堅持有 sound。若 <strong>&quot;sound&quot; = 人類聽覺感受 (human auditory sensation)</strong> → 冇；若 <strong>&quot;sound&quot; = 空氣振動 (vibrations in the air)</strong> → 有</td>\n<td><strong>Getting clear about what is meant by &quot;sound&quot;</strong> 就解決 → <strong>no more than verbal</strong></td>\n</tr>\n<tr>\n<td><strong>3. Apparently verbal but really genuine</strong></td>\n<td>涉及用詞誤解，但<strong>澄清之後仍然有超越字義嘅分歧</strong></td>\n<td><strong>Film with explicit sexual activity 算唔算 &quot;pornography&quot;？</strong> J：露骨 → pornographic and offensive；K：美感同細膩 → <strong>art, not pornography</strong>。澄清 &quot;pornography&quot; 意思之後，雙方<strong>仍然對套戲嘅判斷有分歧</strong></td>\n<td>定義可以解決「算唔算 pornographic」，但會暴露<strong>更深層嘅分歧</strong></td>\n</tr>\n</tbody></table>\n<p><strong>Pornography 例子細節</strong> ⭐⭐</p>\n<ul>\n<li>&quot;Pornographic&quot; 帶明顯嘅 <strong>pejorative associations（貶義聯想）</strong>。</li>\n<li>J（反對套戲）同 K（認同套戲）<strong>用法唔同</strong>；但對兩人嚟講，個字嘅 <strong>emotional meaning 都好負面</strong>。</li>\n<li>佢哋分歧在於 <strong>the criteria for the application of that negative word</strong>（應用呢個負面詞嘅<strong>準則</strong>）。</li>\n<li>→ 呢個係「<strong>apparently verbal but really genuine</strong>」。</li>\n</ul>\n<h3 id=\"m23-h13\">2.3 處理爭論嘅程序 (Summary) ⭐⭐⭐（背！）</h3>\n<pre><code>面對爭論\n  ↓\nQ1: 有冇 ambiguity 可以透過澄清 alternative meanings 而消除？\n  ├─ 冇 → genuine dispute（obviously genuine）\n  └─ 有 → Q2: 澄清咗語言問題之後，爭論解決咗未？\n             ├─ 解決咗 → merely verbal dispute\n             └─ 未解決 → genuine dispute（apparently verbal but really genuine）\n</code></pre>\n<blockquote>\n<p>&quot;When confronting a dispute that arises in discourse, we must <strong>first ask whether there is some ambiguity</strong> that can be eliminated by clarifying the alternative meanings in play. If there is, then we must ask <strong>whether clearing up that linguistic issue will resolve the matter</strong>. If it does, the dispute was indeed <strong>merely verbal</strong>. If it does not, the dispute was <strong>genuine</strong>, although it may have appeared to be merely verbal.&quot;</p>\n</blockquote>\n<h3 id=\"m23-h14\">2.4 練習 A</h3>\n<ul>\n<li>搵三個現時政治/社會爭議：一個 genuine、一個 merely verbal、一個 apparently verbal but really genuine，並解釋。</li>\n</ul>\n<hr>\n<h2 id=\"m23-h15\">3. 同其他課題嘅連結 ⭐</h2>\n<table>\n<thead>\n<tr>\n<th>Copi</th>\n<th>對應中文課題</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Emotive / emotionally colored language</td>\n<td><strong>著色語辭／著色字詞 (coloured expression)</strong>（李天命 2.2、講者 2b）</td>\n</tr>\n<tr>\n<td>Euphemisms</td>\n<td>「the unmentionables（不可提及的）」長褲例子；歧義好處：<strong>語言避諱</strong></td>\n</tr>\n<tr>\n<td>Ambiguity → merely verbal dispute</td>\n<td><strong>歧義</strong>；羅素「你的上帝即是我的魔鬼」故事（2.1）</td>\n</tr>\n<tr>\n<td>Disagreement in belief vs attitude</td>\n<td><strong>事實問題 vs 評價問題</strong>（2a 問題分類）</td>\n</tr>\n<tr>\n<td>Identify ambiguity first</td>\n<td><strong>語理分析 = 首先釐清關鍵用語的意思</strong></td>\n</tr>\n</tbody></table>\n<hr>\n<h2 id=\"m23-h16\">4. 考試速攻 ⚠️⭐</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>Statement</th>\n<th>T/F</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A sentence can express feelings while reporting facts.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>Emotive language should always be avoided.</td>\n<td><strong>F</strong>（depends on the purpose in the context; poetry OK）</td>\n</tr>\n<tr>\n<td>Emotionally colored language is appropriate in survey research.</td>\n<td><strong>F</strong>（highly inappropriate）</td>\n</tr>\n<tr>\n<td>Euphemisms are gentle words for harsh realities.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>&quot;Custodians&quot; is a euphemism for &quot;janitors&quot;.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>&quot;Pro-life&quot; and &quot;pro-choice&quot; show emotive content is sometimes nearly impossible to avoid.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>In logic we strive for language free of emotive distortion.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>The best defense against trickery is awareness of the real uses of the language.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>&quot;With words we govern men&quot; — Benjamin Disraeli.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>Two parties can agree in belief but disagree in attitude.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>If the death-penalty dispute is about whether it is right for the state to execute, agreeing on deterrence facts will surely resolve it.</td>\n<td><strong>F</strong>（likely insufficient）</td>\n</tr>\n<tr>\n<td>Recognizing the nature of a dispute is sufficient to reach agreement.</td>\n<td><strong>F</strong>（necessary-ish, not sufficient）</td>\n</tr>\n<tr>\n<td>The falling-tree &quot;sound&quot; dispute is merely verbal.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>Yankees vs Red Sox fans have a genuine dispute mainly in attitude.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>The Miami/Honolulu dispute can be settled by a good map.</td>\n<td><strong>T</strong>（factual）</td>\n</tr>\n<tr>\n<td>The &quot;pornography&quot; film dispute is merely verbal.</td>\n<td><strong>F</strong>（apparently verbal but <strong>really genuine</strong>）</td>\n</tr>\n<tr>\n<td>In the pornography case, J and K both regard the word as negative but differ on criteria for applying it.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>First step facing a dispute: ask whether there is ambiguity that can be eliminated.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>If clarifying meanings does not resolve the dispute, it was genuine.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>&quot;A rose by any other name would smell as sweet&quot; was written by Shakespeare.</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>Vince Lombardi: &quot;Winning isn&#39;t everything. It&#39;s the only thing.&quot;</td>\n<td><strong>T</strong></td>\n</tr>\n</tbody></table>\n","m31":"<h1 id=\"m31-h1\">M3-1 定義 (Definition)</h1>\n<blockquote>\n<p>來源：</p>\n<ul>\n<li><strong>Lecture notes 3a. Definition</strong>（講者 slides，15 頁）</li>\n<li><strong>Reading 3.1 定義</strong> = 柯比 (Copi)《邏輯導論》第二章，頁 29–56（第一至第六節）\n⭐ = 極高機會考；⚠️ = 陷阱\n⚠️ <strong>兩套分類唔同</strong>：slides 講 <strong>3 種定義 + 3 條規則</strong>；Copi 講 <strong>5 種定義 + 5 條法則</strong> → 兩套都要識，題目用邊套就答邊套。</li>\n</ul>\n</blockquote>\n<hr>\n<h2 id=\"m31-h2\">0. 一頁總覽 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>主題</th>\n<th>講者 slides (3a)</th>\n<th>Copi《邏輯導論》(3.1)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>定義兩端</td>\n<td><strong>被界定端 Definiendum</strong>／<strong>界定端 Definiens</strong></td>\n<td>同（被界定端 definiendum／界定端 definiens）</td>\n</tr>\n<tr>\n<td>意義兩面</td>\n<td><strong>內涵 Intension</strong>／<strong>外延 Extension</strong></td>\n<td><strong>內涵 (intension) = 意涵 (connotation)</strong>；<strong>外範 (extension) = 指涉 (denotation)</strong></td>\n</tr>\n<tr>\n<td>定義種類</td>\n<td>① <strong>規創的定義 Stipulative</strong> ② <strong>釐定的定義 Precising</strong> ③ <strong>字詞的定義 Lexical</strong></td>\n<td>① <strong>規創的</strong> ② <strong>詞典性</strong> ③ <strong>精確化</strong> ④ <strong>理論性</strong> ⑤ <strong>說服性</strong></td>\n</tr>\n<tr>\n<td>規則</td>\n<td>① 不可<strong>太闊</strong> ② 不可<strong>太窄</strong> ③ 不可<strong>循環</strong></td>\n<td>① 說明<strong>本質屬性</strong> ② 不可<strong>循環</strong> ③ 不可<strong>過寬/過窄</strong> ④ 不可用<strong>歧義、晦澀、比喻</strong> ⑤ 可用<strong>肯定</strong>就唔用<strong>否定</strong></td>\n</tr>\n<tr>\n<td>價值</td>\n<td><strong>去除不必要的言詞之爭</strong></td>\n<td>消弭<strong>言詞之爭</strong>；揭露/避免<strong>歧義</strong></td>\n</tr>\n</tbody></table>\n<p><strong>對應</strong>：slides「<strong>釐定的定義</strong> (Precising)」≈ Copi「<strong>精確化定義</strong>」；slides「<strong>字詞的定義</strong> (Lexical)」≈ Copi「<strong>詞典性定義</strong>」。</p>\n<hr>\n<h2 id=\"m31-h3\">PART A — 講者 slides（3a. Definition）</h2>\n<h3 id=\"m31-h4\">A1. 開場</h3>\n<ul>\n<li>《孟子・離婁下》：「<strong>人之所以異於禽於獸者幾希，庶民去之，君子存之。</strong>」（人同禽獸嘅分別好少——即「<strong>種差</strong>」嘅概念：人 = 動物 + 某啲特徵）</li>\n</ul>\n<h3 id=\"m31-h5\">A2. 定義的作用 ⭐⭐</h3>\n<ul>\n<li><strong>分析哲學常用的釐清方法，但不是唯一的方法</strong>；⚠️（T/F：「定義係唯一釐清方法」→ F）</li>\n<li><strong>定義的作用是釐清語辭或概念的意義</strong>；</li>\n<li><strong>最常用於釐清能在句子中作主詞 (subject) 的語辭或概念</strong>，包括<strong>專有名詞 (proper nouns/names)</strong> 和<strong>普通名詞 (common nouns)</strong> 等；</li>\n<li><strong>一些含混的字眼如「冷」、「熱」等都是難以作準確定義。</strong></li>\n</ul>\n<h3 id=\"m31-h6\">A3. 被界定端 Definiendum／界定端 Definiens ⭐⭐⭐</h3>\n<ul>\n<li><strong>要下定義的語辭或概念</strong> = 「<strong>被界定端 (definiendum)</strong>」</li>\n<li><strong>用來解釋被界定端的語辭或概念（可超過一組）</strong> = 「<strong>界定端 (definiens)</strong>」</li>\n<li>例：<ul>\n<li>「<strong>人</strong>是<strong>理性的動物</strong>」→「人」= 被界定端；「理性的動物」= 界定端</li>\n<li>「<strong>民主</strong>是<strong>保護人權的政治體制</strong>」→「民主」= 被界定端；「保護人權的政治體制」= 界定端</li>\n</ul>\n</li>\n<li>記憶：-<strong>endum</strong> = 「被」（要被定義嗰個）；-<strong>ens</strong> = 做緊定義嗰個</li>\n</ul>\n<h3 id=\"m31-h7\">A4. 內涵 Intension 與外延 Extension ⭐⭐⭐</h3>\n<ul>\n<li><strong>「內涵」即詞項的特徵；而「外延」則是詞項的組成份子。</strong></li>\n<li>例：「<strong>偶數</strong>」→ 內涵 = 「<strong>可被『2』整除的自然數</strong>」；外延 = <strong>2, 4, 6, 8, 10…</strong></li>\n</ul>\n<p><strong>外延定義再細分兩類</strong> ⭐</p>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>定義</th>\n<th>例</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>完整外延 (complete extension)</strong></td>\n<td>指稱集合中的<strong>所有</strong>份子</td>\n<td><strong>七大洲 (seven continents)</strong> = 亞洲、歐洲、非洲、大洋洲、北美洲、南美洲、南極洲</td>\n</tr>\n<tr>\n<td><strong>非完整外延 (partial extension)</strong></td>\n<td><strong>未</strong>指稱集合中的所有份子</td>\n<td>哲學家包括<strong>柏拉圖、康德、尼采、釋迦牟尼、孔子</strong>等</td>\n</tr>\n</tbody></table>\n<h3 id=\"m31-h8\">A5. 內涵與外延的關係 ⭐⭐⭐（必考）</h3>\n<p><strong>(1) 外延被內涵決定，反之不然</strong></p>\n<ul>\n<li><strong>可以有不同的內涵但相同的外延</strong>：<ul>\n<li>「<strong>等邊三角形</strong>」、「<strong>等角三角形</strong>」（內涵唔同：三邊相等 vs 三角相等；外延一樣）</li>\n<li>「<strong>2025 福布斯 (Forbes) 全球首富</strong>」、「<strong>2025 福布斯美國首富</strong>」（內涵唔同，外延都係同一個人）</li>\n</ul>\n</li>\n<li><strong>有不同外延的語辭或概念不會有相同的內涵</strong>：<ul>\n<li><strong>中國人、香港人、上海人、華人</strong>（外延唔同 → 內涵必定唔同）</li>\n</ul>\n</li>\n<li>⚠️ 邏輯：內涵相同 ⇒ 外延相同；外延相同 ⇏ 內涵相同；外延不同 ⇒ 內涵不同。</li>\n</ul>\n<p><strong>(2) 假如將語辭或概念按內涵意義遞增排列，則其外延以「不遞增」的次序來排列</strong>（外延指涉對象的數量<strong>遞減</strong>／最多保持不變）</p>\n<ul>\n<li>例（Copi）：「<strong>人</strong>」→「<strong>活人</strong>」→「<strong>超過 20 歲的活人</strong>」→「<strong>超過 20 歲長了紅髮的活人</strong>」：內涵↑，外延↓</li>\n<li>⚠️ 點解係「<strong>不遞增</strong>」而唔係「<strong>遞減</strong>」？因為外延可以<strong>保持不變</strong>：「活人」→「有脊骨的活人」→「有脊骨而又少於 1000 歲的活人」→「…且未盡讀國會圖書館內藏書的活人」：內涵遞增，<strong>外延都一樣</strong>（冇遞減過）。</li>\n<li>⚠️ 「<strong>反向增減定律 (law of inverse variation)</strong>」（外範跟內涵總是反向變化）<strong>有點意思但不全對</strong>；<strong>修訂後嘅正確定律</strong>：「假如語詞按遞增的內涵來排列，則語詞的外範以<strong>不遞增</strong>的次序來排列；換言之，<strong>假如外範有所變動，則跟內涵反向而變</strong>。」</li>\n</ul>\n<p><strong>(3) 內涵固定則外延固定</strong> *　⚠️ <strong>講者堂上明確講：呢條（slides 打 * 嗰條）唔考</strong>（佢對 textbook「人 vs 活人」嘅解釋只係部分同意）——知道有呢條就夠，唔使深究。</p>\n<ul>\n<li>引 Copi（頁 42）：「有人認為，雖然語詞的內涵並沒有時常更改，但外延卻會。例如『<strong>人</strong>』的外延隨著人死去和嬰兒誕生而不斷變更。<strong>這見解出於混淆</strong>。『人』是用來指<strong>所有人，死人和還未出生的人都包含在內</strong>，因此這語詞（的外延）並沒有變更。外延不斷變更的是『<strong>活人</strong>』這個語詞。」</li>\n<li>「活人」= 「<strong>現在</strong>活著的人」，「現在」指不斷消逝變動嘅當下一剎那 → 「活人」嘅<strong>內涵</strong>都喺不同時間有所不同。</li>\n<li>⭐ <strong>任何具有不斷變動的外延的語詞都必定有個不斷變動的內涵。兩者的穩定程度相同；一旦語詞的內涵是固定的，則外延也就是固定的。</strong></li>\n</ul>\n<p><strong>(4) 外延有所變動，則代表內涵反向改變</strong></p>\n<ul>\n<li>例：「<strong>合資格申請獎學金學生</strong>」→ 如果申請條件（內涵）加多一項（例如 GPA 要求提高），合資格學生（外延）就減少；外延變大即代表條件（內涵）減少。</li>\n</ul>\n<h3 id=\"m31-h9\">A6. 定義的分類（slides 版：3 種）⭐⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th>種類</th>\n<th>特點</th>\n<th>真假？</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>1. 規創的定義 Stipulative definitions</strong></td>\n<td><strong>具有創新性</strong>，<strong>沒有真假可言，只有接受與否</strong>；經一段時間嘅運用後，<strong>可能會轉為字詞的定義使用</strong></td>\n<td>✗ 冇真假</td>\n<td>新詞：<strong>佛系、0尊、67 (Six Seven)</strong>；已轉為字詞定義：<strong>王老五、蘇絲黃、Generation Z</strong></td>\n</tr>\n<tr>\n<td><strong>2. 釐定的定義 Precising definitions</strong></td>\n<td>一啲如「<strong>太快</strong>」「<strong>太慢</strong>」嘅字眼，本身<strong>冇明確應用界線</strong>（含混），所以需要<strong>釐定</strong>佢哋嘅定義以方便<strong>實際應用</strong>；<strong>雖然沒有真假可言，但可判斷釐定的定義是否恰當</strong></td>\n<td>✗ 冇真假，但有<strong>恰當與否</strong></td>\n<td><strong>法定年齡、超速、合適每週工作時間</strong>；<strong>十大傑出青年選舉</strong>；<strong>香港的貧窮線</strong></td>\n</tr>\n<tr>\n<td><strong>3. 字詞的定義 Lexical definitions</strong></td>\n<td><strong>旨在消除歧義</strong>，<strong>並沒有增加被界定端的意義</strong>，只係<strong>描述被界定端既有的定義</strong>；<strong>有真假可言</strong>，所以需要<strong>依循一套定義規則</strong></td>\n<td>✔ <strong>有真假</strong></td>\n<td>字典定義</td>\n</tr>\n</tbody></table>\n<ul>\n<li>⚠️ 記：<strong>規創 → 接受與否</strong>；<strong>釐定 → 恰當與否</strong>；<strong>字詞 → 真假</strong>。</li>\n<li>⚠️ 對應問題：<strong>歧義 → 字詞定義（消除歧義）</strong>；<strong>含混 → 釐定定義（減少含混）</strong>。</li>\n</ul>\n<h3 id=\"m31-h10\">A7. 字詞定義的規則 Rules for Lexical Definitions（slides 版：3 條）⭐⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th>規則</th>\n<th>違反例子</th>\n<th>點解錯</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>1. 定義不可太闊</strong></td>\n<td>「<strong>鳥</strong>」是<strong>有翅膀的動物</strong></td>\n<td>蝙蝠、蝴蝶、蜜蜂都有翅膀 → 包括咗唔係鳥嘅嘢</td>\n</tr>\n<tr>\n<td><strong>2. 定義不可太窄</strong></td>\n<td>「<strong>鳥</strong>」是<strong>有羽毛會飛的動物</strong></td>\n<td>企鵝、鴕鳥唔識飛 → 漏咗啲鳥</td>\n</tr>\n<tr>\n<td><strong>3. 定義不可循環</strong> *</td>\n<td>「<strong>心理學是研究心理相關的學科</strong>」</td>\n<td>被界定端（心理）出現喺界定端</td>\n</tr>\n</tbody></table>\n<ul>\n<li>對照好嘅定義：「<strong>心理學是一門研究人類和動物的心理現象、意識和外在行為的科學。</strong>」（維基百科）；&quot;<strong>Psychology is the scientific study of the mind and behavior.</strong> Its subject matter includes the behavior of humans and nonhumans, both conscious and unconscious phenomena, and mental processes such as thoughts, feelings, and motives. Psychology is an academic discipline of broad scope, crossing the boundaries between the natural and social sciences.&quot; (Wikipedia)</li>\n<li><em>（星號）：維基百科嘅定義<strong>都用咗「心理」</strong>（心理現象）——但佢有*<em>進一步具體內容</em></em>（意識、外在行為、thoughts, feelings, motives），唔係純粹兜圈；考慮循環要睇界定端有冇真係<strong>解釋到</strong>被界定端。</li>\n</ul>\n<h3 id=\"m31-h11\">A8. 總結 ⭐⭐</h3>\n<ul>\n<li><strong>定義的價值在於去除不必要的言詞之爭。</strong></li>\n<li><strong>有些爭論是不能透過定義解決</strong>：<ul>\n<li><strong>某色情電影是低俗還是藝術？</strong>（Copi：表面言詞之爭，實際真正分歧／態度分歧）</li>\n<li><strong>人生是苦是樂？</strong>（評價／態度）</li>\n<li><strong>一個概念沒有外延代表沒有意義嗎？</strong>（→ 唔係！「獨角獸」冇外延但有意義——見 Copi 第四節）</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h2 id=\"m31-h12\">PART B — Copi《邏輯導論》第二章（Reading 3.1）</h2>\n<h3 id=\"m31-h13\">B1. 第一節：爭論、言詞之爭、定義 ⭐⭐⭐</h3>\n<ul>\n<li>爭論嘅來源：<ul>\n<li>雙方對「<strong>事實究竟是甚麼？</strong>」有歧見 → <strong>見解上的分歧</strong>（disagreement in belief）</li>\n<li>雙方對事物有<strong>不同態度</strong> → <strong>態度上的分歧</strong>（disagreement in attitude）</li>\n<li>可以<strong>同時</strong>有兩種分歧。要解決呢兩種爭論，<strong>唔能單靠考察字眼嘅定義</strong>。</li>\n</ul>\n</li>\n<li>有時爭執只係因為雙方<strong>未察覺用咗歧義字詞</strong> → <strong>唔涉及見解或態度分歧</strong> → <strong>言詞之爭 (verbal dispute)</strong>；察覺咗，<strong>把歧義字詞意義釐清</strong>就唔難解決。</li>\n<li><strong>語言係人與人之間嘅主要溝通工具</strong>；不小心或錯誤用字詞 → 反變成<strong>負累</strong>：例如用<strong>歧義的、含混的、不精確的、或含有情緒意義</strong>嘅字眼就妨礙彼此了解。（⚠️ 言詞問題通常<strong>只係產生爭執嘅眾多原因之一</strong>）</li>\n</ul>\n<p><strong>爭論三類</strong> ⭐⭐⭐（= 英文 reading 2.3 嘅 three categories）</p>\n<table>\n<thead>\n<tr>\n<th>類</th>\n<th>描述</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>第一種：有明顯和真正的分歧</strong></td>\n<td>分歧可以關乎<strong>態度</strong>，亦可以關乎<strong>事實</strong></td>\n<td><strong>阿根廷</strong>足球隊贏咗世界杯：甲「太好了！」乙「真豈有此理！」→ <strong>態度</strong>分歧（對誰贏冇歧見）；甲認為<strong>杭州</strong>比上海更接近<strong>黃山</strong>，乙相反 → <strong>事實</strong>分歧，<strong>找張地圖</strong>就解決</td>\n</tr>\n<tr>\n<td><strong>第二種：僅僅是言詞之爭</strong></td>\n<td>原因通常在於<strong>關鍵字眼有歧義</strong>；嚴格嚟講<strong>雙方並無真正分歧</strong></td>\n<td><strong>威廉・占姆士 (William James)《實用主義》松鼠例子</strong> ⭐</td>\n</tr>\n<tr>\n<td><strong>第三種：表面看來是言詞之爭，但事實上雙方真的有真正的分歧</strong></td>\n<td>唔能單靠分清歧義字詞意義解決；分歧可以係見解上，亦可以（而且往往）係<strong>態度上</strong></td>\n<td>某齣有<strong>細膩性愛鏡頭</strong>嘅電影應否評為「<strong>色情電影</strong>」：一方話有性愛鏡頭 → 色情、低劣；另一方話有美感同感性 → 真正藝術作品。即使統一咗「色情電影」定義，<strong>很有可能仍然有態度上的分歧</strong></td>\n</tr>\n</tbody></table>\n<p><strong>占姆士松鼠例子</strong> ⭐⭐</p>\n<ul>\n<li>想像一棵樹，樹幹一邊伏住隻松鼠，另一邊站住一個人；人繞住樹幹走，松鼠以同樣速度向反方向繞樹移動，人始終睇唔到佢。問題：<strong>那人有沒有繞著松鼠來跑？</strong>（肯定佢繞住<strong>樹</strong>跑）</li>\n<li>占姆士：「<strong>哪一方才是對的，要視乎你們實際上怎樣了解『繞著松鼠來跑』這句話。</strong>」<ul>\n<li>如果意思係：<strong>由佢北面 → 東面 → 南面 → 西面 → 返回北面</strong> → 有繞住松鼠跑。</li>\n<li>如果意思係：<strong>先跑到松鼠前面 → 右邊 → 背後 → 左邊 → 前面</strong> → 冇，因為由始至終<strong>松鼠嘅肚子都向住嗰個人</strong>。</li>\n</ul>\n</li>\n<li>「<strong>你們可以雙方都錯，也可以雙方都對</strong>」——<strong>唔使搵事實方面嘅真相</strong>（亦冇人可以咁做），只要<strong>分清關鍵字眼嘅不同意義</strong>，爭論就<strong>消失於無形</strong>。</li>\n<li>一旦遇上僅僅言詞方面嘅爭論 → 可以藉<strong>界定字詞</strong>化解，指出雙方其實冇真正歧見：要麼<strong>用相同字詞（不同意義）支持不同命題</strong>，要麼<strong>用不同字詞支持同一命題</strong>。</li>\n</ul>\n<p><strong>總括</strong> ⭐：<strong>真正爭論</strong>：關鍵字眼<strong>冇歧義</strong>，但雙方喺態度上或見解上有真正分歧。<strong>言詞之爭</strong>：涉及<strong>歧義</strong>問題，但雙方<strong>冇真正分歧</strong>。<strong>表面言詞之爭的真正爭論</strong>：<strong>不單有歧義問題，雙方更且有態度上的分歧</strong>。</p>\n<h3 id=\"m31-h14\">B2. 第二節：定義的種類和論爭的解決方法 ⭐⭐⭐</h3>\n<ul>\n<li><strong>定義總是就「符號」而作出的</strong>：只有符號先有意義俾我哋界定。可以為「<strong>椅子</strong>」呢個<strong>詞</strong>下定義，但<strong>唔能為椅子（實物）下定義</strong>（可以坐、髹漆、燒、描述，但唔能定義）。<ul>\n<li>兩種講法都冇問題：「『三角形』一詞意指三直線所包圍而成的一個平面圖」或「三角形（按定義）就是三條直線所包圍而成的一個平面圖」。</li>\n</ul>\n</li>\n<li><strong>被界定端 (definiendum)</strong>：要下定義嘅符號；<strong>界定端 (definiens)</strong>：用嚟解釋被界定端嘅符號或一組符號。<ul>\n<li>⚠️ 話「<strong>界定端就是被界定端的意義</strong>」係<strong>錯</strong>嘅！應該話：據定義，界定端係另一個符號（或一組符號），<strong>有同被界定端相同的意思</strong>。</li>\n</ul>\n</li>\n</ul>\n<p><strong>定義五種</strong> ⭐⭐⭐：<strong>規創的、詞典性、精確化、理論性、說服性</strong>（口訣：「<strong>規詞精理說</strong>」）</p>\n<h4 id=\"m31-h15\">① 規創的定義 (Stipulative definition)</h4>\n<ul>\n<li>引介新符號嘅人俾佢咩意義都可以。<strong>有目的地為某符號賦予新的意義而得出來的定義</strong>，叫做規創的定義。被界定語詞<strong>本身不一定是新的</strong>，可能只係喺得到界定嗰個<strong>脈絡裏係新</strong>。</li>\n<li>又稱「<strong>唯名的 (nominal)</strong>」或「<strong>言詞的 (verbal)</strong>」定義。</li>\n<li><strong>引介新詞嘅理由</strong>：<ol>\n<li><strong>方便</strong>：電訊（電報）裏一個字詞可以代替好多字；</li>\n<li><strong>保密</strong>：只有發消息同接收雙方明白；</li>\n<li><strong>表意簡潔</strong>：科學新專門符號，如數學「<strong>冪數</strong>」：A¹² = B 代替 A×A×…×A = B（12 個 A）；</li>\n<li><strong>避免感情意涵干擾</strong>：太熟悉嘅字詞常附帶感情意涵，例：心理學家<strong>斯波爾曼 (Spearman)</strong> 用「<strong>g 因子</strong>」表達「<strong>智慧 (intelligence)</strong>」嘅描述意義——「g 因子」冇感情意義。</li>\n</ol>\n</li>\n<li>哲學界：有哲學家規創地引介「<strong>感覺質料 (sensum)</strong>」，迴避咗「對物理事物嘅經驗係直接定間接」嘅長久爭論；美國哲學家<strong>皮爾斯 (C. S. Peirce)</strong>——<strong>實用主義 (pragmatism)</strong> 發起人之一——憤於人家濫用此詞，將自己學說規創地界定為 <strong>Pragmaticism</strong>。</li>\n<li>⭐⭐ <strong>規創的定義既非對也非錯，既非準確也非不準確。</strong>（同詞典性定義很不相同）被界定端喺定義賦予意義<strong>之前並沒有意義</strong>；接受兩端有相同意義，<strong>全因為我哋下咗個規創定義</strong>。應該視之為<strong>建議（指引或決定）</strong>：用被界定端表達界定端嘅意義 → 規創定義係<strong>用來作出指引的，而不是用來傳達訊息的</strong>。建議可以不接納、指示可以不遵循，但<strong>既非對也非錯</strong>。</li>\n<li>可以根據其他準則評價：可能<strong>過於隱晦或繁複</strong>難以應用；稱得上「規創」當然有任意性——例：數學家倡議用「<strong>googol</strong>」指稱「1」字之後帶<strong>一百個零</strong>嘅數目。</li>\n<li>⭐ <strong>規創的定義本身清楚與否、有利還是有害、能否達成之所以引介的目的，都是客觀的事實。<strong>一般嚟講，規創定義</strong>不一定有利於紓解真正的爭論</strong>，但佢<strong>釐清用語、減少語言嘅煽情成分</strong>，都有助<strong>避免無謂的言詞之爭</strong>。</li>\n</ul>\n<h4 id=\"m31-h16\">② 詞典性定義 (Lexical definition)</h4>\n<ul>\n<li><strong>把字詞（並非新出的而且有既定意義的）加以界定，目的旨在消除歧義，或使人認識某個字詞</strong>，就係詞典性定義。佢<strong>冇俾被界定端迄今所無嘅意義</strong>，而係<strong>描述佢既有嘅意義</strong> → ⭐ <strong>詞典性定義顯然有對錯之分</strong>。<ul>\n<li>正確：「『<strong>山</strong>』這個字意指比四週郊野高出相當多的一大堆泥土或石塊。」</li>\n<li>錯誤：「『山』這個字詞意指三條直線所包圍而成的平面圖形。」（關於我哋對「山」嘅用法係錯嘅）</li>\n</ul>\n</li>\n<li><strong>重大區別</strong>：規創定義嘅被界定端喺定義引入嘅意義以外（或之前）<strong>冇意義</strong>，定義<strong>不可能是假的（也不可能是真的）</strong>；詞典性定義嘅被界定端有<strong>既有的及獨立的意義</strong> → <strong>非對即錯</strong>，取決於佢所描述嘅意義是否為被界定端<strong>所既有</strong>。所以詞典性定義有時被稱為「<strong>真正的</strong>」定義。</li>\n<li>⚠️ <strong>「存在」問題</strong>：定義（無論規創定定義）<strong>跟被界定端是否指涉「真實存在的」事物無關</strong>。例：「『<strong>獨角獸</strong>』一詞意指一種動物，形狀似馬，但額上生有一角。」→ 係<strong>詞典性定義</strong>（字詞源遠流長，意義正係界定端），雖然<strong>冇指涉任何存在物</strong>。</li>\n<li>「非對即錯」係<strong>高度簡化</strong>：好多字詞有好多用法，原因唔在於有多種標準意義，而在於好多人用得<strong>不正確或不夠正統</strong>；但不正統用法頗普遍。字詞嘅任何定義若<strong>忽略任何一群數量相當嘅使用者</strong>對該字嘅（也許不正統）用法 → <strong>對實際用法不忠實</strong>，所以都唔甚正確。</li>\n<li>⭐ <strong>字詞的慣用法是屬於統計方面的一回事</strong>：字詞定義應<strong>統計地描述</strong>各個意義（由實際用法決定）；即使搬出「正確的」用法，都迴避唔到<strong>詞典統計學</strong>的需要（「正確」用法取決於同意採納某用法嘅「一流」作家數目）。學院詞彙往往<strong>落後</strong>於不斷變化嘅日常語言，<strong>不正統用法大可變得正統</strong> → 只報道學院貴族認同嘅意義會<strong>誤導</strong>。字典希望做到：指出意義屬「<strong>古語</strong>」「<strong>過時</strong>」「<strong>口語</strong>」「<strong>俚語</strong>」。</li>\n<li>重申：詞典性定義<strong>非對即錯</strong>——要麼<strong>忠於實際用法</strong>，要麼<strong>不忠於</strong>。</li>\n</ul>\n<h4 id=\"m31-h17\">③ 精確化定義 (Precising definition)</h4>\n<ul>\n<li>⭐ <strong>規創定義和詞典性定義可助消除歧義；而精確化定義則可助減少含混性 (vagueness)。</strong></li>\n<li><strong>含混性 vs 歧義性</strong>：某字詞有<strong>兩個或以上完全不同的意義</strong>，但脈絡冇顯示清楚用邊個 → <strong>歧義</strong>；倘若有<strong>模稜兩可</strong>情況，以致<strong>無法決定某字詞應否應用於這情況</strong> → <strong>含混</strong>。<strong>大多數字詞多少總有點含混</strong>；字詞可能<strong>同時</strong>出現兩種毛病，例：墮胎道德爭論中嘅「<strong>生存的權利</strong>」「<strong>選擇的權利</strong>」可能<strong>同時歧義和含混</strong>。</li>\n<li><strong>腦死亡例子</strong> ⭐：只有被判定已死去嘅人先可以捐出器官。腦死咗人便死去，但「<strong>腦死亡</strong>」一詞長久以嚟<strong>用得不精確</strong>——人腦分<strong>大腦和小腦</strong>；大腦永久受損<strong>唔表示</strong>小腦或腦垂體唔能繼續正常操作 → 「死亡」急需精確定義。<strong>1983 年美國總統委任嘅醫學道德委員會</strong>報告書定義：任何人遇到以下任何一種情況即死亡：(1) <strong>循環系統和呼吸系統的功能永久停頓</strong>；(2) <strong>整個腦部（包括腦垂體）所有功能永久停頓</strong>。其後<strong>美國大多數州</strong>接納咗呢個定義。法律上精確定義「死亡」+ 測定大腦功能永久停頓嘅技術，對<strong>外科醫生的法律及刑事責任</strong>十分重要。</li>\n<li>清除「腦死亡」嘅含混，<strong>光訴諸日常語言用法係不可能</strong>（日常用法本身就唔夠清楚，否則就唔會含混）。</li>\n<li>⭐ 精確化定義<strong>有別於規創和詞典性定義</strong>：同規創定義唔同，佢嘅被界定端<strong>並非新出，而係早已有之</strong>（儘管含混）→ <strong>唔能隨意加意義，須盡可能忠於既有用法</strong>，旨在<strong>把已知的字詞弄得精確</strong>；同時為減少含混，<strong>一定要超越既有用法</strong>（如何超越涉及規創問題，但又不全是）。</li>\n<li><strong>法律</strong>：法官利用精確化定義釐清法例用語，但<strong>唔會任意</strong>作出定義——通常會<strong>提出論證</strong>支持，一方面照顧<strong>立法者本來動機</strong>，另一方面照顧<strong>受法律管轄大眾對用語的了解</strong> → 佢哋<strong>唔以為</strong>精確化定義僅僅係規創定義。立法機關一般喺法例前寫一個叫「<strong>定義</strong>」嘅章節，盡量貼近詞典意義；日常用語不明確就用規創方法精確化，以免日後起爭論。冇精確化定義，「<strong>甚麼才算是公平地執行法律？</strong>」會引起永無休止紛爭；上訴法院有時判某法例無效，原因只係<strong>法例用語過於含混</strong>，受管制嘅人難以決定佢適用到邊度，無法遵守。</li>\n</ul>\n<h4 id=\"m31-h18\">④ 理論性定義 (Theoretical definition)</h4>\n<ul>\n<li><strong>因定義而起的爭論，以理論性定義所惹起的佔最多。</strong></li>\n<li>⭐ **就可以用得上某個詞來稱呼的事物，作出既在理論上充分的，又要在科學方面實用的描述，就是替該字詞下了一個理論性定義。**提出理論性定義 = <strong>提議人家接受一套理論</strong>；而理論最惹爭議。</li>\n<li>例：物理學家<strong>曾經</strong>界定「<strong>熱</strong>」為<strong>難以捉摸又不可稱量的流體</strong>，<strong>現在</strong>則界定為<strong>物體因分子不規則運動而具有的能量</strong> → 不同時期接受唔同理論。</li>\n<li>哲學：<strong>蘇格拉底</strong>（據柏拉圖著作所載）不斷追尋定義——唔係要搵大家點用「<strong>公正</strong>」「<strong>勇敢</strong>」等字（詞典性），亦唔係規創定義，甚至<strong>唔係精確化定義</strong>；佢要搵一套理論，說出「<strong>知識</strong>」「<strong>節制</strong>」「<strong>愛</strong>」等重要語詞嘅<strong>詳盡定義</strong> → <strong>理論性定義</strong>。哲學家同科學家一樣要建構理論性定義，認為可有效紓解因物理、政治、道德事實而起嘅爭論和誤解。</li>\n</ul>\n<h4 id=\"m31-h19\">⑤ 說服性定義 (Persuasive definition)</h4>\n<ul>\n<li><strong>為了說服別人，炮製個定義，或用上一個定義來左右他的態度，刺激他的情緒，從而把爭論消解</strong> → 說服性定義。</li>\n<li>語言可起<strong>表意</strong>和<strong>表情</strong>兩種功能；前四種定義都同<strong>表意用法</strong>有關；說服性定義係刻意<strong>影響別人感受、間接改變佢哋行為</strong>。</li>\n<li><strong>夏威夷州立法院</strong>墮胎聽訊會：工作人員起草「<strong>就墮胎問題對選民答話</strong>」：「如果『墮胎』是指謀殺毫無自衛能力的人、剝奪最年幼公民的權利……我<strong>永遠堅決反對墮胎</strong>。但是，如『墮胎』指的是給予公民平等的權利……取消殘害無助婦女的壞制度……我<strong>永遠都替你們爭取這些基本的權利</strong>。……我一定堅持自己的立場。」（兩邊都討好 = 說服性定義玩弄）</li>\n<li><strong>政治論證</strong>：<strong>左派</strong>界定「<strong>社會主義</strong>」為「<strong>伸延至經濟領域的民主</strong>」；<strong>右派</strong>界定「<strong>資本主義</strong>」為「<strong>經濟領域的自由</strong>」→ 含正面情緒字眼（「民主」「自由」）。</li>\n<li>手法可以更隱晦：具情感意義嘅文字<strong>偷偷摸摸滲入定義用語</strong>，表面很中肯 → 要保持警覺，免受說服性定義愚弄。</li>\n</ul>\n<h3 id=\"m31-h20\">B3. 第三節：指涉（或外範）和意涵（或內涵）⭐⭐⭐</h3>\n<ul>\n<li>「意義」一詞有不同意思；之前已區別<strong>描述性（字面）意義</strong>同<strong>表情的意義</strong>；而家深入字面意義，尤其<strong>通名（類詞 class term）</strong>——可應用於<strong>多於一件事物</strong>——嘅字面意義。推理時通名定義尤其重要。</li>\n<li><strong>外範／指涉</strong>：「<strong>行星</strong>」可用於水星、金星、地球、火星、木星等；各行星嘅集合 = 呢個語詞嘅意義。<ul>\n<li>⭐ <strong>通名（或類詞）指涉的是它可以正確地應用於其上的那些事物。這個事物的集合構成了該語詞的外範 (extension)，即指涉 (denotation)。</strong></li>\n</ul>\n</li>\n<li>要明白通名嘅意義<strong>唔一定需要知道佢所能正確用於其上嘅所有事物</strong>；外範之內所有事物都有共通屬性 → 可能<strong>知道某語詞的意義，但卻不知道它的外範</strong>。第二種意義假定咗一個<strong>取捨的準則</strong>：決定某事物是否落入語詞外範之內 → <strong>內涵的（意涵的）意義</strong>。<ul>\n<li>⭐ <strong>某語詞的外範內的所有事物（也只有這些事物）所共有的全部屬性就稱為該語詞的內涵 (intension)，也就是意涵 (connotation)。</strong></li>\n</ul>\n</li>\n<li>例：「<strong>摩天大廈</strong>」：內涵 = 所有超過一定高度嘅建築物所特有嘅共通屬性；外範 = <strong>帝國大廈、中銀大廈</strong>等。</li>\n<li>（內涵固定則外範固定；外範受內涵決定、反之不然；等邊/等角三角形；反向增減定律修訂 → 見 A5）</li>\n<li>外範<strong>可以是空的</strong>；分辨內涵外範 + 知道外範可以空 → 可以揭穿<strong>一詞多義的謬誤</strong>：<ul>\n<li>「『<strong>上帝</strong>』一詞不是全無意義的，因此必有一個意義。但按定義『上帝』一詞意指一個至為完善和全能的存在。因此，這個至為完善和全能的存在，即上帝，必定是存在的。」</li>\n<li>一詞多義嘅地方在於「<strong>意義</strong>」同「<strong>全無意義</strong>」：「上帝」唔係全無意義 → 有<strong>內涵</strong>（意涵）；但<strong>唔能單單由某字詞有意涵便跟著說它有所指涉</strong>。</li>\n</ul>\n</li>\n<li>內涵和外範嘅區別<strong>好古老</strong>，但<strong>仍然好有用、好重要</strong>。</li>\n</ul>\n<h3 id=\"m31-h21\">B4. 第四節：外範和指涉性定義 (Denotative / Extensional definitions) ⭐⭐</h3>\n<ul>\n<li><strong>指涉性定義</strong>：把所要界定嘅通名嘅<strong>外範指認出來</strong>——最方便係<strong>舉出通名所指涉的東西作為例子</strong>；廣為人用、往往奏效，但有局限：<ol>\n<li>不同內涵嘅兩個語詞可以有<strong>完全相同外範</strong>（等邊/等角三角形）→ 即使<strong>完全列舉</strong>出外範，指涉性定義<strong>都冇法將佢同另一個指涉相同東西嘅通名區分</strong>。</li>\n<li>絕少語詞能<strong>完全舉出外範</strong>：「<strong>數目</strong>」指涉無限多；「<strong>星體</strong>」雖有限但天文數字 → 實際上不可行。</li>\n<li>指涉性定義一般係<strong>局部列舉</strong> → 嚴重問題：任何東西（例如<strong>陳大文</strong>）有很多屬性，包涵喺很多不同通名外範內（「人」「動物」「哺乳動物」「丈夫」「父親」「學生」）→ 舉例<strong>無助區分</strong>字詞意義；即使舉三四個都一樣：「<strong>摩天大廈</strong>」舉<strong>帝國大廈、佳士拿大廈、沃士華茲大廈</strong>，都可以係「20 世紀的偉大建築物」「曼哈頓的昂貴物業」「紐約市著名建築物」嘅例子。舉「<strong>反面的例子</strong>」（「不是泰姬陵」「不是美國國防部大樓」）或有幫助，但都<strong>唔完全</strong>。</li>\n</ol>\n</li>\n<li><strong>以子類 (subclass) 界定</strong>：有時可以做到<strong>完全列舉</strong>：「<strong>脊椎動物</strong>」= 兩棲動物 + 鳥 + 魚 + 哺乳類 + 爬蟲。</li>\n<li>⭐ 以列舉方式界定——<strong>不論完全抑或部分、不論舉個例定子類</strong>——<strong>雖在心理上有用處，但在邏輯上卻未足以徹底說明所要界定的語詞的意義</strong>。</li>\n<li><strong>實指的定義 (ostensive definition)</strong>：唔列舉、唔描述，而係<strong>用手指著或用其他姿勢指著例子</strong>：「『書桌』一詞指這個」+ 手勢。<ul>\n<li>局限：① 地緣：只能指出<strong>睇得見</strong>嘅事物（喺鄉村唔能實指「摩天大廈」，大草原唔能實指「山」）；② ⭐ <strong>姿勢本身難免含糊不清</strong>：指書桌同時亦指住書桌嘅部分、顏色、大小、形狀、材料，甚至背後嘅牆壁同更遠嘅後院。</li>\n<li>加描述短語 → <strong>半實指定義</strong>：「『書桌』一詞指這種家具（+手勢）」——但失去實指定義原意。</li>\n<li>實指定義素稱「<strong>基本的</strong>」或「<strong>原始的</strong>」定義（以為我哋起初藉此學字義）——⚠️ <strong>呢種講法係錯嘅</strong>：因為<strong>姿勢嘅意義本身都要先學</strong>（指向嬰兒床緣，嬰兒可能注意手指而唔係所指東西）。⭐ <strong>學習使用語言的根本之道在於觀察和模仿，而不是去下定義。</strong></li>\n</ul>\n</li>\n<li><strong>有啲字詞絕對有意義，卻不指涉甚麼</strong> → 唔能用指涉性定義：「<strong>獨角獸</strong>」冇指涉，<strong>外範是空的</strong>。表明「意義」其實<strong>關於內涵多過關於外範</strong>：如果「獨角獸」冇意義，「世間沒有獨角獸」都冇意義——但呢句<strong>唔單止有意義，仲係真的</strong>。⭐ <strong>顯見得內涵才是定義的真正關鍵所在。</strong></li>\n</ul>\n<h3 id=\"m31-h22\">B5. 第五節：內涵和意涵性定義 (Intensional / Connotative definitions) ⭐⭐</h3>\n<ul>\n<li>語詞嘅內涵由語詞所指涉嘅所有東西所共有（也只有它們才能共有）嘅屬性構成；例：「<strong>椅子</strong>」= 單個嘅座位 + 有椅背。</li>\n<li>「意涵」一詞易混淆：有時指字詞<strong>總意思</strong>（情感 + 描述意義），有時單指<strong>情感意義</strong>（「一個冷漠苛刻的人<strong>不是人</strong>」——「人」傳送態度而非生物分類）。邏輯用「意涵」嘅<strong>狹義</strong>：意涵同內涵<strong>只係字詞表意意義嘅一部分</strong>。</li>\n<li><strong>意涵嘅三種意思</strong> ⭐⭐：<table>\n<thead>\n<tr>\n<th>種類</th>\n<th>內容</th>\n<th>能否用嚟下定義？</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>主觀的意涵</strong></td>\n<td>說話者<strong>認為</strong>字詞所指涉東西所具有嘅全部屬性嘅集合</td>\n<td>✗ <strong>因人而異，甚至同一人亦因時而異</strong>；我哋着眼<strong>公共意義</strong>，唔係私人詮譯</td>\n</tr>\n<tr>\n<td><strong>客觀的意涵</strong></td>\n<td>字詞外範內所有東西<strong>所共有</strong>嘅屬性集合，例：「<strong>圓形</strong>」包括「比其他具相同周界長度的平面圖形所包括的面積為大」——好多用呢個字嘅人都<strong>完全唔知</strong></td>\n<td>✗ 要<strong>無所不知</strong>先知道全部屬性 → 唔係公共意義</td>\n</tr>\n<tr>\n<td><strong>約定俗成的意涵</strong></td>\n<td>我哋<strong>同意使用同一個準則</strong>去決定某東西是否屬某字詞外範：「圓形」= <strong>封閉的平面曲線，曲線上任何一點都跟圓心成等距</strong></td>\n<td>✔ <strong>公共的 + 唔使無所不知</strong> → 對定義目的最重要</td>\n</tr>\n</tbody></table>\n<ul>\n<li>一般而言，「<strong>意涵</strong>」按「約定俗成的意涵」意思用；「<strong>內涵</strong>」據「約定俗成的內涵」用。</li>\n</ul>\n</li>\n<li><strong>辨認約定俗成內涵嘅方法</strong>：<ul>\n<li><strong>同義的定義 (synonymous definition)</strong>：說出另一個意義早已為人所知、並且相同嘅字詞（<strong>同義詞</strong>）。袖珍詞典極依賴：「<strong>諺語</strong>」=「<strong>格言</strong>」、「<strong>忸怩</strong>」=「<strong>害羞</strong>」；外語特別有用：法語 &quot;<strong>chat</strong>&quot; = 貓；西班牙語 &quot;<strong>amigo</strong>&quot; = 朋友。<ul>\n<li>容易、有效、有用，但<strong>局限很大</strong>：好多字冇準確同義詞 → 意大利格言 &quot;<em><strong>Traduttore, traditore</strong></em>&quot; ——「<strong>譯者就是叛逆者</strong>」。更嚴重局限：如果被界定字詞所表達嘅<strong>概念唔為人所明白</strong>，任何同義詞都同樣費解 → 下<strong>精確化或理論性定義</strong>時，同義定義<strong>全無用武之地</strong>。</li>\n</ul>\n</li>\n<li><strong>運作定義 (operational definition)</strong> ⭐：曾獲<strong>諾貝爾獎</strong>嘅物理學家<strong>貝茲爾曼 (P. W. Bridgeman)</strong>《<strong>現代物理學的邏輯</strong>》(<em>The Logic of Modern Physics</em>) 首先採用——把被界定端跟可被描述嘅<strong>一組動作或操作</strong>關聯。<strong>愛因斯坦相對論</strong>被接受後，再唔能好似<strong>牛頓</strong>咁抽象地界定「<strong>空間</strong>」「<strong>時間</strong>」→ 用運作方式界定。<ul>\n<li>⭐ <strong>根據一個字詞的運作定義，如果，並且僅當如果，在所討論的情況裡特定的運作能得出特定的結果，則該字詞被正確無誤地用於該情況之上。<strong>例：參照</strong>量度結果</strong>界定<strong>長度</strong>數值。運作定義只有<strong>公開的和可重複的運作</strong>先派得上用場。</li>\n<li>社會科學：心理學家想單參照行為或生理觀察下運作定義，取代「<strong>知覺</strong>」「<strong>心靈</strong>」嘅描述定義；依賴到<strong>靠攏行為主義 (behaviorism)</strong> 嘅地步。極端經驗主義者堅持<strong>只有容得下運作定義的術語才有意義</strong>（評價此主張超出本書範圍）。</li>\n</ul>\n</li>\n<li><strong>種差定義 (definition per genus et differentiam)</strong> ⭐⭐⭐：又稱「<strong>分割的定義</strong>」「<strong>分析性定義</strong>」「<strong>意涵性定義</strong>」。⚠️ 若話<strong>呢種係唯一「真正的」定義就錯</strong>；但佢<strong>比其他更廣為人用</strong>。<ul>\n<li>能按種屬界定，在於有啲屬性係<strong>複雜的</strong>（可分析為兩個或更多屬性）。</li>\n<li><strong>類 (class)</strong> 嘅分子可分為<strong>子類 (subclasses)</strong>：三角形類 → 等邊、等腰、不等邊三角形。<strong>屬 (genus)</strong> = 被劃分嘅類；<strong>種 (species)</strong> = 子類。⭐ 兩個術語係<strong>相對地使用</strong>（好比父母和子女）：三角形類對不等邊三角形係<strong>屬</strong>，對多邊形係<strong>種</strong>。⚠️ <strong>邏輯學家</strong>作<strong>相對性術語</strong>用；<strong>生物學家</strong>視之為<strong>絕對性術語</strong> → 不容混淆。</li>\n<li>多邊形屬所有分子共有：由直線包圍而成嘅封閉平面圖形；可分割為三角形、四角形、五角形、六角形等種；<strong>六角形只有佢先有六條邊</strong> → 呢個區分性質叫「<strong>種差 (specific difference)</strong>」。</li>\n<li>「<strong>六角形</strong>」一詞意指<strong>具有六條邊的多邊形</strong>。</li>\n<li>「<strong>人</strong>」古時界定為「<strong>理性的動物</strong>」：<strong>屬 = 動物</strong>，<strong>種差 = 理性</strong>。⚠️ 都可以把「理性的」視為屬、「動物」作種差——<strong>按邏輯角度，處理次序不是絕對的</strong>（可能有邏輯以外嘅理由選某方為屬）。</li>\n<li>⭐ <strong>按種差定義法下定義的步驟有二：首先指出一個屬——那個為被界定端所指涉的種就是它的子類；然後一定要指出那個種差——即是我們據之以把這個種的分子跟該屬的所有其他種的分子區分開來的那個屬性。</strong></li>\n<li><strong>局限兩種</strong>：① 只適用於<strong>意涵複雜屬性</strong>嘅字詞；如果有<strong>簡單、不可分析</strong>嘅屬性（有人認為<strong>視覺上的顏色</strong>就係）就唔能用；② 意涵<strong>普遍屬性</strong>嘅字詞：「<strong>存有 (being)</strong>」「<strong>實體 (entity)</strong>」「<strong>存有物 (existent)</strong>」「<strong>客體 (object)</strong>」——包括所有實體嘅類<strong>唔係某個更大屬之下嘅種</strong>；普遍性嘅類構成最高的類，即「<strong>至高類 (summum genus)</strong>」，如「物質」「屬性」。但呢啲局限<strong>實用方面影響不大</strong>。</li>\n</ul>\n</li>\n</ul>\n</li>\n<li>意涵性定義（尤其種差定義）可滿足定義嘅要求：<strong>消弭歧義、減少含混、理論性地解釋、甚至影響他人態度</strong>、增加詞彙 → 五種定義（詞典性、規創、精確化、理論性、說服性）都用得著意涵性定義嘅方法。</li>\n</ul>\n<h3 id=\"m31-h23\">B6. 第六節：種差定義法的法則（Copi 版：5 條）⭐⭐⭐</h3>\n<blockquote>\n<p>呢啲法則<strong>唔係仙方</strong>，有咗仍要費盡心思；但用嚟<strong>評價定義</strong>好有用。法則共五條，<strong>主要都是為詞典性定義而設</strong>。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>法則</th>\n<th>重點／例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>第一法則</strong></td>\n<td><strong>定義應說明有關的種的本質的屬性</strong></td>\n<td>最好講成：「<strong>定義應說出所要界定的語詞的約定俗成的意涵。</strong>」例：「圓形」用客觀意涵（面積最大）界定<strong>違反</strong>第一法則；用約定俗成意涵（封閉平面曲線、各點與圓心等距）= 說出「<strong>本質</strong>」。⚠️ 約定俗成意涵<strong>唔一定係內在特性</strong>，可能同<strong>起源</strong>、<strong>關係</strong>或<strong>用途</strong>有關：「<strong>史特拉迪瓦里斯 (Stradivarius)</strong>」= <strong>安東尼奧・史特拉迪瓦里</strong>喺<strong>克里蒙那 (Cremona)</strong> 工場出產嘅小提琴（起源）；「<strong>州長</strong>」= 同其他國民有某種關係（生理心理冇分別）；「<strong>鞋</strong>」要提及<strong>用途</strong>：從外包裹著雙足嘅東西</td>\n</tr>\n<tr>\n<td><strong>第二法則</strong></td>\n<td><strong>定義不可循環</strong></td>\n<td>被界定端出現喺界定端 → 只能向<strong>早已明白</strong>嘅人解釋。例：《不能自已的賭徒》：「<strong>不能自我節制的賭徒就是不能自我節制賭博的人。</strong>」亦防止喺界定端用<strong>同義詞</strong>（若有為人明白嘅同義詞，用同義定義就得）；一般亦可<strong>防止用反義詞</strong></td>\n</tr>\n<tr>\n<td><strong>第三法則</strong></td>\n<td><strong>定義既不可過寬，也不可過窄</strong></td>\n<td>界定端<strong>唔應比被界定端指涉更多（過寬）或更少（過窄）</strong>。⭐ <strong>柏拉圖</strong>雅典學院後繼者同意「<strong>人是無（長）毛兩足的動物</strong>」；<strong>迪奧吉尼斯 (Diogenes)</strong> 捉隻雞<strong>拔光毛</strong>扔入學院 → 過寬；據說補上「<strong>具有寬平指甲的</strong>」。「<strong>鞋</strong>」= 從外包裹雙足的<strong>皮製</strong>東西 → <strong>過窄</strong>（鞋可以用木同帆布）。⚠️ <strong>下規創定義時不可能違反第三法則</strong>（被界定端除咗界定端所賦意義外冇其他意義）；<strong>緊守第一法則就同時兼守第三法則</strong></td>\n</tr>\n<tr>\n<td><strong>第四法則</strong></td>\n<td><strong>不可用歧義的、晦澀的和比喻的用語</strong></td>\n<td><strong>歧義</strong>：妨礙解釋功能。<strong>晦澀</strong>係<strong>相對</strong>而言：「<strong>負阻管振蕩器 (dynatron oscillator)</strong>」= 用負電阻、伏特—安培曲線產生交流電嘅電路——對一般人晦澀，對電機工程學生清楚（為佢哋而寫，有理由用行內話）；非專技事情用晦澀用語 = <strong>用更不為人知的東西解釋不為人知的東西</strong>。<strong>史賓塞 (Herbert Spencer)</strong>「<strong>進化</strong>」定義（物質和伴隨的運動的消耗二者的整合過程……不明確的、不一致的同質性轉而成為明確的、一致的異質性……）= 晦澀自折台腳。<strong>比喻</strong>：「麵包就是<strong>生命的食糧</strong>」；「<strong>結婚戒指</strong>」=「夫妻用來停止血液循環的止血環」；「<strong>謹慎</strong>」=「那種來得太遲，得到了也難再有甚麼作為的東西」；說服性定義亦套用：「<strong>偏見</strong>」=「把看不通的看不入眼」→ 有趣有說服力，但<strong>唔能認真解釋確實意義</strong></td>\n</tr>\n<tr>\n<td><strong>第五法則</strong></td>\n<td><strong>可以用肯定語氣下的定義不要用否定語氣來寫</strong></td>\n<td>定義應解釋字詞<strong>係乜</strong>，唔係<strong>唔係乜</strong>。「<strong>長沙發</strong>」=「既不是床也不是椅子的家具」→ 解釋唔到。⚠️ <strong>有啲字本來就係否定角度</strong>，需要否定定義：「<strong>孤兒</strong>」= 無父無母的小孩；「<strong>禿頭</strong>」= 頭上沒有頭髮。有時揀肯定定否定<strong>冇準則</strong>：「<strong>酒徒</strong>」= 酗酒的人 / 飲酒沒節制的人。即使用否定定義，都要<strong>先肯定地說出屬</strong>，再排除其他種。「<strong>不等邊三角形</strong>」= 既非等邊也非等腰嘅三角形（可以，但最好肯定地講：<strong>具有不等的邊</strong>）；唔能把「<strong>四邊形</strong>」界定為不是三角形、不是五角形……嘅多邊形（排除不盡）。⭐ <strong>肯定的定義比否定的定義更可取</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li>⭐ <strong>大體而言，意涵性定義比指涉性定義更為有用。就推理和語言的其他表意的用法而言，意涵性定義一般以種差定義法最有效及最有用。</strong></li>\n</ul>\n<hr>\n<h2 id=\"m31-h24\">考試速攻 ⚠️⭐</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>講法</th>\n<th>答案</th>\n<th>理由</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>定義係分析哲學唯一嘅釐清方法</td>\n<td><strong>F</strong></td>\n<td>常用但<strong>唔係唯一</strong></td>\n</tr>\n<tr>\n<td>定義最常用於釐清可作句子主詞嘅語辭（專有名詞、普通名詞）</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「冷」「熱」等含混字眼難以作準確定義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「人是理性的動物」中「理性的動物」係 definiendum</td>\n<td><strong>F</strong></td>\n<td>係 <strong>definiens（界定端）</strong></td>\n</tr>\n<tr>\n<td>界定端可以超過一組語辭</td>\n<td><strong>T</strong></td>\n<td>slides 原文</td>\n</tr>\n<tr>\n<td>界定端就是被界定端的意義</td>\n<td><strong>F</strong></td>\n<td>界定端係另一符號，<strong>有相同意思</strong></td>\n</tr>\n<tr>\n<td>「偶數」嘅外延係「可被 2 整除的自然數」</td>\n<td><strong>F</strong></td>\n<td>呢個係<strong>內涵</strong>；外延係 2,4,6,8…</td>\n</tr>\n<tr>\n<td>「七大洲」列出全部七個 = 完整外延</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>外延決定內涵</td>\n<td><strong>F</strong></td>\n<td><strong>內涵決定外延</strong>，反之不然</td>\n</tr>\n<tr>\n<td>內涵不同嘅兩個詞可以有相同外延</td>\n<td><strong>T</strong></td>\n<td>等邊/等角三角形；Forbes 全球首富/美國首富</td>\n</tr>\n<tr>\n<td>外延不同嘅兩個詞可以有相同內涵</td>\n<td><strong>F</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>按內涵遞增排列，外延必定遞減</td>\n<td><strong>F</strong></td>\n<td>係「<strong>不遞增</strong>」（可保持不變）</td>\n</tr>\n<tr>\n<td>反向增減定律完全正確</td>\n<td><strong>F</strong></td>\n<td>「有點意思但不全對」，要修訂</td>\n</tr>\n<tr>\n<td>「人」嘅外延隨人死去同出生不斷變更〔唔考〕</td>\n<td><strong>F</strong></td>\n<td>「人」包括死人同未出生嘅；變嘅係「<strong>活人</strong>」</td>\n</tr>\n<tr>\n<td>內涵固定則外延固定〔唔考〕</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>規創定義有真假可言</td>\n<td><strong>F</strong></td>\n<td><strong>冇真假，只有接受與否</strong></td>\n</tr>\n<tr>\n<td>規創定義可能隨時間轉為字詞定義（如王老五、Generation Z）</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>釐定的定義冇真假可言，但可判斷是否恰當</td>\n<td><strong>T</strong></td>\n<td>貧窮線、超速、法定年齡</td>\n</tr>\n<tr>\n<td>字詞（詞典性）定義有真假可言</td>\n<td><strong>T</strong></td>\n<td>忠於實際用法與否</td>\n</tr>\n<tr>\n<td>字詞定義會增加被界定端嘅意義</td>\n<td><strong>F</strong></td>\n<td><strong>冇增加</strong>，只描述既有意義</td>\n</tr>\n<tr>\n<td>「鳥是有翅膀的動物」太窄</td>\n<td><strong>F</strong></td>\n<td><strong>太闊</strong></td>\n</tr>\n<tr>\n<td>「鳥是有羽毛會飛的動物」太窄</td>\n<td><strong>T</strong></td>\n<td>企鵝、鴕鳥</td>\n</tr>\n<tr>\n<td>「心理學是研究心理相關的學科」犯循環</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>所有爭論都可以透過定義解決</td>\n<td><strong>F</strong></td>\n<td>色情電影低俗定藝術、人生苦樂</td>\n</tr>\n<tr>\n<td>一個概念冇外延就冇意義</td>\n<td><strong>F</strong></td>\n<td>獨角獸</td>\n</tr>\n<tr>\n<td>占姆士松鼠爭論係真正嘅分歧</td>\n<td><strong>F</strong></td>\n<td><strong>言詞之爭</strong></td>\n</tr>\n<tr>\n<td>阿根廷贏世界杯「太好了／豈有此理」係態度分歧</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>杭州定上海較近黃山嘅爭論，找地圖就解決</td>\n<td><strong>T</strong></td>\n<td>事實分歧</td>\n</tr>\n<tr>\n<td>性愛鏡頭電影係咪「色情電影」嘅爭論係純粹言詞之爭</td>\n<td><strong>F</strong></td>\n<td>表面言詞之爭、實際<strong>真正（態度）分歧</strong></td>\n</tr>\n<tr>\n<td>可以為椅子（實物）下定義</td>\n<td><strong>F</strong></td>\n<td>定義總是就<strong>符號</strong>而作</td>\n</tr>\n<tr>\n<td>規創定義又稱唯名的 (nominal) 或言詞的 (verbal) 定義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「g 因子」係為避免「智慧」嘅感情意涵</td>\n<td><strong>T</strong></td>\n<td>Spearman</td>\n</tr>\n<tr>\n<td>「googol」= 1 後面 100 個零，係規創定義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>規創定義清楚與否、有利有害係主觀嘅</td>\n<td><strong>F</strong></td>\n<td>係<strong>客觀的事實</strong></td>\n</tr>\n<tr>\n<td>「獨角獸」嘅定義因為冇指涉存在物，所以唔係詞典性定義</td>\n<td><strong>F</strong></td>\n<td>定義同被界定端是否存在<strong>無關</strong>；係詞典性定義</td>\n</tr>\n<tr>\n<td>字詞慣用法屬於統計方面嘅事</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>精確化定義助減少歧義</td>\n<td><strong>F</strong></td>\n<td>減少<strong>含混</strong>；規創+詞典性先係消除<strong>歧義</strong></td>\n</tr>\n<tr>\n<td>精確化定義可以隨意給被界定端加意義</td>\n<td><strong>F</strong></td>\n<td>須盡可能<strong>忠於既有用法</strong>，但又要<strong>超越</strong></td>\n</tr>\n<tr>\n<td>1983 年美國醫學道德委員會「死亡」定義係精確化定義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>理論性定義引起嘅爭論最多</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「熱」由「不可稱量流體」變為「分子不規則運動能量」係理論性定義改變</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>蘇格拉底追尋嘅係詞典性定義</td>\n<td><strong>F</strong></td>\n<td>係<strong>理論性定義</strong></td>\n</tr>\n<tr>\n<td>「社會主義是伸延至經濟領域的民主」係說服性定義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>說服性定義同語言嘅表意功能有關</td>\n<td><strong>F</strong></td>\n<td>同<strong>表情</strong>功能有關</td>\n</tr>\n<tr>\n<td>通名嘅外範 = 指涉 (denotation)</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>內涵 = 意涵 (connotation)</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>知道一個詞嘅意義就一定知道佢嘅外範</td>\n<td><strong>F</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>由「上帝」一詞有意義推出上帝存在，犯咗一詞多義謬誤</td>\n<td><strong>T</strong></td>\n<td>有意涵 ≠ 有指涉</td>\n</tr>\n<tr>\n<td>指涉性定義（列舉例子）邏輯上足以徹底說明詞義</td>\n<td><strong>F</strong></td>\n<td><strong>心理上有用，邏輯上不足</strong></td>\n</tr>\n<tr>\n<td>實指定義係學習語言嘅最基本途徑</td>\n<td><strong>F</strong></td>\n<td>姿勢意義都要先學；根本之道係<strong>觀察和模仿</strong></td>\n</tr>\n<tr>\n<td>內涵先係定義嘅真正關鍵</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>主觀的意涵可以用嚟下定義</td>\n<td><strong>F</strong></td>\n<td>因人因時而異</td>\n</tr>\n<tr>\n<td>定義應講約定俗成嘅意涵</td>\n<td><strong>T</strong></td>\n<td>第一法則</td>\n</tr>\n<tr>\n<td>運作定義由 P. W. Bridgeman 首先採用</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>種差定義係唯一真正嘅定義</td>\n<td><strong>F</strong></td>\n<td>但<strong>最廣為人用</strong></td>\n</tr>\n<tr>\n<td>屬同種係絕對術語（邏輯學中）</td>\n<td><strong>F</strong></td>\n<td>邏輯學：<strong>相對</strong>；生物學：絕對</td>\n</tr>\n<tr>\n<td>「人是理性的動物」：屬 = 動物，種差 = 理性</td>\n<td><strong>T</strong></td>\n<td>（次序非絕對）</td>\n</tr>\n<tr>\n<td>「存有」「實體」可以用種差定義</td>\n<td><strong>F</strong></td>\n<td>至高類 (summum genus)</td>\n</tr>\n<tr>\n<td>「人是無毛兩足的動物」過寬（迪奧吉尼斯拔毛雞）</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「鞋是從外包裹雙足的皮製東西」過寬</td>\n<td><strong>F</strong></td>\n<td><strong>過窄</strong></td>\n</tr>\n<tr>\n<td>下規創定義時都可能違反第三法則</td>\n<td><strong>F</strong></td>\n<td><strong>不可能</strong>違反</td>\n</tr>\n<tr>\n<td>「孤兒是無父無母的小孩」違反第五法則</td>\n<td><strong>F</strong></td>\n<td>本身係否定角度，需要否定定義</td>\n</tr>\n<tr>\n<td>「長沙發是既不是床也不是椅子的家具」違反第五法則</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>史賓塞「進化」定義違反第四法則（晦澀）</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>意涵性定義一般比指涉性定義更有用</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n</tbody></table>\n","m32":"<h1 id=\"m32-h1\">M3-2 意義判準 (Meaning Criterion)</h1>\n<blockquote>\n<p>來源：Module 3 Lecture notes「3b. Meaning Criterion」（講者 slides，14 頁）\n深入版本見 M3-3（李天命〈兩個基本的方法學區分〉reading 3.2）\n⭐ = 極高機會考；⚠️ = 陷阱</p>\n</blockquote>\n<hr>\n<h2 id=\"m32-h2\">0. 一頁總覽 ⭐⭐⭐</h2>\n<pre><code>語句 (sentence)\n ├─ 有真值 (truth-value) → 述句 (statement) → 有認知意義 (cognitive meaning)\n │    ├─ 分析述句 (analytic)：單從語句分析判定真假\n │    │     ├─ 恆真句 tautology（必真）\n │    │     ├─ 矛盾句 contradiction（必假）\n │    │     └─ 透過語義界定判定（王老五是未婚漢 ✔；神奇女俠是男性 ✘）\n │    └─ 綜合述句 (synthetic)：要經驗事實判定真假\n │          ├─ 綜合真句 (synthetic truth)：地球上有生命；HUMA 1710 is a H-CC\n │          └─ 綜合假句 (synthetic falsity)：地球是平的；HUMA 1710 is a A-CC\n │          └─ 用 4 個驗證原則判斷綜合語句有冇認知意義\n └─ 冇真值 → 冇認知意義（但可以有「非知意義」）\n</code></pre>\n<p><strong>四個驗證原則（只用於綜合語句）</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>「<strong>證明</strong>」（嚴）</th>\n<th>「<strong>支持</strong>」（寬）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>為真</strong></td>\n<td><strong>檢證原則 Verification</strong>（原則上可能由經驗方法<strong>證明為真</strong>）</td>\n<td><strong>印證原則 Confirmation</strong>（原則上可能被經驗證據<strong>支持為真</strong>）→ 處理<strong>非封閉集合的全稱語句</strong></td>\n</tr>\n<tr>\n<td><strong>為假</strong></td>\n<td><strong>否證原則 Falsification</strong>（原則上可能由經驗方法<strong>證明為假</strong>）→ 處理<strong>非封閉集合的全稱語句</strong>；<strong>區分科學與偽科學</strong></td>\n<td><strong>非證原則 Disconfirmation</strong>（原則上可能被經驗證據<strong>支持為假</strong>）→ 處理<strong>特稱語句</strong>；常見於<strong>品質保證</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li>印證 = 檢證嘅<strong>較寬鬆形式</strong>；非證 = 否證嘅<strong>較寬鬆形式</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m32-h3\">1. 開場</h2>\n<ul>\n<li>《莊子・齊物論》：「<strong>故知止其所不知，至矣。</strong>」（知道停喺自己唔知嘅地方，就係最高嘅智慧 → 意義判準劃清可討論/不可討論嘅界線）</li>\n</ul>\n<h2 id=\"m32-h4\">2. 認知意義 Cognitive Meaning ⭐⭐⭐</h2>\n<ul>\n<li><strong>意義判準有助我們分辨那些語句 (sentence) 才是具有真值 (truth-value) 的述句 (statement)。</strong></li>\n<li><strong>真值包括真 (truth) 和假 (falsity) 兩個值。</strong></li>\n<li>例：<table>\n<thead>\n<tr>\n<th>語句</th>\n<th>有冇真值？</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>香港科技大學位處香港西貢區</td>\n<td>✔（真）</td>\n</tr>\n<tr>\n<td>史維是香港科技大學現任校長</td>\n<td>✔（有真假可言）</td>\n</tr>\n<tr>\n<td>史維是香港科技大學校長</td>\n<td>✔（有真假，但<strong>時間闕義</strong>：幾時？）</td>\n</tr>\n<tr>\n<td>史維是香港科技大學前任校長<strong>嗎？</strong></td>\n<td>✗ <strong>問句</strong>冇真值 → 唔係述句</td>\n</tr>\n</tbody></table>\n</li>\n<li>⭐ <strong>在意義判準之下，語句至少要談得上真假，它才有認知意義。</strong></li>\n<li>⚠️ 有認知意義 ≠ 真；<strong>假嘅語句都有認知意義</strong>（例「地球是平的」有認知意義，只係假）。</li>\n</ul>\n<h2 id=\"m32-h5\">3. 析合區分 Analytic and Synthetic Distinction ⭐⭐⭐</h2>\n<ul>\n<li><strong>如果不能透過語句分析或經驗方法檢測語句的真假，它就沒有認知意義。</strong></li>\n<li><strong>所有述句可歸類為：分析述句 (analytic statement)、綜合述句 (synthetic statement)。</strong></li>\n</ul>\n<h3 id=\"m32-h6\">3.1 分析述句 Analytic statement ⭐⭐</h3>\n<p><strong>單從語句分析就足以判定真假</strong>，包括：</p>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>例子</th>\n<th>真假</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>具有<strong>恆真句 (tautology)</strong> 形式的語句</td>\n<td><strong>外面有下雨或沒有下雨</strong>；<strong>他是年輕人則他不可能同是老人</strong></td>\n<td>必真</td>\n</tr>\n<tr>\n<td>具有<strong>矛盾句 (contradiction)</strong> 形式的語句</td>\n<td><strong>外面有下雨同時沒有下雨</strong>；<strong>他是年輕人同時也是老人</strong></td>\n<td>必假</td>\n</tr>\n<tr>\n<td><strong>透過語義界定</strong>便可判定語句真假</td>\n<td><strong>王老五是未婚漢</strong>（真）；<strong>神奇女俠是男性</strong>（假）</td>\n<td>由定義決定</td>\n</tr>\n</tbody></table>\n<p>⚠️ 分析述句<strong>可以係假</strong>（矛盾句、「神奇女俠是男性」）——分析 ≠ 必真！</p>\n<h3 id=\"m32-h7\">3.2 綜合述句 Synthetic statement ⭐⭐</h3>\n<p><strong>原則上不能單從語句分析，而需要以經驗事實去分辨真假</strong>，包括：</p>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>綜合真句 (synthetic truth)</strong></td>\n<td><strong>地球上有生命</strong>；<strong>HUMA 1710 is a H-CC</strong>（Humanities Common Core）</td>\n</tr>\n<tr>\n<td><strong>綜合假句 (synthetic falsity)</strong></td>\n<td><strong>地球是平的</strong>；<strong>HUMA 1710 is a A-CC</strong>（Arts Common Core）</td>\n</tr>\n</tbody></table>\n<h3 id=\"m32-h8\">3.3 析合區分的三個特質 ⭐⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>分析述句</strong></th>\n<th><strong>綜合述句</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>模態</td>\n<td><strong>必然 (necessary)</strong></td>\n<td><strong>適然 (contingent)</strong></td>\n</tr>\n<tr>\n<td>知識來源</td>\n<td><strong>先驗 (a priori)</strong>（唔使經驗）</td>\n<td><strong>後驗 (a posteriori)</strong>（要靠經驗）</td>\n</tr>\n<tr>\n<td>信息</td>\n<td><strong>沒有信息內容</strong>（唔講世界嘅事）</td>\n<td><strong>有信息內容</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li>呼應：言辭空廢 = 用「<strong>冇信息內容</strong>」嘅重言句（分析述句）<strong>冒充</strong>「<strong>有信息內容</strong>」嘅事實陳述（綜合述句）。</li>\n</ul>\n<hr>\n<h2 id=\"m32-h9\">4. 四個驗證原則 ⭐⭐⭐</h2>\n<blockquote>\n<p><strong>四個原則都是為了判斷「綜合語句」是否具有認知意義。</strong>（⚠️ 唔係用嚟判斷分析語句；亦唔係判斷語句<strong>真定假</strong>，而係判斷<strong>有冇認知意義</strong>）</p>\n</blockquote>\n<h3 id=\"m32-h10\">4.1 檢證原則 Verification Principle</h3>\n<ul>\n<li>一個綜合語句 S：<strong>如果 S 在原則上，有可能由經驗方法被證明為真</strong>，則 S 就有認知意義；<strong>如果 S 在原則上，沒有可能由經驗方法被證明為真</strong>，則 S 就沒有認知意義。</li>\n<li>例：<ul>\n<li>「<strong>有一隻天鵝是白色的。</strong>」（搵到一隻就證明為真）</li>\n<li>「<strong>有一個同學在 HUMA 1710 Mid-term 拿到滿分。</strong>」</li>\n<li>「<strong>Dr. Nam 2026 年 9 月 4 日上午在 2407 室上課。</strong>」</li>\n</ul>\n</li>\n<li>⚠️ 適合<strong>特稱語句</strong>（「有一個…」）同<strong>具體單稱語句</strong>。</li>\n</ul>\n<h3 id=\"m32-h11\">4.2 印證原則 Confirmation Principle</h3>\n<ul>\n<li>一個綜合語句 S：<strong>如果 S 在原則上，有可能被經驗證據支持為真</strong>，則 S 就有認知意義；<strong>否則</strong>冇。</li>\n<li>⭐ <strong>印證原則是檢證原則的一種較寬鬆的形式</strong>，以幫助判斷「<strong>非封閉集合的全稱語句</strong>」是否有認知意義：<ul>\n<li>「<strong>所有天鵝都是白色的。</strong>」</li>\n<li>「<strong>所有科大學生都是男生。</strong>」</li>\n<li>「<strong>所有人類女性都有一對相同的性染色體 (XX)。</strong>」</li>\n</ul>\n</li>\n<li>點解要放寬？「所有天鵝」係<strong>非封閉集合</strong>（過去、現在、未來所有天鵝，冇辦法逐一檢查）→ <strong>原則上冇可能「證明」為真</strong> → 用檢證原則會被判冇認知意義（太嚴）；但可以<strong>被證據支持</strong>（見到越多白天鵝越支持）→ 用印證原則就有認知意義。</li>\n</ul>\n<h3 id=\"m32-h12\">4.3 檢證／印證原則的應用 ⭐</h3>\n<ul>\n<li><strong>分辨語句／理論是否有認知意義</strong>；</li>\n<li>⭐ <strong>就分析哲學而言，一個語句若果談不上真假，則連假的都不如</strong>，例如：<ul>\n<li>將<strong>鬼神</strong>定義為<strong>超驗</strong>的學說；</li>\n<li>將<strong>玄學</strong>視為一種<strong>無形力量</strong>的學說；</li>\n<li>將<strong>靈魂、死後世界</strong>定義為<strong>經驗世界以外</strong>的研究。</li>\n<li>（= 李天命「連假語句的資格都沒有」：柏烈得萊「絕對」）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m32-h13\">4.4 否證原則 Falsification Principle</h3>\n<ul>\n<li>一個綜合語句 S：<strong>如果 S 在原則上，有可能由經驗方法被證明為假</strong>，則 S 就有認知意義；<strong>否則</strong>冇。</li>\n<li>跟印證原則一樣，能判斷「<strong>非封閉集合的全稱語句</strong>」是否有認知意義：<ul>\n<li>「所有天鵝都是白色的」→ 搵到<strong>一隻黑天鵝</strong>就證明為假 → 有認知意義。</li>\n<li>「所有科大學生都是男生」→ 一個女生就否證。</li>\n<li>「所有人類女性都有一對相同的性染色體 (XX)」→ 一個反例就否證。</li>\n</ul>\n</li>\n<li>邏輯：全稱語句<strong>唔能完全證實</strong>，但<strong>可以被一個反例證偽</strong>（不對稱性）。</li>\n</ul>\n<h3 id=\"m32-h14\">4.5 非證原則 Disconfirmation Principle</h3>\n<ul>\n<li>一個綜合語句 S：<strong>如果 S 在原則上，有可能被經驗證據支持為假</strong>，則 S 就有認知意義；<strong>否則</strong>冇。</li>\n<li>⭐ <strong>否證原則的一種較寬鬆的形式</strong>，以幫助判斷「<strong>特稱語句</strong>」是否有認知意義，例如：<ul>\n<li>「<strong>有一隻天鵝是黑色的。</strong>」</li>\n<li>「<strong>有一個人類男性擁有一對相同的性染色體 (XX)。</strong>」</li>\n<li>「<strong>有一個科大僱員月薪超過二十萬。</strong>」</li>\n</ul>\n</li>\n<li>點解要放寬？特稱語句（「有一隻…」）<strong>原則上冇可能「證明為假」</strong>（要檢查晒所有天鵝先講到「冇一隻係黑」）；但可以<strong>被證據支持為假</strong>（搵極都搵唔到）。</li>\n</ul>\n<h3 id=\"m32-h15\">4.6 否證／非證原則的應用 ⭐⭐</h3>\n<ul>\n<li>跟前述兩個原則一樣用以<strong>判斷語句是否有認知意義</strong>。</li>\n<li>⭐ <strong>否證原則亦用於區分科學與非（偽）科學 (science vs pseudo-science)</strong>（<strong>波柏 Karl Popper</strong> 嘅 demarcation）：<ul>\n<li>「<strong>人是理性的</strong>」</li>\n<li><strong>孟子性善論</strong></li>\n<li><strong>S. Freud&#39;s psychoanalytic theory</strong>（佛洛依德精神分析）</li>\n<li><strong>K. Marx&#39;s theory of history</strong>（馬克思歷史理論）</li>\n<li>→ 呢啲理論<strong>任何情況都可以解釋</strong>，<strong>冇可能被否證</strong> → 唔係科學（偽科學）。（= 油腔滑調／封閉系統）</li>\n</ul>\n</li>\n<li>⭐ <strong>非證原則常見於日常生活中的品質保證 (quality assurance)</strong>：「<strong>有一件產品不合符標格。</strong>」（抽樣檢查搵唔到 → 支持「冇不合格產品」）</li>\n</ul>\n<h3 id=\"m32-h16\">4.7 四原則配對表（必背）⭐⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th>原則</th>\n<th>方向</th>\n<th>強度</th>\n<th>主要處理</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>檢證 Verification</strong></td>\n<td>證明<strong>為真</strong></td>\n<td>嚴（證明）</td>\n<td>特稱／單稱語句</td>\n<td>有一隻天鵝是白色的</td>\n</tr>\n<tr>\n<td><strong>印證 Confirmation</strong></td>\n<td>支持<strong>為真</strong></td>\n<td>寬（支持）</td>\n<td><strong>非封閉集合的全稱語句</strong></td>\n<td>所有天鵝都是白色的</td>\n</tr>\n<tr>\n<td><strong>否證 Falsification</strong></td>\n<td>證明<strong>為假</strong></td>\n<td>嚴（證明）</td>\n<td><strong>非封閉集合的全稱語句</strong>；<strong>科學 vs 偽科學</strong></td>\n<td>所有天鵝都是白色的</td>\n</tr>\n<tr>\n<td><strong>非證 Disconfirmation</strong></td>\n<td>支持<strong>為假</strong></td>\n<td>寬（支持）</td>\n<td><strong>特稱語句</strong>；<strong>品質保證</strong></td>\n<td>有一隻天鵝是黑色的</td>\n</tr>\n</tbody></table>\n<p>記憶法：「<strong>檢印</strong>」向<strong>真</strong>，「<strong>否非</strong>」向<strong>假</strong>；「<strong>檢否</strong>」要<strong>證明</strong>（嚴），「<strong>印非</strong>」只要<strong>支持</strong>（寬）。\n全稱語句 → 印證（真方向放寬）／否證（假方向本身就得）；特稱語句 → 檢證（真方向本身就得）／非證（假方向放寬）。</p>\n<hr>\n<h2 id=\"m32-h17\">5. 非知意義 Non-cognitive Meaning ⭐⭐⭐</h2>\n<ul>\n<li>⭐ <strong>沒有認知意義不一定等於完全沒有意義/價值。</strong></li>\n<li>沒有認知意義的語句可能具有以下的<strong>非知意義</strong>：<table>\n<thead>\n<tr>\n<th>非知意義</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>規範意義 (normative)</strong></td>\n<td><strong>孟子性善論</strong></td>\n</tr>\n<tr>\n<td><strong>情感意義 (emotive)</strong></td>\n<td>「<strong>煮豆燃豆萁，豆在釜中泣，本是同根生，相煎何太急。</strong>」（曹植《七步詩》）</td>\n</tr>\n<tr>\n<td><strong>評價意義 (evaluative)</strong></td>\n<td>「<strong>萬般皆下品，惟有讀書高。</strong>」</td>\n</tr>\n<tr>\n<td><strong>美學意義 (aesthetic)</strong></td>\n<td>「<strong>天街小雨潤如酥，草色遙看近卻無。</strong>」（韓愈）</td>\n</tr>\n</tbody></table>\n</li>\n<li>⚠️ 孟子性善論：<strong>冇認知意義</strong>（否證原則下唔可否證）<strong>但有規範意義</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m32-h18\">6. 考試速攻 ⚠️⭐</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>講法</th>\n<th>答案</th>\n<th>理由</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>意義判準用嚟分辨邊啲語句係有真值嘅述句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「史維是科大前任校長嗎？」係述句</td>\n<td><strong>F</strong></td>\n<td>問句冇真值</td>\n</tr>\n<tr>\n<td>一個語句要係真先有認知意義</td>\n<td><strong>F</strong></td>\n<td><strong>談得上真假</strong>就有（假都有）</td>\n</tr>\n<tr>\n<td>所有述句可分為分析述句同綜合述句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析述句一定係真</td>\n<td><strong>F</strong></td>\n<td>矛盾句、「神奇女俠是男性」係假</td>\n</tr>\n<tr>\n<td>「王老五是未婚漢」係綜合述句</td>\n<td><strong>F</strong></td>\n<td>分析（語義界定）</td>\n</tr>\n<tr>\n<td>「HUMA 1710 is a H-CC」係綜合真句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「地球是平的」冇認知意義</td>\n<td><strong>F</strong></td>\n<td>係<strong>綜合假句</strong>，有認知意義</td>\n</tr>\n<tr>\n<td>分析述句係必然、先驗、冇信息內容</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>綜合述句係適然、後驗、有信息內容</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>四個驗證原則用嚟判斷分析語句有冇認知意義</td>\n<td><strong>F</strong></td>\n<td>判斷<strong>綜合</strong>語句</td>\n</tr>\n<tr>\n<td>驗證原則判斷語句係真定假</td>\n<td><strong>F</strong></td>\n<td>判斷<strong>有冇認知意義</strong></td>\n</tr>\n<tr>\n<td>檢證原則：原則上可能由經驗方法證明為真 → 有認知意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>印證原則係檢證原則嘅較嚴格形式</td>\n<td><strong>F</strong></td>\n<td><strong>較寬鬆</strong>形式</td>\n</tr>\n<tr>\n<td>印證原則幫助判斷非封閉集合嘅全稱語句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>非證原則幫助判斷全稱語句</td>\n<td><strong>F</strong></td>\n<td>判斷<strong>特稱</strong>語句</td>\n</tr>\n<tr>\n<td>否證原則用於區分科學與偽科學</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>Freud 精神分析、Marx 歷史理論係否證原則下嘅偽科學例子</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>非證原則常見於品質保證</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「所有天鵝都是白色的」用檢證原則會被判有認知意義</td>\n<td><strong>F</strong></td>\n<td>原則上無法證明為真（非封閉集合），要用<strong>印證</strong>或<strong>否證</strong></td>\n</tr>\n<tr>\n<td>「有一隻天鵝是黑色的」用否證原則判斷最合適</td>\n<td><strong>F</strong></td>\n<td>用<strong>非證原則</strong>（或檢證）</td>\n</tr>\n<tr>\n<td>一個語句談不上真假，連假嘅都不如</td>\n<td><strong>T</strong></td>\n<td>分析哲學觀點</td>\n</tr>\n<tr>\n<td>冇認知意義嘅語句一定冇價值</td>\n<td><strong>F</strong></td>\n<td>可有<strong>規範、情感、評價、美學</strong>意義</td>\n</tr>\n<tr>\n<td>「煮豆燃豆萁…」有情感意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「萬般皆下品，惟有讀書高」有美學意義</td>\n<td><strong>F</strong></td>\n<td>係<strong>評價</strong>意義</td>\n</tr>\n<tr>\n<td>「天街小雨潤如酥…」有美學意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>孟子性善論有規範意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n</tbody></table>\n","m33":"<h1 id=\"m33-h1\">M3-3 兩個基要的方法學區分（析合區分 &amp; 意義區分）</h1>\n<blockquote>\n<p>來源：李天命《語理分析的思考方法》第 III 篇，頁 73–117（Module 3 Reading 3.2）\n⭐ = 極高機會考；⚠️ = 陷阱\n同 M3-2（講者 slides：意義判準）互相補充——slides 係精簡版，呢篇係原典。</p>\n</blockquote>\n<hr>\n<h2 id=\"m33-h2\">0. 一頁總覽 ⭐⭐⭐</h2>\n<p><strong>邏輯經驗論 (Logical Empiricism)</strong> 兩個方法學區分：</p>\n<ol>\n<li><strong>分析語句與綜合語句之分</strong>（簡稱「<strong>析合區分</strong>」）</li>\n<li><strong>有認知意義與無認知意義之分</strong>（簡稱「<strong>意義區分</strong>」）</li>\n</ol>\n<p><strong>圖五（必背！）</strong></p>\n<table>\n<thead>\n<tr>\n<th>類</th>\n<th>語句類型</th>\n<th>例子</th>\n<th>意義</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>A</strong></td>\n<td><strong>恒真句</strong>（分析）</td>\n<td><strong>凡王老五都是未婚漢</strong></td>\n<td>有<strong>邏輯意義</strong> → 有認知意義</td>\n</tr>\n<tr>\n<td><strong>B</strong></td>\n<td><strong>矛盾句</strong>（分析）</td>\n<td><strong>有些王老五是已婚婦</strong></td>\n<td>有<strong>邏輯意義</strong> → 有認知意義</td>\n</tr>\n<tr>\n<td><strong>C</strong></td>\n<td><strong>綜合真句</strong></td>\n<td><strong>太陽的質量大過地球的質量</strong></td>\n<td>有<strong>經驗意義</strong> → 有認知意義</td>\n</tr>\n<tr>\n<td><strong>D</strong></td>\n<td><strong>綜合假句</strong></td>\n<td><strong>地球的質量大過太陽的質量</strong></td>\n<td>有<strong>經驗意義</strong> → 有認知意義</td>\n</tr>\n<tr>\n<td><strong>E</strong></td>\n<td>無所謂真假（綜合）</td>\n<td>(1) <strong>人應該愛國</strong>（規範意義）(2) <strong>你是我的靈魂</strong>（情感意義）(3) <strong>智者的人生比帝王的人生更可貴</strong>（評價意義）(4) <strong>白日放歌須縱酒，青春結伴好還鄉</strong>（美學意義）</td>\n<td><strong>有非知意義</strong> → 無認知意義</td>\n</tr>\n<tr>\n<td><strong>F</strong></td>\n<td>無所謂真假（綜合）</td>\n<td>(1) 「<strong>無自無</strong>」（<strong>海德格</strong>語）(2) <strong>那首詩用代數的肚皮去安慰電子的大腿</strong>（新詩？）</td>\n<td><strong>全無意義</strong> → 無認知意義</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>分析語句 = A + B</strong>；<strong>綜合語句 = C + D + E + F</strong></li>\n<li><strong>有認知意義 = A + B + C + D</strong>；<strong>無認知意義 = E + F</strong></li>\n<li>⭐ <strong>所有分析語句都有認知意義</strong>（不是恒真便是恒假）。</li>\n<li>⚠️ 無認知意義嘅語句<strong>全部屬於綜合語句</strong>（E、F）。</li>\n</ul>\n<hr>\n<h2 id=\"m33-h3\">1. 引言：邏輯經驗論 ⭐⭐</h2>\n<ul>\n<li><strong>邏輯經驗論 (Logical Empiricism)</strong>，早期稱為「<strong>邏輯實徵論 (Logical Positivism)</strong>」，係西方哲學中<strong>最尖銳、最強悍</strong>嘅一個學派。<ul>\n<li>註①：「尖銳」「強悍」主要指佢對<strong>傳統哲學（特別是玄學）<strong>嘅批評方式：玄學裏嘅「見解」只係一堆</strong>連「假」的資格都談不上</strong>嘅句子（冇客觀真假 → 缺乏認知意義）。</li>\n</ul>\n</li>\n<li>主要代表：<strong>卡納普 (Carnap)、施里克 (Schlick)、艾耶 (Ayer)、萊興巴赫 (Reichenbach)</strong>。<ul>\n<li>註②：核心源自「<strong>維也納學圈 (Vienna Circle)</strong>」；<strong>施里克和卡納普</strong>係維也納學圈代表人物；⚠️ <strong>艾耶和萊興巴赫不屬於這個團體</strong>，但有密切聯繫。</li>\n</ul>\n</li>\n<li>有意發起學術運動：提出宣言（「<strong>維也納學團之科學的世界概念</strong>」）、創辦機關期刊（《<strong>知識</strong>》）、發表哲學叢書（《<strong>科學統合的基礎</strong>》）、組織國際會議（「<strong>科學統合的國際會議</strong>」）→ 「<strong>極一時之盛</strong>」。</li>\n<li>兩個方法學區分係<strong>極為重要、極有效用的思想利器</strong>；喺分析哲學、自然科學、社會科學影響深而且鉅。<ul>\n<li>註④：連「<strong>日常語言派</strong>」哲學家（如 <strong>Ryle</strong> <em>The Concept of Mind</em>；<strong>Flew</strong> <em>Thinking About Thinking</em>）都自覺或不自覺採用；自然科學：<strong>愛因斯坦、Bridgman</strong>；社會科學：心理學家 <strong>Skinner</strong>、語言學家 <strong>Katz</strong>。</li>\n</ul>\n</li>\n<li>作者指出：邏輯經驗論者嘅引介同應用<strong>有些地方過於粗糙</strong>、不夠條理分明 → 本篇從<strong>實效的宗旨</strong>着眼，作剖析、補充、評定、特別是<strong>系統化</strong>。</li>\n<li>註③：叫「方法學區分」因為<strong>任何思想一經由語言表達之後</strong>，就可以應用呢兩個區分去判定<strong>思想的基本性質</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m33-h4\">2. 一、析合區分 ⭐⭐⭐</h2>\n<h3 id=\"m33-h5\">(A) 分析語句和綜合語句</h3>\n<ul>\n<li>P：「<strong>王老五都是未婚漢</strong>」；Q：「<strong>香港有所中文大學</strong>」。</li>\n<li>P：只要知道句子意思（「王老五」「未婚漢」嘅意思）就夠，<strong>毋需進行經驗事實的考察</strong>（唔使調查所有王老五）→ 有關 P 之真假係<strong>語言問題</strong>，唔係語言以外嘅事實問題。</li>\n<li>Q：知道意思<strong>仍然唔夠</strong>，要<strong>藉着經驗的考察</strong>先斷定真假 → <strong>事實問題</strong>；經驗考察係<strong>必要條件</strong>。</li>\n</ul>\n<p><strong>定義</strong> ⭐⭐⭐</p>\n<ul>\n<li><strong>分析語句 (analytic sentence)</strong> = 「<strong>其意義（其用法）足以決定其真假</strong>」的語句。任何語句 S，<strong>如果（並且僅當）原則上我們僅僅藉着語言分析就能斷定 S 為真或斷定 S 為假</strong>，那麼 S 是一個分析語句。</li>\n<li><strong>綜合語句 (synthetic sentence)</strong> = 「<strong>不是分析語句</strong>」的語句。任何語句 S，<strong>如果（並且僅當）我們無法僅靠語言分析來斷定 S 為真或為假</strong>，那麼 S 是一個綜合語句。<ul>\n<li>⚠️ 註⑤：從實效目的，呢啲定義已足夠；進一步可參 <strong>W. V. Quine &quot;Two Dogmas of Empiricism&quot;</strong>、Grice &amp; Strawson &quot;In Defense of a Dogma&quot;、J. J. Katz。</li>\n</ul>\n</li>\n</ul>\n<p><strong>次分類</strong> ⭐⭐</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>定義</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>恒真句</strong>（分析地真）</td>\n<td>原則上<strong>只通過語言分析</strong>就可以斷定佢<strong>為真</strong></td>\n<td>P「王老五都是未婚漢」；「<strong>倘若王先生是青年人，則他（在同一時間）不是老年人</strong>」；「<strong>外面下雨或沒有下雨</strong>」</td>\n</tr>\n<tr>\n<td><strong>矛盾句</strong>（分析地假）</td>\n<td>原則上<strong>僅透過語言分析</strong>就能斷定佢<strong>為假</strong></td>\n<td>「<strong>某些王老五不是未婚漢</strong>」；「<strong>王先生是一個青年人，並且他（在同一時間）是一個老年人</strong>」；「<strong>外面下雨而又（在同一時空）沒有下雨</strong>」</td>\n</tr>\n<tr>\n<td><strong>綜合真句</strong>（綜合地真）</td>\n<td>唔能僅靠語言分析確定真假，但原則上可以藉考察有關事物<strong>印證它為真</strong></td>\n<td>Q「香港有所中文大學」；「<strong>地球上有生物</strong>」；「<strong>光的入射角等於反射角</strong>」</td>\n</tr>\n<tr>\n<td><strong>綜合假句</strong>（綜合地假）</td>\n<td>唔能僅靠語言分析確定，但原則上可以藉考察<strong>印證它為假</strong></td>\n<td>「<strong>地球是正方形的</strong>」；「<strong>凡物熱縮冷脹</strong>」；「<strong>李天命身高一萬尺</strong>」</td>\n</tr>\n</tbody></table>\n<ul>\n<li>註⑥：「恒真句」「矛盾句」取<strong>廣義</strong>；狹義：恒真句（式）僅指命題邏輯裏嘅<strong>對確語式 (valid formulas)</strong> 或其代換個例；矛盾句（式）指命題邏輯裏嘅<strong>反對確語式 (contravalid formulas)</strong>。</li>\n<li>⚠️ 註⑦：<strong>綜合真句 + 綜合假句並不能窮盡全部綜合語句</strong>，因為有啲綜合語句<strong>說不上「真」或「假」</strong>（見第三節）。另：Q 呢類句子要加<strong>時空座標</strong>先可以嚴格講真假。</li>\n</ul>\n<h3 id=\"m33-h6\">(B) 析合區分的三個要點 ⭐⭐⭐（三點對立性質）</h3>\n<p><strong>(一) 分析語句是先驗的 (a priori)；綜合語句是後驗的 (a posteriori)。</strong></p>\n<ul>\n<li>「分析語句是先驗的」：要確定真假，原則上<strong>只要了解意義</strong>，<strong>毋需對世界實際狀況進行經驗考察</strong>。例：「<strong>外面有人經過或沒有人經過</strong>」——唔使走出去睇，只要知「有」「沒有」「或」嘅用法。</li>\n<li>「綜合語句是後驗的」：必須對世界實際狀況進行<strong>經驗考察</strong>。邏輯經驗論嘅理由：(a) 按定義，真假唔能僅靠分析意義決定；(b) 只能根據<strong>世界的實際情況</strong>決定；(c) 要知悉世界實際情況只有通過<strong>經驗考察</strong>。</li>\n</ul>\n<p><strong>(二) 分析語句是必然的 (necessary)；綜合語句是適然的 (contingent)。</strong></p>\n<ul>\n<li>「分析語句是必然的」：真就<strong>必然地真</strong>，假就<strong>必然地假</strong>。<ul>\n<li>⭐ <strong>「必然地真」= 在任何可能的情況下皆為真；「必然地假」= 在任何可能的情況下皆為假。</strong></li>\n<li>例：「王老五都是未婚漢」必然地真——任何人唔係未婚漢就唔叫「王老五」；「<strong>昨天下雨或沒有下雨</strong>」——下雨都真，冇下雨都真。</li>\n<li>註⑧：「必然」同「可能」任何一個可以界定另一個：「P 必然為真」=「P <strong>不可能為假</strong>」；「P 可能為真」=「P <strong>不必然為假</strong>」。模態邏輯：□p ≡ <del>◇</del>p；◇p ≡ <del>□</del>p。本文取「<strong>可能</strong>」作為基始語辭界定「必然」。</li>\n<li>註⑨：「倘若改變那句子的字眼用法，豈非可能令它變成一個假的語句？」→ 當然「可能」，但對<strong>原語句（意思/用法未改變之前）<strong>之真假</strong>毫無影響</strong>。</li>\n</ul>\n</li>\n<li>「綜合語句是適然的」：真嘅話只係<strong>事實上真</strong>，<strong>唔係必然地真</strong>；假嘅話只係<strong>事實上假</strong>。<ul>\n<li>例：「<strong>李天命有兩隻手</strong>」→ 事實上真，但<strong>唔係必然地真</strong>（佢可能只有一隻手）。「<strong>光的入射角等於反射角</strong>」→ 事實上真但非必然——正因為<strong>其為假是可能的</strong>，所以<strong>科學家才需要做觀察和實驗</strong>。</li>\n</ul>\n</li>\n</ul>\n<p><strong>(三) 分析語句是沒有實質內容的；只有綜合語句有實質內容。</strong></p>\n<ul>\n<li>「分析語句沒有實質內容」：我哋<strong>無法從分析語句所作的陳述獲知任何事實的情況</strong>。<ul>\n<li><strong>分析地真</strong>嘅語句<strong>容納了一切可能的情況</strong>：「昨天下雨或沒有下雨」——冇任何可能情況令佢為假 → 但正因如此，<strong>它並沒有斷定任何一個特定的情況</strong> → 雖然真，但<strong>無法從佢獲知昨天有冇落雨</strong>。</li>\n<li><strong>分析地假</strong>嘅語句<strong>排斥了一切可能的情況</strong>：「昨天下雨並且（在同一時空）沒有下雨」→ 都<strong>無法獲知</strong>昨天有冇落雨。</li>\n</ul>\n</li>\n<li>⭐ 既然分析語句冇實質內容，<strong>一個句子如有實質內容，它就一定是綜合語句</strong>。例：「<strong>昨天下雨</strong>」——<strong>容納</strong>某些情況（昨天有下雨）<strong>同時又排斥</strong>其他情況（昨天沒有下雨）→ 能夠對事實世界作出<strong>特定的陳述</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m33-h7\">3. 二、析合區分的應用 ⭐⭐⭐</h2>\n<h3 id=\"m33-h8\">(A) 論「人與理性」⭐⭐</h3>\n<ul>\n<li><strong>亞里士多德</strong>：「<strong>人是理性的動物</strong>」→ 你認為「<strong>人皆有理性</strong>」。</li>\n<li>作者問：有咩根據？有冇觀察、調查、研究各式各樣嘅人（例如<strong>猶太人、紅印第安人、愛斯基摩人</strong>）？可能只係對自己同相識嘅人嘅觀察（甚至想像）。</li>\n<li>對方反駁：「我根本毋需觀察……我所說的理性，是<strong>人類先天的本質</strong>……如果你提出反例（某某人冇理性），最多只能顯示：<strong>此所謂『人』不能算是一個真正的人</strong>吧了。」</li>\n<li>作者分析（<strong>唔講反駁成唔成立，只指出係乜嘢反駁</strong>）：<ul>\n<li>「人皆有理性」<strong>看似一個綜合語句</strong>，但喺你自己嘅辯解之下<strong>被解釋成一個分析語句</strong>——你<strong>按自己約定嘅定義</strong>（任何缺乏理性嘅都唔可以叫「人」）而宣稱。</li>\n<li>分析語句<strong>並無實質內容</strong> → ⭐ <strong>你所說的話是真的——但卻是空洞無物的。</strong></li>\n</ul>\n</li>\n<li><strong>延伸</strong>：「<strong>所有女人都是已婚的</strong>」→「未婚的少女和沒有結婚的老處女<strong>都不能算是真正的女人呀</strong>！」→ 用同一方法剖析「<strong>處女不是真正的女人</strong>」之類嘅<strong>狡辯</strong>。</li>\n<li>🔗 呢種手法 = <strong>「真正的 X」狡辯／No True Scotsman</strong>；亦即「<strong>相對空廢</strong>」——將綜合語句偷換成分析語句以避開反例。</li>\n</ul>\n<h3 id=\"m33-h9\">(B) 論「歷史與必然」⭐⭐</h3>\n<ul>\n<li>有些人說：「<strong>歷史的發展是必然的。</strong>」→ 意思十分含糊。</li>\n<li>如果話：「意思是『<strong>歷史會如此如此發展</strong>』（稱為 <strong>H</strong>）這個語句是<strong>必然地真</strong>的。」<ol>\n<li>你點知 H 必然地真？你嘅證據最多只係<strong>過去歷史記載</strong>或其他經驗科學知識，頂多作普遍斷言——但<strong>及唔上物理學嘅斷言可靠</strong>；就算同物理學斷言同等可信，<strong>物理學嘅斷言都唔能話係必然地真</strong>（否則物理學家就唔使做觀察和實驗！）</li>\n<li>⭐ <strong>縱使 H 是必然地真的</strong>，更嚴重問題：H 喺所有可能情況下皆為真 → <strong>容納了一切可能情況</strong> → <strong>空洞無物</strong>、<strong>冇實質內容</strong>。難道你只係想講一句<strong>必然地真、但冇實質內容</strong>嘅句子？</li>\n</ol>\n<ul>\n<li>註⑩：H 其實只係<strong>準語句 (quasi-sentence)</strong>，「如此如此」換上適當語辭先係正式語句；如果將「必然」解作「<strong>心理上絕對相信</strong>」，內容就會係<strong>主觀</strong>嘅。</li>\n</ul>\n</li>\n<li>對方改口：「我就說『<strong>歷史的潮流不可抵擋</strong>』（<strong>K</strong>）好了。」<ul>\n<li>「<strong>不可</strong>」至少兩個意思：(a) 「<strong>不應該</strong>」→ <strong>我們不應該抵抗歷史的潮流</strong> → K 係<strong>道德判斷</strong>（但你原意唔係作道德判斷）；(b) 「<strong>不能夠</strong>」（能力上做不到）→ <strong>我們在能力上做不到抵抗歷史的潮流</strong> → 你有咩證據？歷史上唔係有某潮流被一群人抗拒而消失無蹤嘅例子咩？</li>\n<li>再改口：「<strong>能夠被人抗拒的潮流，不能算是一個歷史的潮流。</strong>」→ 咁 K 係真，但<strong>只係分析地真</strong>（由你對「歷史潮流」一詞嘅用法使然）→ <strong>必然地真，但冇實質內容</strong>（分析語句）。</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m33-h10\">(C) 邏輯的性能 ⭐⭐</h3>\n<ul>\n<li>⚠️ 分析語句冇實質內容，但<strong>唔能推論「分析語句都沒有用」</strong>；亦<strong>唔能推論「分析語句都有用」</strong>——要睇<strong>邊個分析語句</strong>，尤其<strong>喺咩環境和上下文</strong>中被述說。</li>\n<li><strong>邏輯真句</strong>：邏輯裏<strong>對確的語式 (valid formulas)</strong> 之代換個例。<ul>\n<li><strong>M</strong>：「<strong>如果沒有人能夠活一萬歲，而所有獨裁者都是人，那麼（感謝上帝）沒有獨裁者能夠活一萬歲。</strong>」→ <strong>分析地真</strong>。</li>\n<li>註⑪：M 可視為對確句式之代換個例：[~∃x(Fx &amp; Gx) &amp; ∀x(Hx → Fx)] → ~∃x(Hx &amp; Gx)</li>\n<li>⭐ <strong>一切邏輯真句都是分析地真的</strong>：其真僅僅由某些<strong>語文符號</strong>（「如果……那麼……」「非」「並且」「所有」「有些」「沒有」等<strong>邏輯字詞</strong>）嘅用法使之為真 → 亦具<strong>先驗性、必然性</strong>、「<strong>內容空</strong>」。</li>\n</ul>\n</li>\n<li><strong>條件句</strong>：「如果……那麼……」形式；跟「如果」= <strong>前項</strong>；跟「那麼」= <strong>後項</strong>。M 嘅前項<strong>涵蘊</strong>後項 → 後項<strong>冇增加任何超出前項嘅內容</strong>，但<strong>可以將本已包含在前項之中但沒有明顯地披露出來的內容明顯地披露出來</strong>。<ul>\n<li>註⑫：「邏輯真句」指可化約為具
