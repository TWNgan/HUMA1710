牛津大學？（「呢個事實問題你可以搵下」）；用到現有嘅字就減低成本。（[35:48]–[36:20]）</li>\n<li><strong>語言避諱</strong>：有啲字唔可以直接講——「我朋友走咗」：走咗去外國讀書？定係去世？要釐清。（[36:20]–[37:27]）</li>\n<li><strong>文學創作</strong>（文學創作通常有種歧義性質；講者只舉字詞、語句兩種歧義，語言分析嘅書仲有其他，例如語音）：（[37:27]–[41:26]）<ul>\n<li>語音歧義：同音字（例如姓史唔好搵姓廖嘅結婚、姓吳改名煩啲、中小學個名俾人笑）——本課程唔特別提（見考試提示）。（[37:58]–[38:26]）</li>\n<li>「<strong>因荷而得藕，有杏不須梅</strong>」：藕（偶）、梅（媒）講感情——有緣份、行運（有幸），就唔使媒人。（[38:26]–[38:56]）</li>\n<li>「<strong>東邊日出西邊雨，道是無晴卻有晴</strong>」：日字邊嘅「晴」講天氣，同音變心字邊嘅「情」。（[38:56]–[39:27]）</li>\n<li>新年揮春：門兩邊「二三四五」「六七八九」、橫批「南北」——係咪數學家？缺一（衣）缺十（食），冇東西（試下用普通話讀）。（[39:27]–[41:26]）</li>\n</ul>\n</li>\n<li><strong>避重就輕</strong>：（[41:26]–[47:28]）<ul>\n<li>「<strong>下雨天留客天留我不留</strong>」（李天命書有講）：主人寫字條想人走——「下雨天留客，天留，我不留」；唔想走嘅朋友幫佢落標點——「下雨天，留客天，留我不？留！」（[42:03]–[43:57]）</li>\n<li>「<strong>人多病少財富</strong>」：有文采咁「恭賀」唔係好想佢有好事嘅親戚——「人多病，少財富」；表面上係「人多，病少，財富」（祝賀嚟嘅，唔係咒罵）。（[43:57]–[44:53]）</li>\n<li>⭐ 「<strong>（我個仔／女）邊個都睇唔上</strong>」（過年親戚問拍拖，父母出嚟救場；以前學生 e-portfolio 寫）：① 佢眼角高、好有市場，但睇唔上身邊人；② 佢冇乜市場，人哋睇唔上佢。幾年前有兩個學生拆出第三、第四個解釋——<strong>除咗語句歧義，仲牽涉字詞歧義（「上」字）</strong>（例如唔係講合唔合眼緣，而係有冇直接 approach；錄音不清）。（[44:53]–[47:28]）</li>\n</ul>\n</li>\n</ol>\n<h3 id=\"lec-h45\">⭐ 歧義 → 謬誤</h3>\n<ul>\n<li><strong>模稜兩可</strong>（同字詞歧義相關）：（[48:24]–[56:05]）<ul>\n<li>「<strong>人不能踏入同一條河兩次</strong>」（古希臘哲學說法；佛教講無常、無我：昨日嘅你已經唔係今日嘅你）——應用落去：大學規定同一科 compulsory course 唔可以肥兩次，你肥完兩次話「唔係同一個 course」，睇下 Department Head 接唔接受。（[48:24]–[49:52]）</li>\n<li>「<strong>爭取自由最終都是徒勞無功的，因為人生總會受到約束</strong>」（李天命例子）：歧義在「<strong>自由</strong>」——絕對嘅自由（時間、空間、金錢所有嘢都自由，連地心吸力都擺脫）一定徒勞無功；但一般傾自由係講某個意義下我哋可以有自己嘅選擇權，唔係話無時無刻擺脫約束。（[49:52]–[50:52]）</li>\n<li>⭐ 「<strong>有個 roomie 好過乜都冇；乜都冇好過有個男／女朋友；所以有個 roomie 好過有個男／女朋友</strong>」：第一句「乜都冇」= nothing／零（就算你個 roomie 係負數，夠開放都覺得好過零）；第二句唔係「零好過你」——表白時講「冇嘢比你好」係話「<strong>你係最好</strong>」，要成句解（只有哲學家、虛無主義者先會話有樣嘢叫 nothing 好過你）→ 「沒有任何東西」喺兩句意思唔同，所以結論唔合理。（[50:52]–[56:05]）</li>\n</ul>\n</li>\n<li><strong>歧義句構</strong>（同語句歧義相關）——大量新聞標題例子；「一定聽過、歷久不衰」嗰個唔使解釋，講幾個未必聽過嘅：（[56:05]–[58:47]）<ul>\n<li>「<strong>新公屋廁廚加大便利輪椅戶</strong>」：廁所、廚房加大（方便輪椅住戶）vs 加咗「大便」。（[56:05]–[56:37]）</li>\n<li>「<strong>挪威農民餓死逾 400 隻豬判囚 1 年</strong>」：原文係挪威農民養豬唔合理，餓死咗 400 隻豬，所以坐監一年；但標題可以讀成「挪威農民餓死，逾 400 隻豬判囚 1 年」（啲豬冇犧牲自己救活農民，所以有罪）。（[57:08]–[58:07]）</li>\n<li>「<strong>父涉姦兒子女友被捕</strong>」：父親涉嫌強姦兒子嘅女朋友被捕 vs 父親涉姦兒子、女友被捕。（[58:07]–[58:47]）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"lec-h46\">⭐ 含混</h3>\n<ul>\n<li>含混牽涉某啲語詞<strong>冇一個明確嘅應用範圍</strong>（教問題分類時都提過）；⭐ 但記住：「<strong>冇明確嘅界線唔代表完全冇界線</strong>」。（[58:47]–[59:41]）</li>\n<li>幾高叫高？高過乜？（錄音提到 1.53 米、1.93 米；「初小、小三以下 1.2 米算高」）——可以不斷釐清，但釐清到某個位，「<strong>只係得接唔接受</strong>」；Module 3 會返嚟補充。（[59:41]–[61:12]）</li>\n<li>大部分係形容詞：<strong>高矮、肥瘦、貧富、冷暖</strong>；呢啲特質喺語言入面<strong>唔可以缺少</strong>：（[61:12]–[64:26]）<ul>\n<li>叫老師「大聲啲」——冇人會話「請將音量提升到 80 分貝」（科學上做到，但同人講嘢係不斷調整）。（[61:12]–[62:42]）</li>\n<li>「呢塊板夠唔夠白？」——白都係比較出嚟；設計師可以用三原色比例（255、255、255），但客人永遠只會話「可唔可以黃啲、紅啲」。（[62:42]–[63:56]）</li>\n<li>「Dr Lam 你講書太快，可唔可以講慢啲？」——唔會要求「一分鐘講幾多隻字」。（[63:56]–[64:26]）</li>\n<li>⭐ 好處：可以<strong>約略咁描述</strong>一件事；平時溝通有彈性。（[63:56]–[64:26]）</li>\n</ul>\n</li>\n<li>⭐ 但某啲情況必須好具體釐清——例如社會上要<strong>立法規管</strong>，就要畀指引：<strong>「開得太快」唔係罪</strong>；你嘅車速比道路限速高咗某個百分比先叫<strong>超速</strong>；交通警淨係話你開得太快就開告票，你可以向法官申訴——一定要畀個數字你。用含混字詞要小心。（[64:26]–[66:03]）</li>\n</ul>\n<h3 id=\"lec-h47\">⭐ 含混 → 謬誤</h3>\n<ul>\n<li>⭐ <strong>連續體謬誤</strong>：含混語詞本身有彈性——雖然冇明確界線，但<strong>有約略嘅界線</strong>（高、矮）；有人誤導，因為冇明顯界線，就將佢推到「<strong>一啲界線都冇</strong>」。（[66:03]–[66:59]）<ul>\n<li>李天命例子（有錢／窮）：身家一億美金（冇負債）嘅人同冇錢嘅人分別大唔大？大。畀一萬美金冇錢嗰個，佢會覺得自己變咗有錢人？（科大讀一年書連宿費都唔止）仍然窮；有錢人少一萬美金，都仲係有錢人；每次一萬「都冇分別」，畀十次、一百次……畀到最後兩個人就一樣。（[66:59]–[70:33]）</li>\n<li>⭐ 講者自己較實際嘅例子（「希望你哋最後唔好咁用」）：另一科有學生問：「我同我朋友成績差唔多，點解佢 A-、我 C+（差 4 個 subgrade）？」講者翻查：final grade 100 分滿分差 20 幾分；學生話呢份 assignment 差 2 分、嗰份 2.5 分、嗰份 3 分、呢份 1 分……六份加埋就 20 分——「係咪差唔多？差好多」。（[70:33]–[72:04]）</li>\n</ul>\n</li>\n<li>⭐ <strong>滑坡謬誤</strong>：推論過程表現得好似有環環相扣嘅因果關係；毛病在於呢啲因果關係<strong>其實只係一種可能性</strong>，講嘢嘅人<strong>利用語詞嘅含混性將可能推論到必然</strong>。（[72:04]–[72:41]）<ul>\n<li>「<strong>若同意主動安樂死，進一步就會接受被動安樂死，最後去到草菅人命</strong>」：一個社會同意咗主動安樂死，下一步立法接受被動安樂死——喺李天命框架下係好合理嘅諗法（先釐清……下一步創意 = 問有咩可能性；錄音略不清）；政策發展都係行第一步再有第二步，但係咪一定去到草菅人命？未必——<strong>政策之間有可能嘅發展，但冇必然嘅結論</strong>。（[72:41]–[73:38]）</li>\n<li>講者例子：「大學生應該唔讀書 → 有時間打扮自己、做 gym、學（談吐；錄音不清）→ 最後成績未必好、冇工作經驗，但有可能釣到金龜」——每一步都有可能，但冇必然性；聽完就推論「教授都話唔讀書，GPA 低、搵唔到工、唔使諗 PhD——我一定搵到有錢配偶」——唔一定，佢只係講有可能。（[73:38]–[75:12]）</li>\n<li>講者補充：佢身邊讀 PhD 嘅人，另一半家底通常都幾好，所以唔明「嗰個教授」點解有咁嘅結論；要數理分析，就要搵一堆讀咗 PhD 同一堆冇讀 PhD 嘅人，比較佢哋配偶嘅經濟狀況。（[75:12]–[75:42]）</li>\n</ul>\n</li>\n</ul>\n<h2 id=\"lec-h48\">重點澄清</h2>\n<ul>\n<li>⭐ <strong>「普遍性」本身有歧義</strong>：同學 e-portfolio 理解嘅「普遍性」= 說法<strong>普遍被人接受</strong>；但講者講概念問題（尤其數學、邏輯、programming）嘅普遍性，<strong>唔係普遍被一般人認同，而係就算全世界唔認同，佢哋都係真</strong>——呢點正正係接住要講嘅「語言嘅歧義性」。Module 3 會返嚟講：佢哋係<strong>絕對地真</strong>，真假唔會因人嘅解讀同理解而唔同。（[01:02]–[02:21]）</li>\n<li>李天命思考方法嘅最終目標係搵到真理，真理最好建基於事實；數學真理都係真理，但對數學真理嘅理解因人而異。（[00:06]–[01:02]）</li>\n<li>「白雪公主可唔可以係男人？」——Module 3 會講：根據<strong>字詞定義</strong>，「公主」本身含有（女性）呢個特質（錄音作「男性」，按上文下理應為女性），全世界唔認同都好；話佢可以係男人，係創意思維／評價問題嘅發揮。「公主有女性含意、王子有男性含意」似係文化上嘅定位；再追問可以透過基因圖譜（雌雄基因排序唔同）畀更好嘅答案。（[02:21]–[03:58]）</li>\n<li>⭐ 概念 → 事實 → 評價（1、2、3）係<strong>方法論架構</strong>：讀完呢個 course 多咗個條件——<strong>畀主觀意見之前，首先釐清晒啲概念同事實</strong>。（[03:58]–[04:21]）</li>\n<li>⭐⭐ <strong>三類問題冇高低，只有先後</strong>：李天命標榜「事實先行」，但佢自己冇作出邊個高、邊個低嘅評價性判斷（e-portfolio reflection 材料）；唔好預設佢係邏輯家就推崇概念、事實問題——佢老婆係中文系，佢本身亦係詩人（錄音作「私人」）。純粹講先後：「概念先行，跟住事實，最後評價」——<strong>唔係評價性問題，而係方法上嘅 step 1、2、3</strong>；<strong>step 3 先行</strong>（唔釐清講咗乜、唔理事實就畀意見）＝違反佢自己嘅批判思考框架。（[11:49]–[13:07]）</li>\n<li>同一個 context 用唔同方式提問，反映唔同學科對某問題嘅諗法（環保：乜嘢係全球暖化）。（[13:07]）</li>\n<li>⭐ Module 2 上半講語理分析基本方法（第一步：釐清問題）；下半講點解要花功夫釐清——<strong>有啲嘢係釐清唔到嘅，係日常語言嘅特質，未必係毛病</strong>。（[16:14]–[16:44]）</li>\n<li>李天命將佢學嘅分析哲學套入日常語言、講一套畀大眾用嘅思考方法，必然涉及日常語言；西方分析哲學慢慢發展到最後係一套近數學嘅嘢（好與壞下個 module 再講）。（[17:33]–[18:00]）</li>\n<li>⭐ <strong>歧義係必須嘅（有好處），但討論時要留意避開，因為會牽涉謬誤</strong>。（[47:28]）</li>\n<li>⭐⭐ <strong>謬誤未必係假</strong>：回到李天命追求嘅真理同謬誤嘅分別——謬誤係一種錯誤、混亂嘅思維，<strong>未必係假</strong>；Module 6 會講有啲謬誤係<strong>必然真</strong>嘅。（[47:57]–[48:24]）</li>\n<li>⭐ 字詞歧義、語句歧義「各自有一類」相關謬誤：模稜兩可、歧義句構；含混相關謬誤：連續體、滑坡。（[48:24]、[56:05]、[66:03]、[72:04]）</li>\n<li>⭐ 含混：冇明確界線 ≠ 冇界線（有約略界線）；連續體謬誤就係將「冇明顯界線」推到「冇界線」。（[59:41]、[66:33]–[66:59]）</li>\n<li>⭐ 含混字詞係雙面刃：平時溝通靠佢嘅彈性；立法等場合必須具體；有人利用佢嘅彈性誤導思考（連續體、滑坡）。（[63:56]–[66:03]）</li>\n<li>⭐ 滑坡：用「可能 vs 必然」去拆——<strong>有可能嘅發展 ≠ 必然嘅結論</strong>。（[73:38]、[74:38]）</li>\n</ul>\n\n<hr>\n<h1 id=\"lec-h49\">課堂 2026-09-28（語言的陷阱（二）：歧義／含混點考、「小時偷針」≠ 滑坡（錯誤類比）、著色字詞（李天命論科學 vs 人文）、訴諸憐憫、言辭空廢（絕對／相對））</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h50\">考試提示</h2>\n<ul>\n<li>⭐⭐⭐ <strong>歧義、含混「冇乜好考」</strong>：「呢度唔需要太擔心……歧義、含混呢啲考試，我諗係<strong>四五題 MC 就完</strong>——四五題頂多，四五題可能仲少」；叫大家代入出題者嘅角度諗。（[06:39]）</li>\n<li>⭐⭐⭐ <strong>問「有冇歧義」→ 答「有」</strong>：「如果問你一個字詞有冇歧義性，你幾大都答<strong>有</strong>」——要解釋「冇歧義」成本非常高：就算佢搵十個 AI model 證明過冇歧義，你對卷時話「我有一個（意思）」，佢就要承認錯誤；所以佢「冇理由」出一條歧義題而答案竟然係冇歧義。（[06:39]–[07:39]）</li>\n<li>⭐⭐ <strong>含混同理</strong>：「你只要講得出嗰樣嘢嘅含混性，你就唔使理其他人嘅解釋」。（[07:39]）</li>\n<li>⭐⭐ <strong>唔會問有幾多種歧義</strong>：例如「67」嘅歧義，你只需要講出佢<strong>係一個數字，同時係 Gen Alpha 嘅用語</strong>（同香港粗口相近嗰啲唔使知）；「我絕對唔會問你某個字詞有幾多種歧義」——唔會有「A 4 種、B 5 種、C 6 種、D 7 種」咁嘅題目。（[08:12]–[08:41]）</li>\n<li>⭐ <strong>唔係語法課</strong>：「我哋呢個課程首先唔係一個語法學嘅課程」；講歧義、含混，係睇一個講法、某啲論述會唔會導致超過一種意思。（[06:11]、[08:41]）</li>\n<li>⭐⭐⭐ <strong>「小時偷針，大時偷金」唔係滑坡謬誤</strong>：「呢個考試如果我會問嘅話，你記得答案：小時偷針大時偷金<strong>並唔係一個滑坡謬誤</strong>」——係<strong>錯誤類比</strong>（Module 6 再講）。（[18:09]–[19:06]）</li>\n<li>⭐ <strong>唔會考</strong>：「你都幾堅定」有冇冒犯對方、應該由邊個判斷——「呢啲你點睇，<strong>考 MC 都唔會問</strong>」。（[40:48]–[41:44]）</li>\n<li>「我呢個課程係<strong>唔會畀你定義乜嘢叫客觀</strong>」。（[45:02]）</li>\n<li>⭐⭐ <strong>10 月 23 日考試</strong>：「識就識，唔識就（揀；錄音作「擇識仔」）——<strong>True or false、ABCD</strong>」。（[59:24]）</li>\n<li><strong>考場紀律</strong>：千祈唔好睇隔籬（張 MC 好細，好易睇錯；錄音略不清）；千祈唔好戴有任何攝錄功能嘅眼鏡——講者一定會同全班講你係邊個，兩個 session 全班重考。（[59:57]–[61:02]）</li>\n</ul>\n<h2 id=\"lec-h51\">課堂例子</h2>\n<h3 id=\"lec-h52\">歧義：「67」、紅磡站</h3>\n<ul>\n<li>有乜嘢冇歧義？基本上所有嘢都有歧義；<strong>數學符號「勉強」可以叫做冇歧義</strong>——但其他文化圈、唔同世代可能對某啲嘢有特別定義：L2 Mentimeter 問有乜字冇歧義，同學寫 1、2，有人寫「6、7」——67 係自然數（66 同 68 中間）；但亦係 <strong>Gen Alpha 用語</strong>（「你哋係 Gen Z，唔好扮後生」）；用廣東話讀要特別注意發音。（[00:40]–[02:27]）</li>\n<li>⭐ 表弟妹話你「好 67」（錄音作「7-11」）代表乜？——<strong>一個字詞可以具有歧義，同時有含混、有著色</strong>；唔同世代有唔同用法，最好釐清佢 in what sense 用兩個數字形容你。（[02:27]–[03:16]）</li>\n<li>講者親身經歷：大約十年前約一位 60 年代尾出世嘅師兄喺「紅磡地鐵站」B 出口等，等咗十分鐘都唔見人——講者喺紅磡站（東鐵綫），師兄喺<strong>黃埔站</strong>（觀塘綫，當時新開冇耐）：喺師兄眼中，紅磡區嘅地鐵站就係「紅磡地鐵站」，而講者去嗰個佢叫「<strong>紅磡火車站</strong>」。釐清其實講兩句好閒。（[03:16]–[06:11]）</li>\n</ul>\n<h3 id=\"lec-h53\">含混（兼歧義）：「成功」「高」</h3>\n<ul>\n<li>大部分形容詞都含混：高矮、肥瘦、冷暖、<strong>成功</strong>（對失敗）；有冇約略嘅界線？有。但呢個界線究竟係去到歧義定含混，要釐清。（[09:16]–[09:47]）</li>\n<li>⭐ 「<strong>成功</strong>」：評價一間大學成唔成功有唔同 ranking（QS、THE），但冇一個 KPI 係大學生自殺率；喺科大學生口中，「成功」被 create 咗「<strong>成功 = 生存</strong>」嘅意思，喺另一間院校教就冇呢個意思 → 經過釐清，可能發現佢<strong>唔止含混，甚至有歧義</strong>。（[09:47]–[10:52]）</li>\n<li>⭐ 「<strong>高</strong>」：作為形容詞有含混性（幾高叫高）；亦有歧義（有人姓高）。講者讀大一時，問全班第一嘅內地同學（physics）CGA 高唔高，佢話「唔係太高」——當時科大 grade point 係 1–12（12 = A+、11 = A），11.5 係 round up 到 A+ 嘅門檻；對佢嚟講「<strong>高低唔係形容詞，係階級</strong>」（喺 A+ 入面唔算高）。講者：「how is it true or false，呢啲畀你哋參考」；「有錢」嘅 concept 喺社會上都係人人唔同。（[11:20]–[15:44]）<ul>\n<li>後來再講：佢係咪「串」緊講者？佢只係<strong>事實咁講一件事</strong>——可以當事實問題查（嗰個學期幾多人 CGA 過咗某個 letter grade），亦可以概念分析（11.5 係門檻，所以一定唔高）；講者同兩個朋友三對一都覺得被串，唔代表就聽邊個判斷。（[43:24]–[45:02]）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"lec-h54\">⭐ Mentimeter：「小時偷針，大時偷金」係唔係滑坡？</h3>\n<ul>\n<li>滑坡謬誤（slide）：推論過程表現得環環相扣，實際問題係將每一層之間嘅意思<strong>由一種可能性講到一種必然性</strong>。（[16:57]）</li>\n<li>「小時偷針，大時會唔會偷金？」——有可能，但證據不足；將 A 到 B 嘅可能性變成必然性；答「否」嘅同學可能已經睇咗 Module 6（會講多啲謬誤例子）。（[16:57]–[17:46]）</li>\n<li>⭐⭐ 答案：<strong>唔係滑坡謬誤</strong>——邏輯家為咗本書寫多個例子，將滑坡謬誤同<strong>錯誤類比</strong>分開兩類：<strong>錯誤類比</strong> = 由一件事比較另一件事，當中有可能性但冇必然性；<strong>滑坡謬誤</strong> = 推論過程要係<strong>環環相扣嘅因果關係</strong>，「推論過程至少係由 A 到 B 到 C」——小時偷針呢度<strong>冇推論過程</strong>。錯誤類比都係謬誤，但唔歸類做滑坡，純粹係邏輯家喺謬誤分類上嘅唔同講法（Module 6 再講）。（[18:09]–[19:06]）</li>\n</ul>\n<h3 id=\"lec-h55\">⭐ 著色字詞</h3>\n<ul>\n<li>著色字詞：用呢啲字時會<strong>表達出情緒</strong>。（[19:06]）</li>\n<li>⭐ <strong>堅定／固執</strong>：形容同一種狀況（一個人不斷嘗試、堅持自己諗法、唔聽人講）——好聽啲叫堅定（有鼓勵性），唔好聽啲叫固執。（[19:56]–[20:28]）</li>\n<li>⭐ <strong>公僕／公務員</strong>（情緒意義隨年代改變）：好舊時嘅香港，「公僕」係負面嘅（僕人）；慢慢演變成中性嘅「公務員」；而家「公務員」對你哋呢代係咪中性？（問有冇人覺得負面）；而家網上講「公僕」反而係講佢哋謙卑嘅特質——<strong>同一個說法喺唔同年代可以由正面變中性、中性變負面、負面又變中性</strong>。（[20:28]–[22:12]）</li>\n<li>⭐ <strong>鬼佬</strong>：講者覺得而家冇人覺得「鬼佬」係負面字詞；「鬼佬」通常指白人（南亞裔另有稱呼）；講者喺紐約長大、教中學嘅表哥用嗰啲族裔稱呼係佢嘅常態，用得好中性——好似地盤佬用粗口做標點符號都好中性；唔係講佢文化水平高低（嗰個絕對係評價性），而係喺嗰個文化圈要 create 嗰種 language 先溝通到。（[22:12]–[24:26]）</li>\n<li>同一個 context，唔同情感下用唔同字：<strong>參考／抄襲</strong>（「你哋通常唔會抄功課，只係參考」）；兩國打仗，自己一方傳媒話敵軍「<strong>冷血殺人</strong>」，對方傳媒將同一場景描述為「<strong>英勇殺敵</strong>」；半杯水心理學：「<strong>還有</strong>半杯水」定「<strong>剩下</strong>半杯水」。（[24:26]–[25:34]）</li>\n<li>⭐ 好處：人係有情感嘅生物——但「<strong>重點係我哋改變唔到事實</strong>」：事實都係某國殺死另一國嘅人、你都係攞咗人哋嘢嚟抄、你都係好固執；事實可以好客觀咁描述。追男神／女神試咗十次都失敗——堅定定固執？唔知；但<strong>事實上你就試咗十次，事實變唔到</strong>。（[25:34]–[26:40]）</li>\n<li>⭐ 做人需要心理調節（試咗十次都失敗，同自己講「我係一個好堅定嘅人」）；<strong>壞處</strong>：如果要透過論述 <strong>convince 其他人</strong>同意我哋，就應該<strong>建基於事實，而唔係利用著色字詞</strong>。（[26:40]–[27:46]）</li>\n<li>日常最常見：<strong>廣告用語</strong>（唔講產品有咩特別，而係「唔買就笨」——錄音作「唔買就瘋」）；<strong>政治宣傳</strong>（講者唔講香港，講特朗普 Make America Great Again）。（[27:46]–[28:53]）</li>\n</ul>\n<h3 id=\"lec-h56\">⭐ 李天命「地圖炮」：科學 vs 人文學科</h3>\n<ul>\n<li>李天命 reading：語詞可以盡量中性、不帶情感——科學／學術語詞大部分係<strong>中性</strong>（方程式、遞歸性、微系數；你覺得負面只係因為某科令你 suffer）；但去到社會、政治、倫理、文藝、宗教，寫文往往用帶情感意味嘅字（<strong>階級、反動、壞蛋、神聖、叛教</strong>）；嚴格學科有高度理論成就，人文學科遠遠落後、幾乎停滯不前；科學家冷靜客觀咁觀察、實驗、假設、演算，嗰班人就透過語言上嘅著色運用嘈交。（[29:26]–[33:25]）</li>\n<li>講者評論：李天命避開社會科學，直接開火人文學科；有啲大學數學唔分入科學（科大就分）——⭐ <strong>喺李天命系統，數學都唔算科學（Module 3 討論；錄音作「module field」），但對李天命嚟講係一個 positive comment</strong>。（[30:59]–[32:55]）</li>\n<li>⭐ 人文學科嘅人係咪真係可以避開著色字詞？講者：<strong>著色字詞係人類語言必然嘅一部分</strong>，人有需要——<strong>情緒價值</strong>（宗教某意義上都係）；講者建議唔好喺學術、課本搵情緒價值，喺家人、伴侶、朋友之間搵。（[33:25]–[36:10]）</li>\n<li>⭐ <strong>文學唔應該避著色字詞</strong>——如果文學家都避咗著色字詞，就冇文學：DSE 嘅描寫文、抒情文寫唔到，淨返議論文；最後只可以做文學批評，而唔係創作。（[36:10]–[36:35]）</li>\n<li>李天命一套除咗批判其他學科，亦用著色字詞批判當時其他哲學學派（英美分析哲學批評歐陸搞現象學嗰班）；喺哲學分類上亦唔應該講形上學；道德倫理要概念咁講——<strong>道德只係人類嘅行為準則，冇其他內容</strong>；分析哲學家盡量唔用著色字詞，後來發展到純粹邏輯。（[37:05]–[38:06]）</li>\n<li>⭐ <strong>歷史可以避開著色字詞</strong>：「人文學科裏面真正做到嘅係歷史」——學術地描述一場戰爭：點解發生、過程、雙方死傷人數（數字表達），唔使講「英勇殺敵」、唔使加「正義／不正義嘅戰爭」。衍生問題：歷史學家係咪做緊科學研究？歷史系應唔應該畀 BSc 而唔係 BA？（文學畀 BA 好合理，BSc in Literature 就好矛盾）——<strong>Module 3 返嚟再討論</strong>。（[38:06]–[40:16]）</li>\n</ul>\n<h3 id=\"lec-h57\">著色字詞：有冇冒犯，邊個判斷？</h3>\n<ul>\n<li>有人講「你呢個人都幾堅定」——有冇冒犯對方，由講嗰個、聽嗰個定第三方判斷？（MC 唔會問）同學答第三方 = <strong>社會規範</strong>；法律上被告某啲罪，用字點判斷——陪審團（社會遊戲規則）。（[40:48]–[46:45]）</li>\n<li>但陪審員係咪就代表事實？講者：整件事係<strong>評價性</strong>——「<strong>有事實基礎，但冇事實嘅答案</strong>」；只可以基於講嘢嘅 context 分析，法律上規則就係第三方。提醒：講嘢小心，可免則免，唔好因為自己或身邊人覺得冇所謂就講。（[46:45]–[47:45]）</li>\n</ul>\n<h3 id=\"lec-h58\">網上圖片真偽 &amp; 分析標語字眼</h3>\n<ul>\n<li>網上見到嘅圖片要先懷疑真定假：有冇人去過現場？最好問當事人、問來源。⭐ 「<strong>李天命教大家係訴諸事實</strong>；但如果冇任何事實，只可以靠估，就要靠旁敲側擊嘅<strong>佐證</strong>」。（[47:45]–[51:30]）</li>\n<li>⭐ 分析一句宣傳標語嘅字眼：有啲字冇著色、唔含混（例如地名）；「XX 的繁榮穩定」<strong>含混</strong>；「XX <strong>成功</strong>」係<strong>著色</strong>（positive，「千祈唔好話中性」）；而「<strong>成功</strong>」同時有<strong>歧義</strong>（成功執行咗？定係經濟發展／幸福指數嗰種成功？）同<strong>含混</strong>（唔同 KPI，要達到幾多先算）→ <strong>一個字詞可以同時有著色、歧義、含混</strong>。（[51:30]–[56:07]）</li>\n<li>⭐ 小結：同前兩類語言特質一樣，<strong>著色字詞喺人類語言入面係存在嘅；重點係要判斷佢有冇影響我哋嘅思考</strong>。（[56:07]）</li>\n</ul>\n<h3 id=\"lec-h59\">⭐ 訴諸情感 → 訴諸憐憫</h3>\n<ul>\n<li><strong>訴諸情感</strong>係一個謬誤大類，入面有一個子類叫<strong>訴諸憐憫</strong>：通常透過講話博取對方同情，而<strong>避開事實嘅理據</strong>。（[56:38]）</li>\n<li>⭐ 有人殺咗自己父母（有證據，錄音提到指紋），向法官求情，理由係佢已經係孤兒——係事實，但<strong>唔係求情理由</strong>：孤兒狀況係你自己一手一腳造成。（講者補充：釐清「殺死咗佢<strong>親生</strong>父母」之後，「呢個人係咪孤兒」就變成概念問題。）（[57:08]–[57:40]）</li>\n<li>⭐ 考試作弊被捉、唔合格，向老師求情：「請讓我合格，唔係我搵工好困難」——都係事實（HR 見到 transcript 連 HUMA1710 都 F），但唔係求情理由：作弊係你自己嘅自由選擇。（[57:40]–[59:24]）</li>\n<li>講者自嘲：如果有人作弊，佢會上網話「一個人文學部教授技術能力低，揭發唔到學生作弊」——「你覺得我博唔博到大家同情？」（訴諸憐憫）；同情感著色字詞一樣要避免。（[60:30]–[61:32]）</li>\n</ul>\n<h3 id=\"lec-h60\">⭐ 言辭空廢（Empty verbalism）</h3>\n<ul>\n<li>定義：<strong>用重言命題冒充事實陳述</strong>。正常嘅事實陳述：數據調查、去現場睇發生咩事、做實驗；但有一種「語言藝術」係用重言命題冒充事實陳述。分<strong>絕對空廢</strong>、<strong>相對空廢</strong>。（[61:32]–[62:36]）</li>\n<li>⭐⭐ <strong>絕對空廢</strong>要跟言辭空廢成個定義，有<strong>兩個條件</strong>：① <strong>重言命題</strong>（係一個語句形式）；② <strong>冒充事實陳述</strong>。⭐ 言辭空廢嘅問題<strong>唔係在於佢講嘅嘢係假</strong>——重言命題係<strong>必然真</strong>嘅語句，只係透過講出必然真語句去<strong>假裝講咗嘢</strong>，係一種思考溝通上嘅毛病。（[62:36]–[63:05]）</li>\n<li>⭐ 記者問商人：「做生意可唔可以唔理商業／社會嘅道德？」（[63:05]–[68:55]）<ul>\n<li>受過批判思考訓練嘅商人應該<strong>先釐清</strong>：乜嘢係商業道德？道德只係一種行為規範——違反咗，證監會會搵我；我冇違反；你覺得唔道德係你嘅價值判斷。乜嘢係商業行為？低價買入、高價賣出係合理商業行為；高價買入、低價賣出都係（失敗嘅）商業行為——都牽涉交易、物品、貨幣。（[63:37]–[66:01]）</li>\n<li>呢個答法可能「好似冇乜養分」，但<strong>有信息內容（information content）</strong>——有冇養分係你嘅評價；定義可以再討論（BBA 同學可以 clarify、講 Adam Smith、畀第二個定義），可以溝通。（[66:01]–[68:17]）</li>\n<li>⭐ 但「<strong>做生意就是做生意</strong>」：<strong>重言句形式「A 就是 A」——冇信息內容、冇講過嘢</strong>，冇解釋過乜嘢係生意；呢個回覆<strong>必然地真</strong>。同類：「會來就是會來」「喜歡就是喜歡」「我就是我」「睡覺就是睡覺」。（[66:32]、[68:17]–[69:39]）</li>\n</ul>\n</li>\n<li>⭐⭐ 留意：言辭空廢有個條件係要<strong>冒充事實陳述</strong>——「你聽日會唔會嚟參加活動？」問嘅人期望你畀信息內容（嚟定唔嚟）；答「會來的話就自然會來」：<strong>你最差嘅地方唔係講錯嘢，而係你冇講過嘢</strong>——結果嚟唔嚟你都冇講大話，必然真，「你好保守」。（[69:39]–[70:16]）</li>\n<li>「點解你咁鍾意瞓覺？」「鍾意就鍾意」——人哋可能想認識你；你可以答「唔係我鍾意瞓，係環境令我瞓」。（[70:16]–[70:51]）</li>\n<li>⭐ 「明年會唔會出現財政赤字？」（問題分類時都提過）財政司答：「如果明年總支出大過總收入，就會出現財政赤字」——<strong>未必係「A 就是 A」嘅感覺，而係畀你一個定義</strong>。（[70:51]–[71:37]）</li>\n<li>⭐⭐ <strong>相對空廢</strong>：言辭空廢定義<strong>放寬</strong>之後嘅產物，<strong>加強佢嘅使用率</strong>——唔再需要重言句形式，而係要求<strong>分析語句內容、了解相關語境</strong>之後，就知道結果必然真。（[71:37]）</li>\n<li>⭐ 算命師（先講你知嘅嘢——父母現況——建立關係）：「<strong>父在母先亡</strong>」——⭐ <strong>一個人嘅言辭空廢可以係因為歧義所導致</strong>：「父在，母先亡」（爸爸健在、媽媽過咗身）或者「父喺母之前亡」；就算你話兩個同時離世，算命師都可以話「你爸爸好錫你媽媽，答應過唔會先走，捱住最後一啖氣睇住媽媽先走，遲幾秒先走」。呢個就係<strong>相對空廢</strong>——相對於絕對空廢，係「稍為鬆散嘅狀態」。（[74:00]–[76:34]）</li>\n<li>⭐ 絕對 vs 相對：絕對要<strong>重言形式</strong>——「A 就是 A」、「因為 A 所以 A」，或者第三種情況「<strong>畀你一個定義</strong>」；相對要<strong>分析當時嘅內容同語境</strong>（算命師嘅語境：統計上好少兩個人同時離世）。（[75:36]–[76:05]）</li>\n<li>算命師先講你知道嘅內容，講啱咗你先會再問感情問題——「我哋星期五再講感情問題」。（[76:34]）</li>\n</ul>\n<h2 id=\"lec-h61\">重點澄清</h2>\n<ul>\n<li>⭐ <strong>基本上所有嘢都有歧義</strong>（包括語音、語境上嘅歧義）；數學符號勉強算冇歧義，但唔同文化圈、世代都可能有特別定義。（[00:40]–[01:31]）</li>\n<li>⭐ 一個字詞可以<strong>同時</strong>有歧義、含混、著色。（[02:49]）</li>\n<li>⭐ 呢個課程唔係語法學課程：重點係唔同人、唔同 channel 見到嘅嘢唔同，所以討論時最好先釐清。（[06:11]）</li>\n<li>⭐ 含混字詞經釐清，可能發現<strong>唔止含混，仲有歧義</strong>（成功、高）——「界線究竟係去到歧義定含混，需要釐清」。（[09:47]–[11:20]）</li>\n<li>⭐⭐ <strong>錯誤類比 ≠ 滑坡</strong>：slide 對滑坡嘅描述係「由可能講成必然」，但講者強調滑坡<strong>要有環環相扣、至少 A → B → C 嘅因果推論鏈</strong>；單純由一件事類比另一件事（小時偷針 → 大時偷金）係錯誤類比。（[16:57]–[19:06]）</li>\n<li>⭐ 著色字詞：好處（人有情感、心理調節、文學創作）vs 壞處（說服他人時應建基於事實，唔應靠著色字詞）；<strong>事實改變唔到</strong>，可以客觀描述。（[25:34]–[27:46]、[36:10]）</li>\n<li>⭐ 李天命：<strong>數學唔算科學</strong>（佢眼中係 positive comment）；歷史學可以避開著色字詞，但歷史研究算唔算科學 → Module 3。（[32:21]、[40:16]）</li>\n<li>⭐ 有冇冒犯係評價性：<strong>有事實基礎，但冇事實嘅答案</strong>；講者唔會定義「客觀」。（[45:02]–[46:45]）</li>\n<li>⭐ 李天命教<strong>訴諸事實</strong>；冇事實時只能靠佐證「估」。（[51:04]）</li>\n<li>⭐ 訴諸憐憫 ⊂ 訴諸情感；所講嘅可以係事實，但唔係相干嘅理由。（[56:38]–[59:24]）</li>\n<li>⭐⭐ 言辭空廢：問題唔係假（重言句<strong>必然真</strong>）；<strong>冒充事實陳述</strong>先係空廢；「有信息內容但你覺得冇養分」（評價）≠「冇信息內容」（空廢）。（[62:36]–[69:39]）</li>\n<li>⭐ <strong>歧義可以導致（相對）言辭空廢</strong>（父在母先亡）。（[74:30]）</li>\n</ul>\n\n<hr>\n<h1 id=\"lec-h62\">課堂 2026-10-02（Module 2 收尾：言辭空廢——絕對／相對空廢、空廢 vs 日常「廢話」；Module 3 開始：定義、內涵與外延嘅四個關係）</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h63\">考試提示</h2>\n<ul>\n<li>⭐⭐⭐ <strong>第三個關係「內涵固定則外延固定」唔考</strong>：講者講完 assigned reading（傳統邏輯書 Copi 中文版）用「人」同「活人」嘅解釋之後話：「我想再次講，考試呢，我唔考呢個規律。考試呢，我唔考呢個規律」——改為畀大家喺 e-portfolio 討論「你哋點睇」。講者喺 slide 呢條打咗星號。（[62:29]、[67:48]）（10 月 5 日再確認：「上次有個打星，我話我唔考嘅」）</li>\n<li>⭐⭐ <strong>言辭空廢題一定係「有問有答」</strong>：「你見到所有例子都係有問有答嘅，所以你考試……你要答言辭空廢，一定係有問有答」——因為兩個條件其中一個係<strong>冒充事實陳述</strong>。（[18:11]）</li>\n<li>⭐⭐ <strong>考試式示範題</strong>：「如果我考試竟然問你：『我的生母是女人』（前面冇問題），係以下邊一類言辭空廢？A 絕對空廢　B 相對空廢　C 不是言辭空廢」→ <strong>答案 C</strong>（冇人問問題，有個人自己講）；大部分同學都揀啱。（[19:44]–[21:30]）</li>\n<li>⭐ <strong>「簡單」嘅內容反而要驚</strong>：講完完整／非完整外延之後，講者話「係咪到而家都好簡單呢？所以你哋應該驚啦」；「我哋 10 月 23 日考試……Dr. Lam 講咗咁幾個禮拜咁簡單嘅嘢，可以點樣考呢？」（中間一句錄音不清，大意似係：難嘅題目你哋反而唔驚）。（[43:11]–[43:54]）</li>\n<li>（錄音不清）講等邊／等角三角形時，講者似乎話「（考）係問啲最簡單嘅 geometry」、「呢啲唔使 pre-requisite」。（[45:47]）</li>\n</ul>\n<h2 id=\"lec-h64\">課堂例子</h2>\n<h3 id=\"lec-h65\">⭐ 絕對空廢：重言句嘅幾種形式（溫習 + 補充）</h3>\n<ul>\n<li>上堂例子：「做生意就係做生意」「鍾意就係鍾意」——都係「A 就係 A」；財政司「如果明年總支出大過總收入，就會出現赤字」都係重言句，因為佢係畀緊「赤字」呢個字詞嘅<strong>定義</strong>。（[02:32]–[03:34]）</li>\n<li>重言句通常嘅形式：<strong>A 就係 A</strong>（A implies A：有 A 嘅話就會 A）、<strong>A 因為 A 所以 A</strong>、<strong>畀個 definition</strong>。（[03:02]–[03:34]）</li>\n<li>⭐ 講者補充 slides 冇講嘅一種：<strong>「A 或者非 A」</strong>——記者問「做生意可以唔理商業道德咩？」答「理或者唔理」；「你明日會唔會嚟呀？」答「嚟或者唔嚟」；「點解鍾意瞓覺？」答「鍾意或者唔鍾意」「有原因或者冇原因」；「明年會唔會有赤字？」答「有或者冇」——「總之喺語句上就見到佢係必然地真」。（[03:34]–[04:56]）</li>\n</ul>\n<h3 id=\"lec-h66\">⭐ 相對空廢：算命師傅、國師、數據分析員</h3>\n<ul>\n<li>⭐ <strong>「父在母先亡」</strong>：「佢本身唔係一個重言句」；經分析先發現佢有<strong>歧義</strong>——①爸爸先於媽媽離開呢個世界；②（加個逗號）「父在，母先亡」：爸爸仲喺度，媽媽行咗先。係語句嘅歧義性令佢必然為真，所以「我哋就唔會將佢歸類為一個重言句」——因為要<strong>再經過多一步分析</strong>，知道佢有歧義，將一句拆做兩句。（[02:32]、[04:56]–[05:50]）<ul>\n<li>有同學提出父母可能同一刻離世（例如「爸爸好愛媽媽，攬住，邊個都唔可以早過另一個半步」）：講者承認咁樣佢只係「好近必然真，而唔係必然真」；但放寬到相對空廢嘅用法，兩個人同時死嘅可能性非常低，都勉強接受（錄音略不清）。（[06:18]–[07:19]）</li>\n</ul>\n</li>\n<li>算命師傅開頭先講你應該知道嘅嘢（例如父母狀況）嚟建立顧客關係，因為未來嘅事冇人知；大學生問算命主要問兩樣：<strong>感情</strong>（通常係 freshman）同<strong>事業</strong>（通常係 final year）——講者話係佢以前做（錄音不清）時嘅數據。（[01:59]–[02:32]、[07:48]–[08:19]）</li>\n<li>⭐ <strong>「你明年會有感情問題，事業會唔順利」</strong>：表面好似畀咗兩個信息內容、做咗判斷；「明年會點」係<strong>事實問題</strong>，要過咗 2027 年先可以返去搵師傅「尋仇」——但點都中：（[08:47]–[10:16]）<ul>\n<li>單身咗 14 個月 → 有問題；由單身變拍拖（「出 pool」）→「你本來單身係冇感情問題㗎嘛」，拍拖先有感情問題；穩定拍拖 14 個月 →「咁穩定點解唔結婚？」；由拍拖變冇拍拖 → 好明顯有問題 → <strong>「感情問題」絕對有歧義性</strong>。（[10:48]–[12:47]）</li>\n<li>事業：14 個月搵唔到工 → 唔順利；搵到工 →「你鍾唔鍾意？」唔鍾意即係唔順利；好似「學業順利」：溫完書高過 mean 一個 SD 攞 B 唔順利，攞 A 都可以話「我捱咗咁耐先攞到，好唔順利」→「算命師傅係講晒嘅」。（[12:47]–[14:11]）</li>\n</ul>\n</li>\n<li><strong>國師／參謀：「如果你發動戰爭，將會摧毀一個強大的國家」</strong>——「國家」有兩個意思：摧毀咗敵方嘅國家，定係摧毀咗自己嘅國家。（[14:44]–[15:17]）</li>\n<li>⭐ <strong>數據分析員：「明年市場會出現動盪」</strong>——唔係重言句形式，但「動盪」係<strong>含混</strong>嘅：幾動盪先叫動盪？市場任何時候都唔係平嘅；升好多係動盪、跌好多係動盪、升完再跌好明顯係動盪；就算（例如特朗普發動第三次世界大戰）美股停市三個月——「好動盪」。（[15:46]–[17:42]）</li>\n<li>⭐ 小結：透過分析實際情況，「尤其係相對空廢，好多時係牽涉到語言嘅歧義同含混性質」。（[17:42]）</li>\n</ul>\n<h3 id=\"lec-h67\">⭐ 冇冒充事實陳述 → 唔係言辭空廢</h3>\n<ul>\n<li>Dr. Lam 喺 Concourse 自言自語「做生意就做生意、動盪就動盪、會嚟就自然會嚟、鍾意就鍾意」——<strong>唔係言辭空廢</strong>，係「我精神錯亂」，因為冇人期望佢提供任何事實陳述；生意失敗嘅人喺 IFC 天台講同樣嘅嘢，你除咗覺得佢精神錯亂，仲應該打電話報警。（[18:42]–[19:44]）</li>\n<li>⭐ 「我的生母是女人」（冇人問）→ C 不是言辭空廢：佢<strong>必然真</strong>（「生母嘛」），但<strong>冇冒充事實陳述</strong>；就算有人問「你親生媽媽係咪女人？」，咁答都係合理回答。（[21:30]–[22:07]）</li>\n<li>⭐ 學生問「可唔可以舉例說明咩係重言句？」，講者答「例如『喜歡就是喜歡』就是一句重言句」——答案必然真，但係<strong>喺度回答你嘅問題</strong>，冇冒充事實陳述。（[22:07]–[22:52]）</li>\n</ul>\n<h3 id=\"lec-h68\">⭐ 言辭空廢 ≠ 日常「廢話」（講者叫 AI 列例子）</h3>\n<ul>\n<li>問題：「空廢命題（言辭空廢）係咪即係日常生活講嘅廢話？」——答之前要先釐清講緊乜：空廢命題（PowerPoint）包括絕對同相對空廢；絕對要求重言形式；相對唔要求重言形式，但都要求一個<strong>必然真</strong>嘅回應 + <strong>冒充事實陳述</strong>。（[22:52]–[24:11]）</li>\n<li>講者叫 AI（Gemini）列出「香港日常生活最常聽到嘅十句廢話」，再逐句分析：（[24:11]–[29:28]）<ul>\n<li>「你唔好理啦」（錄音不清）——叫你唔好理，唔係講「你理又得、唔理又得」→ 唔係重言。（[25:21]–[25:52]）</li>\n<li>「不好意思，我講一句話未必好聽」——扮講對唔住，唔係必然真；「我有個朋友……」——唔係必然真、冇重言成分（「朋友」九成九講緊自己）。（[25:52]–[27:01]）</li>\n<li>「隨便啦／無所謂啦／你決定啦」——冇必然真嘅成分，只係唔想話事；「等我一陣，好快到」——一定唔係重言句，通常係假嘅。（[27:01]–[27:46]）</li>\n<li>「唔係我講㗎，係佢哋講㗎」——有明顯真假可言；「認真你就輸」——冇重言成分（認真嘅人未必輸）；「下次約食飯，得閒再約」——通常唔係真。（[27:46]–[28:20]）</li>\n<li>⭐ 「不好意思，我都係跟公司規矩做咋」——你係 report 自己點做事，<strong>提供咗信息內容（一個事實：你跟緊公司規矩）</strong>，唔係冒充事實陳述，亦唔係重言形式（你其實可以唔跟）。（[28:20]–[29:28]）</li>\n<li>「呢句說話我只係同你講，你唔好同其他人講」——唔係重言形式，係提醒你唔好亂講。（[29:28]）</li>\n</ul>\n</li>\n<li>Gen Z 版本（再問 Gemini）：「好 chill 喎」——應該唔係重言句，頂多係含混（有幾 chill？）；「我唔係針對佢」——未必必然真；（錄音不清）「等我 post 個……先」——report 緊一個行動；「唔好 toxic 啦，positive 啦」「精神內耗好嚴重」——冇重言性質、未必必然真。（[30:05]–[33:19]）</li>\n<li>⭐ 「我係 I 人，社交能量用盡」：人哋問你點解早走、點解唔覆訊息，你係<strong>畀咗個原因</strong>——唔係講「我想早走就早走」「唔覆就唔覆」「我覆嘅話自然會覆」（呢啲先係空廢）。（[33:19]–[33:52]）</li>\n<li>⭐ 「隨緣，係我嘅總會嚟」——終於有句似絕對／相對空廢：<strong>要留意對方問咩</strong>。問「點解你單身咁耐？」答「緣份嚟到，就自然會嚟」→ <strong>絕對空廢</strong>；答「科大學習壓力好大，我冇時間」→ <strong>唔算空廢</strong>（畀咗原因；答案未必令你滿意，但唔係重言形式）。（[33:52]–[36:05]）</li>\n<li>⭐ 結論：用<strong>舉例說明</strong>——舉日常廢話嘅例子，逐個分析係咪符合言辭空廢兩個條件（重言 + 冒充事實陳述）——發覺<strong>有部分日常廢話可以歸類為言辭空廢，但兩個概念唔係重疊（唔等同）</strong>：講者舉咗大約 20 個例子，「19 比 1」，得一個要睇 context（睇對方問咩）先有機會係言辭空廢。（[36:43]、[38:20]–[38:48]）</li>\n</ul>\n<h3 id=\"lec-h69\">定義：被界定端／界定端、內涵／外延</h3>\n<ul>\n<li>⭐ 「人是理性的動物」：「人」= 被界定端，「理性的動物」= 界定端；講出「理性的動物」其實畀咗<strong>兩個性質</strong>（理性、動物）——「<strong>呢兩個性質就係一個概念嘅內涵</strong>」。（[40:27]–[40:57]）</li>\n<li>「民主係一種保護人權嘅政治體制」：「民主」= 被界定端；界定端 = 保護人權 + 政治體制。（[40:57]）</li>\n<li><strong>內涵</strong> = 我哋界定緊嘅語詞嘅特徵（或者內容），即概念嘅內容；<strong>外延</strong> = 符合呢個內容嘅語詞嘅例子——講者話數學堂應該學過，只係數學老師未必 spell out。（[40:57]–[41:58]）</li>\n<li><strong>偶數</strong>：內涵 = 可以被 2 整除嘅自然數（兩個特質：係自然數、可以被 2 整除）；外延 = 2、4、6、8、10……（[41:58]）</li>\n<li><strong>完整外延</strong>：七大洲——1 至 7，講唔到第八個；<strong>非完整外延</strong>：哲學家——你都係舉例；講者預告「一陣間有個問題返嚟，其實係同非完整外延有關係」（即第三個關係）。（[42:33]–[43:11]）</li>\n</ul>\n<h3 id=\"lec-h70\">⭐ 第一個關係：外延由內涵決定，反之不然</h3>\n<ul>\n<li>反映分析哲學家嘅世界觀：<strong>概念先行</strong>——世界上我哋見到嘅嘢，喺見到之前其實應該先有一個概念；外面世界見到嘅嘢係被內涵（概念嘅內容）決定，內涵佔主導性。（[43:54]–[45:09]）</li>\n<li><strong>內涵唔同、外延相同</strong>：（[45:09]–[51:46]）<ul>\n<li><strong>等邊三角形／等角三角形</strong>：一個只描述邊、一個只描述角 → 內涵唔同，外延一樣；呢類外延「五千年前問、五千年後問」都一樣。⭐ 講者：如果你（有數學訓練）覺得兩個概念本身內涵一樣，「我無所謂」——因為唔違反呢個規則（內涵一樣，外延就一樣）。（[45:09]–[49:34]）</li>\n<li>⭐ <strong>2025 福布斯全球首富／2025 福布斯美國首富</strong>：講者查過，2025 年兩個都係 Elon Musk；但 2024 年唔係，有機會係歐洲人——唔係 by default 美國人做首富。同三角形唔同：研究機構可以隨時間改佢點樣定義「最有錢」（減唔減負債、計邊一日定全年平均）——「數學呢啲唔可以調節，呢個可以調節」→ <strong>呢類定義通常要講明幾時</strong>（例如「2025」）。（[49:34]–[51:46]）</li>\n</ul>\n</li>\n<li><strong>外延唔同嘅語詞唔會有相同嘅內涵</strong>：中國人（約 14 億）、香港人（700 多萬）、上海人（二三千萬）——外延唔同，所以推論到內涵唔同。（[51:46]–[55:00]）<ul>\n<li>⭐ <strong>「香港人是中國人？」</strong>——講者連講三次「是」：香港 700 多萬人包括喺 14 億入面（上海人亦然）；但第二個意思係 <strong>equal／equivalent</strong>：「絕對唔係」——兩個概念外延唔同、內容（內涵）都唔同 → 呢句<strong>有歧義</strong>；「邏輯好 hard core，係就係，唔係就唔係」，唔係嘅話我哋就理解到個字詞有歧義。（[52:24]–[58:01]）</li>\n<li>香港人同上海人有冇重疊？講者太太早幾個月攞咗香港身份證，要取消上海戶籍——如果以身份證／戶籍區分，就冇重疊；但「上海人」都可以指<strong>祖籍</strong>上海（而家係香港人），所以「上海人」本身都係兩個概念；講身份時，要了解一樣嘢係咪等於另一樣嘢，可以睇內涵同外延。（[55:00]–[56:51]）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"lec-h71\">⭐ 第二個關係：內涵遞增 → 外延「不遞增」</h3>\n<ul>\n<li>內涵遞增 = 為一個概念加多啲資料、描述；符合新描述嘅外延分子<strong>通常</strong>會越嚟越少，但都有機會數量一樣。（[58:01]–[59:09]）</li>\n<li>例子：<strong>科大學生</strong>（UG + PG，大約兩萬幾人）→ <strong>科大本科生</strong> → <strong>科大商學院本科生</strong> → <strong>現正讀 HUMA1710 嘅科大商學院本科生</strong>（更少）→ <strong>現正讀 1710 而聽得明廣東話嘅科大商學院本科生</strong>——最後呢一層數量應該一樣 → 所以規則係「<strong>不遞增</strong>」嘅次序排列（唔係「遞減」）。（[59:09]–[61:44]）</li>\n<li>講者喺最後一個例子「打咗個問號」：未有讀呢科嘅商學院同學同佢講聽唔明廣東話，但呢個係<strong>事實問題</strong>（「經一事長一智」）。（[61:44]–[62:29]）</li>\n</ul>\n<h3 id=\"lec-h72\">⭐ 第三個關係（打星號、唔考）：內涵固定則外延固定——Copi「人／活人」</h3>\n<ul>\n<li>講者喺呢條打咗星：「相對比較難理解，亦都有一啲同學未必接受到」；叫大家自己諗同唔同意，最好自己舉例（數學、科學，再試 social science）睇下得唔得。（[62:29]–[64:37]）</li>\n<li>Reading（傳統邏輯書中文版）講法：有人認為語詞嘅內涵冇變但外延會變，例如「人」嘅外延隨人死、人出世而變（動態）；但作者話呢個理解唔係佢哋想畀嘅定義——（講者舉例：唔用古希臘「人是理性」，改用「符合某種基因排序嘅生物」）「人」指所有人，包括死咗／曾經存在同未出世嘅，所以外延從來冇變過；<strong>真正外延變嘅係「活人」</strong>。（[64:37]–[67:03]）</li>\n<li>⭐ 講者立場——「<strong>部分同意</strong>」：講「人」包括過去、現在、未來，佢覺得 make sense，因為外延容許<strong>非完整外延</strong>：你哋而家唔係科大畢業生，但將來係；「科大畢業生」呢刻冇包括你，但亦冇排除你；概念喺時間維度上如果冇特別講「現在」，就過去、現在、未來都包括。（[68:24]–[71:21]）<ul>\n<li>身份嘅延續：假設內涵定義冇郁過，你曾經係某樣嘢，理論上依然係嗰樣嘢；極端例子 X-Men：如果科學 breakthrough 將人類基因圖譜分成兩類，有個新定義（Superhuman）而你更符合，「恭喜你成為超人，你唔再係人」——人同超人嘅分別本身有 uncertainty，視乎定義。（[71:51]–[74:08]）</li>\n</ul>\n</li>\n<li>⭐ 講者覺得 reading 奇怪、「比較難接受」嘅地方：佢定義「人」時包括過去、現在、未來（外延冇變；數量係無限，列舉只能係非完整外延）；但解釋「活人」時就變成有限、淨係講<strong>現在</strong>（死咗唔算、未出世唔算；否則「活人」就等於「人」，概念多餘）——<strong>同一個解釋入面有兩種概念上嘅理解</strong>：有啲概念包括過去現在未來，有啲概念加咗個「活」字就淨係包括現在。叫大家週末返去諗。（[74:08]–[76:29]）</li>\n</ul>\n<h2 id=\"lec-h73\">重點澄清</h2>\n<ul>\n<li>⭐ <strong>言辭空廢（無論絕對定相對）</strong>：都係講一啲<strong>必然為真</strong>嘅嘢嚟<strong>冒充事實陳述</strong>；絕對空廢要求<strong>重言形式</strong>；相對空廢<strong>唔要求重言形式</strong>，但要求一個必然真嘅回應 + 冒充事實陳述。（[08:47]、[24:11]）</li>\n<li>⭐ <strong>絕對 vs 相對</strong>：絕對空廢睇語句形式就見到必然真；相對空廢要再經過多一步分析（發現歧義、含混）先知必然真 → 所以「父在母先亡」唔歸類為重言句。（[04:56]–[05:50]、[17:42]）</li>\n<li>⭐ <strong>必然真 ≠ 言辭空廢</strong>：冇人問（自言自語），或者合理回答一條問題（「你生母係咪女人？」「舉個重言句例子」），都冇冒充事實陳述 → 唔係言辭空廢。（[18:42]–[22:52]）</li>\n<li>⭐ 判斷日常講法要「留意對方問咩」：畀咗原因（I 人、讀書冇時間、跟公司規矩）就唔係空廢——答案未必令人滿意，但唔係重言形式。（[33:52]–[36:05]）</li>\n<li>四個陷阱入面，<strong>著色最麻煩</strong>：歧義、含混講錯咗都只係搞笑，著色講錯咗好容易得罪對方（錄音作「勒著對方」）；好難判斷由邊個做最後決定（上次「花牌」例子嗰個字係 neutral 定 negative，唔知）；「一國兩制」喺學術文章當然係 neutral，但日常講呢四個字，有人期望佢有正面意思——日常語言嘅問題。（[00:37]–[01:27]）</li>\n<li>⭐ <strong>定義方法好簡單</strong>：傳統分析哲學嘅定義只牽涉四個 terms——<strong>被界定端、界定端、內涵、外延</strong>；透過釐清界定端同被界定端嘅關係（主要睇內涵同外延嘅聯繫）就做到釐清功夫；但定義<strong>唔係唯一方法</strong>——例如頭先用<strong>舉例說明</strong>釐清日常廢話同言辭空廢。（[36:43]–[38:20]）</li>\n<li>⭐ 定義通常用嚟釐清句子入面嘅<strong>主語</strong>或者<strong>專有名詞</strong>；上個 topic 講過，某啲字詞、形容詞係含混嘅，其實好難畀定義。（[39:55]）</li>\n<li>⭐ 「概念先行」係分析哲學家嘅世界觀——第一個關係（外延由內涵決定，反之不然）正正反映呢點。（[44:32]–[45:09]）</li>\n<li>內涵係某種特質；外延可以理解為接近一種<strong>數量</strong>——符合某個內涵嘅個體例子。（[53:36]）</li>\n<li>講者喺 slides 上嘅標記：第二個關係嘅（廣東話）例子打「？」（係咪真係數量一樣屬事實問題）；第三個關係打星（難理解、有同學未必接受、唔考）。（[61:44]–[62:29]、[67:48]）<ul>\n<li>🔗（筆記對照，唔係講者原話）slides 原文係「(3) 內涵固定則外延固定 *」，並引 Copi：「人」包括死人同未出生嘅人，外延不斷變更嘅係「活人」；任何外延不斷變動嘅語詞，內涵都一定不斷變動。講者唔同意嘅係「人」同「活人」嘅處理，唔係「內涵固定則外延固定」本身（見 10 月 5 日）。</li>\n</ul>\n</li>\n</ul>\n\n<hr>\n<h1 id=\"lec-h74\">課堂 2026-10-05（內涵與外延（續）：人／活人、概念先行、第四個關係；定義的分類：規創、釐定、字詞定義及其規則）</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h75\">考試提示</h2>\n<ul>\n<li>⭐⭐⭐ <strong>題型（講者親口講）</strong>：考 <strong>True or False</strong> 同 <strong>MC</strong>；「應該只有三個類型」：①<strong>T/F</strong>（50-50）；②<strong>問題分類題</strong>——三類問題，選項得 <strong>A／B／C</strong>（三分一）；③<strong>ABCD</strong>（25%）——「我唔會出 ABCDE」。各類題目比例未知——「未出卷」。（[01:12]–[02:46]）</li>\n<li>⭐⭐ <strong>無故缺席期中 = 0 分，冇補考</strong>：講者話當日（10 月 5 日約 1:35pm）講嘅嘢有 RVC 錄影為證：「一個同學無故缺席咗 midterm，冇補考，就係 0 分」。（[00:43]–[01:12]）</li>\n<li>⭐ <strong>一定要去考</strong>：考 T/F 同 MC，「你運氣唔係咁差嘅話，起碼都 50 分啦」；就算五分鐘掃晒佢，都可能執到三分一分；期望值應該高過 25%——「最差嘅決定係唔考」。（錄音提到「三五分而已」「65 以上」，似乎講緊期中所佔分數同合格計算，未能確定。）（[01:12]–[02:16]）</li>\n<li>⭐⭐ <strong>再確認：第三個關係（內涵固定則外延固定）唔考</strong>：「上次有個打星，我話我唔考嘅」——唔考係因為講者覺得自己同 assigned reading 嘅解釋唔係好夾（錄音不清）；但就算冇呢個關係，有少少數學底，由第一、二個關係（內涵有決定性；內涵遞增 → 外延以不遞增方式排列）都應該推論到「內涵固定、外延固定」。（[03:17]–[04:17]）</li>\n<li>⭐ <strong>考試唔係常識問答比賽</strong>：講「哺乳類動物」例子時叫大家自己搜尋哺乳類嘅內涵——「我講咗考試唔係一個常識問答比賽」。（[16:05]）</li>\n<li>⭐ <strong>重點係字詞定義</strong>：講完規創例子（佛系、0尊、6-7、蘇絲黃、王老五／Bachelor）之後話「呢啲參考一下，<strong>重點係喺後面——字詞定義</strong>」。（[45:29]）</li>\n<li>時間表：「仲有四課就 mid term 啦」，仲有一個半 topic。（[00:10]）</li>\n<li>講者：如果你唔係用「先有概念」嘅方式睇世界，「你呢個 course 成績未必好」（但人生會少好多執著——佢另一科教中國哲學，就係教人唔好用呢種方法諗嘢）。（[18:31]–[19:21]）</li>\n</ul>\n<h2 id=\"lec-h76\">課堂例子</h2>\n<h3 id=\"lec-h77\">⭐ 人／活人（續）：講者唔同意 reading 嘅地方</h3>\n<ul>\n<li>講者上次主要唔同意嘅係：reading 將「人」同「活人」呢兩種概念，一種當成冇時間性。當講者講「人」，唔係講「2026 年 10 月 5 日下午 1:40 嘅人」——<strong>加一個具體時間 = 喺內涵上增加咗嘢</strong>；冇咁加嘅時候，概念本身就牽涉過去、現在、未來——呢個係分析哲學家理解一個概念嘅切入點。（[04:17]–[05:14]）</li>\n<li>同樣道理，「活人」本身冇任何時間嘅特質（「2026 年」先係一個好客觀嘅時間點）；「活人」嘅概念應該同「人」一樣，包括<strong>過往曾經活、現在活、將來有機會活</strong>嘅人 → reading 喺同一個 paragraph 入面將一個概念嘅內涵外延關係拆咗兩類嚟解釋，「所以我覺得解釋唔太好」。（[05:14]–[06:17]）</li>\n<li>有冇哲學家咁解釋？有——「但唔應該係分析哲學流派嘅解法」：分析哲學近科學，「人」「活人」都唔帶任何時間性；但好多其他哲學家（存在主義者）覺得「人」本身有時間性、講當下；影響最深係<strong>佛教</strong>——唔講「人」講「我」：上個星期五嘅你係咪你？10 月 23 號（考試）嘅你係咪你？「無我」要斬斷一個人嘅連續性，過往嘅嘢唔能夠帶去未來。（[06:17]–[07:52]）</li>\n<li>分析哲學（近科學）唔係咁斬斷：幾年前入 UST 嗰個係你，而家好多改變但都係你；三年前犯咗案、整完容，三年後搵返你，都係你——<strong>有連續性</strong>，包括過去、現在、未來。（[07:52]–[08:54]）</li>\n</ul>\n<h3 id=\"lec-h78\">⭐ 概念先行：認識世界嘅方式</h3>\n<ul>\n<li>講者腦入面本來有「人」嘅概念；見到你哋行入課室，影像同腦入面「人」嘅概念相符 → 「人」呢個概念嘅外延就係啱啱行入嚟嘅同學——「<strong>先有知識，再理解世界</strong>」，係分析哲學家嘅世界觀。（[08:54]–[09:28]）</li>\n<li>⭐ <strong>火星例子</strong>：你做香港第二個太空人，喺火星見到一個兩手兩腳、似 Dr. Lam 嘅物體——唔會直接標籤佢做「火星人」，只會叫佢「<strong>火星上嘅類人形生物</strong>」（未肯定係咪生物時只叫「物體」，可能係假嘅）——整個概念嘅內涵都係你已有嘅，用已有知識去了解未知；要確定就捉佢驗 DNA：如果基因排序同人類一樣，你嘅問題就變成「點解火星會有個地球人？」；再叫佢「火星人」只係好似「非洲人」「北美人」咁嘅<strong>地域分野</strong>，都係人類。→ <strong>「人」呢個概念嘅確包括未來未知嘅</strong>——我哋係用一個固定嘅概念，去睇有冇新嘅物種入嚟。（[10:05]–[15:20]）</li>\n<li>⭐ <strong>哺乳類動物例子</strong>（講者話「跳脫」咗，改用科學啲嘅講法）：喺未探知清楚嘅地域／海域搵到一隻生物，捉嚟驗 DNA、研究佢嘅生物特性；如果所有嘢都同現時哺乳類動物嘅定義（內涵）相符，就標籤佢做一隻新嘅哺乳類動物——<strong>唔會推翻哺乳類動物嘅定義</strong>；發現者嘅 credit 唔係幫內涵搵到更多內容，而係<strong>跟住內涵搵到某個外延</strong>——呢個外延喺被發現之前已經存在。「外延係咪加一？喺呢個見解之下，冇加一」——外延一直都包括嗰隻未被搵到嘅生物。（[16:05]–[17:40]）</li>\n<li>哲學家：講者自己「一定唔會係哲學家」；但如果佢個仔經過老豆二十年「折騰」覺醒咗變哲學家，佢個仔就可以係其中一個。⭐ <strong>大部分概念都係非完整外延</strong>。（[17:40]–[18:31]）</li>\n</ul>\n<h3 id=\"lec-h79\">⭐ 第四個關係：外延有所變動 → 內涵反向改變</h3>\n<ul>\n<li>理論上內涵有主導性；但做 prediction 時，未有足夠資料了解某個概念或知識嘅內容（內涵），只知道佢所指涉嘅嘢（外延）有變動，就可以<strong>推論到內涵係反向改變</strong>。（[19:21]–[20:30]）</li>\n<li>⭐ <strong>合資格申請獎學金學生</strong>（留意：唔係「獲得獎學金嘅學生」，係兩個概念）：內涵 = 要求——科大學生 → 捐款人只想 benefit UG（PG 走開）→ 某個 school → CGA 要求；資格要求越高，包含嘅人就越少。你喺 Threads 問到今年幾多人攞到（外延），但唔知內涵（網站上 on paper 嘅資格以外有冇其他資格）→ 外延增加（今年多咗人合資格）= 資格放寬、要求低咗：可能 GPA 要求唔同咗，或者由本來只限 Science School 變成五個 school 都得。（[20:30]–[23:01]）</li>\n<li>⭐ 但實際上要諗清楚：你考慮緊嘅概念係「合資格申請獎學金學生」定「實際攞到獎學金學生」——實際攞到錢同合資格嘅內涵未必完全掛鈎，仲要睇獎學金 pool 有幾多錢。（[23:01]–[24:06]）</li>\n<li><strong>九大行星 → 八大行星：反例？<strong>外延由 9 變 8（細咗），如果按第四個關係即代表內涵多咗嘢；但（按講者講法）科學家嘅立場係內涵一直係咁，外延由 9 變 8 係因為以前技術上判斷錯誤——「Sorry，我以前錯誤咁將冥王星當成行星之一」，科學家嘅態度係</strong>認錯</strong>（講者冇明確總結佢算唔算真正反例）。（[24:06]–[27:12]、[29:34]–[30:03]）<ul>\n<li>對比 <strong>2020 年夏季奧運會</strong>：2021 年先舉辦，但日本政府沿用「2020」——講者嘅解讀係經濟上嘅考慮；如果講成「紀念人類疫情嘅苦難、人類好團結、唔會為疫情跪低，所以堅持 2020」——「呢個表達方法好著色」。科學家就唔理你：第一改咗佢，第二講對唔住。（[26:31]–[30:03]）</li>\n<li>⭐ 預告下個 topic：科學同其他學科嘅分別之一——<strong>錯係冇所謂嘅</strong>；科學點解認受性高，係因為<strong>佢接受錯誤</strong>。（[30:03]）</li>\n<li>🔗（背景，唔係講者原話）2006 年國際天文聯會（IAU）首次正式訂立「行星」定義，冥王星因而改列為矮行星；溫習時以講者帶出嘅「科學肯認錯、修正」為重點。</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"lec-h80\">有冇「冇內涵」嘅語詞？</h3>\n<ul>\n<li>講者問：有冇一個冇內涵嘅語詞或者概念？（分析哲學嘅世界觀係先有概念）——潮語（錄音作「67」等，錄音不清）都有內涵：你係先有個概念，再描述你朋友符合呢個概念。（[30:40]–[31:24]）</li>\n<li>感嘆語詞（錄音不清）：你分得出佢係感嘆，未必講得好具體，但一定有啲嘢。（[31:24]–[32:18]）</li>\n<li>⭐ <strong>英文字母「A」</strong>：內涵 = 係英文字母（唔係中文字）、排第一（撇除其他意思）；你要有呢個概念，先可以幫幼稚園學生默 26 個字母打剔打交叉。（[32:18]–[33:34]）</li>\n<li>形而上嘅概念（例如「道」）都有內涵——講者喺另一科講「道」都講兩個禮拜，冇內涵好難講得兩個禮拜；「光」可以用嚟照明、有指引性，可以含混，但內涵只係講內容。→「好難冇嘅」。（[33:34]–[36:03]）</li>\n</ul>\n<h3 id=\"lec-h81\">創意 = 先有內涵、再有外延？</h3>\n<ul>\n<li>我哋係用已知嘅嘢去認識唔識嘅嘢；「AI Gen 嘅 image」：30 年前講唔講得出呢個講法係事實問題；你叫佢做「AI Gen」就係畀咗佢內涵；你同 AI 交流時嘅 input 係內涵，AI 畀返你嘅嘢世界上未必有。（[37:02]–[39:34]）</li>\n<li>另一個分析哲學角度講 Module 1 嘅「創意」：李天命嘅理解係<strong>組合或轉換</strong>；喺 Module 3，基於「先有內涵再有外延」，創新／創意就係講出一啲內涵、豐富某啲概念，而嗰樣嘢當下喺世界上未有——接近 Engineering School 嘅理解（有 purpose、brainstorm、collect user feedback，再創造新嘢）。（[39:34]–[40:58]）</li>\n</ul>\n<h3 id=\"lec-h82\">⭐ 定義的分類：規創、釐定、字詞</h3>\n<ul>\n<li>⭐ <strong>分析哲學要做嘅定義主要係字詞定義</strong>；其他分類出嚟係話畀大家知「呢個唔係佢嘅討論範圍」——等於李天命一開始嘅問題分類：佢將評價問題劃分出嚟，但佢自己同分析哲學傳統係<strong>唔碰評價問題</strong>嘅，<strong>事實問題佢哋都唔碰（冇能力碰）</strong>，於是變成處理純邏輯分析嘅概念問題。（[40:58]–[42:16]）</li>\n<li>⭐ 為下個 topic（意義判準：喺分析哲學判準下邊啲知識／學科有意義）鋪墊：佢哋把尺就係呢個 course 講咗幾個禮拜嘅「真理」——喺佢哋眼中，<strong>一件事物有意義，至少需要講得上真或者假</strong>。（[42:16]–[42:49]）</li>\n<li>⭐ 從定義角度，有啲嘢釐清嘅時候發覺釐清唔到一個有真假可言嘅定義，有兩個情況：①嗰樣嘢<strong>具有創新性</strong>（規創）；②嗰啲係<strong>含混</strong>嘅，只能約定喺社會上有合理嘅應用範圍（釐定）。（[42:49]–[43:18]）</li>\n<li><strong>規創</strong>：講新嘢，<strong>冇真假可言，只係接受唔接受</strong>——佛系、0尊、「你哋鍾意嘅 6-7」（講者似乎話某啲例子可能已經唔再係規創，佢唔敢講；錄音不清）；⭐ 規創嘅意義經過一段時間運用之後，<strong>會變成有真假可言嘅字詞定義</strong>（傳統廣東話用法有冇咁，本課程唔討論）。（[43:18]–[44:27]）<ul>\n<li><strong>蘇絲黃</strong>：較舊派嘅文學用語，西方人眼中（亞洲女性）嘅性形象，代表某種文化、某種性別——<strong>有真假可言</strong>。（[44:27]–[45:03]）</li>\n<li><strong>王老五</strong>（邏輯書常見）：英文 <strong>Bachelor</strong> 有歧義——可以指 UG degree，亦可以指未婚嘅單身男人；喺香港 context 大家嘅 bachelor 都係 UG，但原本個字有第二個意思。（[45:03]–[45:29]）</li>\n</ul>\n</li>\n<li>⭐ <strong>釐定的定義</strong>：牽涉含混字眼（咩叫太快、咩叫太慢）——社會只係大概畀一個應用範圍：（[45:29]）<ul>\n<li><strong>法定年齡</strong>：唔同國家唔同（16、17、18、20、21）；喺香港 18 歲係法定年齡，你 17 歲 11 個月做成年人先做得嘅嘢就<strong>犯法</strong>；但從分析哲學角度，<strong>「18 歲」本身冇真假可言</strong>——係社會約定出嚟嘅。「我 17 歲 364 日同 18 歲有咩分別？」——喺呢個角度冇分別。（[46:02]–[47:15]）</li>\n<li><strong>超速</strong>：一條路架車應該行幾快係運輸署定嘅——叫太快定太慢？冇真假可言。（[46:38]–[47:15]）</li>\n<li>呢啲係社會運作需要嘅；可以判斷<strong>恰唔恰當</strong>，但冇真假——即係討論時唔當佢係概念或事實，而係評價。（[48:10]）</li>\n<li>⭐ 同問題分類嘅關係：「<strong>什麼是法定年齡？</strong>」→ <strong>概念問題</strong>；「<strong>香港的法定年齡是 18 歲嗎？</strong>」→ <strong>事實問題</strong>；「<strong>香港的法定年齡是 20 歲嗎？</strong>」→ 都係<strong>事實問題</strong>；「<strong>香港的法定年齡定在 18 歲合理嗎？</strong>」→ <strong>評價問題</strong>。分析哲學會拆開：係咪 18 歲？係（事實）；未到 18 歲係咪犯法？係；差兩日咋，點解犯法？→ 評價（合唔合當）。（[48:10]–[49:20]）</li>\n<li><strong>合適每週工作時間</strong>：咩叫合適？冇真假可言，只係判斷。（[49:20]）</li>\n<li>⭐ 點解冇真假可言？「<strong>全部人為嘅</strong>」——人類制定出嚟嘅嘢，係咪客觀？有冇真假可言？冇；合唔合當？可以傾。（[49:59]）</li>\n<li><strong>香港十大傑出青年</strong>：候選人資格 21–40 歲——冇真假可言，可以傾合唔合理：有同學覺得 40 太高（30 歲就唔好扮青年），亦有人覺得下限太高（應該 15 歲開始；講者：下限高冇所謂，等多幾年就得）；「傑出」「貢獻」「成就」都好含混、好歧義（錄音作「幸運」「奇異」）；講者解釋點解設咁高：要「傑出」需要時間；得獎名單通常三十幾歲、運動員居多（事業周期唔同），商界 40 歲前好難。講者強調問你「有咩 achievement」唔係用著色字眼，亦唔好理解成評價問題。（[50:45]–[57:44]）</li>\n<li><strong>香港貧窮線</strong>：以前 = 按住戶人數，住戶收入中位數嘅 50%（例如中位數 4 萬 → 低過 2 萬就係窮）；講者話政府而家搞「精準扶貧」，貧窮線冇咗幾個月；佢用舊數字講笑（例如一人住戶約 $5,000、三人住戶約 $19,500；錄音略不清）——社會政策合唔合理可以傾。（[57:44]–[62:58]）</li>\n</ul>\n</li>\n<li>⭐ <strong>字詞定義</strong>（分析哲學家要強調嘅）：<strong>消除歧義</strong>、講得出被界定端嘅意思——<strong>冇講多、冇講少</strong>，描述被界定端應該有嘅定義；有真假可言，準則好簡單：（[62:58]–[64:17]）<ul>\n<li><strong>唔可以太闊</strong>：將唔應該歸類為呢個概念或事物嘅嘢包埋入去——「鳥 = 有翅膀的動物」→ 包咗<strong>蝙蝠</strong>。（[64:17]–[65:34]）</li>\n<li><strong>唔可以太窄</strong>：反過嚟將應該喺嗰個類別入面嘅事物踢走——「鳥 = 有羽毛會飛的動物」→ 排除咗<strong>駝鳥</strong>。（[65:34]–[66:13]）</li>\n<li><strong>唔可以循環</strong>：「心理學是研究心理相關的學科」。（[66:13]）</li>\n</ul>\n</li>\n<li>「乜嘢係鳥？」唔透過定義方法都可以<strong>舉例</strong>：麻雀係鳥、（錄音不清）係鳥、駝鳥都係鳥——呢啲係日常生活用嘅方法；定義就係概念上講呢個鳥嘅物種有咩特質（定義緊鳥呢個物種，唔係「鳥」呢個中文字）。（[66:52]–[67:19]）</li>\n<li>⭐ <strong>心理學例子</strong>：你 enroll 到 Psychology course，朋友排咗四年都入唔到，問你「咩係 psychology？」——答「心理學就是研究心理相關的學科」：「<strong>冇錯</strong>」，但佢只係講出你喺字面上本來就睇到嘅意思。講者（為安全起見唔引（錄音不清）嘅 definition，怕學生話佢空廢）改引維基百科：「心理學是一門研究人類和動物的心理現象、意識和外在行為的科學」——多咗好多嘢：係一門<strong>科學</strong>（唔係其他學科）；包括人類同動物；中英文 wiki 都強調 scientific study、mind and behavior、conscious 同 unconscious；英文 wiki 再 spell out 心理現象：thoughts、feelings、motives，以及 crossing the boundaries of natural science and social science。講者話呢個定義同佢教嘅內容未必完全吻合（下個 topic 講嘅科學主要係 natural science）。（[67:49]–[71:21]）</li>\n</ul>\n<h2 id=\"lec-h83\">重點澄清</h2>\n<ul>\n<li>⭐ <strong>內涵有決定性</strong>：分析哲學家理解世界——概念行先，先有概念再睇外延；外延由內涵決定，調返轉唔得。（[02:46]–[03:17]）</li>\n<li>⭐ <strong>唔考 ≠ 唔啱</strong>：第三個關係唔考，但講者話由第一、二個關係都推論到「內涵固定 → 外延固定」；佢主要唔同意嘅只係 reading 將「人」（冇時間性）同「活人」（淨係現在）分開處理。（[03:17]–[04:46]）</li>\n<li>⭐ <strong>講者立場</strong>：喺分析哲學（近科學）角度，概念如果冇特別加時間（加時間 = 加內涵），就包括過去、現在、未來；「人」同「活人」都唔應該帶時間性。將「人」理解為有時間性（當下）係存在主義、佛教（無我）嘅講法。（[04:46]–[07:52]）</li>\n<li>⭐ 外延唔會因為「發現」而增加：新發現嘅生物一直都喺外延入面；發現者係按內涵搵到外延，唔係改內涵；大部分概念都係非完整外延。（[17:04]–[18:31]）</li>\n<li>⭐ 第四個關係係用嚟喺<strong>唔知內涵</strong>時，由外延嘅變動<strong>推論</strong>內涵反向改變；但要分清楚你諗緊嘅係邊個概念（合資格申請 vs 實際獲獎）。（[20:01]、[23:01]–[23:36]）</li>\n<li>⭐ <strong>規創 → 接受與否；釐定 → 恰當與否</strong>：兩者都<strong>冇真假可言</strong>（一個因為創新，一個因為含混、靠社會約定）；只有字詞定義有真假，所以分析哲學強調字詞定義。（[42:49]–[43:18]、[48:10]、[62:58]–[63:45]）</li>\n<li>⭐ 定義嘅分類同問題分類一樣，都係用嚟劃出分析哲學<strong>唔處理</strong>嘅範圍（評價、事實），集中處理概念問題。（[41:46]–[42:16]）</li>\n<li>⭐ 循環定義嘅毛病唔係「錯」，而係冇講到字面以外嘅嘢；好嘅定義要講出內容（例如維基「心理學」定義）。（[68:20]–[69:00]）</li>\n<li>⭐ 用字要小心：講者問「你有咩 achievement」時特別澄清唔係用著色字眼、唔係評價問題；奧運沿用「2020」嘅「紀念疫情苦難」講法就係著色嘅表達。（[29:34]、[55:33]）</li>\n</ul>\n\n<hr>\n<h1 id=\"lec-h84\">課堂 2026-10-09（Module 3：定義收尾——先有內涵再睇外延、定義練習；意義判準開始：認知意義、真值、分析／綜合述句）</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h85\">考試提示</h2>\n<ul>\n<li>⭐⭐ <strong>MC = ABCD 四個 option；T/F 示範題</strong>：同學要 sample questions，講者：「我考試如果我出 ABCD，就 ABCD 四個 option」；T/F 就好似問「『正方形為四條邊的圖形』——呢個定義太闊嗎？」（答案：太闊，見下）。（[11:29]–[12:59]）</li>\n<li>⭐ <strong>避開動物／寵物相關題</strong>：講完「家屬」定義之後，講者話知道大家同屋企寵物關係好密切，「呢啲我都會醒目避開」、「盡量會避免問啲動物相關」。（[15:17]）</li>\n<li>⭐ <strong>重言句 vs 恆真句：考試會附註</strong>：唔同書對「重言句係咪等於恆真句」講法唔同；「考試的話，我自己如果會問到，我會打一個 remark」——純粹資料參考。（[53:21]–[54:42]）</li>\n<li>⭐ <strong>「水的化學式」呢類會避開</strong>：喺分析哲學框架，水嘅化學式屬綜合述句（問佢係事實問題）；「不用擔心，我講了很多次，考試我會避這些」。（[66:40]–[67:50]）</li>\n<li>⭐ <strong>意義判準 = 期中前最後一個 topic、上半個 course 嘅重點</strong>：「midterm（錄音作「bid term」）前的最後一個 topic……這個 course 前半部分的重點」。（[43:19]）</li>\n<li>有爭議、冇標準答案嘅 Mentimeter 題：「人是理性的動物」——「沒有準確答案」；「獨角獸」——「這個應該都沒有絕對的了」。（[16:48]、[24:23]）</li>\n</ul>\n<h2 id=\"lec-h86\">課堂例子</h2>\n<h3 id=\"lec-h87\">先有內涵、再睇外延（重溫＋理想伴侶）</h3>\n<ul>\n<li>（重溫上堂）分析哲學家睇世界嘅方法：<strong>先有內涵（知識），再睇世界有啲咩</strong>——嘗試向科學靠攏；創新時先有內涵概念，世界冇嘅話可以創造。（[00:06]–[00:34]、[02:41]）</li>\n<li>（重溫上堂）科學角度：內涵不變、外延有改變——九大行星變八大行星（錄音作「恆星」），即係承認過往判斷冥王星（錄音作「王星」）係咪符合行星內涵定義時<strong>犯咗錯</strong>；「犯了錯沒問題的」，肯同人講自己錯就係科學精神；批判思考可以錯，最重要係認。（[01:08]–[01:38]）<ul>\n<li>🔗（筆記對照，唔係講者原話）slides 原則：「內涵固定則外延固定」。講者呢度講嘅「外延改變」係指修正咗過往嘅判斷錯誤；考試問嗰條原則就跟 slides 答。</li>\n</ul>\n</li>\n<li>預告 Module 6：人最大嘅問題唔係錯，係<strong>雙重標準</strong>；最嚴重嘅 double standard 係「<strong>搬龍門</strong>」——把尺今日同昨日唔同，所以永遠唔會錯。（[01:38]–[02:41]）</li>\n<li>⭐ <strong>理想伴侶</strong>：你有一張擇偶條件（同自己性別唔同、年齡差距 ±3 歲、咩 major、CGA……）= <strong>內涵</strong>；<strong>條件越多，通常選擇越少</strong>——「但去到某個位可以是一樣的」：例如其中一個條件係對方財產要多過 Elon Musk（錄音作「EI Mass」），咁再加不合理條件都唔再影響你嘅擇偶 pool（本來世界上就冇呢樣嘢；錄音略不清）；不過講「人」係包括未來，「永遠有機會有人有錢過 Elon Musk」——你仍然可以有呢個內涵要求。（[05:34]–[07:19]）<ul>\n<li>🔗（筆記對照）= slides「內涵遞增，外延<strong>不遞增</strong>（可以保持不變）」。</li>\n</ul>\n</li>\n<li>手機入面有張十個條件嘅 wish list，第一日認識一個人佢喺 list 度，了解多兩個禮拜就 scroll out 佢——即「先有內涵、再喺世界搵外延」，講者稱之為現代好 <strong>KPI 式</strong>嘅處理手法；「我們不評價這種方法是好還是壞」。（[07:19]–[08:26]）</li>\n<li>感情關係：咁樣搵伴侶，除非內涵要求好低，否則符合條件嘅對象好少；「沉船」= 思考斷線，冇批判思考；timing 好重要，批判思考幫唔到你；「對的人」個「對」字好含混。每次 execute 批判思考其實係限制緊自己發展關係；就算李天命話要將批判思考放入日常生活，<strong>都係睇 context</strong>——要好認真思考就用，處理人際、感情、家庭關係唔一定下下咁用。（[08:51]–[11:29]）</li>\n</ul>\n<h3 id=\"lec-h88\">⭐ 定義練習（Mentimeter／sample questions）</h3>\n<ul>\n<li>⭐⭐ 「<strong>正方形為四條邊的圖形</strong>」→ <strong>太闊</strong>：判斷太闊 = 會包咗唔應該係正方形嘅嘢入去，例如<strong>長方形</strong>。（[12:10]–[12:59]）</li>\n<li>⭐ 「<strong>家屬</strong>指的是父母、兄弟」（題目原文錄音不清）→ 家屬仲有兄弟姊妹、祖父母，「你講多兩個都得」；「阿爺阿嫲（錄音作「阿爺阿媽」）唔算家屬呀？<strong>排除咗佢哋在外</strong>」→ 即<strong>太窄</strong>（錄音作「太雜」，按上文應為「太窄」）；帶男／女朋友見家長都要小心有冇排斥咗佢做家屬。（[12:59]–[14:40]）</li>\n<li>⭐ 但如果改做「家屬指的是父母兄弟姊妹<strong>等等</strong>」或者「家屬指的是<strong>例如</strong>父母兄弟」→ 係<strong>舉例說明（非完整外延）</strong>——「講唔晒㗎嘛」，可以係合理定義。（[14:40]–[15:17]）</li>\n<li>⭐ 「<strong>人是理性的動物</strong>」（太闊／太窄／循環／合理定義？）——講者：「<strong>沒有準確答案</strong>」；佢教咗幾年，今年係第一年全班傾向答「合理定義」（2020 年疫情時得約 60 人，「被西方哲學家荼毒」，覺得「人唔係理性㗎咩」）。（[16:48]–[17:53]）<ul>\n<li><strong>唔係循環</strong>：循環即係「人」= 「理性」，兩個概念可以互換——但 AI 都係理性，互換就變成「AI 是人」。（[17:53]–[19:27]）</li>\n<li>⭐ 判斷合唔合理，其實返去 Module 2 問題分類嘅概念問題「<strong>理性是什麼？</strong>」——用定義方法諗「理性」嘅內涵：會唔會包括唔應該包括嘅嘢（太闊）、會唔會排斥應該係人嘅嘢（太窄）。（[19:27]–[20:28]）</li>\n<li>太闊：如果以「能夠使用工具」等智能做理性內容，外延就包括某啲智能相對高嘅物種。（[20:28]–[21:09]）</li>\n<li>⭐ 太窄：<strong>排斥咗嬰兒</strong>（「我通常舉例」）——生物學上 BB 仔係人類嘅幼年期 = 人；如果你將「理性」理解為要為自己行為負責（牽涉社會政策討論，好似 18 歲成年嘅標準），就可以將 BB 仔排斥喺你嘅「人」概念之外 → 兩種「人」嘅理解唔同，透過定義釐清大家對「人」嘅了解唔一樣。（[21:09]–[24:23]）</li>\n</ul>\n</li>\n<li>「人是理性的動物」同「獨角獸」都係西方哲學常用（但好舊）嘅例子。（[24:23]）</li>\n<li>⭐ 「<strong>心理學是研究心理相關的學科</strong>」→ <strong>循環</strong>：你冇讀過心理學，問一個讀緊 UST psychology course 嘅朋友，佢咁答你——第一印象係「空廢」、<strong>冇訊息內容</strong>、冇講過嘢畀你聽；對比「研究人類和動物的心理現象、意識和外在行為的科學」——起碼提供咗訊息內容（人、動物、心理現象、外在行為；「科學」亦係一個 concept）→ 唔循環。（[25:21]–[26:28]）</li>\n<li>⭐ 「<strong>獨角獸是頭上有一隻長角、有馬的身體的動物</strong>」（講者：「這個應該都沒有絕對的了」）：（[24:23]–[32:42]）<ul>\n<li>揀「循環」：講者認為<strong>唔合理</strong>——「獨角」有冇 locate 到喺身體邊個部分？冇；「獸」一定係馬？唔一定 → 成個界定端有提供訊息內容。（[26:28]–[27:37]）</li>\n<li>揀「<strong>合理定義</strong>」：可以——講明係<strong>西方神話既有嘅形象</strong>，跟返嗰個定義；溝通時先講清楚「我講嘅獨角獸係西方神話入面嗰個形象」，「你咁 present 出嚟就冇錯」（講者提到合理定義嘅原因同某種已定嘅屬性有關；錄音不清）。（[27:06]–[29:12]）</li>\n<li>呢個定義亦「頗有歧視成分」：角要長、要馬嘅身體——驢仔（錄音作「雷仔」）同駱駝都唔得。（[27:37]–[28:07]）</li>\n<li>對方話<strong>太闊</strong>：包咗犀牛（錄音作「西牛」）？——「長」係<strong>含混</strong>嘅。（[29:12]–[29:53]）</li>\n<li>對方話<strong>太窄</strong>：現代生物學角度任何有單一隻角嘅動物（有同學舉獨角嘅魚；錄音不清）；高達 fans：「獨角獸」係一部高達；讀 Econ：「獨角獸」係市值去到某個位嘅公司。（[29:53]–[32:02]）</li>\n<li>⭐ 結論：透過內涵外延嘅關係，可以釐清大家係咪企喺同一個平台——大家講嗰樣嘢時<strong>外延唔一樣，就反推內涵會唔一樣</strong>；<strong>定義嘅價值主要係釐清歧義</strong>：究竟大家講緊乜嘢獨角獸、對「人」嘅定義係咪相同。（[31:29]–[32:42]）</li>\n</ul>\n</li>\n<li>釐清 = 先企喺同一個平台（問題分類嘅平台：概念／事實／評價）；分析哲學傳統只可以<strong>嘗試</strong>透過呢個功夫釐清，「但實質上未必成功」→ 所以後來發展到符號邏輯，將所有嘢符號化（講 X、講 Y，先問 X 係咪等於 Y）。（[32:42]–[33:42]）</li>\n</ul>\n<h3 id=\"lec-h89\">⭐ 定義解決唔到嘅爭論：色情電影、人生苦樂</h3>\n<ul>\n<li>「<strong>甚麼是色情電影？</strong>」——用內涵外延嘅提問了解概念：「有裸露鏡頭」？我拍一套拳擊電影，兩個競技者赤裸上身喺擂台肉搏——暴力，唔色情；「赤裸嘅性行為」？著衫算唔算？再釐清做「性行為 = 色情」→ Discovery Channel 好多嘢都變咗色情。（[34:14]–[35:33]）</li>\n<li>⭐ 就算釐清咗色情電影嘅定義，某一套係咪色情電影：電影名、年份、大家坐喺度睇咗都係事實，但「<strong>最後都是有主觀的判斷</strong>」。（[35:33]–[36:03]）</li>\n<li>⭐ 「<strong>人生是苦還是樂？</strong>」——衍生兩類答案（牽涉下個 topic）：（[36:03]–[39:21]）<ol>\n<li>生物學意義嘅人生：IS（綜合科學）教科書形容生老病死嘅生理周期，<strong>冇講過苦定樂</strong> →「在有認知意義的角度去講、科學的角度，<strong>人生既不是苦，亦不是樂</strong>」；唔同意就要講返生物學上喺咩意義之下人係苦／樂。（[36:47]–[38:15]）</li>\n<li>包括經歷、選擇、內疚、驕傲嘅人生：咁就可以講苦定樂——<strong>主觀</strong>；下個 topic 嘅評語：<strong>冇認知意義</strong>，因為呢類人生苦樂嘅論調喺分析哲學系統入面冇真假可言。（[38:15]–[39:21]）</li>\n</ol>\n</li>\n</ul>\n<h3 id=\"lec-h90\">⭐ 一個概念冇外延，係咪代表冇意義？</h3>\n<ul>\n<li>「意義」呢個字本身係<strong>歧義</strong>嘅：要問係咩層面有意義；籠統講，只要喺某一個層面有意義就叫有意義——例如講創新嗰本書（藍色 mind map），冇外延嘅概念有<strong>創新意義</strong>。（[39:21]–[41:10]）</li>\n<li>⭐ 冇外延 = 現實世界搵唔到嗰樣嘢；傳統邏輯書用<strong>獨角獸</strong>：虛構生物、冇外延，但個概念<strong>有意義</strong>——喺分析哲學，有意義代表有真假、畀我哋一種知識。（[41:10]–[42:12]）</li>\n<li>⭐ 例子：男／女朋友生日要一隻獨角獸公仔——你起碼識買隻有角嘅犀牛公仔，唔會買河馬（買河馬就出事）；現實世界冇獨角獸，但獨角獸作為一種知識、一個<strong>純粹嘅內涵</strong>，令我哋了解獨角獸講緊乜，同時知道<strong>咩唔係獨角獸</strong>。（[42:12]–[43:19]）</li>\n</ul>\n<h3 id=\"lec-h91\">⭐ 認知意義：有冇真值</h3>\n<ul>\n<li>分析哲學家：先有概念（知識），再判斷外在事物同腦入面概念嘅契合度（火星上見到一個似男性嘅嘢；收到一件禮物係咪獨角獸形狀）；佢哋用呢套判斷唔同範疇嘅知識有冇價值——「這是一個價值系統，最後是主觀性」：呢班哲學家判斷其他學科係咪喺度探求真理，定係喺度「吹水」；佢哋把尺叫 <strong>Cognitive Meaning（認知意義）</strong>。（[43:19]–[45:43]）</li>\n<li>⭐ 「認知意義」喺其他 critical thinking 範疇都常用，但<strong>分析哲學用嘅定義窄好多</strong>：判斷一個說法有冇<strong>真值 (truth value)</strong>——即係有冇真假可言。（[45:43]–[46:44]）</li>\n<li>⭐⭐ <strong>「真值」有歧義</strong>：日常講「真」就排除咗假；但作為學術用語，truth value 包含<strong>真、假兩個值</strong>——<strong>一句假嘅說法都有真值</strong>。（[46:44]–[47:49]）</li>\n<li>例子：（[47:11]–[51:09]）<ul>\n<li>「香港科技大學位處香港西貢區」→ 真，有真值。（[47:11]）</li>\n<li>⭐ 「史維是香港科技大學現任校長」→ <strong>假——「假的都有真值」</strong>（好似正負數：真嘅 truth value 係真，假嘅 truth value 係假）。（[47:11]–[48:30]）</li>\n<li>「史維是香港科技大學校長」（冇講「現任」）→ 講者：上個 topic 講外延包括過去、現在、未來，<strong>冇特別釐清就用返佢哋嘅框架——真</strong>；日常討論你可以先釐清「你係咪問現任？」。（[48:30]–[49:10]）<ul>\n<li>🔗（筆記對照，唔係講者原話）筆記版 slides 將呢句標為「有真假，但時間闕義」；09-14 講者亦講過「事實問題冇標時間 = 而家」。考試最穩陣嘅考點係：<strong>呢句有真值</strong>。</li>\n</ul>\n</li>\n<li>⭐ 「史維是香港科技大學前任校長<strong>嗎？</strong>」→ <strong>冇真假可言</strong>：問題本身唔係知識，而係要求一個知識（好似參觀嘅小學生問「哥哥姐姐……」）；<strong>答案先有真假</strong>——你答「史維係邊個？冇聽過，所以佢唔係」→ 你個答案係假。（[49:10]–[51:09]）</li>\n</ul>\n</li>\n<li>⭐ 頭三句係<strong>述句</strong>：嘗試對世界有個描述、論斷——提供一種知識，有真假可言。（[49:10]–[50:00]）</li>\n<li>⭐ 意義判準之下：<strong>一個說法需要談得上真假，先有認知意義</strong>。（[51:09]–[51:41]）</li>\n</ul>\n<h3 id=\"lec-h92\">⭐ 分析述句 vs 綜合述句</h3>\n<ul>\n<li>⭐ 有認知意義有兩個可能：① 透過<strong>語句分析</strong>檢測到真假 → 相對於<strong>概念問題</strong> → 歸類為<strong>分析述句</strong>；② 透過<strong>經驗方法</strong> → 相對於<strong>事實問題</strong> → <strong>綜合述句</strong>。Module 2 係由問題嘅角度講，呢個 topic 係由答案／知識層面講。（[51:41]–[52:47]）</li>\n<li>⭐ 分析述句主要三類，第一類<strong>恆真句 (tautology)</strong>：必然地真。「外面有下雨或者沒有下雨」——你唔使郁、唔使出去睇；「外面有下雨」先要經驗方法（行出門口睇）。（[52:47]–[56:23]）</li>\n<li>⭐⭐ <strong>問「外面有沒有下雨？」→ 答「外面有下雨或者沒有下雨」= 絕對空廢</strong>：懶得出去又唔想講錯，就講啲冇信息內容、必然真嘅嘢；我唔可以話你錯；<strong>你個答案有認知意義</strong>（有真假可言、係真）——空廢係你犯咗嘅「另一個毛病」，但純粹喺意義判準角度，你呢句係真。（[56:23]–[58:16]）</li>\n<li>諗下呢句喺咩情況下係假？舉唔到例——「你要定義一件事定義不到就舉例；你舉不到例，有沒有問過自己為何舉不到例」；好似「親生父母年紀一定比你大」，了解字詞就知答案；「外面有下雨或者沒有下雨」甚至唔使知咩叫外面、咩叫落雨，只要知「有」係「冇」嘅相反、同「或者」——透過語句形式就知必然真。（[58:16]–[61:04]）</li>\n<li>「他是年輕人，則他不可能是老人」：你可以話佢肉體年輕、心境老——釐清後（都講生理、生命周期）兩者唔可以同時發生 → 必然真。⭐ <strong>必然真嘅嘢係有認知意義嘅</strong>。（[61:04]–[62:16]）（⚠️ 10-12 講者承認呢個例子唔好，見 10-12）</li>\n<li><strong>矛盾句</strong>：「外面有下雨同時沒有下雨」「他同時是年輕人又是老人」→ 冇可能發生，<strong>必然假</strong>。恆真句論斷兩個情況、包括所有情況、二取其一 → 必然真；矛盾句論斷兩個冇可能同時發生嘅事。（[62:16]–[63:36]）</li>\n<li>⭐ 第三類「<strong>語義界定</strong>」——「爭議大一點」（返去呢個 course 第一個爭議：白雪公主可唔可以係男人）：Module 4–5 符號邏輯完全冇呢個問題（唔牽涉具體內容，只睇語句／推論形式）；但要將分析哲學用喺日常語言，就容許透過語義（字典、數學 theorem by definition）判斷真假——問題係我哋會忘記或者懶得搵返點解王老五係未婚漢。（[63:36]–[65:18]）<ul>\n<li><strong>王老五是未婚漢</strong>（bachelor = 未結婚嘅男性，英文字典定義）→ 真；<strong>神奇女俠是男性</strong> → 假（美漫形象係女性；男嘅你叫「神奇男俠」，冇理由用人哋個名）；<strong>白雪公主是女的</strong> → 真、「白雪公主是男的」→ 假——公主查字典係女性，王子係男性。（[65:18]–[66:40]）</li>\n</ul>\n</li>\n<li>⭐ <strong>水的化學式</strong>：喺分析哲學框架屬<strong>綜合述句</strong>，問「水的化學公式是什麼」係<strong>事實問題</strong>（考試會避）；唯一例外：將 H₂O 當成約定俗成、大家唔會改嘅定義（語意界定角度）→ 可以係分析述句／概念問題；但傳統上佢哋堅持係綜合——「即係你背咗答案」。（[66:40]–[67:50]）</li>\n<li>⭐ <strong>綜合述句</strong>（要經驗事實分辨真假）：（[67:50]–[72:59]）<ul>\n<li>「<strong>地球上有生命</strong>」（綜合真句）：唔係必然——上帝全善唔會咁做，但人類有可能令地球冇生命（某啲領導人玩核戰，蟑螂都冇埋）；機會率幾高都好，都要經驗事實支持——最簡單：舉手話「我係一個生命，我企喺地球」。（[67:50]–[70:30]）</li>\n<li>「<strong>HUMA 1710 is a H-CC</strong>」（綜合真句）：佢「而家」係 H-CC、唔係 S-CC；講者做 TA 嗰陣仲未有 common core；之後會唔會係，唔知——同「地球上有生命」比，改變嘅落差易好多（課程由 Common Core Director 自己教）。（[69:54]–[71:07]）</li>\n<li>「<strong>地球是平的</strong>」（綜合假句）：有冇可能係真？「你真係低估人類嘅破壞力」——用晒地球上所有炸藥炸到佢平為止。（[71:07]–[72:26]）</li>\n<li>「<strong>HUMA 1710 is an A-CC</strong>」（綜合假句）：好多人俾 course title 個「Art」誤導——「你 art 錯，thinking 都唔 art」。（[72:26]–[72:59]）</li>\n<li>「假嘅可唔可以變真？」留待下堂；概念上分析同綜合有三個唔同嘅地方（下堂講）。（[72:59]）</li>\n</ul>\n</li>\n</ul>\n<h2 id=\"lec-h93\">重點澄清</h2>\n<ul>\n<li>⭐ <strong>分析哲學家睇世界：先有內涵（概念、知識），再睇世界有冇（外延）</strong>——呢個係嘗試向科學靠攏。（[00:06]–[02:41]）</li>\n<li>⭐ 定義重溫：<strong>規創</strong>（創新）→ 冇真假，淨係得接唔接受；<strong>釐定</strong> → 同含混字眼相關，冇真假，睇恰唔恰當；<strong>字詞定義</strong> → 消除歧義，<strong>有真假可言</strong>。（[02:41]–[03:47]）</li>\n<li>⭐⭐ <strong>字詞定義嘅「真」= 認知意義之下嘅真 = 唔太闊、唔太窄</strong>，啱啱好包含到所有佢應該描述嘅事物。（[03:47]–[04:18]）</li>\n<li>⭐ 太闊 = 包咗唔應該包嘅嘢入去；太窄 = 排斥咗應該包嘅嘢。（[12:59]、[20:28]）</li>\n<li>⭐ 判斷循環：睇界定端有冇提供訊息內容——「心理學是研究心理相關的學科」冇；「獨角獸……」有。（[25:21]–[27:37]）</li>\n<li>⭐ 外延唔同 → 反推內涵唔同；定義嘅價值主要係釐清歧義、令大家企喺同一個平台——但未必成功。（[31:29]–[33:16]）</li>\n<li>⭐ 有啲爭論定義解決唔到（色情電影、人生苦樂）——最後係主觀判斷。（[35:33]–[39:21]）</li>\n<li>⭐ 冇外延 ≠ 冇意義（獨角獸）；「意義」本身有歧義。（[39:21]–[43:19]）</li>\n<li>⭐⭐ 真值包括真同假；問句冇真值、答案先有；<strong>談得上真假先有認知意義</strong>。（[46:44]–[51:41]）</li>\n<li>⭐ 恆真句 vs 重言句：講者自己將<strong>重言句</strong>淨係用嚟講「A 就是 A」（字面重複）；兩者有重疊（都必然真），但重言句未必包括「外面有下雨或者沒有下雨」；唔同書有唔同講法。（[52:47]–[54:42]）</li>\n<li>⭐ <strong>概念先於事實</strong>：純粹語句分析時，未需要接觸世界發生咩事。（[54:42]–[55:16]）</li>\n<li>⭐⭐ <strong>空廢 ≠ 冇認知意義</strong>：絕對空廢嘅答案係必然真、有認知意義；空廢係另一個毛病。（[57:38]–[58:16]）</li>\n<li>⭐ 恆真句、矛盾句靠<strong>語句形式</strong>判斷；語義界定係為咗將分析哲學用落日常語言而容許，<strong>爭議較大</strong>。（[63:36]–[64:44]）</li>\n<li>犯錯冇問題、要認；最嚴重嘅雙重標準係搬龍門（Module 6 再講）。（[01:38]–[02:07]）</li>\n</ul>\n\n<hr>\n<h1 id=\"lec-h94\">課堂 2026-10-12（Module 3 意義判準：真理＝有真假可言；修正恆真句例子；析合區分三個分別；四個驗證原則——檢證 → 印證）</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h95\">考試提示</h2>\n<ul>\n<li>⭐⭐ <strong>題目可以好簡單，唔好懷疑自己</strong>：做 Mentimeter 練習前：「如果考試我問過這麼簡單，你們就不要疑惑了」（「卷是未出的」）。（[44:42]）</li>\n<li>⭐⭐ <strong>填答題紙要對準題號</strong>：「小心啦考試嘅時候……True or False 呀，自己搵把間尺對住」——唔好將第 25 題嘅 True 填咗落第 26 題。（[45:50]）</li>\n<li>⭐ <strong>MC 用排除法</strong>：MC 有四個答案 ABCD——你唔知邊個啱，但知道 C、D 一定錯，已經係「畀自己一個信息內容」，至少篩選到 A、B 係合理；知道「錯」都係知識。（[04:26]–[05:01]）</li>\n<li>T/F（錄音略不清）：大意係答 True 要好肯定佢係 true；如果你覺得佢冇可能係假，就等於直接證明咗佢係啱。（[03:57]–[04:26]）</li>\n<li>「Module 3 10 月 23 日考唔考？」——講者只係用嚟做恆真句／矛盾句嘅例子（答「考或者唔考」／「考嘅時候同時唔考」），<strong>唔係範圍公佈</strong>；範圍見 10-16（Module 2 + 3）。（[23:53]–[24:28]）</li>\n<li>符號化（「X or not X」）係考完 mid-term 之後 Module 4–5 嘅內容；「描述嘅嘢只要有一樣係假，成句假」講者話「明顯還沒教過」，M4 先講。（[07:34]、[48:43]–[50:09]）</li>\n</ul>\n<h2 id=\"lec-h96\">課堂例子</h2>\n<h3 id=\"lec-h97\">⭐ 「真理」＝有真假可言（假嘅都得）</h3>\n<ul>\n<li>今日 topic（意義判準）主要答返課程初段問過嘅兩條問題：批判思考要辨識嘅真理係乜？點解佢比某啲「超越的存在」更可信？（[00:06]–[00:40]）</li>\n<li>⭐ 上堂講過：有真假可言嘅嘢就係真理。「香港科技大學位處香港西貢區<strong>是假的</strong>」→ 成句係假 → 唔算真理；「香港科技大學位於香港<strong>觀塘區</strong>是假的」→ 成句係真 → 係真理。由於真值只有真同假、冇「部分假」，<strong>任何有真假值嘅說法，rephrase 一下（後面加「是假的」）都會得到一個真理</strong>——「史維是 HKUST 現任校長」是假的，都係一個真理。（[00:40]–[02:56]）</li>\n<li>⭐ 好似科學：做實驗做錯都係 knowledge，可以寫 paper，叫人唔好行嗰條路——真同假兩條路都通向真理、知識；分析哲學強調「至少我講嘅嘢有真假可言」：同一般人 common sense 唔同，<strong>錯都 OK，證明到佢錯、知道嗰個唔係答案就可以</strong>。（[02:56]–[03:57]）</li>\n<li>大部分知識來自綜合性嘅嘢（其他學科），唔係邏輯家嘅處理範圍：綜合述句真定假由唔同學科嘅專家畀答案；邏輯家講到嘅係「搵到嘅知識有冇真假可言」——所以做邏輯家「舒服很多」，失敗都有好多嘢寫。（[05:01]–[06:36]）</li>\n</ul>\n<h3 id=\"lec-h98\">⭐⭐ 講者修正：恆真句／矛盾句嘅例子</h3>\n<ul>\n<li>L1 一位同學落堂指出上堂（10-09）有兩個例子用得唔好，講者同意：（[06:36]–[07:05]）<ul>\n<li>恆真句、矛盾句係分析哲學發展到<strong>符號化</strong>之後都仍然維持嘅兩種分析述句，因為佢哋<strong>唔牽涉世界發生嘅任何事</strong>——只需要知道「或者」「有／冇」等語言表達（唔使知咩叫落雨），同時論斷兩個可能性，加埋 100% 準確；符號化之後只會見到「X or not X」，唔使處理內容。（[07:05]–[08:03]）</li>\n<li>⭐ 唔好嘅係「<strong>他是年輕人，則他不可能是老人</strong>」同「<strong>他是年輕人同時也是老人</strong>」——要靠<strong>語意界定</strong>先知道年輕人、老人係乜（有歧義：心理上 vs 肉體上；要釐清做純肉體上先冇可能同時發生）。（[08:03]–[08:55]）</li>\n<li>⭐ 撇除語言問題嘅改寫：「<strong>他是年輕人，則他不可能同時不是年輕人</strong>」（恆真句句式：同時論斷兩個相反狀況，冇同時發生 → 必然真）；「<strong>他是年輕人，同時也不是年輕人</strong>」（矛盾句，好似「下雨同時沒有下雨」）——即係將「老人家」換成「不是年輕人」。（[08:55]–[10:43]）</li>\n<li>🔗（筆記對照，唔係講者原話）講者 slides（筆記 M3-2）同李天命 reading（筆記 M3-3，「恒真句」「矛盾句」取廣義）都有用「年輕人／老人」嘅例子。考試如問呢兩句係唔係<strong>分析述句</strong>，答案一樣係分析（必然真／必然假）；講者嘅修正係關於佢哋係咪<strong>純粹靠句式</strong>判斷。</li>\n</ul>\n</li>\n<li>語意界定：為咗將批判思考放落日常生活而「勉強」用字典／百科全書嘅意思（傳統邏輯書：bachelor = 未結婚嘅男人；「王老五」／bachelor 本身界定咗唔係女性）；但落到日常生活會衍生問題——字典對男人／女人嘅意思會唔會有性別、角色定型？「唔肯定」；科學家通常唔理呢啲（唔會講「你男子之家點解入我 lab」）；可以透過釐清處理。（[10:43]–[13:51]）</li>\n<li>分析述句小結：恆真句必然真、矛盾句必然假；透過字詞定義（錄音作「自持定義」）——同字詞定義一致係真、相反係假。（[13:51]–[14:27]）</li>\n</ul>\n<h3 id=\"lec-h99\">綜合述句例子（續）</h3>\n<ul>\n<li>「地球上有生命」：經驗方法——你自己就係一個經驗事實；有人想用自己做反例（「喺科大咁多年已經冇生命跡象」）→ 釐清：有呼吸、有心跳就算有生命，唔係講靈魂。（[14:27]–[15:00]）</li>\n<li>「1710 是 H-CC」：經驗事實；點 check？去 Common Core Office（一站式）或 ARO 查。⭐ <strong>幻聽唔算經驗事實</strong>。（[15:00]–[16:03]）</li>\n<li>「地球是平的」（綜合假句）：唔係冇可能——唔使夾到好似薄餅，喺北極、南極向下炸平佢就算平（佢冇講地球平嘅同時仲有生命）；炸完少咗一幅，你都仍然叫佢地球（最多內涵上係「冇咗一幅嘅地球」）→ 有可能發生，難啲出現。（[16:03]–[16:35]）</li>\n<li>「1710 是 A-CC」：而家係假，有冇可能係真？有——講者可以（「好黑箱咁」）自己 approve 做 A；理論上呢個課程近 S 唔近 A；實際唔 co-list A 係因為 H 已經幾百人排隊，加埋 A 怕過千人。（[16:35]–[17:41]）</li>\n<li>⭐ <strong>水的化學式（續）</strong>：分析哲學系統當佢綜合述句（事實問題、經驗事實答案）；另一解釋：當教科書金科玉律、永恆不變，透過語意界定變成分析述句。⭐「<strong>重點是：無論你當它概念問題問，還是當事實問題問，不影響它的答案有真假</strong>」——當分析述句答冇問題、當綜合述句答亦冇問題，都係人類知識嘅一部分；分別只係你覺得嗰個知識係唔變定可以被推翻（可否被推翻稍後講）。（[17:41]–[20:22]）</li>\n</ul>\n<h3 id=\"lec-h100\">⭐⭐ 析合區分嘅三個分別</h3>\n<ul>\n<li>定義好簡單：單從語句分析判斷真假 vs 單從語句分析唔能判斷、要經驗事實。講深啲，三個層面：（[20:22]–[20:51]）</li>\n</ul>\n<ol>\n<li>⭐ <strong>先驗 vs 後驗</strong>（跟返定義）：（[20:51]–[27:23]）<ul>\n<li>判斷真假有<strong>先後</strong>：先睇語句分析做唔做到，做唔到再睇經驗事實——同 Module 2 問題分類一樣係<strong>方法學上嘅先後</strong>：「想東西先想概念，再想事實，最後想評價」。（[20:51]–[21:50]）</li>\n<li>析合區分劃分咗人同世界嘅連繫兩個層面：<strong>先於經驗</strong>（未同經驗世界接觸已經描述到）、<strong>後於經驗</strong>（要同世界接觸後先判斷到）。（[21:50]–[22:21]）</li>\n<li>例：「外面有下雨或者沒有下雨」唔使同世界接觸；股票提示「明天恒指升或者唔升」→ 空廢——「點解一個人可以空廢？佢脫離咗現實世界」；「外面有下雨同時沒有下雨」——Dr Lam 唔係教書時咁講嘢，「你打電話畀 counsellor」。（[22:21]–[23:53]）</li>\n<li>「Module 3 10 月 23 日考唔考？」答「考或者唔考」→ 你會去 Department Head 度投訴：問你問題，冇講過嘢；「考嘅時候同時唔考」——即係咩？兩種答法都同經驗世界無關。（[23:53]–[24:28]）</li>\n<li>⭐ 用先驗／後驗去分，邏輯上排除咗語意界定 → 較近分析哲學：<strong>講分析述句嘅核心只有恆真句、矛盾句</strong>；因為語意界定牽涉大家對先驗／後驗嘅唔同理解（例如水嘅化學式，因每個人知識差異，可以判斷為先驗或後驗）；將批判思考留喺日常語言，用法空間多咗，同時會影響佢本身嘅 definition——但唔影響「水的化學式 H₂O」有真假可言。（[24:28]–[25:34]）</li>\n<li>「地球上有生命」「地球是平的」：都要同世界接觸先判斷到（你自己嘅存在就係一種經驗事實）。有同學話坐喺度就知地球係圓定平——講者：「Good point」，咁你係語意界定緊；「但不影響真假」。（[25:34]–[27:23]）</li>\n</ul>\n</li>\n<li>⭐⭐ <strong>必然 vs 適然</strong>：（[27:23]–[32:38]）<ul>\n<li>「外面有下雨或沒有下雨」必然真、唔容許反例（要釐清時間空間）；「外面有落雨同時冇落雨」必然假。（有同學問 AI，AI 話「上海有落雨而香港冇落雨」——未釐清「外面」喺邊。）（[27:23]–[29:42]）</li>\n<li>「地球上有生命」：機率非常高，「但係分析哲學嘅體系唔係必然真」（好似 Polymarket 買機率好高嘅嘢，都唔係必然）；「1710 由 H-CC 變成唔係 H-CC」就好易——教嘅、approve 嘅、Human（學院）開唔開都係佢，人控制到；「地球是平的」當事實問題睇機率好低；「1710 係 A-CC」有機會改，「可以變嘅」。（[28:59]–[31:24]）</li>\n<li>⭐⭐ 「<strong>可以變的東西就叫做適然</strong>」；用機率 0 至 1 嘅線：分析哲學家只有兩點——<strong>1 = 必然真、0 = 必然假</strong>；<strong>大過 0、細過 1 嘅整個範圍都係適然</strong>。（[31:24]–[32:38]）</li>\n<li>有同學話「球」字本身已語意界定咗佢唔係平（橢圓、美式足球都唔係平）；講者：呢個層面先驗後驗講得出；但個波係咪必然圓？漏氣嘅波仲叫唔叫波？（[31:56]–[32:38]）</li>\n</ul>\n</li>\n<li>⭐⭐ <strong>有冇信息內容</strong>：（[32:38]–[39:20]）<ul>\n<li>「有落雨或冇落雨」冇講過嘢畀你聽——唯一內容係必然真，對世界冇特別描述，冇話你知咩係真理、咩合乎事實；矛盾句（冇可能發生）都只係畀咗你一個矛盾句嘅例子，冇提供任何信息。（[33:37]–[34:16]）</li>\n<li>⭐⭐ 「信息內容」呢個 term 你哋第一次喺<strong>空廢</strong>度聽：有人問你問題，你畀一個空廢、必然真嘅答案 → 冇信息內容。「<strong>留意：（空廢）要求係恆真句，或者叫重言句，必然真；反過來你講必然假就唔係空廢</strong>——雖然矛盾句都冇信息內容，但佢唔符合言詞空廢嘅要求：<strong>言詞空廢要求真嘅回答</strong>」。（[34:16]–[35:29]）</li>\n<li>⭐ 綜合述句要有信息內容：「地球上有生命」——「鬼唔知咩」，但始終講咗嘢畀你聽；「地球上有生命或者冇生命」冇講過嘢。極端例子：你成為第二個上火星嘅香港人，同火星上嘅 Dr Lam 講「地球上有生命」→「哦，原來地球都有生命」，溝通到；講「有生命或者冇生命」→ 佢會覺得地球人講嘢好奇怪。（[35:29]–[36:40]）</li>\n<li>⭐ 「<strong>Dr Lam 屋企隻貓係用四隻腳行路</strong>」→ 冇乜特別，但<strong>就算內容幾微不足道都好，都提供咗信息內容</strong>；「隻貓用四隻腳行路或者唔係用四隻腳行路」→ 分析真句，冇內容（只要知道「有或者冇」、「有同時冇」就判斷到）。（[36:40]–[38:35]）</li>\n<li>⭐⭐ <strong>答題策略</strong>：有冇信息內容同先驗後驗相似，都會牽涉語意界定問題（例如「地球是平的」——你話係球、冇可能平，覺得佢係假）——<strong>懷疑係咪冇信息內容時，就問自己係必然定適然</strong>；「對於我來說，三個分辨的方法，<strong>必然和適然的分化應該是最實在的</strong>，因為是連繫到統計學、機率問題」。（[38:35]–[40:02]）</li>\n</ul>\n</li>\n</ol>\n<ul>\n<li>「波係圓的」：撇除俗語（「波係圓嘅」講緊唔好放棄），客觀描述個波係圓；點解要撇開語意界定去諗？買架百萬嘅車，brake 踩兩下就斷？社會實際操作要做 QA——你可以話語意界定上 brake 係用嚟煞車、最重要，唔應該偷工減料；你覺得呢啲 take it for granted，係受人類文化影響（例如見到某品牌名、「中國香港製造」就覺得冇問題；錄音不清）——邏輯提醒你：嗰件事係咪<strong>必然</strong>？「批判思考的析合區分，就給大家一個思考工具去想」。（[40:02]–[42:26]）</li>\n<li>⭐⭐ Mentimeter：「<strong>一個述句冇信息內容，係咪代表佢冇意義？</strong>」——「意義」有歧義；喺意義判準、析合區分嘅架構入面係<strong>有意義</strong>：冇信息內容代表佢一係必然真、一係必然假，<strong>至少有真假可言</strong> → 呢個課程教嘅意義判準下有意義；一件事至少要有真假可言，我哋先值得了解佢。（[43:18]–[44:42]）</li>\n</ul>\n<h3 id=\"lec-h101\">⭐ Mentimeter 練習：邊一種述句？</h3>\n<ul>\n<li>「<strong>地球是平的</strong>」→ <strong>綜合假句</strong>：要透過經驗事實判斷地球係咪平。（[45:50]–[46:24]）</li>\n<li>「<strong>地球上有人類居住</strong>」→ <strong>綜合真句</strong>：「千萬不要想共識的角度」——地球上有人係必然真嗎？地球歷史大部分時間冇人，而家有 → 唔係必然；想 argue「分析真句」嘅同學：你望下隔籬有冇人——「你一轉過頭就有了」，用肉眼睇就係經驗事實方法。（[46:24]–[48:43]）</li>\n<li>將兩句「擺埋一齊」（似係「地球是平的而且有人類居住」；錄音不清）→ <strong>假</strong>：「描述的東西只要有一樣是假，成句假——這個是邏輯學定義」（M4 會講：好似串聯電路，一個位斷咗線就唔通電；a and b and c and d and e）。（[48:43]–[50:39]）</li>\n<li>「<strong>地球是平的或者不是平的</strong>」→ <strong>分析真句</strong>（同時論斷兩個相反特性，二取其一）；「<strong>地球是平的而且不是平的</strong>」→ <strong>分析假句（矛盾）</strong>；「有人居住同時無人居住」→ 矛盾。（[50:39]–[51:41]）</li>\n<li>⭐ 分析述句靠語句形式判斷真假；綜合靠<strong>經驗方法</strong>——包括問題分類講嘅方法：observation、用 scientific ground 做 research 都係；⭐ <strong>神秘經驗唔算經驗</strong>；非常個人嘅經驗（例如你覺得自己以一隻貓嘅身份存在）<strong>唔算經驗方法、唔算經驗事實</strong>。（[51:41]–[53:13]）</li>\n</ul>\n<h3 id=\"lec-h102\">⭐⭐ 四個驗證原則（上）：檢證 → 印證</h3>\n<ul>\n<li>⭐ 四個原則其實係<strong>兩組</strong>：<strong>檢證、印證</strong> = 搵資料<strong>證明或者支持</strong>一件事係<strong>真</strong>；<strong>否證、非證</strong> = 搵資料證明或者支持一件事係<strong>假</strong>。（[53:13]–[54:14]）</li>\n<li>背景：分析哲學向科學靠攏；先畀自己一個空間——<strong>分析述句</strong>：做有真假可言研究嘅哲學家、數學家、（講者認為）computer science——都係<strong>必然性</strong>嘅（數學只有一個答案）；其他學科都要同經驗世界接觸。（[54:14]–[56:56]）</li>\n<li>⭐ 先撇除連真假都冇嘅嘢，定個最基本標準：一個學科研究嘅知識<strong>必須有認知意義</strong>；⭐ <strong>四個原則都係處理綜合語句，唔處理分析語句</strong>（分析語句唔需要任何經驗事實支持）。（[56:56]–[57:47]）</li>\n<li>⭐ <strong>檢證原則</strong>：原則上有可能由經驗方法被<strong>證明為真</strong> → 有認知意義；原則上冇可能 → 冇。例子：（[57:47]–[61:51]）<ul>\n<li>「<strong>有一隻天鵝是白色的</strong>」：有真假可言，唔係分析地真；點證明？去動物園（順便約人出街）。（[57:47]–[58:57]）</li>\n<li>「<strong>有一個同學在 HUMA 1710 mid-term 拿到滿分</strong>」：未來嘅事，原則上可以——考完試 score 唔會公開，但原則上睇講者個 Excel 就答到。（[58:57]–[59:30]）</li>\n<li>⭐ 「<strong>Dr. Lam 2026 年 9 月 7 日下午在 2407 上課</strong>」（講者 highlight；9 月 7 日係星期一第二堂；9 月 11 日先搬課室）——原則上有可能由經驗方法證明為真；「點解我 highlight 呢？講否證嘅時候返嚟講」（見 10-16）。（[59:30]–[61:51]）<ul>\n<li>🔗（筆記對照）筆記版 slides 寫「Dr. Nam 2026 年 9 月 4 日上午在 2407 室上課」——日期唔同唔影響分類。</li>\n</ul>\n</li>\n<li>呢個係起點：了解唔同知識嘅第一步係某說法有可能由經驗方法證明為真；之後慢慢修正。（[60:18]–[62:20]）</li>\n</ul>\n</li>\n<li>⭐⭐ <strong>點解要修正？</strong>「<strong>所有人都有心臟</strong>」vs「<strong>今個學期 HUMA 1710 嘅學生都有心臟</strong>」：對一般人兩句都應該有認知意義。（[61:51]–[64:08]）<ul>\n<li>⭐ 第一個修正：「有可能由經驗方法<strong>證明</strong>為真」→「有可能被經驗證據<strong>支持</strong>為真」——「差了兩粒字，是不是咬文嚼字呢？我不 comment」。（[64:08]–[64:39]）</li>\n<li>⭐⭐ 「<strong>證明</strong>」喺分析哲學家用語 = <strong>100% proof／verify</strong>：描述個別例子（「有一隻天鵝是白色」「有一個同學 1710 mid-term 滿分」）搵到一個例子就證明到；後者理論上仲可以搵晒（得約 300 個同學）。（[64:39]–[66:17]）</li>\n<li>⭐ <strong>封閉集合／有限 sample → 檢證原則冇問題</strong>：「今個學期 HUMA 1710 嘅學生都有心臟」——入讀人數唔係無限（約 300 人），用部機驗下就 100% 確認到 → 根據檢證原則有認知意義。⭐ 「<strong>證明同支持嘅分別就係是否可以 100% 說明</strong>」。（[66:17]–[67:55]）</li>\n<li><strong>非封閉集合</strong>：「所有人都有心臟」——人嘅數量無限多（不斷有人出世）→ 冇可能證明。（[67:55]–[68:28]）</li>\n<li>⭐ 所以第一個改變「非常簡單、非常無聊」：由證明變成支持——只需要提出一啲例子支持佢係真，唔使攞晒所有例子 → 處理到「<strong>所有天鵝都是白色的</strong>」（唔使搵晒所有天鵝影相；越多證據只係提供更高支持度）、「所有科大學生都是男生」（唔係分析）、「所有人類女性都有一對相同的性染色體」。（[68:28]–[69:35]）</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"lec-h103\">⭐ 「連假的都不如」？——重點唔係題材本身</h3>\n<ul>\n<li>⭐ 檢證、印證（同第三、四個原則一樣）嘅作用：判斷語句或理論有冇認知意義；喺分析哲學系統，至少要談得上有認知意義先可以為人類提供知識。（[69:35]–[70:27]）</li>\n<li>⭐ 「連假的都不如」：<strong>將鬼神定義做超驗</strong>（超出人類經驗）嘅學說；<strong>將玄學視為一種無形力量</strong>嘅學說；<strong>將靈魂或者死後世界定義為經驗世界以外</strong>嘅研究——「你見到我嘅描述都多咗一層嘢，我唔係只講鬼神、唔係講玄學」；⭐「<strong>重點是：不是個 subject 本身，是你如何研究</strong>」。（[70:27]–[71:02]）</li>\n<li>例：「上帝存在嗎？」大部分人覺得係概念或評價問題，但可唔可以事實上去睇？鬼神、超自然存在可唔可以透過人類文化歷史嘅記載去支持？例如<strong>朗基努斯之槍</strong>（錄音作「朗基羅斯之槍」）：搵到槍上嘅血、同人類基因圖譜吻合 → 大家同耶穌有血緣關係、證明係以上帝形象創造——「<strong>事實地去講就會令到那件事有認知意義</strong>」。（[71:02]–[72:29]）</li>\n<li>講者自己唔會將玄學視為無形力量嘅學說，而係視為<strong>統計學</strong>（個人睇法）。（[72:56]–[73:25]）</li>\n<li>⭐ 靈魂／死後世界：喺分析哲學系統「<strong>不是不能說</strong>」，要睇你想建立嘅理論表達乜——例如「人死後少咗若干克 = 靈魂嘅重量」：至少呢個 hypothesis 可以透過經驗方法支持（睇自然死亡嘅人死後兩小時內係咪都輕咗幾克）→ 分析哲學系統「不是一開始就不讓你說話」。（[73:25]–[74:20]）</li>\n</ul>\n<h2 id=\"lec-h104\">重點澄清</h2>\n<ul>\n<li>⭐⭐ 真理 = 有真假可言；假嘅說法 rephrase 一下（加「是假的」）就成為真理——分析哲學「錯都 OK」。（[00:40]–[03:57]）</li>\n<li>⭐⭐ <strong>分析述句嘅核心只有恆真句、矛盾句</strong>（符號化後仍然成立）；語意界定係為日常語言而放寬，爭議較大；slides 上「年輕人／老人」兩例要語意界定，唔係純句式。（[06:36]–[11:17]、[24:28]–[25:34]）</li>\n<li>⭐ 方法學先後：概念 → 事實 → 評價；判斷真假先試語句分析，唔得先用經驗事實。（[20:51]–[21:50]）</li>\n<li>⭐⭐ 必然 = 機率 1 或 0；適然 = 0 同 1 之間；可以變嘅就係適然；機率再高（地球上有生命）都唔係必然。（[29:42]–[32:38]）</li>\n<li>⭐⭐ 言詞空廢要求<strong>必然真</strong>嘅答案（恆真句／重言句）；矛盾句冇信息內容但唔係空廢。（[34:16]–[35:29]）</li>\n<li>⭐ 三個分辨方法之中，講者認為<strong>必然／適然最實在</strong>；唔肯定有冇信息內容就問必然定適然。（[38:35]–[40:02]）</li>\n<li>⭐⭐ 冇信息內容 ≠ 冇意義：必然真／必然假都有真假可言 → 有認知意義。（[43:18]–[44:42]）</li>\n<li>⭐ 神秘經驗、極個人嘅經驗、幻聽都唔算經驗方法／經驗事實。（[15:32]、[52:43]–[53:13]）</li>\n<li>⭐⭐ 四個原則只處理綜合語句；檢證 → 印證嘅修正 =「證明」（100%）→「支持」；封閉集合用檢證冇問題，非封閉集合嘅全稱語句要印證。（[56:56]–[69:35]）</li>\n<li>⭐ 分析哲學唔係一開始就禁止講鬼神、靈魂——問題係你點界定、點研究（定義為超驗 → 冇認知意義；可以經驗支持 → 有）。（[70:27]–[74:20]）</li>\n<li>析合區分係一個思考工具：提醒你 take it for granted 嘅嘢係咪真係必然。（[41:51]–[42:26]）</li>\n</ul>\n\n<hr>\n<h1 id=\"lec-h105\">課堂 2026-10-16（期中前最後一堂：意義判準完結——證明 vs 支持、科學 vs 非科學、否證／非證、非知意義；期中安排）</h1>\n<blockquote>\n<p>來源：Whisper 自動轉錄嘅廣東話錄音（有錯字、漏字）；時間係錄音時間。⭐ = 最可能同考試有關；「錄音不清」= 轉錄唔清楚，未能確定原話。</p>\n</blockquote>\n<h2 id=\"lec-h106\">考試提示</h2>\n<ul>\n<li>⭐⭐⭐ <strong>期中安排</strong>：（[58:07]–[59:24]）<ul>\n<li><strong>10 月 23 日（下個星期五）</strong>，喺 <strong>LTB</strong>；<strong>下個星期一（10/19）放假，唔使返嚟</strong>。（[58:07]）</li>\n<li><strong>冇座位表（「冇畫位」）</strong>，隨便坐，但要<strong>隔開坐</strong>。（[53:13]、[58:07]）</li>\n<li>⭐ 「<strong>Cover module 2 and 3；Module 1 唔考</strong>」。（[58:07]–[58:54]）</li>\n<li>⭐ <strong>50 分鐘；「你只會見到 MC 同 True or False」</strong>。（[58:54]）</li>\n<li>⭐ 題數未出：「<strong>我只可以承諾少過 50 題</strong>」——即平均每題至少有一分鐘。（[58:54]–[59:24]）</li>\n</ul>\n</li>\n<li>⭐ <strong>考埋意義判準呢份 PowerPoint</strong>：堂頭：「今日完埋呢個 topic……考試就考埋呢個 PowerPoint」。（[00:03]）</li>\n<li>⭐⭐ <strong>示範 T/F</strong>：「我問你一個理論是沒有認知意義，是否代表沒有意義——<strong>10 秒內你會填 false</strong>」；「一個說法沒有認知意義是否等於沒有（任何）意義 → 你會選 false」——至少喺呢份 PowerPoint 你見到嗰個說法可能有<strong>非知意義</strong>；「唔使一分鐘一題，唔使擔心」。（[59:24]–[59:56]）</li>\n<li>⭐⭐ <strong>T/F 分數少過 MC</strong>：T/F 係一種特殊嘅 MC（只有 A、B 兩個選項），答啱答錯機率 50-50，所以<strong>多過兩個 option 嘅 MC carry 嘅分數會比 T/F 多</strong>（如果唔係，講者怕分數太高；錄音略不清）。（[59:56]–[60:24]）</li>\n<li>⭐ <strong>T/F 題唔好填 C</strong>：「除非你旁邊那個只有 A 和 B，你填 C——有的，每年都有發生」。（[60:24]）</li>\n<li>⭐ <strong>時間</strong>：<strong>9:30 開考</strong>；可以遲到，但<strong>唔可以遲過「9 點 9」（廣東話「九點九」= 9:45）</strong>——因為 9:45 開始其他同學可以離場（避免不必要嘅溝通；過往兩三年有人 20 分鐘左右就做完，「沒有什麼好想的」）。如因清水灣道大塞車遲到，要<strong>自己提供經驗證據</strong>（例如影相：8:15 喺彩虹排隊、9:45 仲喺彩虹排隊），唔好淨係 email 話「我 8:15 已經到」。（[60:59]–[62:40]）</li>\n<li>⭐ <strong>記得帶 ID</strong>。（[62:40]–[63:15]）</li>\n<li>⭐⭐ <strong>上堂用嘅 PowerPoint 同 upload 嘅 PowerPoint「起碼差三分一以上」</strong>——「那三分一重點來的；如果不是，你們上課來做什麼」，要留啲嘢畀上堂嘅人。（[62:40]–[63:15]）</li>\n<li>⭐ 上堂有幫助（USTSpace 評語話講者「最鍾意考上堂同人傾嗰啲嘢」），但「所有問題你不上課的話，如果你對這些 concept 是很熟悉的話，你都是可以答對的」——講者嘅承諾：唔上課，了解到課程教嘅嘢都答到。（[64:01]–[65:30]）</li>\n<li>有問題：堂尾仲有十分鐘可以問，或者<strong>下星期四（10/22）去講者辦公室</strong>問。（[63:15]）</li>\n<li>講者話 Canvas 已喺 10:00 定時 post 咗「最重要嘅嘢」（相信同期中安排有關；錄音未講明內容）。（[57:34]–[58:07]）</li>\n</ul>\n<h2 id=\"lec-h107\">課堂例子</h2>\n<h3 id=\"lec-h108\">⭐ 點解要由「證明」放寬到「支持」？</h3>\n<ul>\n<li>⭐ 「證明」= 搵到<strong>所有</strong>證據證明一件事係真；但人類建立知識系統時好少淨係想理解<strong>單一事件</strong>——我哋希望由單一事件了解相關情況係咪都係咁：一隻天鵝係白色 → 係咪所有天鵝都係白色？大師叫你聽日著紅衫，星期六面試就會成功 → 係咪所有面試著紅衫都好啲？科大出名海景靚、男仔多——多到咩地步？係咪多到「所有」？要檢查晒所有嘢好浪費時間 → 所以傾向<strong>搵經驗證據支持為真</strong>。（[00:34]–[02:53]）</li>\n<li>⭐ 幾多證據先夠？<strong>唔同學科有唔同要求</strong>：scientific research 通常 <strong>p-value 0.05</strong>——點解唔係 0.01／0.1？國際慣例、專業團體、科學傳統定咗呢個 threshold；日常生活嘅描述唔使次次 p-value 0.05（做 lab 證據 92% 已經好 convincing，supervisor 仍可能話唔夠）。（[02:53]–[04:35]）</li>\n<li>⭐⭐ <strong>Finance</strong>：「<strong>股價低嘅時候買入、高嘅時候賣出，撇除手續費、行政費，如果係 positive 就一定賺錢</strong>」→「<strong>這是一種分析述句式的表達</strong>」——畀咁多錢上投資 course 聽啲分析性嘅嘢，「冇參考價值」；拍拖班教「最緊要靚仔」——人係想得到多啲嘢，通常透過經驗方法得到。（[05:38]–[07:36]）</li>\n<li>⭐ <strong>Backtest</strong>（錄音作「Bad Test」）：用過去 10 年數據睇某投資方法賺唔賺錢 = <strong>搵經驗證據、用過往推敲將來</strong>——「<strong>絕對不是必然真的，因為它是一種綜合性的說法</strong>」。（[07:36]–[08:05]）</li>\n<li>成功率 70% 嘅策略：唔使 p-value 0.05，你唔使擔心搵工；要求越高（95%、100% mathematical model），投資策略越少；甚至 51%——資本夠厚、時間夠長，做 100 次 51 次賺 49 次蝕就賺 2%；交朋友／搵伴侶嘅方法成功率 20% 都值得試（平均試五次搵到一個）。⭐ <strong>要幾多支持先夠：睇學科</strong>。（[08:05]–[11:18]）</li>\n<li>⭐⭐ 但<strong>分析哲學家唔處理實際落手落腳做經驗方法</strong>：究竟幾多經驗證據、幾多 percent 先為之真？「在他們的系統裏面很簡單：<strong>大過零就可以了</strong>……只要大過零就代表真了」。（[11:18]–[11:51]）</li>\n</ul>\n<h3 id=\"lec-h109\">⭐ 中醫有冇認知意義？係唔係科學？（Mentimeter）</h3>\n<ul>\n<li>問題：以你對中醫嘅理解，中醫學說有冇認知意義？——西醫（問題分類時講過）都係透過過往經驗推敲未來。如果答「冇」，即係你覺得中醫任何判斷都<strong>冇真假可言</strong>；<strong>大部分同學覺得有真假可言</strong>——跟住問：係咪一個科學？（[11:51]–[15:29]）</li>\n<li>⭐ 講者：（餘下）兩個驗證原則就係嘗試解釋<strong>點解有啲同學覺得一樣嘢有認知意義，但佢唔係一個科學學科</strong>。（[15:29]–[16:03]）</li>\n<li>⭐ 有同學揀「<strong>中醫冇認知意義，而中醫係科學</strong>」——「呢個得意嘅揀法，喺分析哲學裏面覺得好奇怪」（講者唔 comment 個別同學嘅理解）。（[16:03]–[16:36]）</li>\n<li>講者自己嘅理解（「<strong>給你參考而已</strong>」）：（純）中醫係科學——「不是我說的」，要睇<strong>研究方法、論證方法</strong>：古時嘅中醫好可能唔係科學；現代（至少國內嘅做法）係科學。（[16:36]–[17:50]）</li>\n<li>科大八卦：講者讀 PhD 時做 PG board 學生代表，有 school 提交「Master of Science in …」嘅 TPG proposal，Science School 代表問「<strong>In what sense is it science?</strong>」，對方答「提供數學訓練，尤其統計學」，再被駁「statistics is not science」；講者做 Common Core Director 時都見過有 proposal 自稱 Science CC 而被問同一問題——但好少人問「In what sense humanities／social analysis?」。（[17:50]–[24:50]）</li>\n</ul>\n<h3 id=\"lec-h110\">⭐⭐ 科學 = 有認知意義 + 多一層要求：接受黑天鵝</h3>\n<ul>\n<li>⭐ 學術上理解科學：源頭係<strong>實證</strong>——要證據支持某樣嘢為真；但<strong>其他學科都有呢個要求</strong>：讀經濟、finance、做歷史都要講證據（「做歷史冇證據就係吹水」）；第一眼覺得有意義、有真假可言嘅內容，分析哲學就叫有認知意義。（[24:50]–[25:55]）</li>\n<li>⭐⭐ 「<strong>跟科學的分別就是科學多一層要求</strong>」——接唔接受<strong>黑天鵝</strong>嘅出現。（[25:55]–[26:26]）</li>\n<li>分析哲學家向科學靠攏：<strong>Karl Popper（卡爾・波柏；錄音作「卡爾帕帕」）<strong>係當代比較著名嘅分析哲學家；講者引</strong>愛因斯坦</strong>（錄音只聽到「……ever proved me right」片段），大意：證據<strong>唔能夠證明 (prove)</strong> 我哋正確，只係<strong>支持</strong>我哋嘅諗法；但<strong>一個實驗就可以證明我錯</strong>——「有一個反例就證明到我說的東西錯了，這個至少是愛因斯坦理解之下的科學」。（[26:26]–[28:34]）</li>\n<li>科學精神：你做咗好多年研究，第二間院校嘅人搵到嘢 disprove 你嘅 hypothesis——唔使傷心，寫 email 讚佢，繼續做 lab；大家透過證據講道理、接受有一日自己會錯——呢種精神推動人類進步；分析哲學家用呢個想法<strong>繼續擴充佢哋對認知意義嘅理解</strong>。（[28:00]–[29:39]）</li>\n<li>⭐⭐ <strong>科學家兩個要求</strong>（「我不是在說好似科學家只係要求人哋講啲嘢證明我錯」）：① 自己講嘅嘢<strong>被印證到</strong>——可以被經驗證據支持為真；② <strong>接受到</strong>自己講嘅嘢<strong>可以透過經驗方法被證明為假</strong>——「科學嘅兩個面向：實證為真，同埋接受可以被否證」。（[29:10]–[30:17]）</li>\n<li>⭐ 所以印證同否證嘅例子「都是一樣的，沒有分別」——所有天鵝都是白色、科大學生都是男生、人類女性都有一對相同嘅性染色體：<strong>同一件事嘅兩個面向</strong>。（[30:17]–[30:43]）</li>\n<li>⭐ 透過我哋<strong>對呢啲說法、看法嘅態度</strong>，可以分辨<strong>科學同非科學</strong>。（[30:43]）</li>\n</ul>\n<h3 id=\"lec-h111\">⭐ 宗教：概念定事實？接唔接受自己會錯？</h3>\n<ul>\n<li>信仰可否透過經驗事實支持，視乎你當「上帝是否存在」係概念問題定事實問題：純概念 → 上帝<strong>必然存在</strong> → 唔會落到幾個驗證原則；但咁你同相信實證嘅人就<strong>冇溝通空間</strong>。（[30:43]–[31:56]）</li>\n<li>稍為放低對信仰嘅堅定，同你講證據：朗基努斯之槍、十二門徒（凡人，好多被殺）講佢哋同耶穌生活嘅<strong>口述歷史</strong> →「耶穌是真實存在的、基督宗教有真實性」可以<strong>經驗上講</strong>，有好多資料，冇問題、我哋接受到。⭐「<strong>全部不是純粹看那個學科，而是看那個學科如何去講他的論斷</strong>」。（[31:26]–[32:59]）</li>\n<li>⭐ 下一步：問講呢啲嘢嘅神學家——你接唔接受啱啱講嘅證據<strong>可以否定</strong>耶穌嘅存在？作為信仰，你否定唔到、唔會接受某啲證據否定你一開始嘅論斷 → 從經驗事實角度，某啲宗教、神秘主義說法<strong>可以有真假可言</strong>；再檢查係咪我哋想要嘅知識：問「<strong>你接唔接受你會錯？</strong>」（[32:59]–[33:41]）</li>\n</ul>\n<h3 id=\"lec-h112\">⭐⭐ 否證、非證：一嚴一鬆</h3>\n<ul>\n<li>⭐ 最後嘅非證原則都係「學術上嘅少少修正」：檢證同印證差唔多（用證據支持為真）——<strong>檢證要求高啲、印證要求低啲 → 印證係放寬嘅形式</strong>；一開始要求經驗證據支持為真，<strong>再加多一重要求：講嘅嘢可以被證明為假</strong>（否證）；再下一步：有啲說法判斷唔到可以被證明（錄音略不清），就再<strong>放寬</strong> → 處理牽涉<strong>特稱語句</strong>嘅說法：「<strong>有一隻天鵝是黑色</strong>」「<strong>有人類男性擁有一對相同嘅性染色體</strong>」。（[33:41]–[35:24]）</li>\n<li>⭐ <strong>否證、非證嘅關係同檢證、印證差唔多</strong>：一個嚴謹啲、一個鬆啲——檢證、印證：搵證明／證據支持說法係<strong>真</strong>；否證、非證：搵證明／證據支持說法係<strong>假</strong>。（[35:24]–[36:04]）</li>\n<li>⭐⭐ <strong>推論</strong>：「<strong>你不需要知道講甚麼</strong>」——如果一個說法可以透過檢證原則被證明為真，<strong>必然可以通過印證原則被支持為真</strong>；同樣，如果已有足夠證據<strong>證明</strong>佢係假，用放鬆咗嘅要求，當然亦可以有經驗證據<strong>支持</strong>佢係假。（[35:24]–[36:39]）</li>\n<li>⭐ 點解要講否證、非證（錄音作「火星飛行」）：<strong>區分學科——科學同非科學之間嘅分別</strong>（講者話 e-portfolio 都寫得）。（[36:39]–[38:01]）</li>\n</ul>\n<h3 id=\"lec-h113\">⭐⭐ 分析哲學家傳統上「打」嘅三個大佬</h3>\n<ul>\n<li>透過否證、非證（錄音作「火星和飛行器」），除咗宗教，分析哲學家傳統上主要批評三個：（[38:01]–[42:11]）<ol>\n<li>⭐ <strong>西方哲學傳統：「人是理性的」</strong>——對西方哲學係一個理想、「分析地真」：人係唯一可以理性溝通、認知唔同學科真理嘅物種；歷史上被誤用（「男人才是理性的」），後來慢慢修正。（[38:01]–[39:47]）<ul>\n<li>⭐ 講者自己嘅感覺（「這個分析哲學家沒有說過」）：<strong>孟子講人性善，都係分析地講</strong>。「分析地講」= 嗰樣嘢必然真、<strong>先於經驗</strong>——「你唯有先於經驗，你才可以不理後天經驗證據的反例」。（[39:47]–[40:31]）</li>\n</ul>\n</li>\n<li>⭐ <strong>Sigmund Freud</strong>（嗰個年代嘅 psychologist）：用人嘅<strong>性衝動</strong>解讀人嘅行為；最原始版本其實否定人嘅理性決定——所有理性決定都係 unconscious 嘅性衝動（而家心理學唔係咁）。（[40:31]–[41:35]）</li>\n<li>⭐ <strong>Karl Marx</strong>：歷史演進有<strong>必然性</strong>——原始社會、部落、貴族封建 → 帝國、民主 → 最後共產，必然；點解資本主義同民主影響咗咁耐都未到共產？「<strong>未到而已，會發生的</strong>」。（[41:35]–[42:11]）</li>\n</ol>\n</li>\n<li>⭐⭐ 人嘅心理、溝通能力係咪理性、本性善惡、歷史進程——可唔可以<strong>事實地</strong>談？可以；但要<strong>科學地</strong>談，就要<strong>接受嗰樣嘢可以被推翻</strong>。事實地談一件事最 convincing 係科學——「你事實上要打贏科學呢，沒可能的，因為他一開始就認輸了」：科學一開始就話「我講的不一定是真的」，包容性最大。（[42:11]–[43:27]）</li>\n<li>⭐⭐ 唔科學地講、要話自己嘅論斷有<strong>必然性</strong>，就只能以<strong>分析述句</strong>嘅狀態講（上帝存在、歷史必然、所有行為由 unconscious 原因解讀、人性善）——咁你就唔能夠接受經驗證據推翻，所以你講嘅都係<strong>先於經驗</strong>；接受嘅話，就要同時接受<strong>你講嘅嘢冇信息內容</strong>。（[43:27]–[44:27]）</li>\n<li>⭐ 邏輯家「冇所謂」：接受自己講嘅嘢冇信息內容，只係<strong>純粹工具性</strong>、符號嘅解讀（= Module 4–5 內容）；數學都係工具性——透過數學公式模型幫我哋理解世界運作，「<strong>冇為呢個世界多一分知識</strong>」，只係系統化咁描述世界嘅運作畀你聽。（[43:51]–[45:11]）</li>\n</ul>\n<h3 id=\"lec-h114\">⭐ 歷史可唔可以科學地做？——「9 月 7 日喺 2407 上堂」</h3>\n<ul>\n<li>歷史可以科學地做 = 你接唔接受某啲歷史定案<strong>可以被推翻</strong>；做學術、做歷史要有呢個思維——就算唔係讀科學，都係科學性咁理解人類歷史：可以透過經驗證據支持為真，同時應該接受被推翻嘅一日。（[45:11]–[46:20]）</li>\n<li>⭐ 「（Dr Lam）2026 年 9 月 7 號喺 2407 上堂」而家已經係歷史（10-12 highlight 過嘅例子）：（[46:20]–[48:42]）<ul>\n<li>對<strong>冇 take 過</strong>呢個課嘅同學：呢句可以被經驗證據<strong>支持為真</strong>，亦可以被經驗證據<strong>支持為假</strong>——冇問題（e-portfolio idea：WhatsApp 問佢，佢答你就係 artifact）；對佢哋嚟講呢句一定唔係真就係假，唔可以同時真又同時假。（[46:20]–[47:30]）</li>\n<li>對 9 月 7 日有上堂、喺 2407 嘅你：有經驗方法<strong>證明為真</strong>——「你就舉手：我就是那個經驗方法」。（[47:30]）</li>\n<li>反過來，<strong>身在其中</strong>，你接唔接受呢句<strong>有可能係假</strong>？好難——講者嗰日返咗嚟、落堂排咗四架 91M 先走得，咁確實、咁足夠證據，點解要接受可以被推翻？（[47:30]–[48:42]）</li>\n</ul>\n</li>\n<li>⭐ 「研究歷史最煩就係：如果你唔能夠將自己<strong>抽離</strong>喺件事度，你係唔會接受到任何證據推翻你切身感受嘅內容」。（[48:42]）</li>\n<li>上半個 course 收尾返去「主觀定客觀」：分析性嘅嘢講得上必然真、必然假，但係咪客觀？（定好似兩樣都唔係？講者冇答）；綜合性嘅嘢應該近常識理解嘅客觀——要客觀證據支持，唔係某人主觀評價；<strong>科學只係講多一句：客觀證據支持為真嘅同時，要接受客觀證據支持為假</strong>。（[48:42]–[50:04]）</li>\n</ul>\n<h3 id=\"lec-h115\">⭐ 非證原則嘅日常應用：QA</h3>\n<ul>\n<li>⭐ 做 product 嘅 <strong>QA test</strong>：唔會 100 件全部打開驗，驗幾件冇事就出廠；疫情時嘅<strong>快測</strong>都有 disclaimer 講準確性係幾多——出廠嗰批嘢嘅準確度係咁高，「但不一定是真的」。（[50:04]–[51:34]）</li>\n</ul>\n<h3 id=\"lec-h116\">⭐⭐ 分析哲學將人類知識分三部分</h3>\n<ul>\n<li>① <strong>分析性</strong>：數學、邏輯；② <strong>經驗性</strong>（綜合性）：要經驗支持，<strong>唔一定 100% 真或 100% 假，容許有反例</strong>；③「<strong>留意：不是 no meaning</strong>」——佢哋擁有嘅 meaning 叫 <strong>non-cognitive meaning（非知意義）</strong>：分析哲學「留了個位」，<strong>唔係否定佢哋嘅存在</strong>，只係話佢哋冇認知意義。（[51:34]–[52:36]）</li>\n<li>⭐ <strong>規範</strong>：人類知識入面嘅道德問題——人係咪應該誠實、係咪唔應該講大話 → 規範性嘅嘢冇真假可言。（[52:36]–[53:13]）</li>\n<li>⭐⭐ <strong>作弊例子</strong>（期中冇座位表、隔位坐；「你知我啲 MC 其實好難望」）：我捉唔捉到你 → <strong>經驗事實</strong>，有認知意義；捉到、有證據，但「點解要懲罰我？」「我係咪應該懲罰你？」→ <strong>規範性</strong>——<strong>分析哲學家唔處理</strong>；你講得好動聽，講者可能認為係你嘅 artifact，叫你放入 e-portfolio 拎分，「但今日你嘅考試係零分」；究竟要唔要守規矩 → 規範性。（[53:13]–[54:44]）</li>\n<li>⭐ <strong>情感意義</strong>：抒發感受——Module 2 講<strong>情感用字</strong>時講過佢哋想避；但避完之後，<strong>佢唔否定人有需要呢個價值</strong>（見 Module 2 下半、講者截圖嘅李天命 reading 嗰度）。（[54:13]–[55:13]）</li>\n<li>⭐ <strong>評價</strong> → 衍生到問題三分類嘅<strong>評價問題</strong>；最後係<strong>美學</strong>。（[55:13]）</li>\n<li>⭐⭐ 「情感、規範、評價和美學都是人類對於知識的其他訴求」——我哋認識世界唔只係知一件事真定假：仲想知<strong>該做嘅事</strong>（規範）、會唔會令我哋<strong>快樂或憤怒</strong>（情感）、做唔做到會唔會影響我哋對<strong>自己或他人嘅評價</strong>（評價）、嗰件事<strong>靚唔靚</strong>（美學）——都係人類需要嘅。（[55:13]–[56:05]）</li>\n<li>⭐ 但分析哲學家話：學術討論（同學術經費）<strong>請用喺有 cognitive meaning 嘅嘢</strong>，唔好用喺 non-cognitive meaning 嘅嘢；（科大潮文：讀科學／工程對人類好有貢獻但人工低，讀商業冇貢獻但人工高）——佢哋覺得好 serious、應投放更多資源，但實際人類點運作，佢哋控制唔到。（[56:05]–[57:34]）</li>\n</ul>\n<h2 id=\"lec-h117\">重點澄清</h2>\n<ul>\n<li>⭐⭐ 證明 vs 支持：證明 = 搵到所有證據（100%）；知識系統想由單一事件推到一般 → 要靠支持；幾多支持先夠睇學科，<strong>分析哲學家嘅系統：大過零就得</strong>。（[00:34]–[11:51]）</li>\n<li>⭐⭐ 有認知意義 ≠ 科學：其他學科（經濟、finance、歷史）都講證據、有認知意義；<strong>科學多一層：接受被否證（黑天鵝）</strong>。（[24:50]–[30:43]）</li>\n<li>⭐⭐ 科學兩個面向：可印證（支持為真）+ 接受可被否證；印證同否證用同一批全稱例子。（[29:10]–[30:43]）</li>\n<li>⭐⭐ 檢證嚴、印證鬆；否證嚴、非證鬆；<strong>通過檢證 ⇒ 必然通過印證</strong>；<strong>證明為假 ⇒ 當然可以支持為假</strong>。（[33:41]–[36:39]）</li>\n<li>⭐⭐ 唔係睇學科／題材本身，而係睇佢<strong>點樣講佢嘅論斷</strong>、接唔接受自己會錯。（[32:28]–[33:41]）</li>\n<li>⭐⭐ 要必然性 ⇒ 只能係分析述句 ⇒ 先於經驗、唔受經驗反例推翻 ⇒ <strong>冇信息內容</strong>（人是理性、人性善、Freud、Marx、上帝必然存在）。（[39:47]–[44:27]）<ul>\n<li>🔗（筆記對照，唔係講者原話）= 李天命〈兩個基要的方法學區分〉總結：「沒有任何語句能夠既有實質內容，又有必然性」。</li>\n</ul>\n</li>\n<li>⭐ 邏輯、數學係工具性：冇為世界多一分知識，只係系統化描述。（[43:51]–[45:11]）</li>\n<li>⭐⭐ <strong>冇認知意義 ≠ 冇意義</strong>：非知意義（規範、情感、評價、美學）——分析哲學留咗位，唔否定佢哋存在，只係主張學術資源應放喺有認知意義嘅嘢。（[51:34]–[57:34]）</li>\n<li>⭐ 講者個人睇法（參考、唔係 reading 立場）：孟子性善係「分析地講」（「分析哲學家沒有說過」）；（現代）中醫係科學（睇研究方法）。（[16:36]–[17:50]、[39:47]–[40:31]）<ul>\n<li>🔗（筆記對照）筆記版 slides 將「人是理性的」、孟子性善論、Freud、Marx 列為否證原則下唔係科學嘅例子；孟子性善論同時有<strong>規範意義</strong>。</li>\n</ul>\n</li>\n</ul>\n"}};</script>

  // A question stays in the wrong-book until answered right twice in a row.

      if (!st) continue;
      seen++; att += st.a; cor += st.c;
      if (st.k > 0) solid++;
      if (isWrongNow(st)) wrongNow++;

  }
  function renderCardSetup() {
    const boxes = [0, 1, 2, 3, 4, 5].map((b) => D.cards.filter((c) => (S.c[c.id] || 0) === b).length);
    const tchk = D.topics.map((t) => `<label class="chk"><input type="checkbox" name="t" value="${t.id}" checked> ${pill(t.id)} ${esc(t.name)} <span class="muted small">(${D.cards.filter((c) => c.topic === t.id).length})</span></label>`).join('<br>');
    app.innerHTML = `<h1>🃏 閃卡 Flashcards</h1>
      <p class="muted">睇正面 → <b>喺心入面講出答案</b> → 先揭開對答案（主動回憶，唔係被動睇）。唔記得嘅卡會喺幾張之後再出現；記得嘅升盒，盒數越高越少出現（Leitner system）。快捷鍵：<span class="kbd">Space</span> 揭卡、<span class="kbd">1</span>/<span class="kbd">2</span>/<span class="kbd">3</span> 評分。</p>
      <div class="card"><div class="boxes">${boxes.map((n, b) => `<span>${b === 0 ? '未溫' : '盒 ' + b} : <b>${n}</b></span>`).join('')}</div></div>
      <form class="card setup" id="csetup"><fieldset><legend>課題</legend>${tchk}</fieldset>
        <fieldset><legend>範圍</legend><label class="chk"><input type="checkbox" name="weak" checked> 只溫未熟（盒 &lt; 3）</label></fieldset>
        <fieldset><legend>張數</legend><div class="seg">${[[20, '20'], [40, '40'], [999, '全部']].map(([v, l], i) => `<label><input type="radio" name="n" value="${v}" ${i === 0 ? 'checked' : ''}>${l}</label>`).join('')}</div></fieldset>
        <button class="btn primary big" type="submit">開始 ▶</button></form>`;
    $('#csetup').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target;
      const topics = $$('input[name=t]:checked', f).map((c) => c.value);
      let pool = D.cards.filter((c) => topics.includes(c.topic));
      if (f.weak.checked) pool = pool.filter((c) => (S.c[c.id] || 0) < 3);
      if (!pool.length) { toast('呢個範圍全部已熟 👍（剔走「只溫未熟」可以再溫）'); return; }
      pool = shuffle(pool).sort((x, y) => (S.c[x.id] || 0) - (S.c[y.id] || 0)).slice(0, +f.n.value);
      cs = { list: interleave(pool).map((c) => c.id), i: 0, flipped: false, re: {}, n: { 1: 0, 2: 0, 3: 0 } };
      if (location.hash === '#/cards/run') renderCard(); else location.hash = '#/cards/run';
    });
  }
  function renderCard() {
    if (cs.i >= cs.list.length) {
      onKey = null;
      app.innerHTML = `<div class="card qbox"><h1>🏁 閃卡完成</h1><p>😵 唔記得 ${cs.n[1]} · 🙂 記得 ${cs.n[2]} · 😎 好熟 ${cs.n[3]}</p>
        <div class="row"><a class="btn primary" href="#/cards">再嚟一輪</a><a class="btn" href="#/quiz">去做題</a></div></div>`;
      return;
    }
    const c = CBY[cs.list[cs.i]];
    const box = S.c[c.id] || 0;
    app.innerHTML = `<div class="qbox"><div class="qhead"><b>🃏 閃卡</b><span class="muted small">${cs.i + 1} / ${cs.list.length} · ${box ? '盒 ' + box : '新卡'}</span></div>
      <div class="progress"><i style="width:${pct(cs.i, cs.list.length)}%"></i></div>
      <div class="flash ${cs.flipped ? 'flipped' : ''}" id="flash"><div class="flash-inner">
        <div class="flash-face front"><div>${pill(c.topic)}</div><div style="margin-top:.6rem">${c.front}</div><div class="small muted" style="margin-top:1rem">（撳一下或者 Space 揭開）</div></div>
        <div class="flash-face back prose">${c.back}</div></div></div>
      <div class="row" style="justify-content:center;margin-top:1rem" id="grades">${cs.flipped ? `
        <button class="btn" data-g="1">😵 唔記得 <span class="kbd">1</span></button>
        <button class="btn" data-g="2">🙂 記得 <span class="kbd">2</span></button>
        <button class="btn primary" data-g="3">😎 好熟 <span class="kbd">3</span></button>` : '<button class="btn primary big" id="flipBtn">揭開 ↻</button>'}</div></div>`;
    const flip = () => { cs.flipped = true; renderCard(); };
    $('#flash').addEventListener('click', () => { if (!cs.flipped) flip(); });
    const fb = $('#flipBtn'); if (fb) fb.onclick = flip;
    $$('[data-g]').forEach((b) => b.addEventListener('click', () => gradeCard(+b.dataset.g)));
    onKey = (e) => {
      if (!cs.flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flip(); }
      else if (cs.flipped && '123'.includes(e.key)) { e.preventDefault(); gradeCard(+e.key); }
    };
  }
  function gradeCard(g) {
    const id = cs.list[cs.i];
    let b = S.c[id] || 0;
    if (g === 1) { b = 1; if (!cs.re[id]) { cs.re[id] = 1; cs.list.splice(Math.min(cs.list.length, cs.i + 4), 0, id); } }
    else b = Math.min(5, Math.max(b, 1) + (g === 3 ? 2 : 1));
    S.c[id] = b;
    cs.n[g]++;
    save();
    cs.i++;
    cs.flipped = false;
    renderCard();
  }

  // ---------- wrong book ----------
  function wrong() {
    const items = QS.filter((q) => isWrongNow(S.q[q.id]));
    const fixed = QS.filter((q) => S.q[q.id] && S.q[q.id].w > 0 && !isWrongNow(S.q[q.id])).length;
    const groups = D.topics.map((t) => ({ t, qs: items.filter((q) => q.topic === t.id) })).filter((g) => g.qs.length);
    app.innerHTML = `<h1>❌ 錯題本</h1>
      <p class="muted">答錯過、而未試過<b>連續答啱兩次</b>嘅題目會留喺度。考試前最有效率嘅溫習 = 重做呢度嘅題目。已攻克：${fixed} 題。</p>
      <div class="row" style="margin-bottom:1rem"><a class="btn primary big" href="#/quiz/wrong">🔁 重做全部錯題（${items.length}）</a></div>
      ${groups.map((g) => `<div class="card"><h2 style="margin-top:0">${pill(g.t.id)} ${esc(g.t.name)}（${g.qs.length}）</h2>${g.qs.map((q) => reviewHtml(q, null)).join('')}</div>`).join('') || '<div class="card">暫時冇錯題 👍 去<a href="#/quiz">做多啲題</a>先！</div>'}`;
  }

  applySettings();
  route();
})();
</script>
</body>
</html>
