<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUMA1710 Midterm 衝刺站 · Modules 2 & 3</title>
<meta name="theme-color" content="#0f766e">
<style>:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #1c2430; --muted: #5b6676; --line: #dfe3e9;
  --brand: #0f766e; --brand-2: #115e59; --brand-soft: #e6f4f2;
  --ok: #15803d; --ok-soft: #e7f6ec; --bad: #b91c1c; --bad-soft: #fdecec; --warn: #a16207; --warn-soft: #fdf6e3;
  --m2: #2563eb; --m3: #9333ea; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius: 12px; --fs: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", "Heiti TC", sans-serif;
}
[data-theme="dark"] {
  --bg: #0f1419; --card: #171d24; --ink: #e6e9ee; --muted: #9aa5b4; --line: #2a333d;
  --brand: #2dd4bf; --brand-2: #5eead4; --brand-soft: #12302d;
  --ok: #4ade80; --ok-soft: #12291b; --bad: #f87171; --bad-soft: #2e1515; --warn: #facc15; --warn-soft: #2b2510;
  --m2: #60a5fa; --m3: #c084fc; --shadow: none;
}
* { box-sizing: border-box; }
html { font-size: var(--fs); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.65; -webkit-text-size-adjust: 100%; }
a { color: var(--brand); }
button { font: inherit; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding: .45rem .9rem; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.brand a { text-decoration: none; color: var(--ink); font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.brand span { display: inline-block; margin-left: .4rem; font-weight: 600; color: var(--brand); }
.nav { display: flex; gap: .15rem; overflow-x: auto; flex: 1 1 auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { white-space: nowrap; text-decoration: none; color: var(--muted); padding: .3rem .55rem; border-radius: 8px; font-size: .92rem; }
.nav a:hover { background: var(--brand-soft); color: var(--ink); }
.nav a.active { background: var(--brand); color: #fff; }
.search input { width: 13rem; max-width: 40vw; padding: .35rem .6rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.tools { display: flex; gap: .25rem; }
.tools button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: .2rem .5rem; cursor: pointer; }
@media (max-width: 760px) {
  .topbar { gap: .35rem; }
  .nav { order: 3; flex-basis: 100%; }
  .search { flex: 1; } .search input { width: 100%; max-width: none; }
}

main { max-width: 1100px; margin: 0 auto; padding: 1rem .9rem 3rem; outline: none; }
.foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 1rem; }

/* generic */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
h1 { font-size: 1.6rem; margin: .2rem 0 .8rem; line-height: 1.3; }
h2 { font-size: 1.3rem; margin: 1.4rem 0 .6rem; line-height: 1.35; }
h3 { font-size: 1.1rem; margin: 1.1rem 0 .5rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.btn { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: .5rem .9rem; border-radius: 10px; cursor: pointer; text-decoration: none; font-weight: 600; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn.big { padding: .75rem 1.2rem; font-size: 1.05rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.pill { display: inline-block; font-size: .75rem; padding: .05rem .5rem; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 700; white-space: nowrap; }
.pill.m2 { background: color-mix(in srgb, var(--m2) 14%, transparent); color: var(--m2); }
.pill.m3 { background: color-mix(in srgb, var(--m3) 14%, transparent); color: var(--m3); }
.pill.tf { background: var(--warn-soft); color: var(--warn); }
.pill.lec { background: var(--bad-soft); color: var(--bad); }
.kbd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 .3em; }

/* home */
.hero { background: linear-gradient(135deg, var(--brand), #0e7490); color: #fff; border: none; }
.hero h1 { margin: 0 0 .3rem; }
.hero .countdown { font-size: 2rem; font-weight: 800; letter-spacing: .02em; }
.hero a { color: #fff; }
.hero .btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); color: #fff; }
.hero .btn.primary { background: #fff; color: var(--brand-2); }
.stat { font-size: 1.8rem; font-weight: 800; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.bar.ok > i { background: var(--ok); } .bar.bad > i { background: var(--bad); }
.topicrow { display: grid; grid-template-columns: minmax(150px, 1.3fr) 2fr auto; gap: .6rem; align-items: center; padding: .35rem 0; border-bottom: 1px dashed var(--line); }
.topicrow:last-child { border-bottom: none; }
.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li { display: flex; gap: .6rem; align-items: flex-start; padding: .45rem 0; border-bottom: 1px dashed var(--line); }
.checklist li:last-child { border-bottom: none; }
.checklist input { margin-top: .35rem; width: 1.1rem; height: 1.1rem; accent-color: var(--brand); }
.checklist .done { text-decoration: line-through; color: var(--muted); }

/* prose (notes) */
.prose { overflow-wrap: anywhere; }
.prose table { border-collapse: collapse; width: 100%; margin: .8rem 0; font-size: .93rem; display: block; overflow-x: auto; }
.prose th, .prose td { border: 1px solid var(--line); padding: .4rem .55rem; vertical-align: top; text-align: left; }
.prose th { background: var(--brand-soft); }
.prose tr:nth-child(even) td { background: color-mix(in srgb, var(--bg) 60%, transparent); }
.prose blockquote { margin: .8rem 0; padding: .5rem .9rem; border-left: 4px solid var(--brand); background: var(--brand-soft); border-radius: 0 8px 8px 0; }
.prose blockquote p { margin: .3rem 0; }
.prose pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .7rem .9rem; overflow-x: auto; line-height: 1.5; }
.prose code { font-family: ui-monospace, Menlo, Consolas, "Microsoft JhengHei", monospace; font-size: .9em; }
.prose h1 { border-bottom: 2px solid var(--brand); padding-bottom: .3rem; }
.prose h2 { border-bottom: 1px solid var(--line); padding-bottom: .2rem; }
.prose strong { color: color-mix(in srgb, var(--ink) 85%, var(--brand)); }
.prose hr { border: none; border-top: 2px dashed var(--line); margin: 1.5rem 0; }
.prose li { margin: .15rem 0; }
table.selftest td:nth-child(n+2) { filter: blur(5px); cursor: pointer; transition: filter .15s; user-select: none; }
table.selftest td.shown { filter: none; user-select: auto; }
.selftest-hint { font-size: .85rem; color: var(--warn); background: var(--warn-soft); padding: .3rem .6rem; border-radius: 8px; display: inline-block; }

.notes-layout { display: grid; grid-template-columns: 250px 1fr; gap: 1rem; align-items: start; }
.notes-side { position: sticky; top: 4.2rem; max-height: calc(100vh - 5rem); overflow: auto; }
.notes-side a { display: block; text-decoration: none; color: var(--ink); padding: .35rem .5rem; border-radius: 8px; font-size: .9rem; }
.notes-side a.active { background: var(--brand); color: #fff; }
.notes-side a:hover:not(.active) { background: var(--brand-soft); }
.notes-side .toc a { font-size: .8rem; color: var(--muted); padding: .15rem .5rem .15rem 1rem; }
.notes-side .toc a.l3 { padding-left: 1.8rem; }
.notes-side h4 { margin: .6rem .5rem .2rem; font-size: .75rem; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
@media (max-width: 860px) { .notes-layout { grid-template-columns: 1fr; } .notes-side { position: static; max-height: none; } .notes-side .toc { display: none; } }

/* quiz */
.setup label.chk { display: inline-flex; gap: .35rem; align-items: center; margin: .2rem .8rem .2rem 0; cursor: pointer; }
.setup fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 .8rem; padding: .5rem .8rem; }
.setup legend { font-weight: 700; padding: 0 .3rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg label { padding: .35rem .7rem; cursor: pointer; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: none; }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--brand); color: #fff; }
.qbox { max-width: 820px; margin: 0 auto; }
.qhead { display: flex; justify-content: space-between; gap: .5rem; align-items: center; margin-bottom: .5rem; flex-wrap: wrap; }
.qtext { font-size: 1.15rem; font-weight: 600; margin: .4rem 0 1rem; line-height: 1.6; }
.opts { display: grid; gap: .55rem; }
.opt { text-align: left; display: flex; gap: .7rem; align-items: flex-start; width: 100%; padding: .75rem .9rem; border: 2px solid var(--line);
  background: var(--card); color: var(--ink); border-radius: 12px; cursor: pointer; line-height: 1.5; }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt .key { flex: none; width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); font-weight: 700; font-size: .85rem; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.picked { border-color: var(--brand); background: var(--brand-soft); }
.opt:disabled { cursor: default; }
.tfopts { grid-template-columns: 1fr 1fr; }
.feedback { margin-top: 1rem; padding: .8rem 1rem; border-radius: 12px; border: 1px solid var(--line); }
.feedback.ok { background: var(--ok-soft); border-color: var(--ok); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.feedback .verdict { font-weight: 800; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: .3rem 0 1rem; }
.progress > i { display: block; height: 100%; background: var(--brand); transition: width .2s; }
.sticky-actions { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 35%); padding: 1.2rem 0 .6rem; display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; }

/* exam */
.exam-top { position: sticky; top: 3.4rem; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .5rem .8rem; margin-bottom: .8rem; box-shadow: var(--shadow); }
.timer { font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.3rem, 1fr)); gap: .3rem; }
.qgrid button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: .3rem 0; cursor: pointer; font-size: .85rem; }
.qgrid button.ans { background: var(--brand-soft); border-color: var(--brand); }
.qgrid button.cur { outline: 2px solid var(--brand); }
.qgrid button.flag { background: var(--warn-soft); border-color: var(--warn); }
.qgrid button.ok { background: var(--ok-soft); border-color: var(--ok); }
.qgrid button.bad { background: var(--bad-soft); border-color: var(--bad); }
.review-item { border-top: 1px solid var(--line); padding: .8rem 0; }
.review-item .mine.bad { color: var(--bad); font-weight: 700; }
.review-item .mine.ok { color: var(--ok); font-weight: 700; }

/* flashcards */
.flash { perspective: 1200px; max-width: 680px; margin: 0 auto; }
.flash-inner { position: relative; min-height: 260px; transition: transform .45s; transform-style: preserve-3d; cursor: pointer; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column;
  justify-content: center; padding: 1.4rem; border-radius: 16px; background: var(--card); border: 2px solid var(--line); box-shadow: var(--shadow); overflow: auto; }
.flash-face.front { align-items: center; text-align: center; font-size: 1.35rem; font-weight: 700; }
.flash-face.back { transform: rotateY(180deg); font-size: 1rem; }
.flash-face.back p { margin: .3rem 0; }
.boxes { display: flex; gap: .4rem; flex-wrap: wrap; }
.boxes span { font-size: .8rem; padding: .15rem .5rem; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }

/* search */
.hit { border-bottom: 1px dashed var(--line); padding: .6rem 0; }
mark { background: #fde68a; color: #111; border-radius: 3px; padding: 0 .1em; }

.toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: .5rem 1rem; border-radius: 10px; z-index: 50; opacity: .95; }

@media print {
  .topbar, .foot, .no-print, .notes-side { display: none !important; }
  body { background: #fff; color: #000; font-size: 11px; }
  main { max-width: none; padding: 0; }
  .card { box-shadow: none; border: none; padding: 0; }
  .notes-layout { display: block; }
  table.selftest td { filter: none !important; }
}
</style>
</head>

<script>window.DATA={"built":"2026-10-22T15:40:36.235Z","topics":[{"id":"m21","code":"M2-1","mod":2,"name":"語理分析通論","src":"Lecture notes 2.1（李天命 第I篇）"},{"id":"m2a","code":"M2-2a","mod":2,"name":"語理分析步驟 & 問題分類","src":"Reading 2a（講者 slides）"},{"id":"m22","code":"M2-2","mod":2,"name":"語言的陷阱（李天命 6 陷阱）","src":"Lecture notes 2.2（李天命 第II篇）"},{"id":"m2b","code":"M2-2b","mod":2,"name":"語言的陷阱（講者 4 陷阱 + 謬誤）","src":"Reading 2b（講者 slides）"},{"id":"m23","code":"M2-3","mod":2,"name":"Language: Emotive Language & Disputes","src":"Reading 2.3（Copi，英文）"},{"id":"m31","code":"M3-1","mod":3,"name":"定義 Definition","src":"Lecture notes 3a + Reading 3.1（Copi 第二章）"},{"id":"m32","code":"M3-2","mod":3,"name":"意義判準 Meaning Criterion","src":"Lecture notes 3b（講者 slides）"},{"id":"m33","code":"M3-3","mod":3,"name":"兩個基要的方法學區分","src":"Reading 3.2（李天命 第III篇）"}],"notes":{"m21":"<h1 id=\"m21-h1\">M2-1 語理分析通論 (General Theory of Logico-linguistic Analysis)</h1>\n<blockquote>\n<p>來源：李天命《語理分析的思考方法》第 I 篇，頁 1–36（Module 2 Lecture notes 2.1）\n考試重點標記：⭐ = 極高機會考；⚠️ = 常見陷阱（MC / T-F 易錯）</p>\n</blockquote>\n<hr>\n<h2 id=\"m21-h2\">0. 一句總結（先記呢句）</h2>\n<p><strong>Logico-linguistic analysis（語理分析）= 「釐清主要用語的意思，辨明關鍵論點的義理，由此着手去分析問題」的一種思考方法。</strong>\n又叫 <strong>linguistic analysis（語言分析）</strong>。佢係 <strong>methodology of thinking（思考方法學）</strong> 嘅 <strong>第一環節 / 基礎部門（starting point）</strong>。</p>\n<hr>\n<h2 id=\"m21-h3\">1. 引言：點解要語理分析？</h2>\n<table>\n<thead>\n<tr>\n<th>概念</th>\n<th>內容</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Methodology of thinking（思考方法學）</strong></td>\n<td>研究「什麼是正確思考的基本法則？怎樣使思想清晰、精審、合理？」</td>\n</tr>\n<tr>\n<td>第一環節 / 基礎部門</td>\n<td>⭐ <strong>Logico-linguistic analysis（語理分析）</strong></td>\n</tr>\n<tr>\n<td>定義</td>\n<td>⭐ 「<strong>釐清主要用語的意思，辨明關鍵論點的義理，由此着手去分析問題</strong>」</td>\n</tr>\n<tr>\n<td>別名</td>\n<td><strong>Linguistic analysis（語言分析）</strong></td>\n</tr>\n</tbody></table>\n<p><strong>羅素 (Russell) 講過嘅故事</strong> ⭐</p>\n<ul>\n<li>一位教徒同人辯論神學問題，爭到面紅耳赤，差啲訴諸暴力、演出一場「聖戰」。</li>\n<li>佢忽然醒覺：「<strong>原來你的『上帝』即是我的『魔鬼』，你的『魔鬼』即是我的『上帝』！</strong>」</li>\n<li>教訓：好多爭論其實係<strong>起於言語夾纏 (verbal confusion)</strong>，實質上滑稽無聊。</li>\n<li>語理分析嘅作用：<strong>破斥文字把戲、澄清概念混淆</strong>；係疏通思想惑亂偏執<strong>最有效的方法利器</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m21-h4\">2. 一、當代西方哲學概況 —— 英美哲學 vs 歐陸哲學的對壘</h2>\n<h3 id=\"m21-h5\">2.1 兩大陣營 ⭐</h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>英美 (Anglo-American)</strong></th>\n<th><strong>歐陸 (Continental)</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>地區</td>\n<td>英、美、澳洲、加拿大等英語國家</td>\n<td>德、法、西班牙、意大利等</td>\n</tr>\n<tr>\n<td>主流</td>\n<td><strong>Analytic Philosophy（分析哲學）</strong></td>\n<td><strong>Phenomenology（現象學）</strong> 和 <strong>Existentialism（存在主義）</strong></td>\n</tr>\n<tr>\n<td>要義</td>\n<td>應用<strong>語理分析</strong>的方法，對論題 (topic) 及有關概念和思想進行<strong>釐清、審定、或評估</strong></td>\n<td>存在主義：顯出人的<strong>自主性與獨特性</strong>，令生命成為「<strong>純真無妄的實存</strong>」；現象學：通過一種<strong>直覺的運作</strong>去描述<strong>本質的結構</strong>，企圖由此建立知識的基礎</td>\n</tr>\n<tr>\n<td>被對方批評</td>\n<td>「瑣碎冷硬而忽略人的情感」、「<strong>糟蹋人的靈魂</strong>」、「<strong>沒有心</strong>」</td>\n<td>「故弄玄虛而流於文字遊戲」、「<strong>糟蹋人的思想</strong>」、「<strong>沒有腦</strong>」</td>\n</tr>\n</tbody></table>\n<ul>\n<li>⚠️ 記清楚方向：<strong>分析家譏笑歐陸「沒有腦」；歐陸譏笑分析家「沒有心」</strong>。（柏斯摩爾 <strong>Passmore</strong> 嘅講法：分析家指責歐陸「糟蹋人的思想」，歐陸指責分析哲學「糟蹋人的靈魂」。）</li>\n<li>兩大陣營好似生活喺<strong>兩個截然不同、無法交通的觀念世界</strong>。</li>\n</ul>\n<h3 id=\"m21-h6\">2.2 分析哲學家嘅批評</h3>\n<ul>\n<li>思維好容易<strong>掉進文字圈套而作繭自縛</strong>；所謂思路糾結，往往係喺<strong>語言陷阱</strong>裏自尋煩惱。</li>\n<li>好多高深莫測嘅問題/理論，拆穿咗只係「有名無實」嘅 <strong>pseudo-problem（偽贗問題）</strong> 同偽贗理論。</li>\n<li>不少「精神導師」嘅教說：披住玄妙詞句外衣，內裏空空如也。</li>\n<li>⭐ 例子：<strong>海德格 (Heidegger)</strong> 名言：「<strong>『無』先於『非』與『否定』</strong>」→ 曖昧語句，<strong>毫無 cognitive meaning（認知意義）</strong>，即<strong>根本沒有客觀的真假可言</strong>。</li>\n<li>依據 <strong>艾耶 (A. J. Ayer)</strong> 等分析家：由傳統哲學到歐陸哲學，好些主義/學說都係<strong>語意不明、思想不清</strong>嘅產物——一套套<strong>似是而非的語言戲法</strong>。</li>\n</ul>\n<h3 id=\"m21-h7\">2.3 馬色爾 (Gabriel Marcel) 的故事 ⭐</h3>\n<ul>\n<li>法國南部一系列哲學會議，歐陸 + 英美分析家一齊參加，希望互相交通；「哲學上的交通」始終達不到。</li>\n<li>法國存在主義者<strong>馬色爾</strong>想向分析家解釋「<strong>超越</strong>」、「<strong>恩惠</strong>」等問題；分析家不停問：「你那句話是甚麼意思？」「你的意思只是如此而已嗎？」……</li>\n<li>聽眾問佢點解唔直截了當講意思。馬色爾答：「<strong>也許我沒有辦法向你解釋清楚。不過，假如有一架鋼琴在這裏的話，我倒可以把我的意思彈奏出來。</strong>」（取意自 H. Kohl, <em>The Age of Complexity</em>）</li>\n<li>作者設想分析家嘅反駁：<ul>\n<li>「咁你不如去彈琴／轉行做演奏家！」</li>\n<li>一面埋怨語言、一面喋喋不休 = 嚷着要「文靜」嘅長舌婦。</li>\n<li>⭐ <strong>哲學係一門思考的學問，不可或缺的工具係語言</strong>（冇語言就無法深入思考和討論）；<strong>音樂係藝術，工具係樂器</strong>。哲學家唔善用自己工具、反而想用樂器思考 → 注定失敗。</li>\n</ul>\n</li>\n<li>作者話：如果佢係馬色爾，<strong>唔會勉強反駁</strong>（去抽煙、聊天、睡午覺）。</li>\n</ul>\n<h3 id=\"m21-h8\">2.4 「邊個境界高？」⭐</h3>\n<ul>\n<li>有人問：分析家境界高定馬色爾境界高？</li>\n<li>作者反問：「<strong>甚麼高高低低的？你所謂的『高』（或『低』），根據甚麼標準來衡量？</strong>」</li>\n<li>⚠️ 呢個反問<strong>並不表示</strong>境界高低問題<strong>冇可能</strong>有比較客觀的標準。</li>\n<li>用意：<strong>問題的意思未釐清之前，我們無法有效地討論它</strong>；硬要爭論 = 「<strong>盲俠鬥盲俠</strong>」——互不碰頭。</li>\n</ul>\n<hr>\n<h2 id=\"m21-h9\">3. 二、分析哲學的方法進路 —— 從古代思想到現代分析思考</h2>\n<h3 id=\"m21-h10\">3.1 分析哲學四個階段／種別 ⭐（20 世紀初「哲學的革命」萌芽）</h3>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>支派</th>\n<th>特點</th>\n<th>代表人物</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>(一)</td>\n<td><strong>早期分析哲學 (Early analytic philosophy)</strong></td>\n<td>—</td>\n<td><strong>羅素 Russell、慕爾 Moore、維根斯坦 Wittgenstein</strong>；實效論者 (pragmatists) <strong>裴爾士 Peirce、詹姆斯 James</strong> 算係<strong>先驅</strong></td>\n</tr>\n<tr>\n<td>(二)</td>\n<td><strong>邏輯實徵論 (Logical Positivism)</strong></td>\n<td>由「<strong>維也納學圈 (Vienna Circle)</strong>」衍發；以「<strong>反對玄學</strong>」同「<strong>強調科學</strong>」著稱；後來又稱「<strong>邏輯經驗論 (Logical Empiricism)</strong>」</td>\n<td><strong>卡納普 Carnap、施里克 Schlick、艾耶 Ayer、函寶 Hempel、萊興巴赫 Reichenbach</strong></td>\n</tr>\n<tr>\n<td>(三)</td>\n<td><strong>特構語言學派 (Ideal / Constructed Language School)</strong></td>\n<td>應用**特構語言（主要係符號邏輯 symbolic logic）**處理哲學問題</td>\n<td>卡納普、羅素、<strong>塔斯基 Tarski</strong>、函寶、<strong>瑰英 Quine</strong>、<strong>波柏 Popper</strong>、<strong>古德曼 Goodman</strong></td>\n</tr>\n<tr>\n<td>(四)</td>\n<td><strong>日常語言學派 (Ordinary Language School)</strong></td>\n<td>藉住分析語言嘅<strong>平常用法 (ordinary use)</strong> 去<strong>解答或解消</strong>哲學問題</td>\n<td><strong>（後期的）維根斯坦</strong>、韋斯登 Wisdom、懷士曼 Waismann、<strong>萊爾 Ryle</strong>、<strong>奧斯丁 Austin</strong>、<strong>史特勞遜 Strawson</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li>⚠️ 各支派<strong>不必互相排斥</strong>：羅素可歸入 (一) 同 (三)；卡納普可歸入 (二) 同 (三)。</li>\n<li>⭐ <strong>分析哲學最主要的特點 = 佢處理問題時所用的方法 = 語理分析。</strong></li>\n</ul>\n<h3 id=\"m21-h11\">3.2 西方哲學發展線索（圖一）⭐⭐</h3>\n<pre><code>古代哲學：  「甚麼是 X？」                         ← 玄學 metaphysics / 倫理學 ethics\n     ↓\n近代哲學：  「X 在人類知識的限度以內嗎？」            ← 知識論 epistemology\n     ↓\n現代分析哲學：「『X』一辭究竟是甚麼意思？」           ← 語理分析\n            （譬如說，怎樣定義或例釋『X』？）\n</code></pre>\n<ul>\n<li><strong>古代哲學中心問題</strong>：「甚麼是<strong>宇宙萬物的本質</strong>？」（屬<strong>玄學 metaphysics</strong>）；「甚麼是<strong>人生的終極目標</strong>？」（屬<strong>倫理學 ethics</strong>）→ 眾說紛紜、莫衷一是。</li>\n<li>可能原因：問題超出人類認知能力？如果認知能力「心有餘而力不足」，繼續追問 = 徒勞無功。</li>\n<li><strong>近視眼爭匾額</strong>笑話 ⭐：一班近視眼喺涼亭下爭論匾額寫乜（四海一家／天下為公／天下太平），明眼人話：「<strong>亭子上面根本沒有任何匾額哩！</strong>」→ 爭論前嘅<strong>先決條件</strong>：我哋嘅視力（認知能力）要達到目的物，否則爭論都係無謂。</li>\n<li>由此 → 轉問「人的認知能力有甚麼限度？」→ <strong>近代西方哲學以知識論 (epistemology) 為核心</strong> → 係<strong>哲學反省深入一層</strong>，因為<strong>前一種問題預設 (presuppose) 着後一種問題</strong>。</li>\n<li>⚠️ 知識論問題都<strong>冇公認定論</strong>，但<strong>唔等於哲學冇進步</strong>——進步 = 由一個問題<strong>追溯到背後更基本的問題</strong>。</li>\n</ul>\n<h3 id=\"m21-h12\">3.3 「預設」(Presupposition) 的例子 ⭐</h3>\n<ul>\n<li><strong>Q 先生問女朋友</strong>：「我們結婚時舉行<strong>西式還是中式</strong>的婚禮？」→ 預設咗女朋友會同佢結婚；更基本嘅問題係：「<strong>你會跟我結婚嗎？</strong>」</li>\n<li>Q 問女朋友：「<strong>你的丈夫近來沒有像以前那樣經常打你，是嗎？</strong>」→ 兩項預設：(a) 女朋友<strong>有丈夫</strong>；(b) 佢丈夫<strong>以前經常打佢</strong>。（Q 要考慮嘅唔係「女朋友是否常被丈夫打」，而係「自己會唔會被女朋友打」😂）</li>\n<li>如果唔首先反省認知能力嘅限度，貿然追問萬物本質 → 好似 Q 先生咁「碰一個很大的釘子」。</li>\n</ul>\n<h3 id=\"m21-h13\">3.4 點解語理分析比知識論更基本？⭐⭐</h3>\n<ul>\n<li>「知識的可能限度達到甚麼地方？」vs「所謂『<strong>知識</strong>』其實是甚麼意思？」→ <strong>後者更基本</strong>。</li>\n<li>冇釐清「知識」一詞嘅意思，就冇辦法討論「知識之可能限度」。</li>\n<li>例：「<strong>＊＊◎△有沒有極限？</strong>」→ 冇人知答案，因為<strong>連自己問緊乜都唔知</strong>；應該一開始反問：「<strong>『＊＊◎△』到底是甚麼意思？</strong>」</li>\n<li>⭐⭐ <strong>「你所說的『X』是甚麼意思？」= 語理分析最鮮明尖銳的標記 (hallmark)。</strong></li>\n<li>註：呢種「基本性」嘅比較係由「<strong>方法學的次序 (methodological order)</strong>」決定。</li>\n</ul>\n<h3 id=\"m21-h14\">3.5 語理分析處理問題嘅步驟 ⭐</h3>\n<ol>\n<li>一般思考習慣：直接搵答案，好少反省問題嘅意思。</li>\n<li>語理分析：<strong>首先釐清問題的意思</strong>。<ul>\n<li>如果係<strong>冇意義嘅偽贗問題 (pseudo-problem)</strong> → 工作唔係「解答」而係「<strong>解消 (dissolve)</strong>」。</li>\n<li>如果係<strong>有意義</strong> → 進一步對其意義作<strong>較精細的審定</strong> → 探討先有<strong>嚴格基礎</strong>。</li>\n</ul>\n</li>\n<li>否則：探討容易流於<strong>混淆、盲目、乃至無的放矢</strong>。</li>\n</ol>\n<ul>\n<li>總括：<strong>玄學 &amp; 倫理學 → 知識論 → 語理分析</strong> = 思想反省<strong>愈趨成熟</strong>的表現。</li>\n<li>註：呢條線索只係一種簡略嘅「<strong>架式的表象 (schematic representation)</strong>」。</li>\n</ul>\n<hr>\n<h2 id=\"m21-h15\">4. 三、對文字把戲的破解 —— 四類最易惑人心思的文字把戲 ⭐⭐⭐</h2>\n<blockquote>\n<p>語言分析<strong>源於</strong>哲學思考，但<strong>不限於</strong>哲學思考；對<strong>任何思想性的問題</strong>都有重要應用。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>派別</th>\n<th>核心手法</th>\n<th>經典例子</th>\n<th>破解</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>(A) 無中生有派</strong></td>\n<td>驟眼睇似「<strong>有</strong>」認知意義，分析後原來「<strong>無</strong>」認知意義</td>\n<td>柏烈得萊「絕對」；黑格爾之謎</td>\n<td>唔好急住同意／反對，先檢查係咪有 <strong>cognitive meaning</strong> 嘅語句</td>\n</tr>\n<tr>\n<td><strong>(B) 跳高一層派</strong>（又叫「<strong>某個意義派</strong>」、「<strong>觀點角度派</strong>」）</td>\n<td>「跳高一個層次來看……」「在某個意義之下……」「從 X 學的觀點（或角度）着眼……」當擋箭牌</td>\n<td>孔子體重超過五百磅</td>\n<td>請佢釐清「層次」「意義」「觀點」「角度」嘅內容；佢轉移話題 → <strong>以子之矛，攻子之盾</strong></td>\n</tr>\n<tr>\n<td><strong>(C) 另一種 X 派</strong></td>\n<td>「指鹿為馬」嘅翻版，用喺抽象名詞</td>\n<td>「通常說的自由民主是假的，我們的才是真自由真民主」</td>\n<td>問：同通常嘅 X 有冇<strong>大致相同的類屬性徵</strong>？</td>\n</tr>\n<tr>\n<td><strong>(D) 空洞派</strong></td>\n<td>用空泛籠統字眼 → <strong>油腔滑調</strong>，任何情況都「正確」，避開<strong>否證</strong></td>\n<td>江湖神棍、工程學教授、三個封閉系統例子</td>\n<td>要求精密、可否證嘅斷述</td>\n</tr>\n</tbody></table>\n<h3 id=\"m21-h16\">(A) 無中生有派 ⭐</h3>\n<p><strong>例一：柏烈得萊 (F. H. Bradley，新唯心論者) 的「絕對」</strong></p>\n<ul>\n<li>「<strong>絕對 (The Absolute) 進入演進和進步裏，而它自己卻不能演進和進步。</strong>」（引自 Ayer, <em>Language, Truth and Logic</em>）</li>\n<li>語言分析處理：<strong>唔會輕率表示「同意」或「不同意」</strong>，而係首先檢查佢係唔係一個<strong>有認知意義的語句</strong>。<ul>\n<li>「進入」喺呢句咩意思？（「客人進入我的客廳」明，但「絕對進入演進和進步裏」？）</li>\n<li>按通常用法，「<strong>絕對」唔係名詞</strong>，你當佢名詞用，指咩？</li>\n</ul>\n</li>\n<li>結論：冇明確意義令人斷定為真或為假 → <strong>甚至稱不上一個假語句</strong>，係<strong>連假語句的資格都沒有的偽贗陳述</strong> → <strong>缺乏認知意義</strong>。⚠️（T/F 陷阱：「Bradley 句子係假的」✗ → 佢係<strong>無意義 (meaningless)</strong>，唔係假 (false)）</li>\n</ul>\n<p><strong>例二：黑格爾之謎 (Hegel)</strong></p>\n<ul>\n<li>「<strong>X 是物質在它的無形性及其液化性之中的自我復元；是其抽象的同質性對分殊的特定性之一種勝利；它底作為否定之否定的抽象的純粹自存的連續性在此從事活動。</strong>」</li>\n<li>⭐ <strong>X = 「熱」(heat)</strong>（引自 Blanshard, <em>On Philosophical Style</em>）</li>\n<li><strong>白連沙德 (Blanshard)</strong> 懷疑呢段係<strong>冇意義嘅字面堆砌</strong>；⚠️ 白連沙德<strong>唔算分析哲學家</strong>（思想比較保守、傾向傳統），但佢都認為黑格爾呢段冇意義。</li>\n<li>⭐ <strong>贊同或反對都有問題</strong>：兩者都<strong>假定咗</strong>黑格爾嘅講法係一個<strong>確定的斷述</strong>，但其實只係一串<strong>缺乏明確內容、冇認知意義</strong>嘅句子。</li>\n</ul>\n<h3 id=\"m21-h17\">(B) 跳高一層派（某個意義派／觀點角度派）⭐</h3>\n<ul>\n<li>常見片語：「<strong>跳高一個層次來看……</strong>」「<strong>在某個意義之下……</strong>」「<strong>從 X 學的觀點（或角度）着眼……</strong>」</li>\n<li>問返：「高一層次」係咩層次？「某個意義」係邊個意義？「X 學嘅觀點」係點樣嘅觀點？→ 用作口頭禪嘅人往往<strong>瞠目不知所答</strong>。</li>\n<li>⚠️ 作者<strong>唔係話</strong>呢啲片語<strong>唔可以用</strong>：如果能清楚答覆，用就冇問題；問題係<strong>根本講唔出咩意思、只用嚟花言巧語</strong> → 是非不分、觀念混淆；仲有人當<strong>擋箭牌</strong>：<ul>\n<li>「在一般的層次看，你的批評是對的；但要是跳高一層來看，我的說法更站得住腳。」</li>\n<li>「在平常的意義之下，你的批評可算正確；不過在某個意義——一個更深的意義——之下，我的說法才是正確的。」</li>\n<li>「以普通的觀點或角度來衡量，你的批評也有道理；可是從 X 學的觀點或角度着眼，我的說法完全成立。」</li>\n</ul>\n</li>\n<li><strong>應付方法</strong>：(1) 請佢先<strong>釐清</strong>「層次」「意義」「觀點」「角度」嘅內容；(2) 如果佢用<strong>譏笑、「發火」、濫用權威、顧左右而言他</strong>轉移問題 → 用 ⭐「<strong>以子之矛，攻子之盾</strong>」。</li>\n<li>⭐ <strong>孔子體重例子</strong>：「孔子的體重超過五百磅。」「不合事實。」「在平常意義下你對，但在某個更『高』的意義之下我更對——<strong>倘若孔子揹着南子，南子揹着子路，子路揹着貂蟬，貂蟬揹着呂布，呂布揹着楊玉環</strong>——在『這』個意義之下，我說的就很對。」「如果你跳高一層、兩層、三層……來看，你就知道確是有這個意義的了。」</li>\n</ul>\n<h3 id=\"m21-h18\">(C) 另一種 X 派 ⭐</h3>\n<ul>\n<li>斑馬係<strong>另一種馬</strong>、化石係<strong>另一種石</strong> ✔ → <strong>必要條件 (necessary condition)</strong>：佢哋分別同普通馬/石嘅<strong>類屬性徵 (generic characteristics) 大致相同</strong>。</li>\n<li>⭐ 原則：<strong>只有當 a 與 b 的類屬性徵大致相同的時候，a 才可說是另一種 b。</strong><ul>\n<li>✗ 唔可以指住一隻鹿話係「另一種馬」；✗ 唔可以指住一嚿石話係「另一種蛋糕」。</li>\n</ul>\n</li>\n<li>流行論調 = 「<strong>指鹿為馬</strong>」嘅翻版；因為涉及「<strong>自由</strong>」「<strong>民主</strong>」等<strong>抽象名詞</strong>（唔係「鹿」「馬」等具體名詞），荒謬本質<strong>較易逃過覺察</strong>。<ul>\n<li>「<strong>通常說的自由民主是假自由假民主，我們所說的是另一種自由民主，那才是真自由真民主。</strong>」</li>\n</ul>\n</li>\n<li>質問：呢個「另一種自由民主」同通常講嘅自由民主有冇<strong>大致相同的類屬性徵</strong>？冇嘅話，點可以叫「另一種」，甚至美其名曰「<strong>真正的</strong>自由民主」？同<strong>指鹿為馬、把石頭叫做蛋糕</strong>有咩分別？</li>\n<li>「天才們」嘅諗法：開動<strong>萬能宣傳機器</strong>，<strong>重複又重複</strong>宣稱 → 日子久咗人哋就會信。<strong>最可悲嘅係：呢個諗法好可能符合事實。</strong></li>\n<li>（延伸閱讀：M. Cranston, <em>Freedom</em>）</li>\n</ul>\n<h3 id=\"m21-h19\">(D) 空洞派 ⭐⭐</h3>\n<ul>\n<li>比較：「<strong>車開得太快者將重重受罰</strong>」vs「<strong>車速超過每小時一百公里者罰款五百大元</strong>」→ <strong>後者遠為精密</strong>；前者空泛得多。</li>\n<li>「<strong>反動</strong>」、「<strong>壞份子</strong>」等字眼，對照嚴格法律術語 → 都係空空泛泛嘅語辭。</li>\n<li>⭐ <strong>空泛語辭 = 釀製「油腔滑調」的上佳材料。</strong></li>\n</ul>\n<p><strong>江湖神棍例子</strong>：「你遵守如此如此的誡條，上帝（或玉皇大帝）就會保佑你。」→ 你照做但一直不幸，搵佢算帳 → 「<strong>其實你已經是得到上帝保佑的了，不然的話，你遭到的不幸會更加多，可能已大難臨頭，根本沒命來找我算帳哩。</strong>」= 油腔滑調典型。</p>\n<p><strong>油腔滑調的特色</strong> ⭐⭐</p>\n<ul>\n<li>喺<strong>任何情形之下都能被解釋成為正確</strong>。</li>\n<li>奧妙：利用<strong>籠籠統統的字眼</strong>，<strong>永遠不作清晰明確的斷述</strong> → 總能<strong>避開別人提出的否證 (falsification)</strong>，將<strong>一切事例都說成是它的證據</strong>。</li>\n<li>代價：⭐ <strong>不能提供任何確定的知識或具體的指引。</strong>（「安全保險」但空洞）</li>\n</ul>\n<p><strong>工程學教授例子</strong>：佢嘅工程理論只係兩句格言：「<strong>所取的材料要合用，所用的圖則要適宜。</strong>」→ 樓建成功：「理論正確的例證」；樓塌咗：「都係理論正確的例證（材料不合用／圖則不適宜）」→ 夠安全，但<strong>唔構成工程學確定知識</strong>，亦<strong>唔能俾建築工人具體指引</strong>。</p>\n<ul>\n<li>科學用語大都<strong>精密嚴格</strong>；但宗教、政治、社會、文藝等言論，好多油腔滑調卻被當作「<strong>深刻的哲理</strong>」。</li>\n<li>唔拆穿嘅話 → 思想喺 ⭐ <strong>「封閉系統」(closed system)</strong> 裏面兜圈子，誤把恍兮惚兮嘅講法視為「有很豐富的內涵」。</li>\n<li><strong>陷於封閉系統的人</strong>：到處發現「<strong>證實</strong>」其信仰嘅例子；充滿「<strong>作見証</strong>」嘅衝動甚至狂熱；<strong>不能忍受任何懷疑</strong>；喜歡用奇妙方式（如<strong>火刑、槍斃</strong>）去「拯救不信者的靈魂」，<strong>唔鍾意講理</strong>。</li>\n</ul>\n<p><strong>封閉系統／「準封閉系統」三個例子</strong> ⭐</p>\n<ol>\n<li>「<strong>成功的秘訣是在最恰當的時刻做最恰當的事。</strong>」→ 不着邊際（打交輸咗，返去唸一千次都冇用）。【想做「所有成就歸功於你」嘅「偉大導師」？秘訣：講嘢要令人<strong>摸不着邊</strong>——當然要喺最恰當時刻用最恰當字眼😏】</li>\n<li>「<strong>事情之所以如此，是因為事物是不斷變化的。</strong>」→ 空洞浮泛；醫生咁樣診斷你，你可能想打甩佢門牙。【識時務嘅俊傑靠呢句過關：立場隨權勢改變，話係「認識改變了」，「因為事物是不斷變化的」。】</li>\n<li>「<strong>信就得神恩，不信就遭神罰。</strong>」→「神恩」同「神罰」兩個詞語之間嘅<strong>使用界線模糊不清、遊移不定</strong>。屋燒咗、腳斷咗、太太失蹤 → 如果佢係你<strong>敵人</strong>：「活該，上帝懲罰」；如果係你<strong>朋友</strong>：「感謝上帝，那是恩典（天國有更好嘅屋、更強健嘅腳……太太失蹤更是最大恩典）」。</li>\n</ol>\n<hr>\n<h2 id=\"m21-h20\">5. 四、澄清與定位</h2>\n<h3 id=\"m21-h21\">5.1 語理分析的方法進路（最簡略講法）⭐</h3>\n<ul>\n<li>「<strong>首先釐清論題的意思</strong>」</li>\n<li>詳細啲：「<strong>首先分析關鍵語辭的用法，釐清了所考慮的論點或問題的意思之後，才着手進一步的研究。</strong>」</li>\n</ul>\n<h3 id=\"m21-h22\">5.2 (A) 有關語理分析的五項澄清（對語理分析嘅誤解）⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>誤解</th>\n<th>作者澄清</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>(1)</td>\n<td>「首先釐清論題意思」好簡單</td>\n<td>落實運用得<strong>靈活、合理、服人之心</strong>係一種<strong>精微的技巧</strong>：要鋒銳頭腦、機敏心思、對意義透徹了解、準確審辨；仲要打破心理障——<strong>望文生義、胡思亂想</strong>（一聽「語言」就以為語言分析係文字把戲，其實佢<strong>正是文字把戲的剋星</strong>）</td>\n</tr>\n<tr>\n<td>(2)</td>\n<td><strong>語意學 (semantics)</strong>（或記號學 semiotics、語言學 linguistics、語言哲學 philosophy of language）= 語理分析</td>\n<td>⚠️ <strong>很大的誤解</strong>！<strong>語意學是一門「學科」(discipline)</strong>；<strong>語理分析本身不是學科，而是探究問題的「方法」或「進路」(method / approach)</strong></td>\n</tr>\n<tr>\n<td>(3)</td>\n<td>講求用語清晰 = 膚淺</td>\n<td><strong>荒謬</strong>：①「<strong>清晰」≠「清淺」，更 ≠「膚淺」</strong>（物理學唔膚淺，但可以用清晰語言建構）；② 用語含糊就無法確定佢講咗乜，又點知佢表達咗「深奧的思想」？能夠用清晰語言陳構論點 = 「<strong>功力高</strong>」嘅徵象；未把握課題時用語每每<strong>晦澀</strong>，有意無意<strong>藏飾立論弱點</strong>。語理分析可貴之處：令立論<strong>不帶隱藏或虛飾</strong></td>\n</tr>\n<tr>\n<td>(4)</td>\n<td>「<strong>釐清是不足夠的！語理分析是有其一定限度的！</strong>」</td>\n<td>講咗等於冇講——任何嘢都可以話「不足夠」：數學唔能醫人、醫學唔能烹飪、烹飪唔能計算……「釐清是不足夠的」<strong>呢句本身都唔足夠</strong>（唔食得、唔着得、唔可以打破傻瓜腦袋）。特殊情況（有人傻到以為「語理分析是一切」）可以用「不足夠」提點佢，但<strong>唔等於語理分析這「方法」有毛病，只係佢對語理分析嘅「看法」有毛病</strong></td>\n</tr>\n<tr>\n<td>(5)</td>\n<td>「<strong>你這是執着文字嘛！</strong>」</td>\n<td>很不負責任。語理分析<strong>從來冇叫人執着文字</strong>；<strong>唔係漫無目標分析任何語辭，只分析論題中的關鍵用語</strong>。例：「<strong>人是否命定？</strong>」唔使問「人」「是」「否」咩意思，但**要分析「命定」**嘅意思——解決問題最起碼嘅條件。對方仍以「不要執着」作遁辭 → 再用「<strong>以子之矛攻子之盾</strong>」（自己亂講一堆似通非通句子，佢問咩意思就扮委屈話「你這是執着文字嘛！」）</td>\n</tr>\n</tbody></table>\n<p><strong>語理分析 vs 語意學的關係</strong> ⭐⭐</p>\n<ul>\n<li>語理分析可用嚟確立<strong>一切學科（包括語意學）<strong>嘅概念基礎；可處理</strong>任何領域</strong>裏屬於<strong>思想性或概念性</strong>嘅問題。</li>\n<li>喺<strong>知識論、倫理學、美學、宗教哲學、社會政治哲學、哲理語意學 (philosophical semantics)</strong> 等哲學部門，語理分析<strong>格外重要而且必要</strong>。</li>\n<li>語意學研究成果（如對語意結構嘅考察）反過嚟為分析方法嘅實際運用提供利便。</li>\n<li>⭐ <strong>結論：語理分析是語意學的基礎方法（或說是哲理語意學的主要方法），而語意學則可作為語理分析的輔助工具。</strong></li>\n</ul>\n<h3 id=\"m21-h23\">5.3 (B) 語理分析的定位：思考方法學的起點 ⭐⭐⭐</h3>\n<p><strong>現代思考方法學（簡稱「方法學」）包括四種：</strong></p>\n<ol>\n<li><strong>語理分析 (logico-linguistic analysis)</strong></li>\n<li><strong>邏輯方法 (logical method)</strong></li>\n<li><strong>科學方法 (scientific method)</strong></li>\n<li><strong>謬誤剖析 (fallacy analysis)</strong></li>\n</ol>\n<p><strong>點解語理分析係最基本一環？</strong></p>\n<ul>\n<li><strong>謬誤剖析係其他三種方法的引申</strong>：判斷一個言論有冇犯謬誤，依據就係語理分析、邏輯方法、科學方法 —— 先分析有冇<strong>語理上的毛病</strong>；冇嘅話，再用邏輯方法同科學方法考察佢<strong>是否合乎邏輯的律則</strong>、<strong>是否滿足科學方法關於證立的規求</strong>。</li>\n<li>所以只需比較語理分析 vs 邏輯方法 &amp; 科學方法：應用邏輯/科學方法處理任何論題，<strong>第一步必須確定論題所說或所問的到底是甚麼</strong>（= 首先釐清論題意思）。</li>\n<li>⭐ ∴ 語理分析嘅「<strong>方法學位置</strong>」<strong>先於</strong>邏輯方法和科學方法 → 語理分析係<strong>思考方法學最基本的部份</strong>，即<strong>方法學的起點</strong>。</li>\n</ul>\n<p><strong>⭐⭐ 是起點，但不是終點 (starting point, NOT end point)</strong></p>\n<ul>\n<li>知識系統嘅建構固然要釐清／審定語言概念（<strong>清理、開路、打地基</strong>嘅底層工作），但**更有賴其他方法（特別係科學方法）**去建構。</li>\n<li><strong>概念問題 (conceptual problem)</strong>：一般「思想性的問題」乃係概念問題，<strong>原則上只需用分析方法界劃清楚關鍵語辭／概念便能解決</strong>。<ul>\n<li>例：「<strong>甚麼是真、善、美？</strong>」→ 分析清楚「真」「善」「美」等概念 ≈ 解決咗。</li>\n</ul>\n</li>\n<li><strong>經驗問題 (empirical problem)</strong>：<strong>科學方法係主要憑藉</strong>。<ul>\n<li>例：「<strong>宇宙是否在膨脹？</strong>」→ 分析「宇宙膨脹」嘅概念只係<strong>最起碼的工夫</strong>，主要要靠科學方法判定事實上宇宙係咪膨脹緊。</li>\n</ul>\n</li>\n</ul>\n<p><strong>「起點重要定終點重要？」</strong></p>\n<ul>\n<li>反問：「甲乙兩人賽跑，<strong>甲跑一百公尺勝過乙，乙跑千五公尺勝過甲</strong>，究竟誰跑得快些？」（→ 問題本身要先釐清標準）</li>\n<li>另一個回答：「如果你<strong>鍾意</strong>語理分析，可以話<strong>起點比終點重要</strong>（冇起點，事情永遠無法開始）；如果你<strong>唔鍾意</strong>，可以話<strong>終點比起點重要</strong>（冇終點，事情永遠無法完成）。」</li>\n</ul>\n<h3 id=\"m21-h24\">5.4 其他註釋（細節題）</h3>\n<ul>\n<li>註⑦：<strong>預設 (presupposition)</strong> 可以再區別為幾個次類，本文毋須細分。</li>\n<li>註⑮：方法學有唔同種別（管理、教育嘅方法學）；本文講嘅係<strong>思考的方法學</strong>——考慮嘅大體上係關於<strong>各種思考的審查與核證 (justification)</strong> 的問題，<strong>而唔係關於發現過程 (discovery)</strong> 的問題（後者好多時<strong>冇定則可循</strong>）。<strong>狹義的方法學 = 科學方法學</strong>。</li>\n<li>用語補註：(1)「語理分析的方法」中，「語理分析」指<strong>思考的活動</strong>；「語理分析這方法」中，指<strong>思考的方法</strong>。(2)「語理分析是方法學的基本部門」= 「方法學的基本部門以語理分析為其課題」嘅簡略語（正如「命題演算是邏輯的基本部門」）。</li>\n</ul>\n<hr>\n<h2 id=\"m21-h25\">6. 考試速攻：MC / T-F 高危考點 ⚠️</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>題目可能講法</th>\n<th>答案</th>\n<th>理由</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>語理分析又叫語言分析 (linguistic analysis)</td>\n<td><strong>T</strong></td>\n<td>原文</td>\n</tr>\n<tr>\n<td>語理分析是一門學科，即語意學</td>\n<td><strong>F</strong></td>\n<td>語意學係學科；語理分析係<strong>方法/進路</strong></td>\n</tr>\n<tr>\n<td>語意學可作為語理分析的輔助工具</td>\n<td><strong>T</strong></td>\n<td>語理分析係語意學嘅基礎方法</td>\n</tr>\n<tr>\n<td>語理分析是思考方法學的終點</td>\n<td><strong>F</strong></td>\n<td>係<strong>起點，唔係終點</strong></td>\n</tr>\n<tr>\n<td>「宇宙是否在膨脹？」主要靠語理分析解決</td>\n<td><strong>F</strong></td>\n<td>經驗問題，主要靠<strong>科學方法</strong></td>\n</tr>\n<tr>\n<td>「甚麼是真善美？」分析清楚概念就等於解決咗</td>\n<td><strong>T</strong></td>\n<td>概念問題</td>\n</tr>\n<tr>\n<td>謬誤剖析是其他三種方法的引申</td>\n<td><strong>T</strong></td>\n<td>依據語理分析、邏輯、科學方法</td>\n</tr>\n<tr>\n<td>柏烈得萊「絕對」句子是假語句</td>\n<td><strong>F</strong></td>\n<td>連假語句資格都冇，<strong>缺乏認知意義</strong></td>\n</tr>\n<tr>\n<td>黑格爾謎語中 X = 熱</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>白連沙德係分析哲學家</td>\n<td><strong>F</strong></td>\n<td>唔算，思想保守傾向傳統</td>\n</tr>\n<tr>\n<td>反對黑格爾嗰段說話就係正確態度</td>\n<td><strong>F</strong></td>\n<td>贊同或反對都假定咗佢係確定斷述</td>\n</tr>\n<tr>\n<td>「清晰」等於「膚淺」</td>\n<td><strong>F</strong></td>\n<td>清晰 ≠ 清淺 ≠ 膚淺</td>\n</tr>\n<tr>\n<td>語理分析要求分析論題中每一個字</td>\n<td><strong>F</strong></td>\n<td>只分析<strong>關鍵用語</strong>（如「命定」）</td>\n</tr>\n<tr>\n<td>油腔滑調嘅言論能提供確定知識</td>\n<td><strong>F</strong></td>\n<td>避開否證，<strong>冇確定知識、冇具體指引</strong></td>\n</tr>\n<tr>\n<td>「另一種 X」成立嘅必要條件：類屬性徵大致相同</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析家譏笑歐陸哲學家「沒有心」</td>\n<td><strong>F</strong></td>\n<td>分析家話歐陸「<strong>沒有腦</strong>」；歐陸話分析家「沒有心」</td>\n</tr>\n<tr>\n<td>近代西方哲學以知識論為核心</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「你所說的 X 是甚麼意思？」係語理分析最鮮明的標記</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>邏輯實徵論源自維也納學圈，反對玄學、強調科學</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>日常語言學派代表包括後期維根斯坦、奧斯丁、萊爾</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>偽贗問題應該被解答</td>\n<td><strong>F</strong></td>\n<td>應被<strong>解消 (dissolve)</strong></td>\n</tr>\n<tr>\n<td>思考方法學主要處理「發現過程」</td>\n<td><strong>F</strong></td>\n<td>處理<strong>審查與核證 (justification)</strong></td>\n</tr>\n</tbody></table>\n","m2a":"<h1 id=\"m2a-h1\">M2-2a 語理分析 &amp; 問題分類 (Logico-linguistic Analysis &amp; Classification of Questions)</h1>\n<blockquote>\n<p>來源：Module 2 Readings「2a. Classification of Questions」（講者 slides，13 頁）\n⭐ = 極高機會考；⚠️ = 常見陷阱</p>\n</blockquote>\n<hr>\n<h2 id=\"m2a-h2\">0. 一句總結</h2>\n<p><strong>三類問題：Conceptual questions（概念問題）／Factual questions（事實問題）／Evaluative questions（評價問題）。</strong>\n判斷方法：<strong>要用咩方法先答到？</strong> → 只分析概念 = Conceptual；要經驗方法 = Factual；了解概念 + 事實之後<strong>仲要用個人價值觀</strong> = Evaluative。</p>\n<hr>\n<h2 id=\"m2a-h3\">1. 開場引言（slide 1–2）</h2>\n<ul>\n<li>《莊子・齊物論》：「<strong>六合之外，聖人存而不論；六合之內，聖人論而不議；春秋經世，先王之志，聖人議而不辯。</strong>」</li>\n<li>孔子 (Confucius, 551–479 BC)：「<strong>道之以政，齊之以刑，民免而無恥；道之以德，齊之以禮，有恥且格。</strong>」《論語．為政》</li>\n<li>蘇格拉底 (Socrates, 470–399 BC)：“<strong>The only good is knowledge and the only evil is ignorance.</strong>”</li>\n<li>Socrates：“<strong>I cannot teach anybody anything; I can only make them think.</strong>”</li>\n</ul>\n<h2 id=\"m2a-h4\">2. 西方哲學中的理性傳統（slide 3）⭐</h2>\n<ul>\n<li><strong>科學方法先於科學知識；思考先於知識。</strong></li>\n<li>原則與方法：<strong>客觀、理性</strong></li>\n<li>課程結構（記住流程）⭐：</li>\n</ul>\n<pre><code>語理分析 (M2, M3)  →  邏輯 / 科學 (M4, M5)  →  檢查謬誤 (M6)\n</code></pre>\n<p>（呼應李天命：語理分析係方法學嘅<strong>起點</strong>；謬誤剖析係其他方法嘅引申）</p>\n<hr>\n<h2 id=\"m2a-h5\">3. 語理分析 Logico-linguistic Analysis（slide 4–6）⭐⭐</h2>\n<h3 id=\"m2a-h6\">3.1 定義／特徵</h3>\n<ul>\n<li><strong>不採用人工語言 (artificial language)，將邏輯融入於日常語言 (ordinary language) 中的思考方法。</strong></li>\n<li>⚠️ <strong>不是研究語言的用法，而是分析思維合理性。</strong>（T/F 陷阱：「語理分析係研究語言用法嘅學問」✗）</li>\n<li><strong>首先釐清 (clarify) 關鍵用語的意思，再着手分析有關講法</strong>，這種處理問題的進路，就是語理分析。</li>\n</ul>\n<h3 id=\"m2a-h7\">3.2 基本步驟 ⭐⭐（背次序）</h3>\n<ol>\n<li><strong>分辨</strong>語句中邊啲字詞先係對分析語句起關鍵作用嘅「<strong>關鍵用語 (key terms)</strong>」；</li>\n<li><strong>釐清</strong>「關鍵用語」嘅<strong>內容與意義</strong>；</li>\n<li>若<strong>未能釐清</strong>「關鍵用語」嘅涵義時，就要<strong>視情況去回答（或不作回答）</strong>。</li>\n</ol>\n<h3 id=\"m2a-h8\">3.3 起點 &amp; 終點 ⭐⭐⭐</h3>\n<ul>\n<li><strong>當分析問題時，語理分析總是解決問題的起點，也可以是終點，要視乎問題的性質。</strong><ul>\n<li><strong>概念問題</strong> → 語理分析 = 起點 <strong>兼</strong> 終點（分析完概念就答到）</li>\n<li><strong>事實問題 / 評價問題</strong> → 語理分析只係起點，仲要經驗方法／價值判斷</li>\n</ul>\n</li>\n<li>⚠️ 同 2.1 李天命講法對照：「語理分析係<strong>方法學</strong>嘅起點但唔係終點」（講整個知識建構，終點要靠科學方法）；slide 講「<strong>解決個別問題</strong>時<strong>可以</strong>係終點（視乎問題性質）」。兩者唔矛盾：<ul>\n<li>「語理分析<strong>總是</strong>起點」→ <strong>T</strong></li>\n<li>「語理分析<strong>永遠不能</strong>是解決問題的終點」→ <strong>F</strong>（概念問題可以）</li>\n<li>「語理分析<strong>一定</strong>是終點」→ <strong>F</strong></li>\n</ul>\n</li>\n</ul>\n<p><strong>Slide 6 例子</strong>（都係概念問題 → 語理分析就係終點）：</p>\n<ul>\n<li>「你認為<strong>腐蝕性液體能對人體造成超過十成皮膚燒傷</strong>嗎？」→ 關鍵用語「<strong>十成</strong>」= 100%，<strong>超過十成</strong>概念上不可能 → 唔使做實驗，分析概念就答到（<strong>不能</strong>）。</li>\n<li>「<strong>在截止時間後交功課算準時交功課嗎？</strong>」→ 「準時」按定義即係喺截止時間或之前 → 概念上答到（<strong>不算</strong>）。</li>\n</ul>\n<hr>\n<h2 id=\"m2a-h9\">4. 問題分類 Classification of Questions ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>類別</th>\n<th>定義（背原文）</th>\n<th>點樣答</th>\n<th>例子（slide 原例）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>概念問題 Conceptual Questions</strong></td>\n<td><strong>只須分析問題中的概念、用語就能回答的問題。</strong></td>\n<td>分析概念／定義（語理分析／邏輯／數學）</td>\n<td>甚麼是<strong>真、善、美</strong>？／<strong>5 + 5 = 10?</strong>／<strong>你的生父年齡比你大嗎？</strong>／<strong>4 + 5 = 8?</strong>／<strong>If y = x², then dy/dx is?</strong>／<strong>何謂反對黨？</strong>／<strong>甚麼是國家？</strong>／<strong>甚麼是國家的根本？</strong>／<strong>何為由治及興？</strong></td>\n</tr>\n<tr>\n<td><strong>事實問題 Factual Questions</strong></td>\n<td><strong>原則上必須通過經驗方法 (empirical methods) 才能回答這類問題。</strong></td>\n<td>觀察、調查、實驗、統計</td>\n<td><strong>iPhone 17</strong> 是 2025 年全球銷量最高的智能手機系列嗎？／<strong>日本</strong>是第二次世界大戰中的戰勝國嗎？／<strong>中國</strong>是世界第二大經濟體嗎？／<strong>明年香港會出現財政赤字嗎？</strong>／<strong>明年香港政府的支持度會上升嗎？</strong>／<strong>K2-18b 上有生物嗎？</strong></td>\n</tr>\n<tr>\n<td><strong>評價問題 Evaluative Questions</strong></td>\n<td>包含如「<strong>美</strong>」「<strong>好</strong>」「<strong>偉大</strong>」等<strong>帶有評價意義的概念</strong>，因此當<strong>了解問題的概念及與問題相關的經驗事實後，還須以個人的價值觀 (personal values)</strong> 去回答。</td>\n<td>概念 + 事實 + <strong>價值判斷</strong></td>\n<td><strong>香港科技大學美/好嗎？</strong>／<strong>科大看到的日出比日落美嗎？</strong>／<strong>同性戀是不道德的嗎？</strong>／<strong>香港政府延後推行垃圾徵費的決定是正確的嗎？</strong></td>\n</tr>\n</tbody></table>\n<h3 id=\"m2a-h10\">4.1 判斷技巧（考試用）⭐</h3>\n<ol>\n<li>搵<strong>關鍵用語</strong>：有冇評價字眼？（美、好、偉大、應該、正確、道德、不道德、值得、更好……）→ 有 → 多數係 <strong>Evaluative</strong>。</li>\n<li>冇評價字眼 → 問：「<strong>淨係分析字義／概念就答到？</strong>」→ 係 → <strong>Conceptual</strong>（包括數學、邏輯、定義、「生父比你大」呢類由定義保證嘅）。</li>\n<li>要<strong>睇世界、搵數據、觀察</strong>先答到 → <strong>Factual</strong>。</li>\n</ol>\n<h3 id=\"m2a-h11\">4.2 ⚠️ 易錯位</h3>\n<ul>\n<li><strong>「4 + 5 = 8?」係概念問題</strong>（答案係「錯」都仍然係概念問題）→ 問題分類<strong>唔關答案真假</strong>，關<strong>用咩方法答</strong>。</li>\n<li><strong>「5+5=10」「dy/dx」數學題 = 概念問題</strong>（唔使經驗方法）。</li>\n<li><strong>「你的生父年齡比你大嗎？」= 概念問題</strong>：由「生父」概念已知必然比你大，唔使查身份證。</li>\n<li><strong>未來嘅事</strong>（明年財赤？明年支持度？）<strong>仍然係事實問題</strong>：<strong>原則上 (in principle)</strong> 可以用經驗方法回答（到時就知），<strong>而家答唔到唔代表唔係事實問題</strong>。</li>\n<li><strong>未知／技術上暫時查唔到</strong>（K2-18b 上有冇生物？）<strong>仍然係事實問題</strong>：關鍵字「<strong>原則上</strong>」。</li>\n<li><strong>歷史事實</strong>（日本係咪二戰戰勝國？）→ 事實問題（答案：唔係，係戰敗國）。</li>\n<li>「甚麼是<strong>國家的根本</strong>？」「何為<strong>由治及興</strong>？」→ slide 歸類為<strong>概念問題</strong>（問概念內容）。</li>\n<li>「<strong>同性戀是不道德的嗎？</strong>」→ 「不道德」= 評價概念 → <strong>評價問題</strong>。</li>\n<li>「<strong>政府延後推行垃圾徵費的決定是正確的嗎？</strong>」→ 「正確」帶評價 → <strong>評價問題</strong>（雖然涉及政策事實）。</li>\n</ul>\n<hr>\n<h2 id=\"m2a-h12\">5. 三類問題有高低嗎？（slide 13）⭐⭐</h2>\n<p>以「全球暖化」做例子，三條問題層層遞進：</p>\n<table>\n<thead>\n<tr>\n<th>問題</th>\n<th>類別</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>什麼是<strong>全球暖化 (Global Warming)</strong>？</td>\n<td><strong>概念問題</strong></td>\n</tr>\n<tr>\n<td><strong>以太陽能代替化石燃料發電</strong>是否改善全球暖化的一種方法？</td>\n<td>slides：<strong>事實問題</strong>（⚠️ 講者堂上同意因為「<strong>改善</strong>」而帶<strong>評價性</strong>；乾淨嘅事實版：「以太陽能代替化石燃料是否能<strong>減低碳排放</strong>？」→ 有爭議，考試應會避開）</td>\n</tr>\n<tr>\n<td>人類<strong>應該</strong>盡力保護地球生態嗎？</td>\n<td><strong>評價問題</strong>（「應該」）</td>\n</tr>\n</tbody></table>\n<ul>\n<li>⭐ 講者：三類問題<strong>冇高低，只有先後</strong>——方法上嘅 step 1（概念）→ step 2（事實）→ step 3（評價）；未釐清概念同事實就畀意見（step 3 先行）＝違反批判思考框架。</li>\n<li>重點：三類問題<strong>冇價值上嘅高低之分</strong>（唔係話評價問題「更高級」），但有<strong>方法上嘅先後／依賴關係</strong>：<ul>\n<li>要答<strong>事實問題</strong>，先要釐清<strong>概念</strong>（全球暖化係乜？）；</li>\n<li>要答<strong>評價問題</strong>，先要了解<strong>概念 + 相關經驗事實</strong>，再加<strong>個人價值觀</strong>。</li>\n<li>→ 呼應：<strong>語理分析總是起點</strong>。</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h2 id=\"m2a-h13\">5½. 課堂補充：講者點樣判斷（考試以此為準）⭐⭐⭐</h2>\n<ul>\n<li><strong>一條問題只屬一類</strong>（冇「all of the above」）。判斷次序：<strong>① 概念分析答唔答到？→ ② 唔得，經驗方法答唔答到？→ ③ 都唔得，先係評價問題</strong>。判斷唔到 → 返去第一步<strong>釐清關鍵字眼</strong>。</li>\n<li><strong>考試考「分類」，唔考答案</strong>——「唔好諗答案，諗問題」。</li>\n<li><strong>數學問題一律係概念問題</strong>（5+5=10?、dy/dx）。可以用數手指（經驗）<strong>展示</strong>，但<strong>唔係必須</strong> → 仍然係概念問題。</li>\n<li><strong>句號 vs 問號</strong>：「4+5=8。」係錯嘅陳述；「4+5=8？」係概念問題（答案錯 ≠ 問題錯）。</li>\n<li>「<strong>甚麼是由治及興？</strong>」＝概念；「<strong>李家超會點樣 define 由治及興？</strong>」＝<strong>事實</strong>。「<strong>甚麼是國家的根本？</strong>」＝概念；「<strong>主席話國家的根本是甚麼？</strong>」＝<strong>事實</strong>。（問「某人講過／會點講」＝事實問題）</li>\n<li>「<strong>日本是二戰戰勝國嗎？</strong>」：就算兩個人對「戰勝」嘅定義唔同（戰後 GDP vs 和約簽署），<strong>都唔影響佢係事實問題</strong>。</li>\n<li><strong>未來嘅事</strong>（明年財赤、2027 美國大選）同 <strong>技術上暫時做唔到</strong>（K2-18b）都係<strong>事實問題</strong>；唔好因為「常識上冇可能」就 take for granted。</li>\n<li><strong>冇標年份嘅事實問題 = 考試當日（2026年10月23日）</strong>；時間性係事實問題嘅重要特性（中國係咪第二大經濟體？答案隨年份而變）。</li>\n<li>其他堂上例子：「一年有幾多秒？」→ 概念；「QS 排名第 47 嘅大學係咪比第 52 嘅排名高？」→ 概念；「我屋企隻貓係咪用四隻腳行路？」→ 事實；「你有冇學過思考？」→ 事實；「甚麼是思考？」→ 概念（唔好諗複雜）。</li>\n<li>「甚麼是真、善、美？」點解係<strong>概念</strong>例子（雖然似評價）：有啲哲學家／宗教視真善美為<strong>絕對、普遍</strong>，而且大家傾嘅時候有個「合約」——至少同意講緊係正面、想要嘅嘢。</li>\n<li>將政策「正確與否」<strong>量化成 KPI</strong>（例如減咗幾多膠袋）得出數據，<strong>唔等於</strong>答咗佢係咪正確（評價問題）。</li>\n<li>「支持度咁低，明年一定上升」＝<strong>將事實問題概念化</strong>（錯誤思維）；以「我認為／我預測」表達對未來嘅判斷 ＝ 評價式答法，可以接受。</li>\n</ul>\n<hr>\n<h2 id=\"m2a-h14\">6. 考試速攻 ⚠️</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>講法</th>\n<th>答案</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>語理分析係將邏輯融入日常語言中嘅思考方法，不採用人工語言</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>語理分析係研究語言用法嘅學科</td>\n<td><strong>F</strong>（分析思維合理性；而且係方法唔係學科）</td>\n</tr>\n<tr>\n<td>語理分析第一步：分辨關鍵用語</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>語理分析總是解決問題嘅起點</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>語理分析不能是解決問題嘅終點</td>\n<td><strong>F</strong>（視乎問題性質；概念問題可以）</td>\n</tr>\n<tr>\n<td>「4+5=8?」係事實問題</td>\n<td><strong>F</strong>（概念問題）</td>\n</tr>\n<tr>\n<td>「明年香港會唔會有財赤？」因為而家答唔到所以唔屬事實問題</td>\n<td><strong>F</strong>（原則上可用經驗方法）</td>\n</tr>\n<tr>\n<td>「K2-18b 上有生物嗎？」係事實問題</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>評價問題只需要個人價值觀就答到</td>\n<td><strong>F</strong>（要先了解概念 + 經驗事實，<strong>再</strong>加價值觀）</td>\n</tr>\n<tr>\n<td>「科大看到的日出比日落美嗎？」係評價問題</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>「你的生父年齡比你大嗎？」係事實問題</td>\n<td><strong>F</strong>（概念問題）</td>\n</tr>\n<tr>\n<td>「在截止時間後交功課算準時嗎？」可以單靠語理分析解決</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>科學方法先於科學知識；思考先於知識</td>\n<td><strong>T</strong></td>\n</tr>\n<tr>\n<td>課程流程：語理分析 → 邏輯/科學 → 檢查謬誤</td>\n<td><strong>T</strong></td>\n</tr>\n</tbody></table>\n","m22":"<h1 id=\"m22-h1\">M2-2 語言的陷阱 (The Pitfalls of Language)</h1>\n<blockquote>\n<p>來源：李天命《語理分析的思考方法》第 II 篇，頁 37–72（Module 2 Lecture notes 2.2）\n⭐ = 極高機會考；⚠️ = 常見陷阱</p>\n</blockquote>\n<hr>\n<h2 id=\"m22-h2\">0. 總覽：六大語言陷阱（必背）⭐⭐⭐</h2>\n<p><strong>語言的陷阱</strong> = 某些<strong>語辭</strong>（字、詞、片語、或句子），或某些<strong>使用語辭的方式</strong>，係特別容易<strong>誤導、混淆、或妨害思想之正確運作</strong>嘅。</p>\n<ul>\n<li>「語言的陷阱往往比地下的陷阱更可怕。」</li>\n<li>把各種語言陷阱<strong>指認並揭露</strong>出嚟 = 語理分析工作中<strong>極為重要的一環</strong>。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>陷阱</th>\n<th>English</th>\n<th>一句定義</th>\n<th>例釋主題 (B)</th>\n<th>利（功用）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td><strong>闕義</strong></td>\n<td><strong>Meaning-incomplete</strong></td>\n<td>語法完整但<strong>語意欠整</strong></td>\n<td>政制與生命</td>\n<td>文意清楚時令用語<strong>簡潔</strong></td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong>歧義</strong></td>\n<td><strong>Ambiguous</strong></td>\n<td>語辭有<strong>多過一個意義</strong></td>\n<td>勝敗與自由</td>\n<td><strong>語言的經濟</strong>（唔使每個新意義都造新詞）</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>含混</strong></td>\n<td><strong>Vague</strong></td>\n<td>應用範圍<strong>冇截然明確的界線</strong></td>\n<td>善惡與貧富</td>\n<td><strong>彈性</strong>；表達<strong>概略知識</strong></td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong>著色</strong></td>\n<td><strong>Coloured / Emotive</strong></td>\n<td>帶<strong>情感意含（情感色彩）</strong></td>\n<td>堅定與固執</td>\n<td>表露發洩情感、心理平衡、令雙方<strong>態度齊一</strong></td>\n</tr>\n<tr>\n<td>5</td>\n<td><strong>實化</strong></td>\n<td><strong>Reification</strong></td>\n<td>把<strong>非具體名項當作具體名項</strong></td>\n<td>國家與真理</td>\n<td>令語言<strong>生動、濃縮、優美</strong></td>\n</tr>\n<tr>\n<td>6</td>\n<td><strong>僻義</strong></td>\n<td><strong>Idiosyncratic sense</strong></td>\n<td><strong>違離慣常用法</strong>（vs 通義 stock sense）</td>\n<td>佛學與虛實</td>\n<td><strong>補充通義之不足</strong>，增強表達效力</td>\n</tr>\n</tbody></table>\n<p><strong>記憶口訣</strong>：「<strong>闕歧含，著實僻</strong>」（缺乜？歧路？含糊；著色、實化、偏僻）\n<strong>例釋主題口訣</strong>：「<strong>政命・勝自・善貧・堅固・國真・佛虛</strong>」</p>\n<p>⚠️ <strong>六個陷阱全部「有利有弊」</strong>——作者冇話任何一種一定唔可以用；原則都係<strong>針對思考、討論等認知性的活動 (cognitive activities)</strong> 而提出。</p>\n<hr>\n<h2 id=\"m22-h3\">1. 闕義 (Meaning-incomplete) ⭐⭐</h2>\n<h3 id=\"m22-h4\">(A) 定義</h3>\n<ul>\n<li>日常語言裏，有啲句子以<strong>語法 (syntax)</strong> 標準衡量係完整，但從<strong>語意 (semantics)</strong> 方面睇係<strong>唔完整</strong>——<strong>形式結構（語法）完整，但意義內容（語意）不完整</strong>。</li>\n<li>呢種「<strong>在句式上完整但在意義上不完整的句子</strong>」= <strong>語意欠整的語句</strong> = <strong>闕義的 (meaning-incomplete)</strong>。</li>\n<li>例：「<strong>講老實話是最有利的做法。</strong>」→ 除非<strong>脈絡 (context)</strong>（又稱「<strong>語境</strong>」，即上下文或講嘢時嘅場合）能提示欠缺嘅意義，否則要問：<ul>\n<li>最有利？<strong>與甚麼比較</strong>起來最有利？</li>\n<li><strong>對誰來說</strong>最有利？（講老實話嘅人？同佢交往嘅人？雙方？）</li>\n</ul>\n</li>\n<li>⚠️ 註②：作者用較生僻嘅「<strong>闕</strong>」字而<strong>唔用「缺」字</strong>，因為「缺」容易令人<strong>望文生義</strong>（缺 → 沒有 → 沒有意義）。<strong>闕義 ≠ 沒有意義！</strong></li>\n<li>註②（深入）：用符號邏輯術語可嚴格界定：當<strong>量符 (quantifier) 被略去</strong>，或者 <strong>n-端謂辭被說成 (n−j)-端謂辭</strong>（n ≥ 2, j ≥ 1）嘅時候，就會有闕義。（即：漏咗「所有／有些」，或漏咗關係嘅一方，如「最有利」漏咗「對誰」）</li>\n</ul>\n<h3 id=\"m22-h5\">(B) 例釋：政制與生命</h3>\n<table>\n<thead>\n<tr>\n<th>例</th>\n<th>句子</th>\n<th>欠缺咩？</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>例一</td>\n<td>「<strong>青少年期的反叛行為常是很危險的。</strong>」</td>\n<td><strong>對誰</strong>危險？青少年自己？社會上已獲固定利益嘅人？整個社會各階層？</td>\n</tr>\n<tr>\n<td>例二</td>\n<td>「<strong>怎樣的制度是最妥善的政治制度？</strong>」（語意欠整的<strong>問句</strong>）</td>\n<td>從<strong>邊個觀點</strong>講「最妥善」？統治者？被治者？知識份子？商人、實業家？工人、農民？任何立場？</td>\n</tr>\n<tr>\n<td>例三</td>\n<td>「<strong>生命是有價值的。</strong>」</td>\n<td>「<strong>一切</strong>」生命定「<strong>某些</strong>」生命（例如<strong>濾過性病毒</strong>嘅生命都有價值？）；<strong>任何情況下</strong>（精神錯亂、絕症、長期受酷刑虐待）？「有價值」係<strong>對誰講</strong>——被論及嘅生命本身？旁觀者？兩者？</td>\n</tr>\n</tbody></table>\n<ul>\n<li>例三結論：問題未釐清前就馬上<strong>贊同或反對</strong>「生命有價值」= <strong>冒失</strong>，常引致無謂爭論，「白白虛耗了我們『有價值的生命』」。</li>\n</ul>\n<h3 id=\"m22-h6\">(C) 闕義的原則 ⭐⭐</h3>\n<ul>\n<li>⚠️ <strong>唔係</strong>「無論幾時都唔可以用闕義句子」！<strong>闕義有利亦有弊</strong>，視乎使用情況。<ul>\n<li><strong>利</strong>：只要當時<strong>文意夠清楚</strong>，闕義句子反而令用語<strong>簡潔</strong>，省去語意完整但<strong>冗長累贅</strong>嘅陳述。</li>\n<li><strong>弊</strong>：<strong>文意不清</strong>時，會**迷亂別人（甚至自己）**嘅思想。</li>\n</ul>\n</li>\n<li><strong>原則（背）</strong>：<strong>設 S 是一個闕義的句子。假如 S 所在的脈絡足以提示所欠缺的意義，則在這情況下 S 之為闕義是無害於思考或討論的。但假如 S 的脈絡並不能提示所欠缺的意義，那麼在這情況下 S 可說是一個對思考和討論有妨害的句子。</strong></li>\n<li><strong>按</strong>：原則係針對<strong>思考、討論等認知性的活動</strong>而提出（歧義、含混等原則亦然）。如果講嘢目的根本唔在此，而在於（例如）<strong>談情說愛</strong>，就算句子語意欠整、脈絡亦唔足以提示，<strong>好多時都唔需要要求明文補足</strong>。<ul>\n<li>😂 女朋友發嬌嗔：「<strong>男人是負心的。</strong>」你咄咄迫人反問「『所有』定『有些』男人？『一切』定『某些』情況？對『任何』女人定對『嚕囌』嘅女人？」→ 第一、你冇好好消化闕義嘅按語；第二、小心你以後<strong>再搵唔到女朋友向佢「負心」一番</strong>。</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h2 id=\"m22-h7\">2. 歧義 (Ambiguous) ⭐⭐⭐</h2>\n<h3 id=\"m22-h8\">(A) 定義</h3>\n<ul>\n<li>對話 a：小孩問「媽媽，為甚麼剛才睡着的時候我會飛的？」母親答「孩子，你是<strong>做夢</strong>而已。」→ 「做夢」= <strong>睡着時的某種心理經驗</strong></li>\n<li>對話 b：男孩問「你其實很喜歡我，是嗎？」女孩答「你是<strong>做夢</strong>而已。」→ 「做夢」= <strong>醒着時所作的不切實際的空想</strong></li>\n<li>具有<strong>多過一個意義</strong>嘅語辭 = <strong>歧義語辭 (ambiguous expression)</strong>。</li>\n<li>例：「<strong>天</strong>」「<strong>地</strong>」「<strong>陽</strong>」「<strong>陰</strong>」「<strong>法</strong>」「<strong>子</strong>」「<strong>理</strong>」「<strong>和</strong>」「<strong>同胞</strong>」「<strong>經濟</strong>」「<strong>風流</strong>」……<ul>\n<li>「<strong>天</strong>」至少三個意思：(1) 諸星羅列的空間 (2) 自然 (3) 時日季節（昨天、秋天）</li>\n<li>「<strong>風流</strong>」：(1) 舉止蕭散品格清高 (2) 精神韻味 (3) 浪蕩不羈</li>\n</ul>\n</li>\n<li>註④：「意思」同「意義」喺本書通常當<strong>同義語</strong>。</li>\n<li>⚠️ 註⑤：「<strong>歧義」一詞本身都係歧義嘅</strong>！本書採用較通行嘅意思（Hospers），但呢個定義<strong>唔係最妥善</strong>——因為咁樣<strong>大部分字詞都可以話係歧義</strong>。另一個（更嚴格）意思：<strong>當且僅當一個語辭 E 在脈絡 S 裏容許多過一個解釋時，E 在 S 之中才是歧義的。</strong></li>\n</ul>\n<h3 id=\"m22-h9\">歧義嘅成因 ⭐</h3>\n<ul>\n<li>原因不止一種：<strong>類比、引申、借用、語法結構</strong>……</li>\n<li>由<strong>語法結構</strong>造成嘅歧義 → 特別受**語言學家（如參姆斯基 Chomsky）**注意 → 稱為「<strong>語法歧義 (syntactic ambiguity)</strong>」：<ul>\n<li>「<strong>路不通行不得在此小便</strong>」→ 原意：「路不通行，不得在此小便」；小便嘅人解作：「路不通，行不得，在此小便」</li>\n<li>「<strong>士可殺不可辱</strong>」→ 原意：「士可殺，不可辱」；開玩笑解作：「士可殺？不，可辱！」</li>\n</ul>\n</li>\n<li>「<strong>非語法歧義</strong>」= 廣義嘅「<strong>語意歧義 (semantic ambiguity)</strong>」：<ul>\n<li>西洋劍擊會：甲：「我想加入貴會。」乙：「本會向來是最歡迎『<strong>新血</strong>』的。」甲（大吃一驚）：「我不想加入了。」</li>\n<li>中文教師：「俗稱雜物為『<strong>東西</strong>』，枱、椅、梳、書籍都是東西。」洋學生：「我們都不是雜物，所以<strong>你不是東西，我也不是東西</strong>。」</li>\n<li>笑話中嘅歧義<strong>無傷大雅</strong>；但喺<strong>認知性的探討</strong>中令思想胡塗，就唔再係無傷大雅嘅小笑話。</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m22-h10\">(B) 例釋：勝敗與自由 ⭐⭐</h3>\n<p><strong>例一</strong>：「<strong>戰爭沒有勝方，只有敗方。<strong>任何一場戰爭裏的每一個參與國家其實都是失敗的。就拿二戰來說，一般人都認為</strong>德國是敗了</strong>，而英國是戰勝國。可是考慮到英國在政治、經濟、社會、人民生命與精神方面遭受的破壞，又有誰能否認<strong>她（英國）實在也是失敗的</strong>呢！」</p>\n<ul>\n<li>「<strong>敗</strong>」（或「<strong>勝</strong>」）係歧義語辭：<ul>\n<li>「德國是敗了」嘅「敗」= <strong>軍事上的「被擊倒」</strong></li>\n<li>「英國實在也是失敗的」嘅「敗」= 政治、經濟、社會、人民生命與精神等方面所受嘅「<strong>損毀</strong>」</li>\n</ul>\n</li>\n<li>冇覺察歧義就會覺得呢句好<strong>深刻、有見地</strong>；其實只係利用歧義造成嘅「<strong>文字遊戲</strong>」。</li>\n</ul>\n<p><strong>例二</strong>：「<strong>一般所謂自由的人，其實都不是自由的</strong>，因為，即使那些沒有受到外在因素所制約的行動，仍然是被行動者自己的<strong>性格和心理狀態</strong>所決定的。」</p>\n<ul>\n<li>「<strong>自由</strong>」係歧義嘅：<ul>\n<li>(1) <strong>冇受到某啲外在因素（監獄、集中營、極權制度）制約</strong> → 「自由的人」</li>\n<li>(2) 有學者將冇外在制約嘅行動都叫「不自由」（因仍被本人性格、心理狀態決定）→ 「自由」= <strong>不被任何原因決定</strong></li>\n</ul>\n</li>\n<li>句中「自由」<strong>第一次出現取 (1)，第二次轉取 (2)</strong> → 喺兩個意義之間<strong>遊移</strong> → 令人誤以為「<strong>很有深度</strong>」「<strong>甚有深意</strong>」，拆穿後只係<strong>故弄玄虛</strong>。</li>\n</ul>\n<h3 id=\"m22-h11\">(C) 歧義的原則 ⭐⭐</h3>\n<ul>\n<li>同闕義一樣，<strong>有利有弊</strong>：<ul>\n<li><strong>利</strong>：對<strong>語言的經濟 (economy of language)</strong> 有好處，免除「<strong>凡有新意義便要增加新語辭</strong>」嘅麻煩。</li>\n<li><strong>弊</strong>：好多時引生<strong>思想上的糾纏</strong>。</li>\n</ul>\n</li>\n<li><strong>原則（背）</strong>：<strong>設 E 是一個歧義語辭，且在某個脈絡 C 裏出現</strong>（脈絡嘅範界<strong>不能事先硬性規定</strong>，但<strong>不可違背常理定得過大或過小</strong>）。<ol>\n<li>如果 <strong>C 不能表明 E 在其中的每次出現究竟是取哪個意義</strong> → E 的使用乃是一種<strong>混淆思想的用語方式</strong>。</li>\n<li>⚠️ <strong>就算 C 原則上能表明</strong>每次出現取邊個意義，<strong>倘若我們利用 E 的歧義性質來玩弄文字遊戲</strong>（如例一、例二）→ <strong>仍然</strong>係一種混淆思想的用語方式。</li>\n</ol>\n</li>\n</ul>\n<hr>\n<h2 id=\"m22-h12\">3. 含混 (Vague) ⭐⭐⭐</h2>\n<h3 id=\"m22-h13\">(A) 定義</h3>\n<ul>\n<li><strong>當一個語辭的應用範圍沒有截然明確的界線時，這語辭就叫做是「含混的」(vague)。</strong></li>\n<li>例：「<strong>禿子</strong>」「<strong>頭毛稀疏</strong>」——<strong>拔頭髮論證</strong>：<ul>\n<li>你有滿頭濃髮，拔一根唔會令你變禿子；再拔一根都唔會……一直拔落去，結果你<strong>會變禿子</strong>。</li>\n<li>問題：<strong>由邊一剎那開始</strong>變「頭毛稀疏」？<strong>邊一根</strong>頭髮嘅失去令你變禿？→ <strong>冇答案</strong>：世上<strong>冇一根「具有關鍵重要性」的頭髮</strong>。</li>\n<li>∴「頭髮濃密」同「頭毛稀疏」（或「禿頭」）之間<strong>冇明確分野</strong> → 呢啲語辭係<strong>含混</strong>嘅。</li>\n</ul>\n</li>\n<li>⚠️ 註⑥：「有截然明確的界線」同「冇截然明確的界線」之間<strong>都冇截然明確的界線</strong> → <strong>「含混」一詞本身亦是含混的</strong>（「著色」「僻義」等亦然）。但<strong>唔等於呢個詞冇用</strong>，因為「<strong>沒有分明的界線」並不涵蘊「沒有約略的界線」</strong>。</li>\n</ul>\n<h3 id=\"m22-h14\">⭐⭐ 含混 vs 歧義（必考對比）</h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>歧義 Ambiguous</strong></th>\n<th><strong>含混 Vague</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>問題</td>\n<td><strong>多過一個意義</strong>（揀邊個意思？）</td>\n<td><strong>界線唔清楚</strong>（去到邊度先算？）</td>\n</tr>\n<tr>\n<td>例</td>\n<td>「做夢」「天」「風流」「敗」「自由」</td>\n<td>「禿子」「好人」「富人」「資本家」「很熱」「神蹟」</td>\n</tr>\n<tr>\n<td>測試問題</td>\n<td>「你指邊一個意思？」</td>\n<td>「幾多先算？界線喺邊？」</td>\n</tr>\n</tbody></table>\n<h3 id=\"m22-h15\">(B) 例釋：善惡與貧富 ⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th>例</th>\n<th>內容</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>例一</td>\n<td>小孩子或鄉間老太婆睇戲，成日問角色係「<strong>好人</strong>」定「<strong>壞人</strong>」</td>\n<td>佢哋不自覺<strong>預設</strong>好人同壞人各自構成<strong>壁壘分明的類</strong>——呢個預設係<strong>錯</strong>嘅，「好人」「壞人」係含混嘅。一個對父母妻兒<strong>赴湯蹈火在所不辭</strong>、對別人<strong>心狠手辣</strong>嘅人算唔算好人？→ 與其苦思佢「其實」係唔係好人，<strong>不如具體考察</strong>佢平日習慣、一般行為傾向、特殊環境嘅特定反應——<strong>較實際和有效</strong></td>\n</tr>\n<tr>\n<td>例二</td>\n<td>元旦前後報章報導「<strong>預言家</strong>」嘅預言：「<strong>亞洲會有動盪的形勢出現</strong>」「<strong>美國將有異常之事發生</strong>」</td>\n<td>含混說法 → 預言家總可以做「<strong>事後諸葛亮</strong>」：學生示威、工人罷工 → 「動盪形勢（嘅徵象）」；美國有<strong>隻雞生咗隻特大嘅蛋</strong> → 「異常之事」！同<strong>科學上精密的預測</strong>對照，冇乜用，最多只係「<strong>放馬後砲</strong>」</td>\n</tr>\n<tr>\n<td>例三</td>\n<td>飛機失事，全機只有一人生還，佢係教徒 → 教友話係「<strong>神蹟</strong>」；但如果全機只有呢位教徒喪生，就唔會話係神蹟</td>\n<td>「<strong>神蹟</strong>」一詞嘅應用界線喺邊度劃定？</td>\n</tr>\n<tr>\n<td>例四</td>\n<td>有人以為「<strong>資本家</strong>」「<strong>工人</strong>」「<strong>知識份子</strong>」界限分明，各自指謂<strong>絕對確定的類</strong></td>\n<td>唔切實際：佢哋都係含混嘅。擁有<strong>數十億財產</strong>嘅老闆無可爭辯係資本家；但街邊<strong>擺攤賣報紙</strong>嘅小販，幾十年積存<strong>一、二十萬元</strong>，算唔算？→ 正如「濃髮」有<strong>不爭的範例 (clear cases)</strong> 同時又有<strong>不定的疑例 (borderline cases)</strong>，「資本家」亦然。以為呢啲名稱係「<strong>鮮明的旗幟</strong>」、碰到任何人都要歸類並作為<strong>行動根據</strong> = <strong>與實際脫節、閉門造車式的幼稚想法</strong>，可憐復可笑、可怕復可悲嘅做法每每係佢嘅自然結果</td>\n</tr>\n</tbody></table>\n<p><strong>⭐⭐ 重要按語：<strong>雖然唔可以將含混語辭嘅應用範圍視為</strong>有分明界線</strong>，但<strong>亦唔可以由此推論</strong>佢<strong>冇約略的界線</strong>。</p>\n<blockquote>\n<p><strong>「X 沒有分明的界線」並不涵蘊「X 沒有約略的界線」。</strong></p>\n</blockquote>\n<p><strong>貧富詭辯（連鎖論證）</strong> ⭐⭐</p>\n<ul>\n<li>「<strong>富人（或資本家）與窮人之間其實沒有真正的分別。<strong>有一千萬美元當然係富人，但一千萬同九百九十九萬九千九百九十九元冇分別，去掉一元唔會令佢由富變窮。一直咁論證落去，貧富之間根本搵唔到分明界線。所以</strong>貧與富之間其實沒有真正的分別</strong>。」</li>\n<li>破解：佢<strong>最多只能証明貧富之間沒有截然的界線</strong>；但如果由此推論兩者之間<strong>冇約略的界線</strong>或「<strong>冇真正的分別</strong>」，就係一個<strong>錯誤的推論</strong>。</li>\n<li>😂「<strong>實用方法</strong>」：請佢將啲錢<strong>全部送俾人</strong>。佢唔肯 → 問佢：「點解唔肯呀？<strong>貧與富之間本無真正的分別嘛。</strong>」（同樣適用於高與矮、冷與熱等）</li>\n</ul>\n<h3 id=\"m22-h16\">(C) 含混的原則 ⭐⭐</h3>\n<ul>\n<li>⚠️ <strong>含混，不一定是語言的缺憾。<strong>有時由於佢嘅</strong>彈性</strong>，含混語辭反而<strong>適合</strong>我哋使用。<ul>\n<li>例：房間好熱但唔知幾多度，用唔到「華氏 X 度」「攝氏 Y 度」呢類精密語辭，但<strong>唔等於對溫度一無所知</strong> → 「<strong>很熱</strong>」「<strong>溫度甚高</strong>」啱啱好表達<strong>大概知識</strong>（平日生活好有用）。<strong>冇咗含混語辭，好多場合我哋會啞口無言。</strong></li>\n</ul>\n</li>\n<li><strong>缺點</strong>：最易造成 ⭐ <strong>廢話（多餘的言語）、空話（空洞的言語）、大話（大而無當的言語）</strong>。<ul>\n<li>例：「<strong>善有善報，惡有惡報，若還不報，時辰未到。</strong>」<ul>\n<li>頗有<strong>勸人為善之功</strong>，<strong>唔應抹殺</strong>；但喺<strong>認知上無可否認係一句空話</strong>。</li>\n<li>點樣算善報、惡報<strong>冇明確分際</strong>，鍾意點解就點解：某人素來行善但一生坎坷，仍可以話係善有善報——「理由」：依某種哲學/宗教觀點，<strong>善就是德，德就是福</strong>，所以行善便是有福，有福便是善報。惡有惡報亦可「<strong>萬無一失</strong>」咁辯解。</li>\n<li>再加「<strong>若還不報，時辰未到</strong>」嘅條件句 → 更加「<strong>雙重保險</strong>」，因為「時辰未到」<strong>全無界限可言</strong>（同「某年某月某日某個時刻還未到來」之類精密說法唔同）。十年、二十年未報應 → 時辰未到；臨死嗰日都冇報應 → 照樣「時辰未到」。幾時先算時辰到？→「<strong>天機不可洩漏。</strong>」</li>\n</ul>\n</li>\n</ul>\n</li>\n<li><strong>原則（背）</strong>：<strong>設 E 是一個含混的語辭。如果 E 被用來表達一些概略的知識（或概略的判斷、問題、指令……），則就這點來說 E 之為含混是沒有甚麼不妥的。但如果 E 只是被用來製造廢話、空話或大話，則那就可以說是一種誤導思想的用語方式了。</strong></li>\n</ul>\n<hr>\n<h2 id=\"m22-h17\">4. 著色 (Coloured Expression / Emotive Expression) ⭐⭐⭐</h2>\n<h3 id=\"m22-h18\">(A) 定義</h3>\n<ul>\n<li>上一世紀英國保守紳士淑女唔肯公開講「<strong>長褲</strong>」，認為係「<strong>淫褻詞</strong>」（長褲裏面隱藏住「不雅」嘅人體某部份）→ 發明咗「<strong>不可提及的」(the unmentionables)</strong> 代替「長褲」。</li>\n<li>我哋語言都有：「<strong>他媽的</strong>」——「的」甚麼？後面嗰個字被視為淫褻詞，不提為妙。（作者講「<strong>人體的某一部份</strong>」時亦遵守咗呢個社會習慣）</li>\n<li>關鍵：直接字眼帶有<strong>反面的情感意含（或「情感色彩」）</strong>；「人體的某一部份」<strong>唔帶</strong>情感意含。</li>\n<li>淫褻詞只係其中一種。其他：「<strong>雜種</strong>」「<strong>奴才</strong>」「<strong>下賤</strong>」→ 引起<strong>厭惡</strong>；「<strong>英雄</strong>」「<strong>光榮</strong>」「<strong>偉大</strong>」→ 激發<strong>崇慕</strong>。</li>\n<li>⭐ 具情感意含嘅字眼<strong>雙重功能</strong>：(1) <strong>引起聽者的情感反應</strong>；(2) <strong>表露或發洩說者的喜怒愛憎</strong>。<ul>\n<li>叫人「雜種」→ 令人對佢反感 + 發洩我哋自己嘅反感；叫人「英雄」→ 激發敬仰 + 舒發我哋嘅仰慕。</li>\n</ul>\n</li>\n<li>定義：帶有<strong>情感意含或情感色彩</strong>嘅字眼 = <strong>著色語辭 (coloured expression)</strong>，有時亦叫「<strong>情感語辭 (emotive expression)</strong>」。</li>\n<li>⚠️ 註⑧⑨：一個語辭有冇情感意含、有咩情感意含，<strong>唔係一成不變</strong>，主要<strong>視乎當時一般語言使用者的態度</strong>而定。（參考 <strong>C. L. Stevenson</strong>, <em>Ethics &amp; Language</em>）</li>\n<li>⭐⭐ <strong>特別注意：許多著色語辭雖帶有不同的情感意含，但所描述的事態卻是相同的。</strong></li>\n</ul>\n<h3 id=\"m22-h19\">(B) 例釋：堅定與固執 ⭐⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th>例</th>\n<th>內容</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>例一（<strong>羅素 Russell</strong> 著名例子）</td>\n<td><strong>我是堅定的／你是固執的／他是愚頑的</strong> → 描述嘅事態相同：<strong>某人慣於按照自己的意見行事而不受他人意見的左右</strong>。鍾意佢 → 「<strong>堅定</strong>」；唔鍾意 → 「<strong>固執</strong>」；好討厭 → 「<strong>愚頑</strong>」/「<strong>人頭豬腦</strong>」</td>\n</tr>\n<tr>\n<td>例二</td>\n<td>有些女仔見人喺公眾場合旁若無人咁親熱 → 「<strong>肉麻當有趣！</strong>」；但自己男朋友同佢咁做 → 「<strong>夠羅曼蒂克</strong>」</td>\n</tr>\n<tr>\n<td>例三</td>\n<td>別人身上嘅「<strong>桃色醜聞</strong>」，發生喺自己身上 → 「<strong>艷史</strong>」或「<strong>生命中一段美好的插曲</strong>」</td>\n</tr>\n<tr>\n<td>例四</td>\n<td>甲太太對乙太太：「我的先生去<strong>尋芳</strong>的時候，碰見你的丈夫在<strong>嫖妓</strong>。」</td>\n</tr>\n<tr>\n<td>例五</td>\n<td>自己仔嘅所作所為 = 「<strong>時代青年的新潮作風</strong>」；鄰家孩子 = 「<strong>流氓舉動</strong>」</td>\n</tr>\n<tr>\n<td>例六</td>\n<td>戰情報導：「敵方未經審訊便<strong>冷血地</strong>對俘虜進行<strong>非法屠殺</strong>；我軍毋需盤問即<strong>乾脆地</strong>把擒獲的敵人<strong>就地槍決</strong>。」</td>\n</tr>\n</tbody></table>\n<h3 id=\"m22-h20\">(C) 著色的原則 ⭐⭐</h3>\n<ul>\n<li><strong>功用</strong>：表露和發洩情感，<strong>有利於心理的平衡</strong>；引起聽者相應情感，促成聽者與說者<strong>態度上趨向齊一</strong>。</li>\n<li><strong>流弊</strong>：對<strong>認知性的活動</strong>係<strong>危險</strong>嘅——好易<strong>誘發情緒的激動</strong>，而情緒激動時就難以進行<strong>冷靜、客觀</strong>嘅思考或討論。</li>\n<li><strong>科學 vs 人文</strong> ⭐：<ul>\n<li>數學、物理學、生物學等<strong>嚴格科學</strong>：語辭大都係<strong>中性的</strong>（不帶情感意含）——「方程式」「遞歸性」「微系數」「速率」「電磁場」「γ 射線」「細胞」「脫氧核醣核酸」。</li>\n<li>社會、政治、倫理、文藝、宗教等<strong>人文問題</strong>：語辭每每帶情感意含——「<strong>階級</strong>」「<strong>反動</strong>」「<strong>壞蛋</strong>」「<strong>神聖</strong>」「<strong>叛教</strong>」。</li>\n<li>嚴格科學有<strong>高度理論成就</strong>；人文學科<strong>遠遠落後甚至停滯不前</strong>。科學家靠冷靜客觀嘅觀察、實驗、假設、演算；人文問題就喺「<strong>熱烈的氣氛中</strong>」無休止爭辯，最後要靠<strong>政治鬥爭、社會壓力、宗教迫害</strong>等「方法」嚟「徹底解決」。</li>\n<li>原因之一（⚠️ <strong>儘管不是唯一</strong>）：科學討論用語大都<strong>中性</strong>，人文討論卻<strong>混雜太多著色語辭，以致濫用</strong>。</li>\n</ul>\n</li>\n<li>反駁：「<strong>但人是有情感的嘛，為甚麼不可以使用有情感意含的語辭？</strong>」→ 好似見到「<strong>不可隨地吐痰</strong>」告示就反駁：「人總會有痰的嘛，為甚麼不可以吐？」——告示<strong>唔係話唔可以吐痰</strong>，只係話<strong>喺有關範圍內唔可以隨地吐</strong>。同樣，作者<strong>冇話唔可以「使用」著色語辭，只係話唔可以「濫用」</strong>。</li>\n<li>⭐⭐ <strong>原則（背）</strong>：<strong>當我們企圖說服別人接受某某論點時，如果我們根本沒有藉着客觀証據或邏輯推演來建立該論點，而只是利用著色語辭的情感意含去誘使別人接受，則我們就是濫用著色語辭了。但如果我們的論點是基於客觀証據或邏輯推演來建立的，則縱使在論証的過程裏間或採用了一兩個著色語辭，那仍然不算是對這種語辭的濫用。</strong><ul>\n<li>註⑪：「建立」可以係<strong>演繹的 (deductive)</strong> 亦可以係<strong>歸納的 (inductive)</strong>。</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h2 id=\"m22-h21\">5. 實化 (Reification) ⭐⭐⭐</h2>\n<h3 id=\"m22-h22\">(A) 定義</h3>\n<ul>\n<li><strong>名詞和名詞片語</strong> 共稱「<strong>名項 (terms)</strong>」。</li>\n<li><strong>具體名項 (concrete terms)</strong>：用嚟<strong>指謂具體的實物（或元目 entity）</strong>——「孔子」「杜甫」「這個人」「那棵樹」「喜瑪拉雅山上最高的山峰」。</li>\n<li><strong>非具體名項 (non-concrete terms)</strong>：<strong>唔係</strong>用嚟指謂具體實物——「<strong>真理</strong>」「<strong>理性</strong>」「<strong>國家</strong>」「<strong>社會</strong>」「<strong>良知</strong>」「<strong>存有</strong>」「<strong>愛情</strong>」「<strong>積分法</strong>」「<strong>波動函數</strong>」。</li>\n<li>⭐⭐ <strong>實化 (reification) = 把非具體名項當作具體名項來使用。</strong></li>\n<li><strong>丙先生故事</strong>（精神病院）：「社會是一個殘忍的<strong>魔鬼</strong>……我從窗口望出去，就看見社會向我<strong>張牙舞爪</strong>，露出冷酷的神情。喳！喳！」治療後醫生問佢仲會唔會咁講，佢話：「唔會喇，原來社會根本<strong>唔係魔鬼</strong>，因為魔鬼只喺<strong>晚間</strong>出現，但我發覺社會喺<strong>大白天也會出現</strong>的。喳！喳！」→ 繼續被關。「社會」本係非具體名項，佢當咗具體名項用 → 實化。</li>\n<li>⚠️ 實化<strong>唔限於</strong>精神病患者，<strong>正常人</strong>都會自覺或不自覺咁將語言實化。</li>\n</ul>\n<h3 id=\"m22-h23\">(B) 例釋：國家與真理 ⭐⭐</h3>\n<p><strong>例一（國家）</strong>：獨裁者施行不得民心政策時，口齒伶俐嘅「知識份子」辯護：「<strong>我們應服從國家的意志。國家叫我們做甚麼，我們就該做甚麼</strong>，不管我們是願意還是不願意。否則我們又怎能算得是愛自己的國家呢？」</p>\n<ul>\n<li><strong>愛國係可敬嘅情操</strong>，但<strong>唔涵蘊</strong>我哋同意上述論調。</li>\n<li>論調將「<strong>國家</strong>」<strong>實化</strong>：國家被講成一種<strong>具體實物</strong>，有<strong>自己的意志</strong>，能叫人民做嘢——恰似一個具體、有意志嘅個人叫人<strong>替佢穿襪子、買杯雪糕</strong>。</li>\n<li>⭐ <strong>不利後果</strong>：統治者可藉「<strong>國家</strong>」之名<strong>獨斷獨行</strong>，制訂大部份老百姓唔贊同嘅政策，強令佢哋做唔願意做嘅事——獨裁者稱之為「<strong>遵從國家的意志</strong>」。</li>\n</ul>\n<p><strong>例二（真理）</strong>：以下引句全部將「<strong>真理</strong>」實化：</p>\n<table>\n<thead>\n<tr>\n<th>引句</th>\n<th>作者</th>\n<th>可唔可以轉譯成冇實化嘅語句？</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>「真理不斷前進，任何人也無法阻止。」</td>\n<td><strong>羅曼羅蘭</strong> (Romain Rolland)</td>\n<td>✔ →「<strong>人類對事物的認識愈來愈增進，沒有人能阻止這一趨勢</strong>」</td>\n</tr>\n<tr>\n<td>「若能在適當的時刻理解，真理大概是和藹、寬大、可愛、柔和的吧！」</td>\n<td><strong>哥德</strong> (Goethe)</td>\n<td>✗ 意思毫不清楚</td>\n</tr>\n<tr>\n<td>「真理如上帝，真理不直接現身，我們只能從其啟示臆測真理。」</td>\n<td><strong>哥德</strong> (Goethe)</td>\n<td>✔（基於「<strong>同情的了解</strong>」）→「<strong>凡事實真句都不是必然地真的，最多僅是蓋然地真</strong>」</td>\n</tr>\n<tr>\n<td>「乾脆向真理投降，只要看見它走過來，便把武器奉上。」</td>\n<td><strong>蒙田</strong> (Montaigne)</td>\n<td>✔ →「<strong>承認真的命題，只要發現某一命題是真的，便承認那是一個真命題</strong>」</td>\n</tr>\n<tr>\n<td>「酒是強的，國王更強，女人又更強。然而，真理最強。」</td>\n<td><strong>路德</strong> (Luther)</td>\n<td>（書中未轉譯）</td>\n</tr>\n<tr>\n<td>「真理和美彼此含有對方，相輔相成。」</td>\n<td><strong>貝多芬</strong> (Beethoven)</td>\n<td>✗ 意思毫不清楚</td>\n</tr>\n<tr>\n<td>「真理是醜惡的。」</td>\n<td><strong>尼采</strong> (Nietzsche)</td>\n<td>✗ 意思毫不清楚</td>\n</tr>\n</tbody></table>\n<ul>\n<li>轉譯之後，「……真理不直接現身……」就唔會誘使我哋不知不覺以為「真理係『<strong>隱身</strong>』喺某種像衣服或面紗背後嘅『<strong>實體</strong>』」。</li>\n<li>無法轉譯嘅句子：一個話戒指係<strong>純金</strong>、一個話係<strong>純銀</strong>，原則上知道點判定誰是誰非；但一個話<strong>真理醜惡</strong>、一個話<strong>真理可愛柔和</strong>，<strong>是非如何判定</strong>？</li>\n</ul>\n<h3 id=\"m22-h24\">(C) 實化的原則 ⭐⭐</h3>\n<ul>\n<li>⚠️ 前面嘅論述<strong>唔涵蘊</strong>任何時刻都要避免實化。<strong>實化的價值</strong>：好多時令語言<strong>生動、濃縮、優美</strong>。</li>\n<li>但進行<strong>認知性活動</strong>時，實化時常會<strong>妨礙嚴格的思考和討論</strong>。</li>\n<li><strong>原則（背）</strong>：<strong>在文藝寫作之類的場合裏，我們可以隨意將語言實化而只須顧及修辭方面的效果；但是在思考或討論的場合裏，我們卻須考慮：那實化的句子能否用有認知意義（即說得上客觀真假）的語句去把它轉譯過來？<strong>以審美標準衡量，轉譯也許</strong>索然無味</strong>；但就<strong>認知的目的</strong>來說，轉譯係<strong>必要</strong>嘅，至少<strong>在原則上</strong>係咁。</li>\n<li>註⑬：如果覺得「<strong>可譯性規準</strong>」太苛求，可以降低標準，僅要求「<strong>局部可譯性</strong>」（參 Hempel；Carnap）。</li>\n</ul>\n<hr>\n<h2 id=\"m22-h25\">6. 僻義 (Idiosyncratic Sense) ⭐⭐⭐</h2>\n<h3 id=\"m22-h26\">(A) 定義</h3>\n<ul>\n<li>進行語理分析時，<strong>首須考察關鍵語辭的慣常用法</strong>。</li>\n<li>語辭<strong>依其慣常用法</strong>被使用 → 此時意義 = ⭐ <strong>通義 (stock sense)</strong></li>\n<li>語辭<strong>違離其慣常用法</strong>被使用 → 此時意義（假如有意義）= ⭐ <strong>僻義 (idiosyncratic sense)</strong></li>\n<li><strong>流弊</strong>：<ol>\n<li>隨意賦予僻義（按自己「特殊用法」用字）→ 別人<strong>難以了解</strong>你講乜 → 製造思想紛亂（<strong>明顯</strong>）。</li>\n<li>⭐ <strong>較不明顯（更須特別留意）</strong>：僻義常會造成「<strong>真，但多餘</strong>」(true but superfluous / trivially true) 嘅言論。</li>\n</ol>\n</li>\n</ul>\n<h3 id=\"m22-h27\">(B) 例釋：佛學與虛實 ⭐⭐</h3>\n<p><strong>例一：懷黑德 (Whitehead)</strong>（邏輯、數學上甚有成就，都「不能免俗」）</p>\n<ul>\n<li>「<strong>我們在世界之內，而世界也在我們之內。</strong>」</li>\n<li>依<strong>通義</strong>解：<strong>前半真，後半顯然假</strong>（森羅萬有點會喺我哋之內？）</li>\n<li>懷黑德將某種<strong>僻義</strong>賦予「<strong>在……之內</strong>」：「X 在我們之內」只等於「<strong>X 是我們經驗的對象</strong>」。宇宙萬物都係我哋經驗嘅對象 → 世界就「在我們之內」。<ul>\n<li>佢話：「我在這房間之內，而這房間則是我當前經驗內的一個項目。但我當前的經驗就是現在的我。」→ 所以<strong>房間「在他之內」</strong>！</li>\n</ul>\n</li>\n<li>結論：照僻義解，<strong>算係真，但好多餘</strong>——只係廢話：「<strong>世界是我們經驗的對象</strong>」。</li>\n<li>😏 想人覺得你有深度？唔可以淨係識講「世界是我們經驗的對象」，要識講「<strong>世界在我們之內</strong>」——世人有種莫名其妙傾向：覺得<strong>玄虛嘅言語先「有深度」</strong>，如獲至寶「鑽研」落去，你最終成為「<strong>一代大師</strong>」。</li>\n<li>註⑮：枱、椅、山、河 = 「<strong>直接的經驗對象</strong>」；原子、星雲 = 「<strong>間接的經驗對象</strong>」（用實在論嘅語言）。</li>\n</ul>\n<p><strong>例二：佛家「一在一切中，一切在一中」</strong>（<strong>華嚴宗</strong>最高原理）</p>\n<ul>\n<li>同懷黑德名句<strong>異曲同工</strong>。口頭信奉嘅人，行為上總顯露<strong>冇真正信奉</strong>：發現太太／女朋友喺別人懷裏，大概都免唔到「<strong>佛都有火</strong>」——但點解要火？既然「一在一切中，一切在一中」，<strong>別人嘅懷抱都必定喺自己懷中</strong>嘛！</li>\n<li>反駁：「你假定咗佛家依<strong>慣常用法</strong>用字，但佛家冇咁做，佛家哲學<strong>根本已從語言解脫了出來</strong>。」</li>\n<li>作者：「<strong>從語言解脫了出來</strong>」只係<strong>語焉不詳</strong>嘅說法：<ul>\n<li>(1) 如果指<strong>拒絕說話、保持緘默</strong> → 點解有<strong>多如恆河沙數</strong>嘅佛家經典及論辯？要拒絕說話，就連「一在一切中……」都唔應該講。如果話係「<strong>用語言破語言</strong>」嘅手段 → 兩個難題：① 「用邏輯破論證」= 用邏輯揭穿論證不成立；「用大砲破城堡」= 用大砲攻陷城堡；但「<strong>用語言破語言</strong>」係<strong>咩意思</strong>？② 就算有清楚意思，語言<strong>點解要「破」</strong>？用嚟破語言嘅語言本身，<strong>又用乜嚟破</strong>？</li>\n<li>(2) 如果「從語言解脫出來」只係指<strong>違反慣常用法去用字</strong> → 點解唔直接講「違反慣常用法去用字」，要<strong>故作神秘、故弄玄虛</strong>？更嚴重：喺僻義下理解，點樣避免造成<strong>思想胡塗</strong>及「<strong>真但多餘的廢話</strong>」？</li>\n</ul>\n</li>\n<li>作者立場：佛家哲學係世界上<strong>幾種最有人生智慧的思想之一</strong>，但漫長發展中都夾雜大量<strong>似是而非的詭辯</strong>，根源每每在於<strong>違反慣常用法來用字</strong>。</li>\n</ul>\n<p><strong>例三：實在與虛幻（人生如夢）</strong> ⭐⭐</p>\n<ul>\n<li>論證：做夢時唔知自己做夢 → 點確定而家唔係做夢？→ 也許人生就係一場大夢 → 宇宙只係幻象，<strong>一向以為實在的東西原來都是虛幻的</strong>。</li>\n<li>分析：「<strong>實在</strong>」同「<strong>虛幻</strong>」係<strong>兩個互相對立的詞語</strong>，<strong>效用在於把經驗或世間事物作某種區分</strong>。<ul>\n<li><strong>圖二</strong>：A 範圍 = 「實在的」；B 範圍 = 「虛幻的」（中間有界線）。「X 是實在的」告訴我哋 X 屬 A；「Y 是虛幻的」告訴我哋 Y 屬 B。</li>\n<li>有人宣稱「<strong>一切東西（包括我們稱為『實在』的東西）都是虛幻的</strong>」→ ⭐ <strong>佢乜都冇講</strong>——冇話俾我哋知任何事物嘅狀況；只係暗中（通常不自覺）<strong>改變咗「實在」與「虛幻」的慣常用法</strong>：「實在」嘅適用範圍<strong>縮小到不能指稱任何東西</strong>；「虛幻」<strong>擴張到可以指稱任何東西</strong>。</li>\n<li><strong>圖三</strong>：A、B 都叫「虛幻」，<strong>界線被取消</strong> → 混淆概念。更嚴重：而家講「X 是一虛幻之物」，<strong>再唔能得知 X 屬 A 類定 B 類</strong>。</li>\n<li>結論：「<strong>一切都是虛幻</strong>」<strong>雖是真的</strong>，但只係一句「<strong>真得多餘</strong>」的廢話。</li>\n</ul>\n</li>\n<li>註⑱：呢個例子目的係說明僻義可能嘅流弊；⚠️ <strong>並不涵蘊</strong>語言分析一定要採納本例所用嘅論證方式——即 <strong>範例論證 (paradigm-case argument, P.C.A.)</strong> 以及 <strong>對比理論 (contrast theory)</strong>。</li>\n</ul>\n<h3 id=\"m22-h28\">(C) 僻義的原則 ⭐⭐</h3>\n<ul>\n<li>僻義好多時引致<strong>思想紛亂</strong>同「<strong>真，但多餘</strong>」嘅言論；但對<strong>語言的表達效力</strong>嚟講，僻義亦扮演<strong>頗為重要的角色</strong>：<ul>\n<li>當<strong>通義不夠表達</strong>某種思想或經驗時，需要以僻義<strong>補充通義之不足</strong>；</li>\n<li>當某一僻義<strong>被大家了解和接受</strong>以後，嗰個僻義（<strong>已開始演變為通義</strong>）就會或多或少<strong>增強語言的表達效力</strong>。</li>\n</ul>\n</li>\n<li><strong>原則（背）</strong>：<strong>如果依照語言的慣常用法已能表達意思，那就不可違反慣常用法而去硬造僻義；而在慣常用法不能表達意思故有理由給某某語辭賦以僻義的時候，我們須得聲明這時我們是以特殊用法來使用那語辭的，並且更重要的是：我們須得藉着定義或例釋……等手段去說明那特殊的用法</strong>，即須對該僻義提出<strong>清楚的闡釋</strong>。</li>\n<li>抵觸原則嘅三種情況：① <strong>冇需要卻濫造僻義</strong>；② <strong>有需要但冇聲明</strong>；③ <strong>有聲明但冇清楚闡釋</strong> → 費解甚至不可理解（喺<strong>哲學等抽象討論</strong>中十分普遍）。</li>\n<li>羅素 (Russell)：「<strong>為了不讓別人看出他們的言論原來站不住腳，不少哲學家遂小心翼翼地務求令得自己的言論不可理解。</strong>」（批評用曖昧言辭、裝作駁倒咗<strong>休謨 Hume</strong> 嘅哲學家；<em>The Scientific Outlook</em>）</li>\n</ul>\n<hr>\n<h2 id=\"m22-h29\">7. 其他註釋（細節題）</h2>\n<ul>\n<li>註①：思考大都通過<strong>自然語言 (natural language)</strong> 而<strong>非特構語言</strong>進行；本書陳述有時係約略嘅，<strong>不能（亦不必）<strong>預期有符號邏輯咁精密；本書大體以</strong>實效的宗旨</strong>決定行文分際。分目 B 嘅標題（政制與生命等）<strong>唔好望「題」生義</strong>——係稿成後為方便檢索先加上。</li>\n</ul>\n<hr>\n<h2 id=\"m22-h30\">8. 考試速攻 ⚠️⭐</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>講法</th>\n<th>答案</th>\n<th>理由</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>闕義即係冇意義</td>\n<td><strong>F</strong></td>\n<td>闕義 = 語意<strong>欠整</strong>，唔係冇意義；所以先用「闕」唔用「缺」</td>\n</tr>\n<tr>\n<td>闕義句子永遠唔應該用</td>\n<td><strong>F</strong></td>\n<td>脈絡足以提示欠缺意義時<strong>無害</strong>，仲令用語簡潔</td>\n</tr>\n<tr>\n<td>「生命是有價值的」係闕義例子</td>\n<td><strong>T</strong></td>\n<td>一切/某些？任何情況？對誰？</td>\n</tr>\n<tr>\n<td>歧義 = 語辭有多過一個意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「路不通行不得在此小便」係語法歧義</td>\n<td><strong>T</strong></td>\n<td>語法結構造成（Chomsky 注意）</td>\n</tr>\n<tr>\n<td>「新血」「東西」笑話係語法歧義</td>\n<td><strong>F</strong></td>\n<td>係<strong>非語法歧義</strong>（廣義語意歧義）</td>\n</tr>\n<tr>\n<td>只要脈絡能表明歧義詞每次取咩意義，使用就一定冇問題</td>\n<td><strong>F</strong></td>\n<td>若<strong>利用歧義玩文字遊戲</strong>，仍然係混淆思想</td>\n</tr>\n<tr>\n<td>「戰爭沒有勝方只有敗方」利用咗「敗」嘅歧義</td>\n<td><strong>T</strong></td>\n<td>軍事被擊倒 vs 各方面損毀</td>\n</tr>\n<tr>\n<td>「一般所謂自由的人其實不自由」利用「自由」嘅含混</td>\n<td><strong>F</strong></td>\n<td>係<strong>歧義</strong>（兩個意義之間遊移）</td>\n</tr>\n<tr>\n<td>含混 = 應用範圍冇截然明確界線</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「禿子」「好人」「資本家」係含混詞</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「X 冇分明界線」涵蘊「X 冇約略界線」</td>\n<td><strong>F</strong></td>\n<td><strong>唔涵蘊</strong></td>\n</tr>\n<tr>\n<td>貧富之間冇截然界線，所以冇真正分別</td>\n<td><strong>F</strong></td>\n<td>錯誤推論</td>\n</tr>\n<tr>\n<td>含混一定係語言嘅缺憾</td>\n<td><strong>F</strong></td>\n<td>有彈性，可表達概略知識</td>\n</tr>\n<tr>\n<td>「含混」一詞本身都係含混嘅</td>\n<td><strong>T</strong></td>\n<td>註⑥</td>\n</tr>\n<tr>\n<td>「歧義」一詞本身都係歧義嘅</td>\n<td><strong>T</strong></td>\n<td>註⑤</td>\n</tr>\n<tr>\n<td>含混最易造成廢話、空話、大話</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「善有善報…時辰未到」喺認知上係空話，所以應該完全抹殺</td>\n<td><strong>F</strong></td>\n<td>有<strong>勸人為善之功</strong>，唔應抹殺；但認知上係空話</td>\n</tr>\n<tr>\n<td>「堅定／固執／愚頑」描述唔同事態</td>\n<td><strong>F</strong></td>\n<td><strong>情感意含唔同，事態相同</strong>（羅素例子）</td>\n</tr>\n<tr>\n<td>一個詞有冇情感意含係一成不變</td>\n<td><strong>F</strong></td>\n<td>視乎<strong>當時一般語言使用者的態度</strong></td>\n</tr>\n<tr>\n<td>作者認為唔可以使用著色語辭</td>\n<td><strong>F</strong></td>\n<td>唔可以<strong>濫用</strong>（吐痰告示比喻）</td>\n</tr>\n<tr>\n<td>論點基於客觀証據，間中用一兩個著色語辭都唔算濫用</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>人文學科落後嘅唯一原因係濫用著色語辭</td>\n<td><strong>F</strong></td>\n<td>係<strong>原因之一</strong>，<strong>唔係唯一</strong></td>\n</tr>\n<tr>\n<td>實化 = 把具體名項當作非具體名項</td>\n<td><strong>F</strong></td>\n<td><strong>反轉咗</strong>！實化 = <strong>非具體 → 當具體</strong></td>\n</tr>\n<tr>\n<td>「國家」「真理」「社會」係非具體名項</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>文藝寫作中可以隨意實化</td>\n<td><strong>T</strong></td>\n<td>只須顧及修辭效果</td>\n</tr>\n<tr>\n<td>所有實化句子都可以轉譯成有認知意義嘅句子</td>\n<td><strong>F</strong></td>\n<td>「真理是醜惡的」等<strong>無法轉譯</strong></td>\n</tr>\n<tr>\n<td>「真理不斷前進」係羅曼羅蘭講</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「真理是醜惡的」係尼采講</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>通義 = stock sense；僻義 = idiosyncratic sense</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>僻義嘅句子一定係假</td>\n<td><strong>F</strong></td>\n<td>常造成「<strong>真，但多餘</strong>」</td>\n</tr>\n<tr>\n<td>「我們在世界之內，而世界也在我們之內」係懷黑德講</td>\n<td><strong>T</strong></td>\n<td>「在…之內」僻義</td>\n</tr>\n<tr>\n<td>「一切都是虛幻」係假嘅</td>\n<td><strong>F</strong></td>\n<td><strong>真，但多餘</strong>（真得多餘嘅廢話）</td>\n</tr>\n<tr>\n<td>僻義永遠唔可以用</td>\n<td><strong>F</strong></td>\n<td>通義不足時可用，但要<strong>聲明 + 定義/例釋</strong></td>\n</tr>\n<tr>\n<td>「一在一切中，一切在一中」係華嚴宗最高原理</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>六種語言陷阱嘅原則係針對認知性活動提出</td>\n<td><strong>T</strong></td>\n<td>談情說愛等唔使咁執</td>\n</tr>\n</tbody></table>\n","m2b":"<h1 id=\"m2b-h1\">M2-2b 語言的陷阱（講者 slides）The Pitfalls of Language</h1>\n<blockquote>\n<p>來源：Module 2 Readings「2b. The Pitfalls of Language」（講者 slides，22 頁）\n⚠️ 呢份係<strong>講者自己嘅分類</strong>（4 種），同李天命 2.2 嘅 6 種唔同 → <strong>兩套都要識</strong>，考試好可能用呢套 + 謬誤名稱（英文）。\n⭐ = 極高機會考</p>\n</blockquote>\n<hr>\n<h2 id=\"m2b-h2\">0. 一句總結 ⭐⭐⭐</h2>\n<p><strong>語言的陷阱（講者版）4 種：</strong></p>\n<ol>\n<li><strong>歧義 Ambiguity</strong> → 謬誤：<strong>模稜兩可 (Equivocation)</strong>、<strong>歧義句構 (Amphiboly)</strong></li>\n<li><strong>含混 Vagueness</strong> → 謬誤：<strong>連續體謬誤 (Continuum Fallacy)</strong>、<strong>滑坡謬誤 (Slippery Slope Fallacy)</strong></li>\n<li><strong>著色字詞 Coloured Word</strong> → 謬誤：<strong>訴諸憐憫 (Appeal to Pity)</strong> ⊂ <strong>訴諸情感 (Appeal to Emotion)</strong></li>\n<li><strong>言辭空廢 Empty Verbalism</strong> → <strong>絕對空廢 / 相對空廢</strong></li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>陷阱</th>\n<th>對應謬誤（英文要識）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>字詞歧義</td>\n<td><strong>The Fallacy of Equivocation（模稜兩可的謬誤）</strong></td>\n</tr>\n<tr>\n<td>語句歧義</td>\n<td><strong>The Fallacy of Amphiboly（歧義句構的謬誤）</strong></td>\n</tr>\n<tr>\n<td>含混</td>\n<td><strong>Continuum Fallacy（連續體謬誤）</strong>；<strong>Slippery Slope Fallacy（滑坡謬誤）</strong></td>\n</tr>\n<tr>\n<td>著色字詞</td>\n<td><strong>Fallacy of Appeal to Pity（訴諸憐憫）</strong>，係 <strong>Fallacy of Appeal to Emotion（訴諸情感）</strong> 嘅子類</td>\n</tr>\n<tr>\n<td>言辭空廢</td>\n<td><strong>Tautological proposition（重言命題）冒充 factual statement（事實陳述）</strong></td>\n</tr>\n</tbody></table>\n<h3 id=\"m2b-h3\">李天命 6 陷阱 vs 講者 4 陷阱（對照）</h3>\n<table>\n<thead>\n<tr>\n<th>李天命《語理分析的思考方法》</th>\n<th>講者 slides</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>闕義、歧義、含混、著色、實化、僻義</td>\n<td>歧義、含混、著色字詞、<strong>言辭空廢</strong></td>\n</tr>\n<tr>\n<td>空洞派／油腔滑調（2.1）、「真但多餘」（僻義）</td>\n<td>≈ <strong>言辭空廢 (Empty Verbalism)</strong></td>\n</tr>\n</tbody></table>\n<hr>\n<h2 id=\"m2b-h4\">1. 開場 &amp; 語言與思考（slide 1–2）</h2>\n<ul>\n<li>《孟子・盡心下》：「口之於味也，目之於色也，耳之於聲也，鼻之於臭也，四肢之於安佚也，<strong>性也，有命焉，君子不謂性也</strong>。仁之於父子也，義之於君臣也，禮之於賓主也，智之於賢者也，聖人之於天道也，<strong>命也，有性焉，君子不謂命也</strong>。」（「性」「命」喺唔同脈絡有唔同意思 → 引入歧義）</li>\n<li><strong>語言與思考</strong>：在運用語言的同時，我們應對這種幫助我們<strong>表達意見、描述外物的工具</strong>進行<strong>檢查</strong>，從而避免某些使用語辭的方式<strong>誤導、混淆或妨害了思想的正常運作</strong>。</li>\n<li><strong>日常語言 vs. 人工語言</strong> ⭐：<ul>\n<li>「<strong>九龍及新界部分地區落雨</strong>」→ 日常語言有歧義：「部分」只修飾新界？定九龍同新界都係部分？</li>\n<li>人工語言（符號邏輯）可以清楚分開兩個解讀：<ul>\n<li><code>(x)(Kx ⊃ Rx) · (∃x)(Nx ⊃ Rx)</code> → <strong>九龍全部地區</strong> + 新界部分地區落雨（<code>(x)</code> = 全稱量詞 all）</li>\n<li><code>(∃x)(Kx ⊃ Rx) · (∃x)(Nx ⊃ Rx)</code> → <strong>九龍部分地區</strong> + 新界部分地區落雨（<code>(∃x)</code> = 存在量詞 some）</li>\n</ul>\n</li>\n<li>重點：<strong>人工語言精確無歧義</strong>；日常語言方便但易有陷阱（但語理分析<strong>不採用人工語言</strong>，係喺日常語言中運用邏輯思考）。</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h2 id=\"m2b-h5\">2. 歧義 Ambiguity ⭐⭐⭐</h2>\n<p><strong>定義：具有多過一個意義的字詞或詞句。</strong></p>\n<h3 id=\"m2b-h6\">2.1 兩種歧義</h3>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>例子（slide）</th>\n<th>解釋</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>1. 字詞歧義 (lexical ambiguity)</strong></td>\n<td><strong>欠</strong>、<strong>發夢</strong>、<strong>掛號</strong></td>\n<td>欠：欠債 (owe) / 欠缺 (lack) / 打呵欠；發夢：瞓覺做夢 / 不切實際嘅幻想；掛號：掛號信 / 醫院登記掛號</td>\n</tr>\n<tr>\n<td><strong>2. 語句歧義 (structural / syntactic ambiguity)</strong></td>\n<td><strong>路不通行不得在此小便</strong>、<strong>求學不是求分數</strong>、<strong>練跑減慢性病風險</strong></td>\n<td>「路不通行，不得在此小便」vs「路不通，行不得，在此小便」；「練跑減<strong>慢性病</strong>風險」vs「練跑<strong>減慢性病</strong>風險」</td>\n</tr>\n<tr>\n<td>新聞標題（slide 4 圖）</td>\n<td>「<strong>美無人機空襲巴西北部炸死至少8人</strong>」</td>\n<td>「<strong>巴西</strong>／北部」(Brazil) vs「<strong>巴</strong>（基斯坦）／<strong>西北部</strong>」(Pakistan)</td>\n</tr>\n</tbody></table>\n<h3 id=\"m2b-h7\">2.2 歧義嘅好處（歧義不一定有問題，也可以說是必需）⭐⭐</h3>\n<ol>\n<li><strong>字詞多義可免除增加新字詞的麻煩</strong>（= 李天命「語言的經濟」）</li>\n<li><strong>語言避諱</strong>（避開直接講忌諱嘅嘢）</li>\n<li><strong>創作</strong>（諧音雙關）：<ul>\n<li>「<strong>因荷而得藕，有杏不須梅。</strong>」→ 荷 = <strong>何</strong>、藕 = <strong>偶</strong>、杏 = <strong>幸</strong>、梅 = <strong>媒</strong> →「因何而得偶，有幸不須媒」</li>\n<li>「<strong>東邊日出西邊雨，道是無晴卻有晴。</strong>」→ 晴 = <strong>情</strong>（劉禹錫《竹枝詞》）</li>\n<li>「<strong>二、三、四、五；六、七、八、九；南北。</strong>」→ 缺「<strong>一</strong>」(衣) 少「<strong>十</strong>」(食)；有南北冇「<strong>東西</strong>」→ <strong>缺衣少食，沒有東西</strong></li>\n</ul>\n</li>\n<li><strong>避重就輕</strong>（留後路，兩面都講得通）：<ul>\n<li>「<strong>下雨天留客天留我不留</strong>」→「下雨天，留客天，留我不？留！」vs「下雨天留客，天留，我不留。」</li>\n<li>「<strong>人多病少財富</strong>」→「人多，病少，財富」vs「人多病，少財富」</li>\n<li>「<strong>誰都看不上</strong>」→「（佢）睇唔起任何人」vs「冇人睇得上（佢）」</li>\n</ul>\n</li>\n</ol>\n<h3 id=\"m2b-h8\">2.3 歧義嘅壞處 → 歧義性謬誤 ⭐⭐⭐</h3>\n<p><strong>壞處：不能分辨歧義語辭每次出現時所代表的意義，輕則成為笑話，重則會混淆思想。</strong></p>\n<table>\n<thead>\n<tr>\n<th>歧義類型</th>\n<th>→ 謬誤</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>字詞歧義</strong></td>\n<td>→ <strong>模稜兩可的謬誤 (The Fallacy of Equivocation)</strong></td>\n</tr>\n<tr>\n<td><strong>語句歧義</strong></td>\n<td>→ <strong>歧義句構的謬誤 (The Fallacy of Amphiboly)</strong></td>\n</tr>\n</tbody></table>\n<p><strong>① 模稜兩可的謬誤 The Fallacy of Equivocation</strong>（同一個<strong>字詞</strong>喺論證中途轉咗意思）</p>\n<table>\n<thead>\n<tr>\n<th>例子</th>\n<th>邊個字轉咗意思？</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>「<strong>我們不能踏進同一條河兩次。</strong>」</td>\n<td>「<strong>同一條河</strong>」：同一條河（身份）vs 同一批河水</td>\n</tr>\n<tr>\n<td>「<strong>爭取自由最終都是徒勞無功的，因為人生總會受到約束。</strong>」</td>\n<td>「<strong>自由</strong>」：政治/社會自由 vs 完全唔受任何約束嘅絕對自由</td>\n</tr>\n<tr>\n<td>「<strong>有室友勝過沒有任何東西；沒有任何東西勝過有個女/男朋友。因此，有室友勝過有個女/男朋友。</strong>」</td>\n<td>「<strong>沒有任何東西</strong>」：一無所有 (having nothing) vs 冇一樣嘢（比佢好）(nothing is better)</td>\n</tr>\n</tbody></table>\n<p><strong>② 歧義句構的謬誤 The Fallacy of Amphiboly</strong>（<strong>句子結構</strong>可以有兩種讀法）</p>\n<ul>\n<li>「<strong>我們不應該支持他，他是反對美國的單邊主義提倡者。</strong>」→「反對【美國的單邊主義】的提倡者」vs「【反對美國】的單邊主義提倡者」</li>\n<li>新聞標題（slide 10 圖）：<ul>\n<li>「<strong>兒子生性病母倍感安慰</strong>」→「兒子<strong>生性</strong>，<strong>病母</strong>倍感安慰」vs「兒子<strong>生性病</strong>，母倍感安慰」</li>\n<li>「<strong>挪威農民餓死逾400隻豬判囚1年</strong>」→ 農民<strong>餓死</strong>咗？定農民<strong>令 400 隻豬餓死</strong>？</li>\n<li>「<strong>父涉姦兒子女友被捕</strong>」→ 父涉姦<strong>兒子</strong>？定父涉姦<strong>兒子女友</strong>？</li>\n<li>「<strong>新公屋廁廚加大便利輪椅戶</strong>」→「廁廚<strong>加大</strong>，<strong>便利</strong>輪椅戶」vs「廁廚加<strong>大便</strong>……」</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h2 id=\"m2b-h9\">3. 含混 Vagueness ⭐⭐⭐</h2>\n<p><strong>定義：當一個語辭的應用範圍沒有截然明確的界線，它就是含混的語辭。</strong></p>\n<ul>\n<li>例子：<strong>高矮、貧富、冷暖</strong>；<strong>成功、快樂、色情</strong>；<strong>重要、信心、尊重</strong></li>\n</ul>\n<h3 id=\"m2b-h10\">3.1 含混嘅功能／好壞</h3>\n<ul>\n<li><strong>語言中不能或缺的</strong>：例如「<strong>大聲啲</strong>」、「<strong>講快啲</strong>」</li>\n<li><strong>好處</strong>：可幫助我們<strong>約略地描述當前狀況</strong>，具有一定<strong>彈性</strong>。</li>\n<li><strong>短處</strong>：例如在<strong>制定法例</strong>時，我們必須釐訂<strong>清晰而明確</strong>的內容，在這些情況下就<strong>必須避免字詞的歧義與含混</strong>。</li>\n<li><strong>壞處</strong>：它的<strong>彈性</strong>或會被人利用來製造<strong>空話／大話</strong>（語言的自覺篩選），從而<strong>誤導思想</strong>。</li>\n</ul>\n<h3 id=\"m2b-h11\">3.2 連續體謬誤 Continuum Fallacy ⭐⭐</h3>\n<ul>\n<li><strong>利用語詞的含混性質，誤導人將能約略區分的事物視為不能區分。</strong></li>\n<li>例：「<strong>有錢人和窮人沒有大分別</strong>」；「<strong>我和拿 A- 的室友差不多</strong>」</li>\n<li>破解（李天命）：<strong>「X 沒有分明的界線」並不涵蘊「X 沒有約略的界線」</strong>。（又叫 Fallacy of the Beard / 連鎖論證）</li>\n</ul>\n<h3 id=\"m2b-h12\">3.3 滑坡謬誤 Slippery Slope Fallacy ⭐⭐</h3>\n<ul>\n<li><strong>推論過程表現為一種環環相扣的因果關係，
