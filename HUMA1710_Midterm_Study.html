/strong>。例：「<strong>外面有人經過或沒有人經過</strong>」——唔使走出去睇，只要知「有」「沒有」「或」嘅用法。</li>\n<li>「綜合語句是後驗的」：必須對世界實際狀況進行<strong>經驗考察</strong>。邏輯經驗論嘅理由：(a) 按定義，真假唔能僅靠分析意義決定；(b) 只能根據<strong>世界的實際情況</strong>決定；(c) 要知悉世界實際情況只有通過<strong>經驗考察</strong>。</li>\n</ul>\n<p><strong>(二) 分析語句是必然的 (necessary)；綜合語句是適然的 (contingent)。</strong></p>\n<ul>\n<li>「分析語句是必然的」：真就<strong>必然地真</strong>，假就<strong>必然地假</strong>。<ul>\n<li>⭐ <strong>「必然地真」= 在任何可能的情況下皆為真；「必然地假」= 在任何可能的情況下皆為假。</strong></li>\n<li>例：「王老五都是未婚漢」必然地真——任何人唔係未婚漢就唔叫「王老五」；「<strong>昨天下雨或沒有下雨</strong>」——下雨都真，冇下雨都真。</li>\n<li>註⑧：「必然」同「可能」任何一個可以界定另一個：「P 必然為真」=「P <strong>不可能為假</strong>」；「P 可能為真」=「P <strong>不必然為假</strong>」。模態邏輯：□p ≡ <del>◇</del>p；◇p ≡ <del>□</del>p。本文取「<strong>可能</strong>」作為基始語辭界定「必然」。</li>\n<li>註⑨：「倘若改變那句子的字眼用法，豈非可能令它變成一個假的語句？」→ 當然「可能」，但對<strong>原語句（意思/用法未改變之前）<strong>之真假</strong>毫無影響</strong>。</li>\n</ul>\n</li>\n<li>「綜合語句是適然的」：真嘅話只係<strong>事實上真</strong>，<strong>唔係必然地真</strong>；假嘅話只係<strong>事實上假</strong>。<ul>\n<li>例：「<strong>李天命有兩隻手</strong>」→ 事實上真，但<strong>唔係必然地真</strong>（佢可能只有一隻手）。「<strong>光的入射角等於反射角</strong>」→ 事實上真但非必然——正因為<strong>其為假是可能的</strong>，所以<strong>科學家才需要做觀察和實驗</strong>。</li>\n</ul>\n</li>\n</ul>\n<p><strong>(三) 分析語句是沒有實質內容的；只有綜合語句有實質內容。</strong></p>\n<ul>\n<li>「分析語句沒有實質內容」：我哋<strong>無法從分析語句所作的陳述獲知任何事實的情況</strong>。<ul>\n<li><strong>分析地真</strong>嘅語句<strong>容納了一切可能的情況</strong>：「昨天下雨或沒有下雨」——冇任何可能情況令佢為假 → 但正因如此，<strong>它並沒有斷定任何一個特定的情況</strong> → 雖然真，但<strong>無法從佢獲知昨天有冇落雨</strong>。</li>\n<li><strong>分析地假</strong>嘅語句<strong>排斥了一切可能的情況</strong>：「昨天下雨並且（在同一時空）沒有下雨」→ 都<strong>無法獲知</strong>昨天有冇落雨。</li>\n</ul>\n</li>\n<li>⭐ 既然分析語句冇實質內容，<strong>一個句子如有實質內容，它就一定是綜合語句</strong>。例：「<strong>昨天下雨</strong>」——<strong>容納</strong>某些情況（昨天有下雨）<strong>同時又排斥</strong>其他情況（昨天沒有下雨）→ 能夠對事實世界作出<strong>特定的陳述</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m33-h7\">3. 二、析合區分的應用 ⭐⭐⭐</h2>\n<h3 id=\"m33-h8\">(A) 論「人與理性」⭐⭐</h3>\n<ul>\n<li><strong>亞里士多德</strong>：「<strong>人是理性的動物</strong>」→ 你認為「<strong>人皆有理性</strong>」。</li>\n<li>作者問：有咩根據？有冇觀察、調查、研究各式各樣嘅人（例如<strong>猶太人、紅印第安人、愛斯基摩人</strong>）？可能只係對自己同相識嘅人嘅觀察（甚至想像）。</li>\n<li>對方反駁：「我根本毋需觀察……我所說的理性，是<strong>人類先天的本質</strong>……如果你提出反例（某某人冇理性），最多只能顯示：<strong>此所謂『人』不能算是一個真正的人</strong>吧了。」</li>\n<li>作者分析（<strong>唔講反駁成唔成立，只指出係乜嘢反駁</strong>）：<ul>\n<li>「人皆有理性」<strong>看似一個綜合語句</strong>，但喺你自己嘅辯解之下<strong>被解釋成一個分析語句</strong>——你<strong>按自己約定嘅定義</strong>（任何缺乏理性嘅都唔可以叫「人」）而宣稱。</li>\n<li>分析語句<strong>並無實質內容</strong> → ⭐ <strong>你所說的話是真的——但卻是空洞無物的。</strong></li>\n</ul>\n</li>\n<li><strong>延伸</strong>：「<strong>所有女人都是已婚的</strong>」→「未婚的少女和沒有結婚的老處女<strong>都不能算是真正的女人呀</strong>！」→ 用同一方法剖析「<strong>處女不是真正的女人</strong>」之類嘅<strong>狡辯</strong>。</li>\n<li>🔗 呢種手法 = <strong>「真正的 X」狡辯／No True Scotsman</strong>；亦即「<strong>相對空廢</strong>」——將綜合語句偷換成分析語句以避開反例。</li>\n</ul>\n<h3 id=\"m33-h9\">(B) 論「歷史與必然」⭐⭐</h3>\n<ul>\n<li>有些人說：「<strong>歷史的發展是必然的。</strong>」→ 意思十分含糊。</li>\n<li>如果話：「意思是『<strong>歷史會如此如此發展</strong>』（稱為 <strong>H</strong>）這個語句是<strong>必然地真</strong>的。」<ol>\n<li>你點知 H 必然地真？你嘅證據最多只係<strong>過去歷史記載</strong>或其他經驗科學知識，頂多作普遍斷言——但<strong>及唔上物理學嘅斷言可靠</strong>；就算同物理學斷言同等可信，<strong>物理學嘅斷言都唔能話係必然地真</strong>（否則物理學家就唔使做觀察和實驗！）</li>\n<li>⭐ <strong>縱使 H 是必然地真的</strong>，更嚴重問題：H 喺所有可能情況下皆為真 → <strong>容納了一切可能情況</strong> → <strong>空洞無物</strong>、<strong>冇實質內容</strong>。難道你只係想講一句<strong>必然地真、但冇實質內容</strong>嘅句子？</li>\n</ol>\n<ul>\n<li>註⑩：H 其實只係<strong>準語句 (quasi-sentence)</strong>，「如此如此」換上適當語辭先係正式語句；如果將「必然」解作「<strong>心理上絕對相信</strong>」，內容就會係<strong>主觀</strong>嘅。</li>\n</ul>\n</li>\n<li>對方改口：「我就說『<strong>歷史的潮流不可抵擋</strong>』（<strong>K</strong>）好了。」<ul>\n<li>「<strong>不可</strong>」至少兩個意思：(a) 「<strong>不應該</strong>」→ <strong>我們不應該抵抗歷史的潮流</strong> → K 係<strong>道德判斷</strong>（但你原意唔係作道德判斷）；(b) 「<strong>不能夠</strong>」（能力上做不到）→ <strong>我們在能力上做不到抵抗歷史的潮流</strong> → 你有咩證據？歷史上唔係有某潮流被一群人抗拒而消失無蹤嘅例子咩？</li>\n<li>再改口：「<strong>能夠被人抗拒的潮流，不能算是一個歷史的潮流。</strong>」→ 咁 K 係真，但<strong>只係分析地真</strong>（由你對「歷史潮流」一詞嘅用法使然）→ <strong>必然地真，但冇實質內容</strong>（分析語句）。</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m33-h10\">(C) 邏輯的性能 ⭐⭐</h3>\n<ul>\n<li>⚠️ 分析語句冇實質內容，但<strong>唔能推論「分析語句都沒有用」</strong>；亦<strong>唔能推論「分析語句都有用」</strong>——要睇<strong>邊個分析語句</strong>，尤其<strong>喺咩環境和上下文</strong>中被述說。</li>\n<li><strong>邏輯真句</strong>：邏輯裏<strong>對確的語式 (valid formulas)</strong> 之代換個例。<ul>\n<li><strong>M</strong>：「<strong>如果沒有人能夠活一萬歲，而所有獨裁者都是人，那麼（感謝上帝）沒有獨裁者能夠活一萬歲。</strong>」→ <strong>分析地真</strong>。</li>\n<li>註⑪：M 可視為對確句式之代換個例：[~∃x(Fx &amp; Gx) &amp; ∀x(Hx → Fx)] → ~∃x(Hx &amp; Gx)</li>\n<li>⭐ <strong>一切邏輯真句都是分析地真的</strong>：其真僅僅由某些<strong>語文符號</strong>（「如果……那麼……」「非」「並且」「所有」「有些」「沒有」等<strong>邏輯字詞</strong>）嘅用法使之為真 → 亦具<strong>先驗性、必然性</strong>、「<strong>內容空</strong>」。</li>\n</ul>\n</li>\n<li><strong>條件句</strong>：「如果……那麼……」形式；跟「如果」= <strong>前項</strong>；跟「那麼」= <strong>後項</strong>。M 嘅前項<strong>涵蘊</strong>後項 → 後項<strong>冇增加任何超出前項嘅內容</strong>，但<strong>可以將本已包含在前項之中但沒有明顯地披露出來的內容明顯地披露出來</strong>。<ul>\n<li>註⑫：「邏輯真句」指可化約為具條件句形式嘅邏輯真句（<strong>P → P 的代換個例除外</strong>）。</li>\n</ul>\n</li>\n<li>每個條件句都有對應論證：<strong>前項作前提，後項作結論</strong>。⭐ <strong>S2 是一個（邏輯地）對確的論證 (valid argument)，如果且僅當 S1 是邏輯真句</strong>。<ul>\n<li><strong>論證 N</strong>：沒有人能夠活一萬歲，而所有獨裁者都是人，∴ 沒有獨裁者能夠活一萬歲。（阿門）→ 結論冇增加超出前提嘅內容，但能將隱含內容明顯披露。</li>\n</ul>\n</li>\n<li>⭐⭐ <strong>「雖不能增加新的內容，但能把既有的隱含的內容明顯地披露出來」——這正是邏輯論證的一個最基本而重要的性能所在。</strong>（複雜論證一眼睇唔出前提是否涵蘊結論 → 需要邏輯方法檢定）</li>\n<li>總括：藉析合區分，掌握邏輯一個基本特性：<strong>邏輯真句沒有實質內容</strong>（因為佢係分析語句嘅一種）；但<strong>唔能推論邏輯冇用</strong>——邏輯真句或對確論證嘅重要功用 = <strong>把既有的隱含的內容明顯地披露出來</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m33-h11\">4. 三、意義區分 ⭐⭐⭐</h2>\n<h3 id=\"m33-h12\">(A) 真假條件與認知意義</h3>\n<p><strong>X 君故事</strong> ⭐：X 君（Y 省人氏，性好哲學）一日走火入魔，話有<strong>魔鬼躲在屋隅向他獰笑</strong>。</p>\n<ul>\n<li>醫生：「點解別人睇唔到？」X：「<strong>因魔鬼非目所能見之故。</strong>」醫生：「你摸過？聽過聲？嗅過氣味？」X：「<strong>非也。此魔無形無質，無聲無味，非吾人經驗所能察知者也。他只是自存自在，躲在屋隅向我獰笑耳。</strong>」</li>\n<li>診斷：<strong>X 君患嚴重精神病</strong>；建議：<strong>速送精神病院治療</strong>。</li>\n<li><strong>醫學角度</strong>：X 君患精神病；<strong>邏輯經驗論角度</strong>：X 君嘅句子係「<strong>沒有認知意義的 (cognitively meaningless)</strong>」。</li>\n<li>⭐ 邏輯經驗論最顯著特色：一針見血點出——歷來好多「思想」或言論<strong>在認知上並不優於 X 君那種毫無意義的說法</strong>，例：<strong>柏拉圖主義者</strong>嘅「<strong>現實世界是理型世界的影象</strong>」。呢類學說披上<strong>看似嚴肅高深的言辭外衣</strong>，但語理分析可顯示佢哋<strong>不外是一堆堆沒有認知意義的句子</strong>。</li>\n</ul>\n<p><strong>咩係認知意義？</strong></p>\n<ul>\n<li>例 P：「<strong>香港中文大學有學生五千名</strong>」→ 有認知意義：知道點樣算係中大學生（校方規定、檔案、身份證明書、樣貌、指紋、簽名），原則上可以分辨 → 知道 P 喺咩情況下真、咩情況下假 → 原則上可以進一步考查。</li>\n<li>例 Q：「<strong>某甲是某乙的嫡親弟弟</strong>」→ 真嘅條件：(1) <strong>甲和乙有共同的親生父母</strong>，(2) <strong>甲是男性</strong>，(3) <strong>甲的年紀小於乙</strong>；(1)–(3) 之否定 = 令 Q 為假嘅條件。</li>\n<li>推廣：知道語句喺咩情況下真/假 → 先有可能判定真假；連咩情況下真/假都唔知 → <strong>無從着手</strong>。</li>\n<li>⭐ <strong>真假條件 (truth-conditions)</strong>：令語句為真或為假嘅情況。設 C1 令 S 為真、C2 令 S 為假 → C1、C2 就係 S 嘅真假條件。</li>\n<li>⭐⭐⭐ <strong>定義：如果一個語句 S 有真假條件，那麼 S 是有認知意義的；並且只有當 S 有真假條件時，S 才是有認知意義的。合起來說：如果且僅當 S 有真假條件，則 S 有認知意義。</strong></li>\n<li>據此：<strong>沒有認知意義的語句是說不上「真」或「假」的</strong>，即<strong>無所謂真假</strong>，乃係「<strong>假都不如</strong>」的，或說係「<strong>連『假』的資格都沒有的</strong>」。⭐ <strong>一言以蔽之，沒有認知意義的語句就是沒有真假可言的語句。</strong></li>\n</ul>\n<h3 id=\"m33-h13\">(B) 從檢證原則到印證原則 ⭐⭐⭐</h3>\n<p><strong>檢證原則 (verification principle)</strong>：</p>\n<ul>\n<li>原型 <strong>(VP)：「語句的意義在於它的檢證方法。」</strong></li>\n<li>疏解：<ol>\n<li>原則所提到嘅「語句」<strong>只限於綜合語句</strong>（分析語句不是恒真便是恒假 → <strong>皆有真假可言</strong> → 任何分析語句都有認知意義）；</li>\n<li>「意義」指「<strong>認知意義</strong>」；</li>\n<li>「檢證」= 「<strong>由經驗證明為真</strong>」（註⑭：「證明」取日常用法，<strong>不限於</strong>邏輯/數學上嘅形式推證 formal demonstration）；</li>\n<li>⚠️ <strong>很大的誤解</strong>：以為檢證原則將「<strong>實際上已證實為真</strong>」規定為有認知意義嘅必要條件 → <strong>冇咁嘅要求</strong>！只規定「<strong>原則上有可能被證明為真</strong>」係綜合語句有認知意義嘅<strong>必要條件</strong>；</li>\n<li>⭐ 縱使某語句<strong>實際上已被證明為假</strong>，都<strong>無礙</strong>佢原則上有可能被證明為真（「原則上有可能被證明為真」= 「具有被證明為真之<strong>可能性</strong>」）。例：「<strong>本人（筆者）飛刀，例不虛發</strong>」→ 事實上已證明為假，但仍然有可能（不管幾細）百發百中；</li>\n<li>「被經驗證明為真之可能性」簡稱「<strong>可檢證性 (verifiability)</strong>」→ ⭐ <strong>檢證原則只係要排斥缺乏可檢證性的綜合語句，而唔係要排斥假的語句</strong>——因為<strong>假的語句也是有認知意義的</strong>（冇認知意義嘅語句根本稱不上「真」或「假」）。</li>\n</ol>\n<ul>\n<li>註⑮：「<strong>原則上有可能</strong>」= 「<strong>最低限度是邏輯地可能</strong>」。⚠️ <strong>「技術上沒有可能」並不涵蘊「原則上沒有可能」</strong>。</li>\n</ul>\n</li>\n<li><strong>(VP*)</strong> (a) <strong>所有分析語句皆有認知意義</strong>。(b) 設 S 是綜合語句：如果 S <strong>在原則上有可能由經驗的途徑被證明為真</strong>，則 S 有認知意義；否則冇。簡言之，<strong>如果且僅當 S 有可檢證性，則 S 有認知意義。</strong></li>\n<li>應用：柏拉圖主義者「<strong>現實世界是理型世界的影象</strong>」→ <strong>既不是分析的，又冇可檢證性</strong> → 冇認知意義；「<strong>某某人有一個腦</strong>」→ 原則上可通過經驗方法證明為真 → 有認知意義。</li>\n</ul>\n<p><strong>檢證原則的問題：全稱語句</strong></p>\n<ul>\n<li><strong>全稱語句</strong>：「一切（任何、所有、凡是）X 皆如此如此」。X 係：<ul>\n<li><strong>封閉集合</strong>（包含已知有限個分子）：「<strong>凡是某某果園內的蘋果都有蟲</strong>」→ 可逐一檢查 → 檢證原則冇問題；</li>\n<li><strong>開放集合</strong>（非封閉）：「人」→ 唔能排斥「過去現在和將來的宇宙間有無限多個可稱為『人』的生物」→ 即使證實到目前每個人都有腦，<strong>都唔能證明</strong>「<strong>一切人皆有腦</strong>」（<strong>U</strong>）。</li>\n<li>U 唔可能由經驗途徑「證明」為真 → 檢證原則會判 U <strong>冇認知意義</strong> → ⚠️ <strong>荒謬</strong>！連邏輯經驗論者都唔願意咁講；⭐ <strong>極大多數科學定律都好似 U 一樣，係涉及開放集合的全稱語句，而呢種定律卻正好是「有認知意義」的典範。</strong></li>\n</ul>\n</li>\n</ul>\n<p><strong>解決：以「印證」代替「檢證」</strong> ⭐⭐⭐</p>\n<ul>\n<li>倘若能顯示某句子<strong>被經驗證據支持</strong> → 該句子（或多或少地）得到「<strong>印證</strong>」；原則上有可能被經驗證據支持 → 「<strong>可印證的</strong>」/「<strong>具有可印證性</strong>」。</li>\n<li>U：「一切人皆有腦」→ <strong>唔可能「證明」為真</strong>，但<strong>有可能被經驗證據支持</strong>（有關人腦嘅觀察構成支持 U 嘅證據，令我哋有理由「相信」U 為真）→ ⭐ <strong>儘管 U 不是可檢證的，但它仍是可印證的。</strong></li>\n<li><strong>(CP) 印證原則 (confirmation principle)</strong>：(a) <strong>所有分析語句都有認知意義</strong>。(b) 設 S 是綜合語句：如果 S <strong>在原則上有可能被經驗證據支持</strong>，那麼 S 有認知意義；反之冇。簡言之，<strong>如果且僅當 S 有可印證性，則 S 有認知意義。</strong><ul>\n<li>註⑯：任何綜合語句 S 都<strong>唔係必然地真</strong> → S 如果原則上有可能被經驗證據<strong>支持</strong>，亦有可能被經驗證據<strong>否駁</strong>。支持 S 嘅證據 = <strong>正面證據</strong>；否駁 S 嘅證據 = <strong>反面證據</strong>。前者<strong>印證 S 為真</strong>（簡稱「<strong>印證 S</strong>」）；後者<strong>印證 S 為假</strong>（簡稱「<strong>非證 S</strong>」）。⭐ <strong>「有可印證性」等於「有可非證性」</strong>——即有可能受到正面或反面證據嘅支持或否駁。</li>\n<li>註⑰：<strong>卡納普 (Carnap) 及函寶 (Hempel)</strong> 等喺印證原則嘅形式陳構做咗精細工作；形式陳構屬細節專技問題，<strong>唔影響印證原則喺方法學上嘅重大實效價值</strong>——艾耶 (Ayer)：&quot;a principle may be intuitively clear and effective even though you don&#39;t get a water-tight formal statement of it.&quot;</li>\n</ul>\n</li>\n<li>⭐⭐ <strong>比較</strong>：<strong>印證原則較檢證原則寬容得多。任何經由檢證原則鑑定為有認知意義的語句都會給印證原則鑑定為有認知意義，但反之不然</strong>（例如 U）。換句話說，**凡是通得過檢證原則的句子都通得過印證原則，然而有些通得過印證原則的句子卻通不過檢證原則。**作為「認知意義」的判準，<strong>印證原則比檢證原則更為適當合用</strong>。</li>\n</ul>\n<hr>\n<h2 id=\"m33-h14\">5. 四、意義區分的應用 ⭐⭐⭐</h2>\n<ul>\n<li>根據印證原則，<strong>玄學（即「超驗的」玄想形上學）是沒有認知意義的</strong>：玄學家聲稱研究題材係<strong>經驗範圍以外的對象</strong>，但任何關於「<strong>超驗界</strong>」嘅言論都<strong>缺乏可印證性</strong>（冇任何可能嘅經驗觀察可以算係正面或反面證據）→ <strong>冇客觀真假可言</strong>。<ul>\n<li>註⑱：「<strong>客觀真假</strong>」嘅「客觀」原是<strong>冗詞</strong>（真假本來就係客觀嘅）；用嚟提醒：綜合語句嘅真假係由<strong>客觀的經驗證據</strong>決定，唔係憑主觀意願。</li>\n</ul>\n</li>\n<li>亦適用於<strong>含有玄學成份的神學</strong>：「<strong>上帝是超越的，祂超出一切可能經驗的界限。</strong>」→ 中古時代好多人接受；近代以來趨勢認為呢類論調「<strong>不可信</strong>」→ 用印證原則可以提出<strong>更徹底的批評</strong>：唔係「不可信」，而係「<strong>無所謂可信不可信</strong>」、「<strong>無從信起</strong>」——根本稱唔上喺咩可能經驗情況下算真或假 → <strong>毫無認知意義</strong>。</li>\n</ul>\n<h3 id=\"m33-h15\">(A) 玄學的評例：齊白石的畫 ⭐⭐</h3>\n<ul>\n<li>一幅畫，有人猜係<strong>齊白石</strong>作品，有人話唔係 → 有一定程序處理：鑑畫專家檢查同公認作品嘅相似性、有冇贗品特徵、查閱作品紀錄 → 意見可能仍分歧，但<strong>知道咩經驗資料算正面或反面證據</strong>（註⑲：Ayer, <em>Language, Truth and Logic</em>, pp. 54–55）。</li>\n<li>專家讀咗哲學：有人宣稱「<strong>那幅畫只是認知者（觀畫的人）底心中的一堆觀念</strong>」（<strong>觀念論</strong>）；有人反對：「那幅畫是<strong>客觀地獨立存在的</strong>」（<strong>實在論</strong>）→ <strong>觀念論與實在論之爭</strong>。</li>\n<li>問：有咩可能嘅經驗資料可作為解決爭論嘅最後根據？<strong>冇</strong>——實在論者認為「客觀獨立存在」嘅經驗資料，觀念論者會說成「一堆觀念的集合」。</li>\n<li>依照「觀念」慣常用法，「那幅畫是觀畫者心中的一堆觀念」<strong>顯明是假的</strong>（可以摸到幅畫，摸唔到觀念）→ 觀念論者嘅「觀念」<strong>意義同通常用法唔同</strong>（僻義）→ 我哋亦無法按慣常用法了解句子意思。</li>\n<li>⭐ 作者回答觀念論者：「<strong>我不會像實在論者那樣反對你的說法，但我也不會贊同你的說法——我只是不知道你究竟說了些甚麼。</strong>」只有知道斷言陳述咗乜，先有所謂「接受」或「不接受」；你要我同意或不同意，你要先表明那說法嘅<strong>認知意義</strong>——即<strong>甚麼樣的經驗資料可能用來印證你的見解</strong>？</li>\n<li>邏輯經驗論者指出：觀念論者<strong>根本無法回答</strong> → <strong>觀念論缺乏可印證性</strong>，最多只能算係一種<strong>沒有認知意義的偽贗理論</strong>。<ul>\n<li>註⑳：倘若將實在論視為觀念論嘅否定，<strong>實在論也沒有認知意義</strong>——因為<strong>如果 P 冇認知意義，則非 P 亦然</strong>。</li>\n</ul>\n</li>\n</ul>\n<p><strong>附述：形上學的門類</strong> ⭐</p>\n<ul>\n<li><strong>觀念論是玄學的一派，玄學則是形上學的一種</strong>。形上學門類：<table>\n<thead>\n<tr>\n<th>門類</th>\n<th>內容</th>\n<th>代表</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>描述形上學</strong></td>\n<td>展示概念架構</td>\n<td><strong>史特勞遜 (Strawson)</strong> 等</td>\n</tr>\n<tr>\n<td><strong>形式存有論</strong></td>\n<td>倡議範疇系統</td>\n<td><strong>古德曼 (Goodman)</strong> 等</td>\n</tr>\n<tr>\n<td><strong>歸納形上學</strong></td>\n<td>推定宇宙模型</td>\n<td><strong>藍伯特</strong> 等</td>\n</tr>\n<tr>\n<td><strong>玄想形上學</strong></td>\n<td>研究「超驗界」或「絕對本體」</td>\n<td><strong>黑格爾 (Hegel)</strong> 等</td>\n</tr>\n</tbody></table>\n</li>\n<li>兩點注意：① 「<strong>玄學</strong>」同「<strong>形上學</strong>」有時當同義詞，但本文限定「玄學」<strong>專指玄想的形上學</strong>；② <strong>早期邏輯實徵論者</strong>對形上學一律排斥（認為任何形上學系統都缺乏認知意義），但發展到<strong>成熟階段</strong>以後，邏輯經驗論者對形上學態度<strong>越來越趨於寬容</strong>——<strong>並冇排斥形上學的全體</strong>，要批判和清除嘅主要係<strong>玄學</strong>以及任何理論、學說、主義裏面嘅<strong>玄學成份</strong>。</li>\n</ul>\n<h3 id=\"m33-h16\">(B) 神學的評例 ⭐⭐</h3>\n<ul>\n<li>神學家：「<strong>上帝是智慧的、慈愛的、全能的；他會發號施令，聽我們的禱告，希望我們有幸福，寬恕我們的罪過……</strong>」</li>\n<li>「智慧」「慈愛」「聽」「希望」「寬恕」原是描述<strong>有機體</strong>嘅能力、傾向、心理狀態；但神學家大都<strong>唔願意話上帝係有機體</strong>（有機體有繁殖、生長、吸收、排泄……對上帝太過不雅）→ 咁用嚟形容「上帝」<strong>究竟係乜意思</strong>？一個非有機體點樣「慈愛」、「聽」禱告、「寬恕」世人……<strong>難以想像</strong>。</li>\n<li>神學家答辯：「<strong>當然難以想像，因為上帝是全知全善全能的至高存有。在渺小的人類看來，上帝是不可思議的。我們那麼卑微，不能妄想用自己有限的概念去捕捉無限的上帝。</strong>」</li>\n<li>分析：顯露「<strong>講話不加思索、只憑一時心血來潮即信口開河</strong>」嘅頑劣習慣：<ul>\n<li><strong>集合論</strong>裏「有限」「無限」有嚴格定義，形容集合嘅<strong>基數（分子數）</strong>；但「<strong>有限的概念</strong>」「<strong>無限的上帝</strong>」——並非形容概念或上帝嘅集合基數（答辯者唔願意講「有無限多個上帝」）→ <strong>冇清晰嚴格說明</strong>；點樣算有限概念能否「捕捉」無限上帝，更冇交待。</li>\n<li>「<strong>全知全善全能</strong>」等話頭講多咗好似好清楚，但請佢闡明 → 只會用<strong>愈講愈胡塗</strong>嘅字眼裝作答咗 → 實係<strong>分散注意的詭策</strong>。</li>\n<li>結論：<strong>冇任何可能嘅經驗觀察可用嚟印證</strong> → 按印證原則，<strong>冇認知意義</strong>。</li>\n</ul>\n</li>\n</ul>\n<p><strong>附述：退一萬步</strong> ⭐</p>\n<ul>\n<li>就算假定答辯有認知意義，仍有極大毛病：⭐ <strong>「有認知意義」只等於「有真假可言」，並不等於「真」</strong>；答辯者既聲稱上帝<strong>不可思議</strong>，別人自然質詢：「你又點知有咁樣一個不可思議嘅上帝存在，甚至知道祂係『至高的』、『全知全善全能的』？一方面說祂不可思議，同時又長篇大論地講述祂，<strong>豈非自打咀巴</strong>？」</li>\n<li>詞窮理拙時嘅<strong>最後絕招</strong>：「<strong>你的質問反映出心裏的傲慢。如果你在上帝面前謙卑，你就不會問那種問題。如果你相信，你便不會懷疑。讓我替你祈禱，你自己也要祈禱，讓我們一起多多祈禱。</strong>」→ 「<strong>太極推手</strong>」/「<strong>下台秘訣</strong>」/「<strong>保留面子的最佳妙策</strong>」→ 實係<strong>狡猾而不負責任的詭辯</strong>：<ol>\n<li>「如果你在上帝面前謙卑，你就不會問那種問題」→ <strong>預設了「上帝是存在的」</strong>，但呢個正係爭論範圍之內 → 假定咗正待審查嘅論點 → <strong>犯了循環的謬誤</strong>。</li>\n<li>「如果你相信，你便不會懷疑」→ <strong>只是一句廢話</strong>（懷疑就唔算相信，相信自然唔會懷疑）；向懷疑嘅人講廢話 = <strong>滑頭做法</strong>。😂 傳教士懷疑太太喺外面嘅行為時，太太答：「如果你相信，你便不會懷疑。」佢會滿意咩？</li>\n<li>「多多祈禱」絕招嘅「精華」在於「<strong>兜圈子</strong>」嘅、<strong>永遠搖擺不定的兩面性格</strong>：答得到就講道理，答唔到就唔講道理，要求人<strong>以祈禱代替發問、以盲信代替懷疑</strong>。→ 你究竟打唔打算講道理？打算就唔應以「多多祈禱」作<strong>遁詞</strong>逃避理性討論；唔打算，又何必到處向人「講道」？</li>\n</ol>\n</li>\n</ul>\n<hr>\n<h2 id=\"m33-h17\">6. 五、進一步的細分 ⭐⭐⭐</h2>\n<h3 id=\"m33-h18\">(A) 方法學的次區分</h3>\n<p><strong>圖四</strong>：</p>\n<pre><code>| 分析語句 |    綜合語句     |\n|    X    |   Y   |   Z    |\n|   有認知意義     | 無認知意義 |\n</code></pre>\n<ul>\n<li><strong>X</strong>：分析語句 → 全部說得上真/假 → <strong>全部有認知意義</strong>。</li>\n<li><strong>Y</strong>：<strong>有認知意義的綜合語句</strong>（例：<strong>經驗科學的語句</strong>——有真假可言，但唔能僅靠語言分析決定）。</li>\n<li><strong>Z</strong>：<strong>沒有認知意義的綜合語句</strong>（例：「<strong>牆上那幅畫只是認知者心中的一堆觀念</strong>」）。</li>\n<li><strong>次區分 (subdistinction)</strong>：「恒真句 vs 矛盾句」及「綜合真句 vs 綜合假句」係析合區分之下嘅次一步細分。</li>\n<li>有認知意義嘅語句再分：分析語句所具有嘅意義 = ⭐ <strong>邏輯意義</strong>；有認知意義嘅綜合語句所具有嘅意義 = ⭐ <strong>經驗意義</strong>。</li>\n<li>冇認知意義嘅語句再分兩個<strong>次類 (subclasses)</strong>：① 雖無認知意義但仍有「<strong>非知意義 (non-cognitive meaning)</strong>」；② 既無認知意義也冇非知意義 = <strong>全無意義</strong>。</li>\n</ul>\n<h3 id=\"m33-h19\">(B) 「非知意義」與「全無意義」⭐⭐⭐</h3>\n<ul>\n<li>比較：<ul>\n<li><strong>K1</strong>：「<strong>任何人的壽命或超過一百歲或不超過一百歲</strong>」→ <strong>分析語句</strong></li>\n<li><strong>K2</strong>：「<strong>任何人的壽命都超過一百歲</strong>」→ <strong>有可印證性的綜合語句</strong>（雖然係假）</li>\n<li><strong>K3</strong>：「<strong>任何人都應該每月祈禱至少一百次</strong>」→ 唔係分析（真假唔能靠語言分析決定）；亦唔係有可印證性嘅綜合語句——「<strong>X 應該如何如何</strong>」形式一般只表示<strong>對行為所作的規範</strong>，<strong>唔陳述經驗事態</strong>。即使同意所有關於人嘅經驗性質，仍可能對「應否每月祈禱一百次」持相反意見 → <strong>冇可印證性</strong> → <strong>冇認知意義</strong>。</li>\n</ul>\n</li>\n<li>⭐ <strong>唔能從「某語句沒有認知意義」推論「該語句沒有意義」</strong>：依慣常用法，<strong>認知意義只是意義的一種，而不是意義的全部</strong>（好比<strong>動物只是生物的一種</strong>）。我哋可能唔接受 K3，但唔會話佢不可理解或冇意義 → K3 有 ⭐ <strong>規範意義</strong>。</li>\n<li><strong>非知意義</strong>包括：<strong>規範意義、情感意義、評價意義、美學意義</strong>……<table>\n<thead>\n<tr>\n<th>非知意義</th>\n<th>定義</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>情感意義</strong></td>\n<td>主要用嚟<strong>表露情感或引起情感反應</strong></td>\n<td>「<strong>春花秋月何時了，往事知多少</strong>」；「<strong>風蕭蕭兮易水寒，壯士一去兮不復還</strong>」</td>\n</tr>\n<tr>\n<td><strong>評價意義</strong></td>\n<td>主要用嚟<strong>陳述對事物的價值評判</strong></td>\n<td>「<strong>鐘鼓饌玉不足貴，但願長醉不願醒</strong>」；「<strong>萬般皆下品，惟有讀書高</strong>」</td>\n</tr>\n<tr>\n<td><strong>美學意義</strong></td>\n<td>主要用嚟<strong>傳達或營造藝術性的意象、境界或感受</strong></td>\n<td>「<strong>大江東去，浪淘盡、千古風流人物</strong>」；「<strong>錦江春色來天地，玉壘浮雲變古今</strong>」；「<strong>今宵酒醒何處？楊柳岸，曉風殘月</strong>」</td>\n</tr>\n</tbody></table>\n</li>\n<li>⭐ <strong>各種非知意義不是互相排斥的</strong>：同一句子往往具多過一種，例：「<strong>某甲是一個混蛋</strong>」→ 既表露厭惡（情感），又陳述貶抑評判（評價）。「<strong>將軍百戰身名裂，向河梁，回頭萬里，故人長絕</strong>」→ 營造藝術意境（美學）+ 引起悲壯蒼涼情懷（情感）。</li>\n<li>⭐⭐ <strong>就連認知意義和非知意義也不是互相排斥的</strong>：有啲語句<strong>同時兼有</strong>：「<strong>西風殘照，漢家陵闕</strong>」「<strong>十步殺一人，千里不留行</strong>」「<strong>千山鳥飛絕，萬徑人蹤滅</strong>」「<strong>落霞與孤鶩齊飛，秋水共長天一色</strong>」→ 以美學意義為主，但亦多多少少對<strong>經驗事態作出描述</strong> → 亦可視為具有認知意義。<ul>\n<li>⚠️ 但「有的語句可能同時具有認知意義和非知意義」<strong>並不涵蘊</strong>「所有語句皆有認知意義和非知意義」：<strong>泰戈爾 (Tagore)</strong> 詩句「<strong>塵土被侮辱，卻報以鮮花</strong>」「<strong>小花躺在塵土裡，尋覓那蝴蝶的路徑</strong>」「<strong>乾涸的河床覺得毋需感謝它的過去</strong>」「<strong>蜘網要捕捉蒼蠅，卻假裝在捕捉露珠</strong>」→ <strong>冇描述經驗事態、缺乏可印證性 → 冇認知意義</strong>，但有非知意義（至少<strong>美學意義</strong>）。</li>\n</ul>\n</li>\n<li><strong>全無意義的語句</strong>：既無認知意義、亦無非知意義：「<strong>算術的質量是三十寸</strong>」「<strong>同一性在磁場上蹓冰</strong>」「<strong>正方形喝了半副撲克牌</strong>」→ 冇規範、情感、評價、美學或其他非知意義。<ul>\n<li>註㉒：呢啲字詞組合雖無意義，但仍具有作為一個語句嘅<strong>文法形式</strong>，所以稱為「全無意義的語句」。仲有<strong>連「語句」都稱不上</strong>嘅字詞組合：「<strong>的質量算術寸三十是</strong>」「<strong>於者同一性也不乎之不</strong>」。批評語句冇意義<strong>唔等於</strong>話唔可能約定地「賦給」佢某個意義（任何聲音或筆劃都「可能」通過約定而「獲得」意義），但同評定某語句為無意義<strong>毫不相干</strong>。</li>\n<li>註㉑：(1) 決定句子有咩意義，每每要考慮<strong>脈絡</strong>；(2) 本文談到嘅非知意義<strong>不必窮盡</strong>全部，只係較重要嘅幾種；(3) ⭐ <strong>邏輯經驗論者如艾耶、卡納普</strong>將任何非知意義都<strong>籠統稱為「情感意義」</strong>→ <strong>實過於粗略</strong>（參 R. M. Hare <em>The Language of Morals</em>；G. J. Warnock）。</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"m33-h20\">(C) 圖五：一個概括性的圖解 → 見本筆記第 0 節 ⭐⭐⭐</h3>\n<hr>\n<h2 id=\"m33-h21\">7. 六、總結：避免兩個思想上的泥沼 ⭐⭐⭐</h2>\n<p>掌握兩個方法學區分（及次區分）= 掌握現代哲學思考兩項極有效用嘅利器 → 避免兩個常見<strong>思想上的泥沼</strong>：</p>\n<p><strong>第一、「析合區分」能夠使我們認清各式各樣狂熱而獨斷的「教條主義」的盲目態度之所在。</strong></p>\n<ul>\n<li>教條主義者以為所奉教條係關於宇宙和人生嘅「<strong>最高、最根本的真理</strong>」→ 咁就必須係<strong>有實質內容的綜合語句</strong>；但佢哋又<strong>不能容忍任何人有半分懷疑</strong>，堅信教條係「<strong>必然地真的</strong>」。</li>\n<li>⭐⭐ 可惜冇咁便宜：<strong>一個語句如有實質內容，它就不會是分析的，因而也就不會是必然的；一個語句如果要有必然性，它就只有是分析的，因而也就只有是一個缺乏實質內容的句子。一言以蔽之，沒有任何語句能夠既有實質內容，又有必然性。</strong></li>\n</ul>\n<p><strong>第二、「意義區分」可以使我們辨識「有認知意義」與「無認知意義」的不同性質，並對缺乏認知意義的一類語句有銳利的警覺。</strong></p>\n<ul>\n<li>喺<strong>認知性的探討</strong>中（註㉓：指探究、討論等思考性活動），我哋便唔會提出不相干、冇認知意義嘅說法，例如：<ul>\n<li><strong>黑格爾</strong>：「『<strong>有』深入於其自身……『絕對』乃是『有』……『絕對』即是『無』</strong>」（註㉔：《小邏輯》第一部第一篇第 84–87 節）</li>\n<li>某些「<strong>現象學家</strong>」：「<strong>意向性地不存在的本質之內在性乃在於它們在純粹直覺之前的自我給與性</strong>」</li>\n<li>「<strong>作為一個即興詩人的我</strong>」夢囈般吟哦：「<strong>信仰騎着懷疑在有限與無限以及祈禱與睡覺之間兜圈子</strong>」</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h2 id=\"m33-h22\">8. 考試速攻 ⚠️⭐</h2>\n<table class=\"selftest\">\n<thead>\n<tr>\n<th>講法</th>\n<th>答案</th>\n<th>理由</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>邏輯經驗論早期稱為邏輯實徵論</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>艾耶同萊興巴赫係維也納學圈成員</td>\n<td><strong>F</strong></td>\n<td>唔屬於，但有密切聯繫；施里克、卡納普先係</td>\n</tr>\n<tr>\n<td>兩個方法學區分：析合區分、意義區分</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析語句 = 其意義（用法）足以決定其真假</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>綜合語句 = 不是分析語句嘅語句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「香港有所中文大學」係分析語句</td>\n<td><strong>F</strong></td>\n<td>綜合（要經驗考察）</td>\n</tr>\n<tr>\n<td>「凡物熱縮冷脹」係綜合假句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「光的入射角等於反射角」係必然地真</td>\n<td><strong>F</strong></td>\n<td>事實上真、<strong>適然</strong>；所以科學家要做實驗</td>\n</tr>\n<tr>\n<td>綜合真句 + 綜合假句窮盡全部綜合語句</td>\n<td><strong>F</strong></td>\n<td>仲有冇真假可言嘅（E、F）</td>\n</tr>\n<tr>\n<td>必然地真 = 在任何可能的情況下皆為真</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「P 必然為真」=「P 不可能為假」</td>\n<td><strong>T</strong></td>\n<td>註⑧</td>\n</tr>\n<tr>\n<td>「李天命有兩隻手」係必然地真</td>\n<td><strong>F</strong></td>\n<td>事實上真</td>\n</tr>\n<tr>\n<td>分析地真嘅語句容納一切可能情況，所以冇實質內容</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析地假嘅語句容納一切可能情況</td>\n<td><strong>F</strong></td>\n<td><strong>排斥</strong>一切可能情況</td>\n</tr>\n<tr>\n<td>句子有實質內容就一定係綜合語句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「人皆有理性」喺辯護者嘅解釋下變成分析語句，真但空洞無物</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「歷史的潮流不可抵擋」中「不可」至少有「不應該」「不能夠」兩個意思</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析語句冇實質內容，所以分析語句都冇用</td>\n<td><strong>F</strong></td>\n<td>要睇邊個、喺咩脈絡</td>\n</tr>\n<tr>\n<td>一切邏輯真句都係分析地真</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>邏輯真句冇實質內容，所以邏輯冇用</td>\n<td><strong>F</strong></td>\n<td>可<strong>將隱含內容明顯地披露出來</strong></td>\n</tr>\n<tr>\n<td>對確論證嘅結論增加咗前提以外嘅新內容</td>\n<td><strong>F</strong></td>\n<td>冇增加，只係<strong>披露</strong></td>\n</tr>\n<tr>\n<td>S2 係對確論證若且唯若 S1（對應條件句）係邏輯真句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「現實世界是理型世界的影象」冇認知意義</td>\n<td><strong>T</strong></td>\n<td>柏拉圖主義；冇可檢證性</td>\n</tr>\n<tr>\n<td>如果且僅當 S 有真假條件，則 S 有認知意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>冇認知意義嘅語句係「假都不如」</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>檢證原則要求語句「實際上已證實為真」先有認知意義</td>\n<td><strong>F</strong></td>\n<td><strong>很大的誤解</strong>；只要「<strong>原則上有可能</strong>」</td>\n</tr>\n<tr>\n<td>實際上已證明為假嘅語句冇認知意義</td>\n<td><strong>F</strong></td>\n<td>「本人飛刀，例不虛發」仍有可能被證明為真</td>\n</tr>\n<tr>\n<td>檢證原則要排斥假嘅語句</td>\n<td><strong>F</strong></td>\n<td>只排斥<strong>缺乏可檢證性</strong>嘅綜合語句；假語句有認知意義</td>\n</tr>\n<tr>\n<td>「技術上沒有可能」涵蘊「原則上沒有可能」</td>\n<td><strong>F</strong></td>\n<td>原則上可能 = <strong>最低限度邏輯地可能</strong></td>\n</tr>\n<tr>\n<td>檢證原則所講嘅語句只限於綜合語句</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「凡是某某果園內的蘋果都有蟲」用檢證原則冇問題</td>\n<td><strong>T</strong></td>\n<td><strong>封閉集合</strong></td>\n</tr>\n<tr>\n<td>「一切人皆有腦」可檢證</td>\n<td><strong>F</strong></td>\n<td>開放集合；<strong>不可檢證但可印證</strong></td>\n</tr>\n<tr>\n<td>科學定律多數係涉及開放集合嘅全稱語句</td>\n<td><strong>T</strong></td>\n<td>有認知意義嘅典範</td>\n</tr>\n<tr>\n<td>通得過印證原則嘅句子一定通得過檢證原則</td>\n<td><strong>F</strong></td>\n<td><strong>反過嚟</strong>：通得過檢證 → 一定通得過印證</td>\n</tr>\n<tr>\n<td>印證原則比檢證原則更適當合用</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「有可印證性」等於「有可非證性」</td>\n<td><strong>T</strong></td>\n<td>註⑯</td>\n</tr>\n<tr>\n<td>「客觀真假」嘅「客觀」係冗詞</td>\n<td><strong>T</strong></td>\n<td>註⑱</td>\n</tr>\n<tr>\n<td>玄學（超驗玄想形上學）冇認知意義</td>\n<td><strong>T</strong></td>\n<td>缺乏可印證性</td>\n</tr>\n<tr>\n<td>用印證原則批評神學：上帝論調係「不可信」</td>\n<td><strong>F</strong></td>\n<td>更徹底：「<strong>無所謂可信不可信</strong>」「<strong>無從信起</strong>」</td>\n</tr>\n<tr>\n<td>觀念論同實在論之爭可以用經驗資料解決</td>\n<td><strong>F</strong></td>\n<td>冇可能經驗資料可作最後根據</td>\n</tr>\n<tr>\n<td>作者會反對觀念論者嘅說法</td>\n<td><strong>F</strong></td>\n<td>「不反對也不贊同——<strong>只是不知道你究竟說了些甚麼</strong>」</td>\n</tr>\n<tr>\n<td>如果 P 冇認知意義，非 P 都冇</td>\n<td><strong>T</strong></td>\n<td>實在論亦然（註⑳）</td>\n</tr>\n<tr>\n<td>玄學係形上學嘅一種，觀念論係玄學一派</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>描述形上學代表係史特勞遜</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>成熟期邏輯經驗論者排斥全部形上學</td>\n<td><strong>F</strong></td>\n<td>越趨寬容，主要清除<strong>玄學</strong></td>\n</tr>\n<tr>\n<td>「有認知意義」等於「真」</td>\n<td><strong>F</strong></td>\n<td>只等於「<strong>有真假可言</strong>」</td>\n</tr>\n<tr>\n<td>「如果你在上帝面前謙卑，你就不會問那種問題」犯循環謬誤</td>\n<td><strong>T</strong></td>\n<td>預設上帝存在</td>\n</tr>\n<tr>\n<td>「如果你相信，你便不會懷疑」係廢話</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>分析語句嘅意義 = 邏輯意義；有認知意義嘅綜合語句 = 經驗意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「任何人的壽命都超過一百歲」冇認知意義</td>\n<td><strong>F</strong></td>\n<td>有可印證性嘅綜合語句（假但有認知意義）</td>\n</tr>\n<tr>\n<td>「任何人都應該每月祈禱至少一百次」有認知意義</td>\n<td><strong>F</strong></td>\n<td>冇可印證性；有<strong>規範意義</strong></td>\n</tr>\n<tr>\n<td>冇認知意義就係冇意義</td>\n<td><strong>F</strong></td>\n<td>認知意義只係意義嘅一種（動物/生物）</td>\n</tr>\n<tr>\n<td>「萬般皆下品，惟有讀書高」有評價意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「大江東去，浪淘盡、千古風流人物」有美學意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「風蕭蕭兮易水寒」有情感意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>各種非知意義互相排斥</td>\n<td><strong>F</strong></td>\n<td>「某甲是一個混蛋」：情感 + 評價</td>\n</tr>\n<tr>\n<td>認知意義同非知意義互相排斥</td>\n<td><strong>F</strong></td>\n<td>「西風殘照，漢家陵闕」兼有</td>\n</tr>\n<tr>\n<td>泰戈爾「塵土被侮辱，卻報以鮮花」有認知意義</td>\n<td><strong>F</strong></td>\n<td>只有非知（美學）意義</td>\n</tr>\n<tr>\n<td>「正方形喝了半副撲克牌」全無意義</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「的質量算術寸三十是」係全無意義的語句</td>\n<td><strong>F</strong></td>\n<td><strong>連語句都稱不上</strong></td>\n</tr>\n<tr>\n<td>艾耶、卡納普將非知意義籠統稱為情感意義，作者認同</td>\n<td><strong>F</strong></td>\n<td>作者認為<strong>過於粗略</strong></td>\n</tr>\n<tr>\n<td>冇任何語句能夠既有實質內容又有必然性</td>\n<td><strong>T</strong></td>\n<td>總結第一點</td>\n</tr>\n<tr>\n<td>析合區分使我們認清教條主義嘅盲目態度</td>\n<td><strong>T</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>「無自無」係海德格語，全無意義</td>\n<td><strong>T</strong></td>\n<td>圖五 F</td>\n</tr>\n</tbody></table>\n"},"tocs":{"m21":[{"id":"m21-h2","lvl":2,"text":"0. 一句總結（先記呢句）"},{"id":"m21-h3","lvl":2,"text":"1. 引言：點解要語理分析？"},{"id":"m21-h4","lvl":2,"text":"2. 一、當代西方哲學概況 —— 英美哲學 v supposition)：此問題預設了更基本的問題「你會跟我結婚嗎？」","歧義：「婚禮」有兩個意思","含混：「西式」「中式」沒有明確界線","著色：「婚禮」帶有情感色彩"],"ans":0,"exp":"前一種問題預設着後一種問題 → 解釋為何近代哲學轉向知識論。","tags":[],"src":"mc"},{"id":"m21-mc-7-m2cgx","type":"mc","topic":"m21","q":"柏烈得萊 (Bradley)：「絕對進入演進和進步裏，而它自己卻不能演進和進步。」按語理分析，這句話：","opts":["缺乏認知意義，連假語句的資格都沒有","是一個假語句","是真但多餘的語句","是一個分析地真的語句"],"ans":0,"exp":"屬「無中生有派」：驟眼似有認知意義，分析後原來沒有。","tags":[],"src":"mc"},{"id":"m21-mc-8-edzkl","type":"mc","topic":"m21","q":"「黑格爾之謎」（X 是物質在它的無形性及其液化性之中的自我復元……）中的 X 是：","opts":["熱","光","電","時間"],"ans":0,"exp":"引自白連沙德 (Blanshard)，他懷疑這段是無意義的字面堆砌；白連沙德本身不算分析哲學家。","tags":[],"src":"mc"},{"id":"m21-mc-9-1qeuy","type":"mc","topic":"m21","q":"對於黑格爾之謎那段話，李天命認為恰當的處理是：","opts":["先檢查它是否有認知意義，因為贊同或反對都假定了它是確定的斷述","應該反對，因為它是假的","應該贊同，因為黑格爾是大哲學家","應該存而不論，因為它屬於宗教"],"ans":0,"exp":"贊同或反對都有問題。","tags":[],"src":"mc"},{"id":"m21-mc-10-1lf0w","type":"mc","topic":"m21","q":"「在平常意義下你的批評正確，但在某個更深的意義之下我的說法才正確。」這屬於哪一類文字把戲？","opts":["跳高一層派（某個意義派／觀點角度派）","無中生有派","另一種X派","空洞派"],"ans":0,"exp":"以「層次」「意義」「觀點」「角度」作擋箭牌；破解：以子之矛，攻子之盾。","tags":[],"src":"mc"},{"id":"m21-mc-11-1phxt","type":"mc","topic":"m21","q":"「通常說的自由民主是假自由假民主，我們所說的才是真自由真民主。」屬於：","opts":["另一種X派","跳高一層派","無中生有派","空洞派"],"ans":0,"exp":"「指鹿為馬」的翻版，用在「自由」「民主」等抽象名詞上，較易逃過覺察。","tags":[],"src":"mc"},{"id":"m21-mc-12-1bq06","type":"mc","topic":"m21","q":"根據李天命，a 可說是「另一種 b」的必要條件是：","opts":["a 與 b 的類屬性徵 (generic characteristics) 大致相同","a 與 b 的名稱相同","a 比 b 更真實","a 與 b 被同一群人使用"],"ans":0,"exp":"斑馬是另一種馬、化石是另一種石；但鹿不是另一種馬、石頭不是另一種蛋糕。","tags":[],"src":"mc"},{"id":"m21-mc-13-4ml70","type":"mc","topic":"m21","q":"江湖神棍說：「其實你已經得到上帝保佑了，不然你遭到的不幸會更多。」這種說法屬於：","opts":["空洞派（油腔滑調）","另一種X派","跳高一層派","無中生有派"],"ans":0,"exp":"任何情形下都能被解釋成正確，避開否證。","tags":[],"src":"mc"},{"id":"m21-mc-14-gaeo3","type":"mc","topic":"m21","q":"李天命指「油腔滑調」的言論最大的代價是：","opts":["不能提供任何確定的知識或具體的指引","很容易被別人否證","用語太過精密，一般人看不明","會激發強烈情緒"],"ans":0,"exp":"例：工程學教授「所取的材料要合用，所用的圖則要適宜」。","tags":[],"src":"mc"},{"id":"m21-mc-15-1gpz0","type":"mc","topic":"m21","q":"以下哪一項「不」屬於李天命所講的現代思考方法學四種方法？","opts":["語意學 (semantics)","語理分析","邏輯方法","謬誤剖析"],"ans":0,"exp":"四種：語理分析、邏輯方法、科學方法、謬誤剖析。語意學是一門學科。","tags":[],"src":"mc"},{"id":"m21-mc-16-1l4oy","type":"mc","topic":"m21","q":"為何「謬誤剖析」不是思考方法學最基本的部份？","opts":["因為它是其他三種方法（語理分析、邏輯方法、科學方法）的引申","因為它只處理日常生活問題","因為它不需要語言","因為它比科學方法更晚出現"],"ans":0,"exp":"判斷謬誤要依據語理分析、邏輯方法、科學方法。","tags":[],"src":"mc"},{"id":"m21-mc-17-cskhx","type":"mc","topic":"m21","q":"語理分析與語意學 (semantics) 的關係，李天命的結論是：","opts":["語理分析是語意學的基礎方法，語意學可作為語理分析的輔助工具","語理分析就是語意學","語意學是語理分析的基礎方法","兩者毫無關係"],"ans":0,"exp":"語意學是「學科」；語理分析是探究問題的「方法」或「進路」。","tags":[],"src":"mc"},{"id":"m21-mc-18-19ouq","type":"mc","topic":"m21","q":"「宇宙是否在膨脹？」按李天命：","opts":["屬經驗問題，主要憑藉科學方法，語理分析只是最起碼的工夫","屬概念問題，分析清楚概念就等於解決","屬偽贗問題，應被解消","屬評價問題，要靠個人價值觀"],"ans":0,"exp":"對比：「甚麼是真、善、美？」是概念問題。","tags":[],"src":"mc"},{"id":"m21-mc-19-1cfzv","type":"mc","topic":"m21","q":"語理分析在思考方法學中的定位是：","opts":["起點，但不是終點","終點，但不是起點","既是起點亦必然是終點","可有可無的輔助"],"ans":0,"exp":"知識系統的建構更有賴其他方法（特別是科學方法）。","tags":[],"src":"mc"},{"id":"m21-mc-20-1gfv8","type":"mc","topic":"m21","q":"以下哪位是「日常語言學派」的代表？","opts":["奧斯丁 (Austin)","卡納普 (Carnap)","塔斯基 (Tarski)","函寶 (Hempel)"],"ans":0,"exp":"日常語言學派：後期維根斯坦、韋斯登、懷士曼、萊爾、奧斯丁、史特勞遜。","tags":[],"src":"mc"},{"id":"m21-mc-21-au2gv","type":"mc","topic":"m21","q":"以下哪位「不」是邏輯實徵論 (Logical Positivism) 的代表人物？","opts":["萊爾 (Ryle)","卡納普 (Carnap)","施里克 (Schlick)","艾耶 (Ayer)"],"ans":0,"exp":"萊爾屬日常語言學派。邏輯實徵論：卡納普、施里克、艾耶、函寶、萊興巴赫。","tags":[],"src":"mc"},{"id":"m21-mc-22-gqooe","type":"mc","topic":"m21","q":"邏輯實徵論由「維也納學圈」衍發，以甚麼著稱？","opts":["反對玄學、強調科學","強調直覺、描述本質結構","強調人的自主性與獨特性","以日常用法解消哲學問題"],"ans":0,"exp":"後來又稱「邏輯經驗論 (Logical Empiricism)」。","tags":[],"src":"mc"},{"id":"m21-mc-23-195a9","type":"mc","topic":"m21","q":"分析哲學最主要的特點是：","opts":["它處理問題時所用的方法——語理分析","它只研究英語","它反對一切科學","它重視人的情感與存在"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m21-mc-24-yb2q5","type":"mc","topic":"m21","q":"用柏斯摩爾 (Passmore) 的話，分析家指責歐陸哲學家：","opts":["糟蹋人的思想（「沒有腦」）","糟蹋人的靈魂（「沒有心」）","瑣碎冷硬而忽略人的情感","把人變成機器"],"ans":0,"exp":"歐陸哲學家則指責分析哲學「糟蹋人的靈魂」（沒有心）。","tags":[],"src":"mc"},{"id":"m21-mc-25-1029z","type":"mc","topic":"m21","q":"對於沒有意義的偽贗問題 (pseudo-problem)，語理分析的工作是：","opts":["解消 (dissolve) 它","解答它","用科學實驗檢驗它","用投票決定答案"],"ans":0,"exp":"有意義的問題才進一步作精細審定。","tags":[],"src":"mc"},{"id":"m21-mc-26-tmruq","type":"mc","topic":"m21","q":"分析「人是否命定？」時，語理分析應首先分析哪個關鍵用語？","opts":["命定","人","是","否"],"ans":0,"exp":"語理分析只分析論題中的關鍵用語，並不是「執着文字」。","tags":[],"src":"mc"},{"id":"m21-mc-27-u0gfm","type":"mc","topic":"m21","q":"馬色爾 (Marcel) 說「假如有一架鋼琴在這裏的話，我倒可以把我的意思彈奏出來」。作者設想的分析家反駁重點是：","opts":["哲學是思考的學問，不可或缺的工具是語言；音樂的工具才是樂器","鋼琴比語言更精確","哲學家應該學習音樂","歐陸哲學比分析哲學境界更高"],"ans":0,"exp":"哲學家不善用自己的工具，反而想用樂器思考 → 注定失敗。","tags":[],"src":"mc"},{"id":"m21-mc-28-1e6yv","type":"mc","topic":"m21","q":"有人說「釐清是不足夠的！語理分析是有其一定限度的！」作者的回應要旨是：","opts":["任何東西都可以說是「不足夠」，這句話本身也不足夠；有毛病的是對方對語理分析的看法","語理分析確實沒有任何價值","語理分析可以解決一切問題","應改用語意學"],"ans":0,"exp":"數學不能醫人、醫學不能烹飪……","tags":[],"src":"mc"},{"id":"m21-mc-29-swh0u","type":"mc","topic":"m21","q":"李天命所講的思考方法學，主要考慮的是：","opts":["各種思考的審查與核證 (justification) 問題","發現的過程 (discovery)","管理的方法","教育的方法"],"ans":0,"exp":"發現過程很多時沒有定則可循；狹義的方法學＝科學方法學。","tags":[],"src":"mc"},{"id":"m21-mc-30-1thnr","type":"mc","topic":"m21","q":"以下哪一項「不」是陷於「封閉系統」的人的特徵？","opts":["樂於接受別人對其信仰的懷疑","到處發現「證實」其信仰的例子","充滿「作見証」的衝動甚至狂熱","不能忍受任何懷疑"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m21-mc-31-8b125","type":"mc","topic":"m21","q":"「信就得神恩，不信就遭神罰」被批評的問題是：","opts":["「神恩」與「神罰」之間的使用界線模糊不清、遊移不定","它是一個矛盾句","它使用了實化","它是規創定義"],"ans":0,"exp":"封閉系統例子：屋燒了——敵人就話是懲罰，朋友就話是恩典。","tags":[],"src":"mc"},{"id":"m21-mc-32-rosfy","type":"mc","topic":"m21","q":"「孔子的體重超過五百磅……倘若孔子揹着南子，南子揹着子路……」這個例子用來諷刺：","opts":["跳高一層派（某個意義派）","另一種X派","空洞派","無中生有派"],"ans":0,"exp":"「在某個更高的意義之下我說的就很對」。","tags":[],"src":"mc"},{"id":"m21-mc-33-zu49f","type":"mc","topic":"m21","q":"「成功的秘訣是在最恰當的時刻做最恰當的事。」被李天命列為：","opts":["封閉系統（空洞、不着邊際）的例子","分析地假的矛盾句","另一種X派","精確化定義"],"ans":0,"exp":"打交輸了，回去唸一千次都沒用。","tags":[],"src":"mc"},{"id":"m2a-mc-1-1pw4x","type":"mc","topic":"m2a","q":"「4 + 5 = 8?」屬於哪一類 ":[],"src":"mc"},{"id":"m2a-mc-13-t95uh","type":"mc","topic":"m2a","q":"「在截止時間後交功課算準時交功課嗎？」這問題：","opts":["是概念問題，單憑語理分析即可回答","是事實問題，要查看交功課的紀錄","是評價問題，要視乎老師的價值觀","是偽贗問題"],"ans":0,"exp":"「準時」按定義即在截止時間或之前。","tags":[],"src":"mc"},{"id":"m2a-mc-14-lr00z","type":"mc","topic":"m2a","q":"以下關於語理分析的描述，哪一項「不」正確？","opts":["它是研究語言用法的學問","它不採用人工語言，將邏輯融入日常語言中思考","它首先釐清關鍵用語的意思，再分析有關講法","它分析思維的合理性"],"ans":0,"exp":"slides：「不是研究語言的用法，而是分析思維合理性。」","tags":[],"src":"mc"},{"id":"m2a-mc-15-j3gah","type":"mc","topic":"m2a","q":"「人類應該盡力保護地球生態嗎？」屬於：","opts":["評價問題","事實問題","概念問題"],"ans":0,"exp":"「應該」帶評價/規範意義。","tags":[],"src":"mc"},{"id":"m2a-mc-17-343rc","type":"mc","topic":"m2a","q":"「什麼是全球暖化 (Global Warming)？」屬於：","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m2a-mc-18-s4tei","type":"mc","topic":"m2a","q":"講者 slides「西方哲學中的理性傳統」所示的課程方法次序是：","opts":["語理分析 → 邏輯/科學 → 檢查謬誤","檢查謬誤 → 邏輯/科學 → 語理分析","邏輯 → 語理分析 → 科學","科學 → 邏輯 → 語理分析"],"ans":0,"exp":"M2–M3 語理分析；M4–M5 邏輯/科學；M6 謬誤。","tags":[],"src":"mc"},{"id":"m2a-mc-19-1ysj3","type":"mc","topic":"m2a","q":"「你認為腐蝕性液體能對人體造成超過十成皮膚燒傷嗎？」最恰當的分析是：","opts":["概念問題：「十成」即 100%，「超過十成」概念上不可能","事實問題：需要做化學實驗","評價問題：視乎個人對傷勢的看法","偽贗問題：應被解消"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m2a-mc-20-1amnp","type":"mc","topic":"m2a","q":"「If y = x², then dy/dx is?」屬於：","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"數學問題只需分析概念。","tags":[],"src":"mc"},{"id":"m2a-mc-21-1di7h","type":"mc","topic":"m2a","q":"以下哪一句出自蘇格拉底 (Socrates)？","opts":["“The only good is knowledge and the only evil is ignorance.”","「道之以政，齊之以刑，民免而無恥」","「六合之外，聖人存而不論」","「故知止其所不知，至矣」"],"ans":0,"exp":"其餘：孔子《論語．為政》、莊子《齊物論》（兩句都出自莊子）。","tags":[],"src":"mc"},{"id":"m2a-mc-22-1ide0","type":"mc","topic":"m2a","q":"「同性戀是不道德的嗎？」屬於：","opts":["評價問題","事實問題","概念問題"],"ans":0,"exp":"「不道德」是評價概念。","tags":[],"src":"mc"},{"id":"m2a-mc-23-up915","type":"mc","topic":"m2a","q":"「中國是世界第二大經濟體嗎？」屬於：","opts":["事實問題","概念問題","評價問題"],"ans":0,"exp":"要看實際數據（經驗方法）。","tags":[],"src":"mc"},{"id":"m22-mc-1-1ei48","type":"mc","topic":"m22","q":"「講老實話是最有利的做法。」（脈絡不清時）屬於哪種語言陷阱？","opts":["闕義","歧義","含混","實化"],"ans":0,"exp":"與甚麼比較最有利？對誰最有利？","tags":[],"src":"mc"},{"id":"m22-mc-2-1ti7c","type":"mc","topic":"m22","q":"「怎樣的制度是最妥善的政治制度？」被李天命用作哪種語言陷阱的例子？","opts":["闕義（語意欠整的問句）","歧義","著色","僻義"],"ans":0,"exp":"從誰的觀點講「最妥善」？統治者、被治者、知識份子、商人、工人……","tags":[],"src":"mc"},{"id":"m22-mc-3-1agtx","type":"mc","topic":"m22","q":"「生命是有價值的」作為闕義的例子，以下哪一項「不是」它欠缺的資訊？","opts":["「生命」一詞的情感色彩","是一切生命還是某些生命","是否在任何情況下","對誰來說有價值"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m22-mc-4-1bltp","type":"mc","topic":"m22","q":"李天命用「闕義」而不用「缺義」，原因是：","opts":["避免人望文生義，以為「缺義」即「沒有意義」","「闕」字比較古雅","「缺」字已被語言學家使用","兩者意思完全不同"],"ans":0,"exp":"闕義 ≠ 沒有意義。","tags":[],"src":"mc"},{"id":"m22-mc-5-1mt1j","type":"mc","topic":"m22","q":"闕義的句子在甚麼情況下對思考無害？","opts":["所在脈絡足以提示所欠缺的意義","句子很短","說話者是權威","聽者同意該句子"],"ans":0,"exp":"此時反而令用語簡潔。","tags":[],"src":"mc"},{"id":"m22-mc-6-16fos","type":"mc","topic":"m22","q":"小孩問媽媽與男孩問女孩兩段對話都出現「做夢」，用來說明：","opts":["歧義","含混","闕義","實化"],"ans":0,"exp":"「做夢」：睡着時的心理經驗 vs 醒着時不切實際的空想。","tags":[],"src":"mc"},{"id":"m22-mc-7-j1el0","type":"mc","topic":"m22","q":"「士可殺不可辱」被開玩笑解作「士可殺？不，可辱！」屬於：","opts":["語法歧義 (syntactic ambiguity)","含混","著色","僻義"],"ans":0,"exp":"由語法結構造成，語言學家參姆斯基 (Chomsky) 特別注意。","tags":[],"src":"mc"},{"id":"m22-mc-8-tckzl","type":"mc","topic":"m22","q":"劍擊會「本會向來是最歡迎『新血』的」嚇走申請人，屬於：","opts":["非語法歧義（廣義的語意歧義）","語法歧義","含混","闕義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m22-mc-9-hd6fw","type":"mc","topic":"m22","q":"「戰爭沒有勝方，只有敗方……英國實在也是失敗的。」這論調的問題是：","opts":["利用「敗」的歧義玩文字遊戲","「敗」是含混語辭","把「戰爭」實化","使用了僻義「勝方」"],"ans":0,"exp":"德國「敗」＝軍事上被擊倒；英國「敗」＝各方面受到損毀。","tags":[],"src":"mc"},{"id":"m22-mc-10-1wwsj","type":"mc","topic":"m22","q":"「一般所謂自由的人，其實都不是自由的，因為他們仍被自己的性格和心理狀態所決定。」問題在於：","opts":["「自由」一詞在兩個意義之間遊移（歧義）","「自由」是含混語辭","「自由」被實化","「自由」是著色語辭"],"ans":0,"exp":"(1) 沒受外在因素制約；(2) 不被任何原因決定。","tags":[],"src":"mc"},{"id":"m22-mc-11-1snjp","type":"mc","topic":"m22","q":"根據歧義的原則，以下哪種情況「仍然」屬於混淆思想的用語方式？","opts":["脈絡原則上能表明歧義 ","topic":"m22","q":"李天命認為人文學科遠遠落後於嚴格科學，原因之一是：","opts":["人文討論混雜太多著色語辭，以致濫用","人文學者不夠聰明","人文學科歷史太短","科學家不用語言"],"ans":0,"exp":"⚠️ 是「原因之一」，不是唯一原因。","tags":[],"src":"mc"},{"id":"m22-mc-22-11opx","type":"mc","topic":"m22","q":"「實化」(reification) 的定義是：","opts":["把非具體名項當作具體名項來使用","把具體名項當作非具體名項來使用","違離語辭的慣常用法","語法完整但語意欠整"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m22-mc-23-1ghn5","type":"mc","topic":"m22","q":"以下哪一個是「非具體名項」？","opts":["真理","孔子","那棵樹","喜瑪拉雅山上最高的山峰"],"ans":0,"exp":"非具體名項：真理、理性、國家、社會、良知、存有、愛情、積分法、波動函數。","tags":[],"src":"mc"},{"id":"m22-mc-24-e8doq","type":"mc","topic":"m22","q":"「我們應服從國家的意志。國家叫我們做甚麼，我們就該做甚麼。」李天命指出的不利後果是：","opts":["統治者可藉「國家」之名獨斷獨行","人民會變得更愛國","國家的意志會更清晰","有助冷靜客觀的討論"],"ans":0,"exp":"把「國家」實化成有意志的具體實物。","tags":[],"src":"mc"},{"id":"m22-mc-25-1q9uv","type":"mc","topic":"m22","q":"「真理是醜惡的」是誰的話？李天命認為它：","opts":["尼采；意思毫不清楚，無法轉譯","羅曼羅蘭；可轉譯為人類認識增進","哥德；可轉譯為事實真句只是蓋然地真","蒙田；可轉譯為承認真命題"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m22-mc-26-1pyac","type":"mc","topic":"m22","q":"「真理不斷前進，任何人也無法阻止」（羅曼羅蘭）可轉譯為：","opts":["人類對事物的認識愈來愈增進，沒有人能阻止這一趨勢","凡事實真句都不是必然地真的，最多僅是蓋然地真","只要發現某命題是真的，便承認它是真命題","真理與美彼此含有對方"],"ans":0,"exp":"第二項是哥德「真理如上帝」的轉譯；第三項是蒙田的轉譯。","tags":[],"src":"mc"},{"id":"m22-mc-27-uvtye","type":"mc","topic":"m22","q":"根據實化的原則，在思考或討論的場合我們須考慮：","opts":["實化的句子能否用有認知意義的語句轉譯過來","實化的句子是否優美","實化的句子是否夠簡潔","實化的句子是否用了中性語辭"],"ans":0,"exp":"文藝寫作可隨意實化，只須顧及修辭效果。","tags":[],"src":"mc"},{"id":"m22-mc-28-1xfpw","type":"mc","topic":"m22","q":"懷黑德 (Whitehead)：「我們在世界之內，而世界也在我們之內。」問題在於：","opts":["僻義：「在……之內」違離慣常用法，結果真但多餘","歧義的文字遊戲","含混的空話","闕義"],"ans":0,"exp":"「X在我們之內」只等於「X是我們經驗的對象」。","tags":[],"src":"mc"},{"id":"m22-mc-29-1kyvi","type":"mc","topic":"m22","q":"「一切東西（包括我們稱為實在的東西）都是虛幻的。」按李天命：","opts":["真，但只是一句真得多餘的廢話","假，因為我們能摸到實物","沒有意義，連假都不如","是分析地假的矛盾句"],"ans":0,"exp":"暗中改變慣常用法，取消了「實在」與「虛幻」的界線（圖三）。","tags":[],"src":"mc"},{"id":"m22-mc-30-xooj5","type":"mc","topic":"m22","q":"「一在一切中，一切在一中」是哪一宗派的最高原理？","opts":["華嚴宗","禪宗","天台宗","淨土宗"],"ans":0,"exp":"與懷黑德名句異曲同工（僻義）。","tags":[ -10-2324w","type":"mc","topic":"m23","q":"F says a tree falling in the wilderness with no one to hear it makes no sound; G insists it does. Copi classifies this as:","opts":["a merely verbal dispute","an obviously genuine dispute","an apparently verbal but really genuine dispute","a disagreement in attitude"],"ans":0,"exp":"&quot;sound&quot; = human auditory sensation vs vibrations in the air.","tags":[],"src":"mc"},{"id":"m23-mc-11-w4plf","type":"mc","topic":"m23","q":"A roots for the Yankees and B for the Red Sox. Their dispute is:","opts":["obviously genuine, mainly a disagreement in attitude","merely verbal","apparently verbal but really genuine","purely about facts"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-12-1l5do","type":"mc","topic":"m23","q":"C believes Miami is south of Honolulu and D denies it. Copi says:","opts":["it is a genuine dispute about facts that a good map can settle","it is merely verbal","it is a disagreement in attitude","it can never be resolved"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-13-1m7ac","type":"mc","topic":"m23","q":"J says a sexually explicit film is &quot;pornography&quot;; K says its beauty makes it art. According to Copi this dispute is:","opts":["apparently verbal but really genuine","merely verbal","obviously genuine about geographic facts","not a dispute at all"],"ans":0,"exp":"After the ambiguity of &quot;pornography&quot; is exposed, they will likely still disagree in their judgment of the film.","tags":[],"src":"mc"},{"id":"m23-mc-14-1maal","type":"mc","topic":"m23","q":"When confronting a dispute, Copi says we must FIRST ask:","opts":["whether there is some ambiguity that can be eliminated by clarifying the alternative meanings in play","who has more supporters","whether the dispute is about money","what the speaker feels"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-15-1k8j0","type":"mc","topic":"m23","q":"If clearing up the linguistic issue resolves the matter, the dispute was:","opts":["merely verbal","genuine","emotive","factual"],"ans":0,"exp":"If it does not, the dispute was genuine, although it may have appeared merely verbal.","tags":[],"src":"mc"},{"id":"m23-mc-16-8bv9c","type":"mc","topic":"m23","q":"&quot;Winning isn&#39;t everything. It&#39;s the only thing.&quot; was said by:","opts":["Vince Lombardi, a football coach","Grantland Rice, a sports journalist","Benjamin Disraeli","Thomas Jefferson"],"ans":0,"exp":"Rice: &quot;He marks—not that you won or lost— But how you played the game.&quot;","tags":[],"src":"mc"},{"id":"m23-mc-17-1yclc","type":"mc","topic":"m23","q":"The &quot;seven dirty words&quot; may not be used on US broadcast media because:","opts":["they have unacceptable emotive meanings sharply distinguishable from their literal meanings","they are ambiguous","they are too vague","they have no literal meaning"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-18-lnmp8","type":"mc","topic":"m23","q":"&quot;A rose by any other name would smell as sweet&quot; — yet being told a flower is commonly called &quot;skunkweed&quot; would likely:","opts":["influence our response to the flower","change the smell of the flower","make the word ambiguous","turn the matter into a merely verbal dispute"],"ans":0,"exp":"Words can affect attitudes.","tags":[],"src":"mc"},{"id":"m23-mc-19-s2hng","type":"mc","topic":"m23","q":"In logic, according to Copi, we generally strive for language that is:","opts":["as free as possible of the distortion that emotive meanings introduce","as emotionally powerful as possible","full of euphemisms","ambiguous enough to be flexible"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m23-mc-20-1te5q","type":"mc","topic":"m23","q":"Which statement best matches Copi&#39;s conclusion about disputes?","opts":["Recognizing the real nature of a dispute does not by itself produce agreement, but without it resolution is unlikely","Recognizing the nature of a dispute is sufficient for agreement","All disputes are merely v 日常語言學派","特構語言學派","實用主義"],"ans":0,"exp":"","tags":[],"src":"mc"},{"id":"m2a-mcL20260914-1-18q6o","type":"mc","topic":"m2a","q":"根據講者在課堂上的分析，以下哪一條屬於<strong>事實問題</strong>？","opts":["甚麼是由治及興？","李家超（特首）會如何定義「由治及興」？","甚麼是國家的根本？","若 y = x²，dy/dx 是甚麼？"],"ans":1,"exp":"講者指「甚麼是由治及興？」是概念問題；但「李特首會怎樣 define 由治及興」要查他實際怎樣說，「不是概念問題，事實」。「甚麼是國家的根本」與 dy/dx 皆為概念問題。（課堂 2026-09-14 [69:12]–[70:37]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tfL20260914-1-o5tzb","type":"tf","topic":"m2a","q":"「主席說國家的根本是甚麼？」與「甚麼是國家的根本？」屬於同一類問題。","ans":1,"exp":"講者強調兩者「是兩類問題」：「甚麼是國家的根本」只須分析概念（概念問題）；問某人說過甚麼，則與「李特首會如何定義由治及興」一樣，要靠經驗方法查證（事實問題）。（課堂 2026-09-14 [70:00]–[70:37]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tfL20260914-2-lak9p","type":"tf","topic":"m2a","q":"「4 + 5 = 8？」這個問題本身是錯的，因此它不屬於概念問題。","ans":1,"exp":"講者：「4 + 5 = 8」（句號，陳述）是錯的；但「4 + 5 = 8？」（問號）這個問題本身不是錯，只是答案錯。答案對（5 + 5 = 10？）或錯（4 + 5 = 8？）都是概念問題；考試要看清楚是句號還是問號。（課堂 2026-09-14 [62:02]–[63:13]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mcL20260914-2-zyzy7","type":"mc","topic":"m2a","q":"講者教五歲兒子「5 + 5 = 10」時可以數手指。這個例子說明了概念問題的甚麼特性？","opts":["概念問題原則上必須通過經驗方法（如數手指）才能回答，否則答案沒有根據","數手指證明了「5 + 5 = 10？」其實是事實問題，因為答案要靠觀察得出","經驗方法（如數手指）可用來展示，但並非必要；明白「5」「加」「等於」「10」等符號就能回答","只要有人曾用經驗方法回答，概念問題就會變成事實問題，兩者界線取決於答法"],"ans":2,"exp":"講者：可以用經驗方法（數手指、Lego）展示，但「數手指學習過程，非必要」——這正是概念問題與事實問題（原則上必須用經驗方法）的分別。（課堂 2026-09-14 [65:39]–[66:45]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tfL20260914-3-193d4","type":"tf","topic":"m2a","q":"講者指出，「若 y = x²，dy/dx 是甚麼？」不用畫 slope 或計算方格面積也能回答，屬純粹的概念分析。","ans":0,"exp":"講者：不用畫 slope、間格仔再展示給你看，這是純粹的概念分析 → 概念問題。（課堂 2026-09-14 [63:57]–[65:11]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mcL20260914-3-1anf2","type":"mc","topic":"m2a","q":"有議員聲稱某些人「皮膚燒傷超過十成」。講者用這個例子主要想說明甚麼？","opts":["必須做醫學實驗量度燒傷面積，以經驗證據判斷是否屬實，所以是事實問題","燒傷程度涉及傷者的主觀痛楚感受，所以最終是評價問題","這類醫學問題要交給專家判斷，語理分析在此幫不上忙，只能存而不論","釐清關鍵字眼（「超過十成」）後，就發覺不需要任何證據支持——概念上已不可能"],"ans":3,"exp":"講者：大部分時候釐清後會知道下一步要找甚麼證據；但有些情況釐清後發覺根本不需要證據——超過十成皮膚燒傷不可能發生，申請基金做研究也不可能成功（FYP 第一句聲明就錯）。（課堂 2026-09-14 [47:50]–[49:41]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tfL20260914-4-phxnk","type":"tf","topic":"m2a","q":"根據講者，學生因病（有病假紙）獲延期後才交功課，這份功課就算是「準時交」。","ans":1,"exp":"講者：過了 deadline 就是遲交，「這個事實是不用任何經驗證據的」；有病假紙獲 extend，仍然是遲交，只是 penalty 被 waive 了——「定義釐清得很清楚」。（課堂 2026-09-14 [56:50]–[57:20]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mcL20260914-4-ib5i3","type":"mc","topic":"m2a","q":"就「日本是第二次世界大戰的戰勝國嗎？」，甲以「戰後 20 年 GDP」定義戰勝，乙以「國際和約的簽署雙方」定義戰勝。根據講者，以下哪項正確？","opts":["兩人對「戰勝」的定義不同，但這仍然是一個事實問題","因為兩人定義不同，問題變成了評價問題，各自表述即可","只有乙的定義下才是事實問題，甲的定義下屬概念問題","兩人的結論互相矛盾，所以必定有一方對「戰勝」的理解是錯的"],"ans":0,"exp":"講者：「我和你在溝通的時候，可以對於贏和輸不同，但不影響它是一個事實問題」——在各自定義下都是看實際資料（GDP、和約）。（課堂 2026-09-14 [73:40]–[74:51]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tfL20260914-5-ocqeh","type":"tf","topic":"m2a","q":"講者指出：事實問題如果沒有特別標明時間，理論上就是在談「現在」；考試中沒有標明年份的題目，就是指考試當日（2026 年 10 月 23 日）的情況。","ans":0,"exp":"講者：考試不會每條都標年份，標出來全部都是重複的「2026 年 10 月 23 日」；不特別標，就是在談現在——你答卷那一刻。（課堂 2026-09-14 [77:06]–[77:39]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mcL20260914-5-8e0ad","type":"mc","topic":"m2a","q":"講者以「中國是否世界第二大經濟體？」為例，主要想帶出事實問題的哪一個特性？","opts":["普遍性：無論哪一年問，答案都應該一樣","時間性：答案會因年份不同而改變，要講明是甚麼時間的數據","主觀性：經濟體大小最終要靠個人價值觀判斷","必然性：只要定義清楚「中國」，答案就必然確定，毋須數據"],"ans":1,"exp":"講者：無論怎樣定義「中國」和經濟體大小，最後都是看實際數據，而數據有時間性；「時間性也是與事實問題有一個很相關的特性」。（課堂 2026-09-14 [74:51]–[78:09]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m21-tfL20260914-1-bkka8","type":"tf","topic":"m21","q":"講者強調，語理分析與人文學部語言學同事的研究一樣，都是以分析語言本身為目的。","ans":1,"exp":"講者：「我們不是分析語言本身，我們是分析思維」——會牽涉語言，但主要講人類思維。（課堂 2026-09-14 [38:55]–[39:24]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m21-mcL20260914-1-zqy7b","type":"mc","topic":"m21","q":"根據講者，李天命的語理分析與（已高度數理化的）西方分析哲學相比，最主要的特點是：","opts":["全面採用符號邏輯，以人工語言取代含糊的日常語言","以研究廣東話、普通話等日常語言的文法和用法為目的","強調不採用任何人工語言（如 not、imply、equivalence 等符號），將邏輯融入日常語言","只適用於大學學術研究，不適合在日常生活中與人傾談"],"ans":2,"exp":"講者：李天命把西方分析哲學改造成與普通人聊天也用得上的思維方法（他當時教的對象很多不是大學生），強調不採用任何人工語言，將邏輯融入日常語言。（課堂 2026-09-14 [37:55]–[38:55]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m21-tfL20260914-2-1upvd","type":"tf","topic":"m21","q":"講者指出，討論時要釐清到多嚴謹、證據要多少，並沒有固定答案，要視乎當下討論的 context 與目的（例如閒聊與學術研究不同）。","ans":0,"exp":"講者回應同學提問時說「我不知道答案」——釐清到多嚴謹、證據多少，要看你在談的 context：閒聊的目的不是釐清真理；學術研究則總有 reviewer／supervisor 說不夠。（課堂 2026-09-14 [41:23]–[47:16]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mcL20260914-6-16wz0","type":"mc","topic":"m2a","q":"根據講者，為甚麼思考時第一步要先想清楚對方在問甚麼（即進行問題分類）？","opts":["因為所有問題最終都要靠經驗方法回答，先分類才知道去哪裏找證據","因為評價問題比概念問題更高級，要先把它們排除","因為這樣可以確保每個問題最後都有一個標準答案","因為想清楚後，可能發覺有些問題根本不用浪費時間去找證據"],"ans":3,"exp":"講者：分析哲學家「聰明又懶」——第一部分是想對方在問甚麼，因為想完之後發覺有些問題不用浪費時間找證據；所以李天命把問題分成三類。（課堂 2026-09-14 [57:54]–[59:31]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-mcL20260914-7-1n7zb","type":"mc","topic":"m2a","q":"講者問「甚麼是反對黨？」時強調，這個問題問的是：","opts":["「反對黨」這個概念的意思（概念問題）","某國家現時哪個政黨是反對黨（事實問題）","反對黨的存在對社會是好是壞（評價問題）","香港現時有沒有反對黨（事實問題）"],"ans":0,"exp":"講者：「我不是在問你誰是反對黨，我在問你什麼叫做反對黨」——屬概念問題（釐清後亦發覺通常的定義不太準確）。（課堂 2026-09-14 [66:45]–[68:33]）","tags":["lecture"],"src":"lecture 2026-09-14"},{"id":"m2a-tfL20260918-1-1ekp6","type":"tf","topic":"m2a","q":"講者指出，問題三分類（概念／事實／評價問題）是李天命的創建，其所代表的傳統西方分析哲學並沒有這個三分類。","ans":0,"exp":"講者：問題分類可以說是李天命先生的創建，他所代表的傳統西方分析哲學沒有講問題的三分類。（課堂 2026-09-18 [01:04]–[01:29]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-1-wmjmk","type":"mc","topic":"m2a","q":"根據講者，運用李天命的問題分類時，思考應按甚麼次序進行？","opts":["先判斷是否評價問題 → 再看事實 → 最後才看概念","先問是否概念問題 → 概念答不到，再想是否事實問題 → 事實也答不到，才是評價問題","先判斷是否事實問題 → 再看概念 → 最後才看評價","三類沒有先後之分，見到評價字眼就直接判為評價問題"],"ans":1,"exp":"講者：三類在思考過程中應有先後——不要見到問題就直接說是評價；首先問是否概念，概念答不到就想事實，事實答不到才是評價。（課堂 2026-09-18 [12:06]–[12:34]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tfL20260918-2-5z3nm","type":"tf","topic":"m2a","q":"「明年香港會出現財政赤字嗎？」由於現在無法回答，所以不屬於事實問題。","ans":1,"exp":"講者：原則上未來發生的事都要等經驗、事實出來後才能判斷，所以批判思考教你這是事實問題——只是 at this point we can&#39;t answer it（要等到 2027 年）。（課堂 2026-09-18 [16:08]–[17:35]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-2-9t0gw","type":"mc","topic":"m2a","q":"有人說：「支持度現在這麼低，明年一定上升」、「恒指跌到這麼低，一定會反彈」。講者稱這種思維為：","opts":["將概念問題事實化","將評價問題概念化","將事實問題概念化","將概念問題評價化"],"ans":2,"exp":"講者：這些叫做「將事實問題概念化」——把要等經驗證據的事實問題，當成像 5 + 5 = 10 般一定的概念問題；批判思考教你千萬不要這樣。（課堂 2026-09-18 [24:40]–[25:16]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tfL20260918-3-vagpo","type":"tf","topic":"m2a","q":"根據講者，對於未來的事實問題（如明年經濟），以「我認為／我預測」的方式表達個人判斷，屬「評價問題式的答法」，是李天命可以接受的。","ans":0,"exp":"講者：如果你覺得今天答得到，那是你個人的評價（你有一堆數據、預測明年會怎樣）；「這個叫評價問題式的答法，李天命接受得到」——但不能說成「一定」。（課堂 2026-09-18 [18:10]–[18:46]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-3-p6d9j","type":"mc","topic":"m2a","q":"「K2-18b 上有生物嗎？」根據講者，以下哪項分析正確？","opts":["宇宙這麼大，一定有其他生物，所以是概念問題","因為人類可能永遠無法到達，只能憑個人看法回答，所以是評價問題","因為現時技術做不到，所以暫時不屬於三類問題中任何一類","技術上現在無法到達，但原則上必須而且可以用經驗方法找到答案，所以是事實問題"],"ans":3,"exp":"講者：現在技術上不能透過經驗方法找到答案，但原則上必須和可以找到答案（宇宙航行能力提高便可）；在此之前，李天命框架下只能等答案。（課堂 2026-09-18 [28:01]–[29:25]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tfL20260918-4-1hc1m","type":"tf","topic":"m2a","q":"講者認為，「地球有生物，所以宇宙某處也有生物」這個推論有一定合理性，因此可以把「宇宙中一定有其他生物」當作概念上必然為真。","ans":1,"exp":"講者：這個推論有根據、有合理性，但不是絕對的，只是一個假設；你可以說「我認為有」（變成評價），但千萬不要當作概念——就像「經濟這麼差，一定反彈」一樣太有自信。（課堂 2026-09-18 [29:57]–[32:18]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-4-ss1bw","type":"mc","topic":"m2a","q":"「獵人開槍打死樹上三隻小鳥中的一隻，樹上還剩多少隻？」講者用這條 IQ 題主要想說明甚麼？","opts":["這條題目只有一個標準答案：3 − 1 = 2","語理分析第一步最重要的是確認討論雙方是否在同一個平台、討論同一個問題（概念上答 2，事實上答 0）","答「0」的人沒有掌握基本數學，屬概念錯誤","IQ 題屬評價問題，任何答案都沒有對錯可言"],"ans":1,"exp":"講者：當概念（數學）問題答是 3 − 1 = 2；當事實問題答是 0（其餘兩隻會飛走）；重點是先釐清討論雙方是否在同一平台談同一問題。（課堂 2026-09-18 [35:54]–[40:32]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tfL20260918-5-1wgem","type":"tf","topic":"m2a","q":"根據講者，要確定「你的生父年齡比你大」，必須查看身份證等證據，所以這是事實問題。","ans":1,"exp":"講者：你認得他是你親生父母，就已承認他年紀比你大——可以拿身份證出來，但「可以而已，不是必須」；概念先於事實。（課堂 2026-09-18 [08:17]–[10:04]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m32-mcL20260918-1-1wa53","type":"mc","topic":"m32","q":"講者在討論李天命對科學的要求時預告 Module 3 會再談的觀念：科學的核心在於甚麼？","opts":["可以被背誦和引用的教科書答案","由權威（如教授或諾貝爾獎得主）確認","可否證（falsifiability）——即使證明了很多次是對的，也要容許有一天被其他經驗證據證明為錯","必然為真、在任何情況下都不能被推翻"],"ans":2,"exp":"講者：李天命跟隨實驗精神——無論證明多少次是對的，都要容許它有一日被另外的經驗證據支持是錯；「科學的核心在於可否證」，Module 3 會再講。（課堂 2026-09-18 [53:36]–[54:06]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-5-7o3ib","type":"mc","topic":"m2a","q":"「我家養的貓是否用四隻腳走路？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":1,"exp":"講者：平時講貓貓狗狗是講肉眼見到的實體，你家的貓真實存在——在經驗世界找答案，是事實問題；「貓」一字並非 by default 等於健全。（課堂 2026-09-18 [64:21]–[69:59]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-6-1r9gv","type":"mc","topic":"m2a","q":"「一年有多少秒？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"講者：一年有多少秒數學上計得到（看是否閏年，365 × 24 再拆分到秒），肯定是概念問題。（課堂 2026-09-18 [60:46]–[61:18]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-7-1syny","type":"mc","topic":"m2a","q":"就「香港政府明年的支持度會上升嗎？」，講者認為要有效討論，第一步應怎樣處理？","opts":["先釐清：以某個民意調查量化的分數為準，分數高了就當支持度高了，再等數據判斷","「支持度」無法量化，所以這題只能是評價問題，各自表述即可","現在支持度已經這麼低，概念上明年一定會反彈，毋須等數據","支持度涉及人心，原則上無法以任何方法釐清，不應討論"],"ans":0,"exp":"講者：如果當支持度是事實問題，就要以某民調量化的分數為平台（例如今年 50、明年 75 → 當支持度高了）；「數字高了是否等於支持度高了」是衍生的第二個問題。（課堂 2026-09-18 [24:06]–[24:40]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-8-eofnw","type":"mc","topic":"m2a","q":"根據講者，回答「香港科技大學美嗎？」這類評價問題的過程是：","opts":["只需要個人價值觀，毋須釐清概念或找事實","找齊相片、平面圖等經驗事實後，就能客觀地回答，屬事實問題","只要釐清「美」的定義就能回答，所以屬概念問題","先釐清概念（如指哪個 campus、建築還是環境），再找相關經驗事實（相片、平面圖），最後仍要加上個人價值觀"],"ans":3,"exp":"講者：評價問題包含「美」「好」等評價概念；先釐清概念（Google Map 座標、包不包 Business School、建築風格或周圍環境）、找相關經驗事實（拍照、平面圖），之後仍答不到，要用個人價值觀。（課堂 2026-09-18 [69:59]–[74:05]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-mcL20260918-9-1fpdl","type":"mc","topic":"m2a","q":"講者比較「5 + 5 = 10？」與「甚麼是真善美／國家／由治及興？」時，以下哪項最符合他的說法？","opts":["兩者都是概念問題；數學、邏輯的答案有普遍性，而真善美、國家等抽象概念則有討論空間，是較難答的概念問題","只有數學問題是概念問題；真善美、國家等因有爭議，屬評價問題","真善美、國家等沒有標準答案，要靠觀察社會才知道，所以屬事實問題","數學符號是人創造的，所以數學答案和真善美一樣沒有普遍性"],"ans":0,"exp":"講者：數學、邏輯的答案有普遍性（正確就正確、錯就錯）；真善美、反對黨、國家、由治及興等抽象概念有討論空間——在李天命系統中算是難回答的概念問題。（課堂 2026-09-18 [04:24]–[07:19]）","tags":["lecture"],"src":"lecture 2026-09-18"},{"id":"m2a-tfL20260921-1-170kt","type":"tf","topic":"m2a","q":"在李天命的問題分類架構中，一個問題可以同時屬於概念、事實和評價問題（All of the above）。","ans":1,"exp":"講者：問題一層一層下——是概念問題就停在概念問題；事實根據答得到就不會是評價；只會是三類其中一個，也沒有 None of the above。考試分類題只會有 A 概念／B 事實／C 評價三個選項。（課堂 2026-09-21 [03:30]–[05:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mcL20260921-1-wm098","type":"mc","topic":"m2a","q":"根據講者，若你無法判斷一個問題屬於概念、事實還是評價問題，應該怎樣做？","opts":["一律當作評價問題","選「None of the above」","回到第一步，釐清問題中牽涉的關鍵字眼；釐清後它必屬三類之一","一律當作事實問題"],"ans":2,"exp":"講者：如果解釋不到一個問題是概念、事實還是評價，其實要回到第一步，釐清問題裏面牽涉的關鍵字眼；釐清完之後就是三類問題的其中一個——「考試時也是這樣想」。（課堂 2026-09-21 [04:31]–[05:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tfL20260921-2-11xy0","type":"tf","topic":"m2a","q":"講者澄清：在本課程中，數學問題都是概念問題。","ans":0,"exp":"講者：「我澄清一次，數學問題在這課程中都是概念問題」。（課堂 2026-09-21 [05:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mcL20260921-2-1am74","type":"mc","topic":"m2a","q":"「甚麼是思考？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"講者：「什麼是思考」這個問題是概念問題——「不要錯，考試就這樣想，不要太複雜」。（課堂 2026-09-21 [34:40]–[35:29]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mcL20260921-3-c5jfi","type":"mc","topic":"m2a","q":"「你有沒有學習過思考？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":1,"exp":"講者：「你們有沒有學習過思考？事實啦」——要看你實際上有沒有學過。（課堂 2026-09-21 [35:29]–[36:10]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mcL20260921-4-14rph","type":"mc","topic":"m2a","q":"「QS 排名第 47 的大學，是否比排名第 52 的大學排名較高？」講者認為這屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":0,"exp":"講者：一經 formulate 成排名數字，就直接是概念問題——47 是一個小於 52 的自然數；至於 47 與 52 是否真有那麼大分別，就「不敢說了」。（課堂 2026-09-21 [31:35]–[32:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tfL20260921-3-19mst","type":"tf","topic":"m2a","q":"講者指出，把「政府政策是否正確」量化成 KPI（例如減少了多少膠袋消耗）並得出數據後，就等於回答了該政策是否正確。","ans":1,"exp":"講者：政策成效可以量化成事實問題（減低了多少膠袋消耗）；但量化完之後要留意——你其實不是在問它是否正確，只是問它有沒有減少膠袋消耗。（課堂 2026-09-21 [32:51]–[33:28]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mcL20260921-5-9m4yp","type":"mc","topic":"m2a","q":"講者以「2020 年夏季奧運會」為例，想提醒同學甚麼？","opts":["名稱已寫明 2020 年，所以必然在 2020 年舉行，屬概念問題","舉行時間視乎個人看法，屬評價問題","名稱與舉行時間必然一致，毋須查證","它因疫情而在 2021 年夏季舉行；「何時舉行」是事實問題，不能單憑名稱（概念）斷定"],"ans":3,"exp":"講者：2020 年夏季奧運會在 2021 年夏季舉行（因為疫情）；要分清名稱與「歷史事件何時發生」的客觀事實。（課堂 2026-09-21 [44:31]–[48:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tfL20260921-4-1xxyz","type":"tf","topic":"m2a","q":"講者指出：未來的事（例如 2027 年會否有美國總統大選）屬事實問題，不應因為「常識上不可能」就 take it for granted 地當作已有定論。","ans":0,"exp":"講者：很有 common sense 的人容易說「2027 年沒有美國大選」，但誰敢說 2027 年一定沒有？涉及人的事總之不確定；「我再講一次，未來的事是事實」。（課堂 2026-09-21 [39:59]–[41:11]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tfL20260921-5-1g9j4","type":"tf","topic":"m2a","q":"講者指出：極端的懷疑論者認為世界上沒有事實問題，只有概念問題。","ans":1,"exp":"剛好相反——講者：極端的懷疑論者覺得所有東西都可以透過經驗方法被推翻，所以從這個角度，世界上沒有概念問題（「極端」二字哲學家是 neutral 地用）。（課堂 2026-09-21 [02:28]–[03:30]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-tfL20260921-6-lqss6","type":"tf","topic":"m2a","q":"講者指出：如果一個人把人際關係（如擇偶、交朋友）完全 KPI 化、量化，那麼在他的價值體系中就沒有評價問題。","ans":0,"exp":"講者：同理於極端懷疑論者沒有概念問題，如果處理人際關係不涉及任何評價、全都可以 KPI 化，在你的價值體系就沒有評價問題；正常在李天命框架下應拆成三類。（課堂 2026-09-21 [23:52]–[25:28]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mcL20260921-6-l0fdp","type":"mc","topic":"m2a","q":"根據講者，在李天命眼中所有價值判斷都屬於哪一類問題？而日常生活中人與人溝通最多的又是哪一類？","opts":["事實問題；評價問題","評價問題；評價問題","評價問題；事實問題","概念問題；事實問題"],"ans":1,"exp":"講者：在李天命眼中所有價值判斷都是評價問題（整個思考方法很有目的性——要推高科學的地位）；日常生活人和人溝通，最多是評價問題。（課堂 2026-09-21 [11:24]–[12:45]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m21-tfL20260921-1-1vyxe","type":"tf","topic":"m21","q":"講者認為，李天命的問題分類／思考方法有其時代目的：在當時社會思考不太科學化的背景下，把這套方法工具化，提高事實問題與科學的地位。","ans":0,"exp":"講者：整個思考方法很有目的性，要推高科學的地位；李天命推行時社會想東西不是很科學化，所以把問題分類、整個思考方法工具化，提高了事實問題和科學。（課堂 2026-09-21 [12:07]、[33:28]–[34:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mcL20260921-7-c4h8h","type":"mc","topic":"m2a","q":"李天命雖想把所有價值判斷歸入評價問題，卻以「甚麼是真、善、美？」作為概念問題的例子。講者解釋的原因是：","opts":["有些哲學家（如柏拉圖）及宗教視真善美為絕對、普遍，而非個人評價；而且談真善美時大家有一個「合約」——至少同意談的是正面、想要的東西","因為真善美可以用經驗方法量度，有客觀數據支持","因為李天命認為所有價值判斷其實都是概念問題","因為真善美屬於數學和邏輯概念，答案有普遍性"],"ans":0,"exp":"講者給兩個原因：①不想打死所有哲學家——柏拉圖、宗教的真善美是絕對、普遍的，不是個人評價；②形容詞（如美）的界線釐清不到，但談的時候有「合約」：美 = 吸引的，善 = 應該做的，真 = 值得相信。（課堂 2026-09-21 [55:52]–[59:50]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m33-mcL20260921-1-1spwp","type":"mc","topic":"m33","q":"講者預告 Module 3：一些「必然地真」的東西，李天命會把它們放在哪一類？","opts":["經驗科學那一類","評價那一類","宗教信仰那一類","數學那一類"],"ans":3,"exp":"講者：「去到 Module 3，一些必然地真的東西，李天命會將它擺在數學那類。」（課堂 2026-09-21 [17:08]）","tags":["lecture"],"src":"lecture 2026-09-21"},{"id":"m2a-mcL20260925-1-mfkpi","type":"mc","topic":"m2a","q":"講者展示科大 2025-26 grade distribution 統計後問：「4000 level 的課程是否比 3000 level 的課程高？」即使以統計數字為基礎，這屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":2,"exp":"講者：這樣表達，就算基於這個統計數字，仍然是評價問題——有主觀成分（要解讀 4000 level、3000 level 代表甚麼課程）。較精練、實在的問法是比較具體的百分比（例如給 A grade 的百分比是否高於大學平均水平），從表中讀出這類比較「就是事實」。（課堂 2026-09-25 [06:36]–[07:46]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2a-mcL20260925-2-oxzcg","type":"mc","topic":"m2a","q":"有同學指出 slide 上「以太陽能代替化石燃料發電是否改善全球暖化的一種方法？」不是一條乾淨的事實問題，講者表示同意。原因是甚麼？","opts":["「改善」一詞帶評價性","「太陽能」一詞有歧義","全球暖化涉及未來，所以必然是評價問題","問題涉及科學理論，所以屬概念問題"],"ans":0,"exp":"講者：因為用了「改善」，所以有評價性——「我買他的解釋」，用字不夠精練。可改為更「悶」的「以太陽能代替化石燃料是否能減低碳排放？」——碳排放純粹是數字高低的差距，屬事實問題。（課堂 2026-09-25 [13:38]–[14:48]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2a-tfL20260925-1-1g2mb","type":"tf","topic":"m2a","q":"在李天命的架構中，「概念先行，跟住事實，最後評價」反映三類問題在價值上有高低之分。","ans":1,"exp":"講者：李天命並沒有作出誰高誰低的評價性判斷；這個先後不是評價性問題，而是方法上的 step 1、step 2、step 3。若 step 3 先行（不釐清講了甚麼、不理事實就給意見），便違反了他自己的批判思考框架。（課堂 2026-09-25 [11:49]–[13:07]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2a-tfL20260925-2-1skmz","type":"tf","topic":"m2a","q":"講者指出：數學、邏輯（以及 programming）所追求的「普遍性」，是指該說法普遍地被一般人接受。","ans":1,"exp":"講者：一般同學會把「普遍性」理解為說法普遍被人接受；但數學、邏輯、programming 追求的普遍性，是就算全世界不認同，它們都是真的——Module 3 會再講它們是絕對地真，真假不會因人的解讀和理解而不同。這也正好引出「語言的歧義性」。（課堂 2026-09-25 [01:23]–[02:21]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-mcL20260925-1-11fy9","type":"mc","topic":"m2b","q":"天文台說「九龍及新界部分地區下雨」。講者用這個例子主要想說明甚麼？","opts":["日常語言有歧義：可解作「整個九龍＋新界部分地區」或「九龍部分地區＋新界部分地區」；人工語言（符號）可清楚區分，但日常我們不會這樣溝通","天文台的預報是錯誤的，屬假陳述","「下雨」是著色字詞","這是言辭空廢，因為天文台的說法必然為真"],"ans":0,"exp":"講者：你看到一個還是兩個解釋？可讀成整個九龍下雨加新界部分地區，或九龍部分地區加新界部分地區；用符號（for all x／for some x）表達會清楚一點，「但正常我們不會這樣溝通」。講者亦指天文台沒有說錯。（課堂 2026-09-25 [18:44]–[20:33]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-mcL20260925-2-hrjam","type":"mc","topic":"m2b","q":"講者以「欠（爭）」、「發夢」、「掛號」為例，說明的是哪一種語言陷阱？","opts":["字詞歧義","語句歧義","含混","著色字詞"],"ans":0,"exp":"講者：語言的歧義性指某個字詞或語句有多過一個意思。「欠」（借 1000 只借了 500 還「欠」500／欠債）、「發夢」（夢想／上堂發夢）、「掛號」（診所掛號／掛號信）都是字詞歧義——單看好像只有一個意思，但在生活中真的會出現多過一個意思。（課堂 2026-09-25 [21:09]–[25:10]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-tfL20260925-1-1n8ie","type":"tf","topic":"m2b","q":"講者指出「（我的兒子／女兒）誰都看不上」除了語句歧義之外，也牽涉字詞歧義（「上」字）。","ans":0,"exp":"講者：此句有兩個語句歧義的讀法（他眼角高、看不上別人／他沒有市場、別人看不上他）；幾年前有學生再拆出第三、第四個解釋——「除了語句歧義之外，這裏是牽涉到字詞歧義的」，有歧義的是「上」字。（課堂 2026-09-25 [45:53]–[47:28]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-mcL20260925-3-14r6z","type":"mc","topic":"m2b","q":"「有室友勝過沒有任何東西；沒有任何東西勝過有個男／女朋友；所以，有室友勝過有個男／女朋友。」講者如何分析這個論證？","opts":["模稜兩可（Equivocation）：「沒有任何東西」在兩個前提中意思不同（nothing／零 vs「沒有東西比你好」＝你是最好的）","歧義句構（Amphiboly）：句子的標點與結構可有兩種讀法","連續體謬誤（Continuum fallacy）：利用含混把能區分的事物說成不能區分","論證有效，結論合理"],"ans":0,"exp":"講者：第一句的「沒有任何東西」是 nothing／零；第二句（例如表白時說「沒有東西比你好」）要整句理解，意思是「你是最好的」，不是說有一樣叫 nothing 的東西比你好。「沒有任何東西」在兩句中意思不同，所以結論不合理——屬與字詞歧義相關的模稜兩可謬誤。（課堂 2026-09-25 [48:24]、[50:52]–[56:05]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-mcL20260925-4-16l9o","type":"mc","topic":"m2b","q":"新聞標題「挪威農民餓死逾400隻豬判囚1年」也可以讀成「挪威農民餓死，逾400隻豬判囚1年」。這屬於哪一種與歧義相關的謬誤？","opts":["歧義句構（Amphiboly）","模稜兩可（Equivocation）","滑坡謬誤（Slippery slope）","訴諸憐憫（Appeal to pity）"],"ans":0,"exp":"講者把「新公屋廁廚加大便利輪椅戶」「挪威農民餓死逾400隻豬判囚1年」「父涉姦兒子女友被捕」等新聞標題列為歧義句構的例子：原意是農民令 400 隻豬餓死而被判囚，但也可讀成農民餓死、400 隻豬判囚。字詞歧義 → 模稜兩可；語句歧義 → 歧義句構。（課堂 2026-09-25 [56:05]–[58:07]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-tfL20260925-2-18gsf","type":"tf","topic":"m2b","q":"講者指出：謬誤不一定是假的，而是一種錯誤、混亂的思維。","ans":0,"exp":"講者：李天命要追求的是真理和謬誤的分別——「謬誤未必是假的，但是一種錯誤、混亂的思維」；到 Module 6 會講有些謬誤是必然真的。（課堂 2026-09-25 [47:57]–[48:24]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-tfL20260925-3-16oae","type":"tf","topic":"m2b","q":"根據講者，含混的語詞沒有明確的界線，即代表它完全沒有界線。","ans":1,"exp":"講者：「沒有明確的界線不代表完全沒有界線」——含混語詞（高矮、肥瘦、貧富、冷暖）有約略的界線；連續體謬誤正正是把「沒有明顯界線」推到「一點界線都沒有」。（課堂 2026-09-25 [59:41]、[66:33]–[66:59]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-mcL20260925-5-l4zqa","type":"mc","topic":"m2b","q":"講者以「開得太快」與「超速」為例，想說明甚麼？","opts":["日常溝通可用含混字詞（如「大聲啲」「講慢啲」），但在立法規管等情況必須具體釐清：「開得太快」本身不是罪，車速超過道路限速某個百分比才叫超速","含混字詞在任何情況下都應該避免使用","「超速」是著色字詞，帶負面情緒","交通警說「開得太快」已足以構成檢控"],"ans":0,"exp":"講者：含混字詞在語言中不可缺少，好處是可約略描述、有彈性；但在某些情況（例如社會上要立法規管）必須很具體——開得太快不是罪，你的速度比道路限速高了某個百分比才叫超速；交通警開告票一定要給你一個數字。（課堂 2026-09-25 [63:56]–[66:03]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-mcL20260925-6-12qit","type":"mc","topic":"m2b","q":"一名學生抱怨：「我和拿 A- 的朋友成績差不多——每份功課只差 2、3 分，為甚麼我只得 C+？」（其實總分相差 20 多分）講者以此為哪一種謬誤的例子？","opts":["連續體謬誤（Continuum fallacy）","滑坡謬誤（Slippery slope）","模稜兩可（Equivocation）","訴諸憐憫（Appeal to pity）"],"ans":0,"exp":"講者自己「比較實際」的連續體謬誤例子：每份 assignment 只差 1 至 3 分，六份加起來就差 20 多分——「是不是差不多？差很多」。連續體謬誤利用含混語詞沒有明確界線，把能約略區分的事物說成沒有分別（李天命的例子：有錢人與窮人）。（課堂 2026-09-25 [66:59]–[72:04]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-tfL20260925-4-pvbtp","type":"tf","topic":"m2b","q":"講者指出：滑坡謬誤的毛病在於推論中的因果關係其實只是可能性，說話者卻利用語詞的含混性把這種可能性推論成必然。","ans":0,"exp":"講者：滑坡謬誤的推論過程表現得好像環環相扣的因果關係，但這些因果關係其實只是一種可能性，說話的人利用語詞的含混性把它推論到必然。例：同意主動安樂死 → 接受被動安樂死 → 草菅人命——政策之間有可能的發展，但沒有必然的結論。（課堂 2026-09-25 [72:04]–[73:38]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-tfL20260925-5-1gpk8","type":"tf","topic":"m2b","q":"講者表示，考試需要背熟並寫出各種謬誤的中英文名稱。","ans":1,"exp":"講者：「這些東西不用背的」——他會給你 terms（括上英文），你大概知道哪個謬誤對應哪個語言特質（例如連續體謬誤、滑坡謬誤 ↔ 含混）就可以；「你不用寫這些字出來的，像 MC 一樣」。（課堂 2026-09-25 [66:03]–[66:33]）","tags":["lecture"],"src":"lecture 2026-09-25"},{"id":"m2b-mcL20260928-1-11pl4","type":"mc","topic":"m2b","q":"講者談到考試中有關「歧義」的題目。以下哪一項符合他的說法？","opts":["若問某字詞有沒有歧義，幾乎一定答「有」；他也不會問某字詞共有多少種歧義","他會要求同學寫出某字詞所有可能的意思","他會出「A. 4 種 B. 5 種 C. 6 種 D. 7 種」這類題目，問某字詞有多少種歧義","若十個 AI model 都說某字詞沒有歧義，答案就是「沒有歧義」"],"ans":0,"exp":"講者：如果問你一個字詞有沒有歧義性，「你幾大都答有」——要證明「沒有」成本太高（就算十個 AI model 都說沒有歧義，同學對卷時找到一個意思他就要認錯）；他「絕對不會」問某字詞有多少種歧義。歧義、含混相關題目估計頂多四、五題 MC。（課堂 2026-09-28 [06:39]–[08:41]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-tfL20260928-1-17mbk","type":"tf","topic":"m2b","q":"根據講者，一個字詞可以同時具有歧義、含混和著色的性質。","ans":0,"exp":"講者以「67」等不同世代的用語為例：「一個字詞可以具有歧義，同時有含混、有著色的」，所以最好釐清對方 in what sense 使用。（課堂 2026-09-28 [02:27]–[03:16]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-mcL20260928-2-1vx2z","type":"mc","topic":"m2b","q":"「小時偷針，大時偷金。」根據講者（及邏輯家的分類），這屬於：","opts":["錯誤類比（不是滑坡謬誤）","滑坡謬誤（Slippery slope）","連續體謬誤（Continuum fallacy）","模稜兩可（Equivocation）"],"ans":0,"exp":"講者：「這個考試如果我會問的話，你記得答案：小時偷針大時偷金並不是一個滑坡謬誤」——邏輯家把兩者分開：錯誤類比是由一件事比較另一件事，有可能性但沒有必然性；滑坡謬誤要有環環相扣的因果推論，「至少是由 A 到 B 到 C」，而這句沒有推論過程。錯誤類比留待 Module 6 再講。（課堂 2026-09-28 [16:57]–[19:06]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-tfL20260928-2-x6c7i","type":"tf","topic":"m2b","q":"只要一個說法把「可能」說成「必然」（例如由 A 推到 B），就一定是滑坡謬誤。","ans":1,"exp":"講者：滑坡謬誤的推論過程必須是環環相扣的因果關係，至少由 A 到 B 到 C；「小時偷針，大時偷金」雖把 A 到 B 的可能說成必然，但沒有推論過程，屬錯誤類比而非滑坡謬誤。（課堂 2026-09-28 [17:46]–[19:06]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-mcL20260928-3-17lv0","type":"mc","topic":"m2b","q":"形容同一個「不斷嘗試、堅持己見、不聽別人說」的人，有人說他「堅定」，有人說他「固執」。這反映哪一種語言陷阱？","opts":["著色字詞（Coloured word）","歧義（Ambiguity）","含混（Vagueness）","言辭空廢（Empty verbalism）"],"ans":0,"exp":"講者：著色字詞是用字時會表達出情緒——形容同一種狀況，好聽點叫堅定，不好聽點叫固執；但事實（例如你試了十次都失敗）不會因用字而改變。（課堂 2026-09-28 [19:06]–[20:28]、[26:40]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-tfL20260928-3-az8if","type":"tf","topic":"m2b","q":"講者以「公僕／公務員」為例，指出同一說法的情緒色彩可以隨年代改變。","ans":0,"exp":"講者：很舊時代的香港，「公僕」是負面的（僕人），後來演變成中性的「公務員」；現在網上說「公僕」反而是說他們謙卑的特質——同一說法在不同年代可以由正面變中性、中性變負面、負面又變中性。（課堂 2026-09-28 [20:28]–[22:12]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-tfL20260928-4-657h9","type":"tf","topic":"m2b","q":"講者認為，以不同的著色字詞描述（如「還有半杯水」vs「剩下半杯水」、「參考」vs「抄襲」），可以改變事實本身。","ans":1,"exp":"講者：人是有情感的生物，所以會用不同字眼表達同一狀況；但「重點是我們改變不了事實」——事實都是你拿了別人的東西來抄、你都是很固執，事實可以很客觀地描述。（課堂 2026-09-28 [24:26]–[26:40]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-mcL20260928-4-mgx3z","type":"mc","topic":"m2b","q":"根據講者，著色字詞在甚麼情況下會成為問題？","opts":["當我們想透過論述說服別人同意自己時，不建基於事實而利用著色字詞（例如廣告用語、政治宣傳）","只要用了帶情緒的字眼，在任何情況下都是謬誤","失敗後用「我很堅定」之類的說法安慰自己（心理調節）","文學創作中使用著色字詞"],"ans":0,"exp":"講者：著色字詞有好處——做人需要心理調節（試了十次失敗，對自己說「我是一個很堅定的人」）；壞處在於：若要透過論述 convince 其他人同意我們的想法，就應該建基於事實，而不是利用著色字詞；日常最常見的是廣告用語和政治宣傳。（課堂 2026-09-28 [26:40]–[28:53]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m22-mcL20260928-1-6q2xr","type":"mc","topic":"m22","q":"李天命批評人文學科的討論常帶有著色語詞。講者認為人文學科中哪一門「真正做到」避開著色字詞？","opts":["歷史","文學","宗教研究","倫理學"],"ans":0,"exp":"講者：學術的歷史研究可以不用任何著色字詞——描述一場戰爭只講為何發生、過程、雙方死傷人數（以數字表達），不用說「英勇殺敵」或正義／不正義的戰爭；「人文學科裏面真正做到的就是歷史」。至於歷史學家是否在做科學研究，Module 3 再討論。（課堂 2026-09-28 [38:06]–[40:16]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m22-tfL20260928-1-9jpb5","type":"tf","topic":"m22","q":"講者認為文學也應該盡量避免使用著色字詞。","ans":1,"exp":"講者：文學不應該避開著色字詞——如果文學家都避了著色字詞，便沒有文學（描寫文、抒情文寫不到），最後只能做文學批評而不是創作；著色字詞是人類語言必然的一部分。（課堂 2026-09-28 [34:32]–[36:35]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-mcL20260928-5-3lfc5","type":"mc","topic":"m2b","q":"一名殺害自己父母、證據確鑿的被告向法官求情，理由是「我已經是孤兒」。講者如何分析？","opts":["訴諸憐憫：「他是孤兒」雖是事實，但不是求情理由——孤兒狀況是他一手造成的","不是謬誤，因為他所說的是事實","訴諸情感是訴諸憐憫的子類，所以這屬訴諸情感而非訴諸憐憫","滑坡謬誤"],"ans":0,"exp":"講者：訴諸情感是一個謬誤大類，訴諸憐憫是其子類——透過說話博取同情，避開事實的理據。被告是孤兒是事實，但不是求情理由：孤兒狀況是他自己一手一腳造成的（同理：考試作弊不合格，求老師讓他合格以免找工作困難）。（課堂 2026-09-28 [56:38]–[59:24]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-tfL20260928-5-19jgk","type":"tf","topic":"m2b","q":"言辭空廢的問題在於說話者所說的內容是假的。","ans":1,"exp":"講者：言辭空廢的問題「不是在於他講的東西是假」——重言命題是必然真的語句，說話者只是透過說出必然真的語句去假裝說了話（冒充事實陳述），是思考溝通上的毛病。（課堂 2026-09-28 [62:36]–[63:05]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-mcL20260928-6-1pdwv","type":"mc","topic":"m2b","q":"根據講者，「絕對空廢」必須符合哪兩個條件？","opts":["① 重言命題（語句形式）；② 冒充事實陳述","① 語句是假的；② 冒充事實陳述","① 語句有歧義；② 語句含混","① 重言命題；② 使用著色字詞"],"ans":0,"exp":"講者：絕對空廢要跟從言辭空廢的整個定義，有兩個條件：第一，重言命題（是一個語句形式）；第二，冒充事實陳述。例：記者問「做生意可否不理商業道德？」答「做生意就是做生意」——A 就是 A，必然真但沒有信息內容。（課堂 2026-09-28 [62:36]–[68:55]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-tfL20260928-6-1c4s0","type":"tf","topic":"m2b","q":"財政司回應「如果明年總支出大於總收入，就會出現財政赤字」並不是「A 就是 A」的句式，所以講者認為它不可能是絕對空廢。","ans":1,"exp":"講者在講絕對空廢時舉此例：這個回應「未必一定是 A 就是 A 這個感覺」，它是給你一個定義；他總結絕對空廢所要求的重言形式可以是「A 就是 A」、「因為 A 所以 A」，或第三種情況——給你一個定義。（課堂 2026-09-28 [70:51]、[75:36]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-mcL20260928-7-u2x3x","type":"mc","topic":"m2b","q":"算命師說「父在母先亡」，無論讀成「父在，母先亡」或「父在母之前亡」都會「應驗」。根據講者，這屬於：","opts":["相對空廢：不需重言句形式，但分析內容和語境後可知它必然為真；而且是由歧義導致的言辭空廢","絕對空廢：具有「A 就是 A」的重言句形式","連續體謬誤","著色字詞"],"ans":0,"exp":"講者：一個人的言辭空廢可以因為歧義而導致——「父在，母先亡」或「父比母先亡」；連兩人同時離世，算命師都可以自圓其說。相對空廢是言辭空廢定義放寬後的產物（提高使用率），不需要重言句形式，而是分析語句內容及語境後，知道結果必然為真——相對於絕對空廢是「稍微鬆散的狀態」。（課堂 2026-09-28 [71:37]、[74:30]–[75:36]）","tags":["lecture"],"src":"lecture 2026-09-28"},{"id":"m2b-mcL20261002-1-mbh6w","type":"mc","topic":"m2b","q":"講者在課堂上示範了一道考試式題目：在沒有任何人發問的情況下，有人說「我的生母是女人。」這屬於以下哪一類？","opts":["絕對空廢","相對空廢","不是言辭空廢"],"ans":2,"exp":"講者：答案是 C——沒有人問問題，只是有人自己講。「我的生母是女人」雖然必然為真（生母按定義是女性），但言辭空廢無論絕對或相對，都要同時是「必然為真」並且「冒充事實陳述」；這裏沒有冒充事實陳述。（課堂 2026-10-02 [19:44]–[21:30]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m2b-tfL20261002-1-16qr5","type":"tf","topic":"m2b","q":"講者提示：考試中要判斷為言辭空廢，題目必定是「有問有答」的情境，因為言辭空廢的其中一個條件是冒充事實陳述。","ans":0,"exp":"講者：所有例子都是有問有答的，「所以你考試……你要答言辭空廢，一定是有問有答」，因為兩個條件之一是冒充事實陳述。Dr. Lam 在 Concourse 自言自語「做生意就是做生意」不是言辭空廢——沒有人期望他提供事實陳述。（課堂 2026-10-02 [18:11]–[19:44]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m2b-tfL20261002-2-x4xje","type":"tf","topic":"m2b","q":"學生問：「可否舉例說明甚麼是重言句？」講者答：「例如『喜歡就是喜歡』就是一句重言句。」由於這個回答必然為真，所以構成絕對空廢。","ans":1,"exp":"講者：這個回答必然為真，但他是在回答對方的問題，沒有冒充事實陳述；同理，有人問「你親生媽媽是不是女人？」，答「我的生母是女人」也是合理回答。（課堂 2026-10-02 [21:30]–[22:52]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m2b-mcL20261002-2-7sjrd","type":"mc","topic":"m2b","q":"算命師傅說「父在母先亡」。根據講者的分析，它屬於相對空廢而不是絕對空廢，原因是：","opts":["它具有「A 就是 A」的重言句形式，一看語句就知道必然為真","它本身不是重言句形式；要多走一步分析，發現語句有歧義（「父在，母先亡」／父先於母而亡），拆成兩句之後才知道它必然為真","它是一個假的陳述，而相對空廢就是以假的內容冒充事實陳述","它沒有冒充事實陳述，只是表達算命師傅的情感"],"ans":1,"exp":"講者：「父在母先亡」本身不是重言句；經分析才知道它有歧義——意思一：爸爸先於媽媽離開世界；意思二（加逗號）：父在，母先亡。是語句的歧義性令它必然為真，「所以我們不會將它歸類為一個重言句」，因為要再經過多一步分析，把一句拆成兩句。（課堂 2026-10-02 [02:32]、[04:56]–[05:50]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m2b-mcL20261002-3-1fxmv","type":"mc","topic":"m2b","q":"數據分析員說「明年市場會出現動盪」。講者指出這句話之所以「必然為真」，主要是因為：","opts":["它具有「如果 P 則 P」的重言句形式","「市場」一詞有歧義，可以指街市或股票市場","「動盪」是含混的字眼：大升、大跌、先升後跌，甚至停市三個月，都可以說成「動盪」","它是一個概念問題的答案，毋須經驗證據"],"ans":2,"exp":"講者：這句話不是重言句形式，但「動盪」是含混的——多少動盪才叫動盪？市場任何時候都不是平的，升很多、跌很多、升完再跌都是動盪，停市三個月也「很動盪」。分析相對空廢時，很多時牽涉語言的歧義和含混。（課堂 2026-10-02 [15:46]–[17:42]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m2b-tfL20261002-3-198vj","type":"tf","topic":"m2b","q":"講者分析算命師傅「你明年會有感情問題」時指出：無論你明年一直單身、開始拍拖、穩定拍拖還是分手，都可以被說成「有感情問題」，因為「感情問題」具有歧義性。","ans":0,"exp":"講者：單身 14 個月是問題；由單身變拍拖——「你本來單身是沒有感情問題的」；穩定拍拖 14 個月——「為甚麼不結婚？」；由拍拖變分手更明顯——「感情問題有歧義性的，絕對有歧義性的」。「事業不順利」同理，所以「算命師傅是講盡的」。（課堂 2026-10-02 [09:46]–[14:11]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m2b-tfL20261002-4-1w2k7","type":"tf","topic":"m2b","q":"除了「A 就是 A」「A 因為 A 所以 A」和「給一個定義」之外，講者補充了 slides 沒有提及的另一種重言句形式：「A 或者非 A」，例如被問「你明天來不來？」時答「來或者不來」。","ans":0,"exp":"講者：「還有一種這裏沒有講的」——記者問做生意可以不理商業道德嗎？答「理或者不理」；「你明天會不會來？」答「來或者不來」；「明年會不會有赤字？」答「有或者沒有」——都是重言句形式，「在語句上就見到它是必然地真」。（課堂 2026-10-02 [03:02]–[04:56]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m2b-mcL20261002-4-egiln","type":"mc","topic":"m2b","q":"講者請 AI（Gemini）列出香港人日常最常聽到的「廢話」，再逐句分析。他對「言辭空廢是否等於日常所說的廢話？」的結論是：","opts":["兩者完全等同：所有日常廢話都是言辭空廢","部分日常廢話可以歸類為言辭空廢，但兩個概念並不等同；他舉的約 20 個例子中，只有一個要看清對方問甚麼之後才有機會是言辭空廢","兩者完全沒有交集：日常廢話都是假話，而言辭空廢必然為真","日常廢話都屬於著色字詞，與言辭空廢無關"],"ans":1,"exp":"講者以「舉例說明」逐句分析是否符合言辭空廢的兩個條件（重言／必然為真 + 冒充事實陳述）：「有部分日常生活的廢話可以歸類為言辭空廢，但這兩個概念不是重疊的」——20 個例子「19 比 1」，那一個要看 context（對方問甚麼）。（課堂 2026-10-02 [36:43]–[38:48]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m2b-mcL20261002-5-1hsa2","type":"mc","topic":"m2b","q":"根據講者的分析，以下哪一組「問與答」構成言辭空廢？","opts":["問：「為何你這麼久都單身？」答：「科大學習壓力很大，我沒有時間。」","問：「為何你這麼早走？」答：「我是 I 人，社交能量用盡。」","顧客問：「為何你要這樣做？」職員答：「不好意思，我只是跟公司規矩做。」","問：「為何你這麼久都單身？」答：「緣份來的話，自然會來。」"],"ans":3,"exp":"講者：問你為何單身，答「緣份來的話就自然會來」是（絕對）空廢；答「科大學習壓力很大」「我是 I 人」是給了一個原因——答案未必令人滿意，但不是重言形式；「跟公司規矩做」是 report 自己怎樣做事，提供了一個事實（信息內容），沒有冒充事實陳述。（課堂 2026-10-02 [28:20]–[29:28]、[33:19]–[36:05]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m31-tfL20261002-1-fk8yc","type":"tf","topic":"m31","q":"在「人是理性的動物」這個定義中，「理性」和「動物」這兩個性質是「人」這個概念的外延。","ans":1,"exp":"講者：「人」是被界定端，「理性的動物」是界定端；說出「理性的動物」其實是給了兩個性質（理性、動物），「這兩個性質就是一個概念的內涵」。外延是符合這個內容的例子。（課堂 2026-10-02 [40:27]–[41:27]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m31-tfL20261002-2-43md9","type":"tf","topic":"m31","q":"講者指出，內涵與外延的第一個關係（外延由內涵決定，反之不然）反映了分析哲學家「先觀察世界上的事物，再從中歸納出概念」的世界觀。","ans":1,"exp":"剛好相反——講者：第一個關係反映分析哲學家「概念先行」的世界觀：世界上我們見到的東西，在見到之前其實應該先有一個概念；外面世界見到的東西是被內涵（概念的內容）決定的，內涵佔主導。（課堂 2026-10-02 [43:54]–[45:09]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m31-mcL20261002-1-9ckqo","type":"mc","topic":"m31","q":"講者以「2025 福布斯全球首富」和「2025 福布斯美國首富」作為「內涵不同、外延相同」的例子，並特別在定義中標明年份。這主要是因為：","opts":["數學定義（如等邊三角形）也會隨時間改變，所以所有定義都必須標明年份","標明年份可以令兩個概念的內涵變成相同","福布斯是美國機構，所以全球首富按定義必然是美國人","這類由機構制定的定義（例如計不計負債、以哪一天還是全年平均計算）可以隨時間改變，首富亦未必每年相同，所以要講明是甚麼時候"],"ans":3,"exp":"講者：等邊／等角三角形的外延五千年前問、五千年後問都一樣，「數學這些不能調節」；但研究機構可以改變它怎樣定義「最有錢」（減不減負債、計哪一天還是全年平均），所以這類定義通常要講明時間。2025 年兩者都是 Elon Musk，但 2024 年不是，有機會是歐洲人——「不是 by default 美國人做首富」。（課堂 2026-10-02 [47:44]–[51:46]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m31-mcL20261002-2-nx0ge","type":"mc","topic":"m31","q":"講者分析「香港人是中國人」這句話時指出它有歧義。以下哪一項最符合他的分析？","opts":["因為香港人與中國人外延不同，所以「香港人是中國人」在任何意思下都是假的","若意思是「香港人包括在中國人之中」（七百多萬人在約十四億人之內），答案是「是」；若意思是「香港人等同（equivalent）中國人」，答案是「不是」——兩者外延不同，內涵也不同","因為香港人包括在中國人之中，所以「香港人」和「中國人」的內涵相同","這是評價問題，答「是」或「不是」只視乎個人價值觀"],"ans":1,"exp":"講者：香港人是中國人？「是、是、是」——香港的七百多萬人包括在十四億人之中；但第二個意思是 equal／equivalent：「絕對不是」，兩個概念外延不一樣，由此推論內涵也不一樣。「邏輯很 hard core，是就是，不是就不是」——不是的話，我們就理解到字詞有歧義。（課堂 2026-10-02 [52:24]–[58:01]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m31-mcL20261002-3-js4y7","type":"mc","topic":"m31","q":"講者把「科大學生」→「科大本科生」→「科大商學院本科生」→「現正修讀 HUMA1710 的科大商學院本科生」→「現正修讀 HUMA1710 而聽得明廣東話的科大商學院本科生」依次排列。最後一步主要用來說明：","opts":["內涵遞增時，外延必定嚴格遞減","外延決定內涵，反之不然","內涵遞增時，外延通常減少，但也可能數量不變——所以規則說外延以「不遞增」（而非「遞減」）的次序排列","外延有所變動，代表內涵反向改變"],"ans":2,"exp":"講者：內涵遞增（為概念多加一層描述）→ 外延分子通常越來越少；但加上「聽得明廣東話」這一層，數量應該是一樣的，「所以規矩會是不遞增的次序排列」。他在這個例子打了個問號，因為是否真的人人都聽得明廣東話是事實問題。（課堂 2026-10-02 [58:01]–[62:29]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m31-tfL20261002-3-1690c","type":"tf","topic":"m31","q":"講者表明，期中考不會考內涵與外延的第三個關係「內涵固定則外延固定」（即 Copi 以「人」與「活人」所作的解釋）。","ans":0,"exp":"講者：「我想再次說，考試呢，我不考這個規律」（說了兩次），改為留給大家在 e-portfolio 討論；10 月 5 日再確認：「上次有個打星，我話我唔考嘅」。他亦補充：即使沒有這條，有少少數學底也可由第一、二個關係推論到內涵固定、外延固定。（課堂 2026-10-02 [67:48]；2026-10-05 [03:17]–[04:17]）","tags":["lecture"],"src":"lecture 2026-10-02"},{"id":"m31-mcL20261005-1-jntt4","type":"mc","topic":"m31","q":"講者以「合資格申請獎學金的學生」說明內涵與外延的第四個關係。假設今年合資格申請某獎學金的學生比去年多了，根據這個關係，最合理的推論是：","opts":["申請資格收緊了（內涵增加）","獎學金的總金額增加了，所以實際獲獎的人數必定更多","申請資格放寬了（內涵減少），例如 GPA 要求降低，或由只限某一學院改為五個學院都可申請","內涵與外延互不相干，所以無從推論"],"ans":2,"exp":"講者：在不知道內涵時，可由外延的變動推論內涵反向改變——外延增加、包含的人多了，代表申請資格放寬、要求低了（例如 GPA 要求不同了，或本來只限 Science School，現在五個 school 都可以）。但要分清「合資格申請獎學金學生」與「實際拿到獎學金學生」是兩個概念：實際拿到錢還要看獎學金 pool 有多少錢。（課堂 2026-10-05 [20:01]–[24:06]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-mcL20261005-2-1p8c1","type":"mc","topic":"m31","q":"科學家在未探索的海域發現一種新生物，經 DNA 檢驗及研究後，發現它完全符合現時「哺乳類動物」的定義（內涵）。根據講者，以下哪項描述最恰當？","opts":["「哺乳類動物」的外延增加了一個，根據第四個關係，其內涵必須反向減少","「哺乳類動物」的外延一直都包括這種未被發現的生物，外延並沒有「加一」；發現者的功勞是依照內涵找到某個外延","這個發現推翻了「哺乳類動物」的定義，需要重新界定其內涵","發現者的功勞在於為「哺乳類動物」的內涵增加了新內容"],"ans":1,"exp":"講者：若所有特徵都與現時哺乳類動物的定義（內涵）相符，就把它標籤為一隻新的哺乳類動物，不會推翻定義；發現者的 credit「不是幫內涵找到更多的內容，而是跟着內涵找到某個外延」——它在被發現之前已存在；「外延是否加一？在這個見解之下，沒有加一」。大部分概念都是非完整外延。（課堂 2026-10-05 [16:05]–[18:31]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-mcL20261005-3-hwi2e","type":"mc","topic":"m31","q":"講者假設你作為太空人登陸火星，見到一個兩手兩腳、樣子像 Dr. Lam 的物體。根據他「概念先行」的分析，以下哪項最恰當？","opts":["立即創造一個全新概念「火星人」，因為已有的概念無法用來理解未知的事物","它出現在火星，所以按定義不可能是人","是否稱它為人屬評價問題，視乎各人的價值觀","先以已有的概念稱它為「火星上的類人形生物」；若捉來驗 DNA 發現基因排序與人類一樣，它就是人——「火星人」只是像「非洲人」「北美人」一樣的地域分野"],"ans":3,"exp":"講者：我們是以已有的知識去了解未知——你只會說它是「火星上的類人形生物」，整個概念的內涵都是你已有的；驗 DNA 後若與人類基因排序一樣，問題就變成「為甚麼火星上有個地球人」，再叫它「火星人」只是地域上的分野，都是人類。所以「人」這個概念的確包括未來未知的分子。（課堂 2026-10-05 [10:05]–[15:20]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m2a-mcL20261005-1-jpl8m","type":"mc","topic":"m2a","q":"「香港的法定年齡是 20 歲嗎？」屬於哪一類問題？","opts":["概念問題","事實問題","評價問題"],"ans":1,"exp":"講者：「什麼是法定年齡？」是概念問題；「香港的法定年齡是 18 歲嗎？」是事實問題；「香港的法定年齡是 20 歲嗎？」也是事實問題（答案是「不是」，不影響它是事實問題）；「香港的法定年齡定在 18 歲合理嗎？」是評價問題。（課堂 2026-10-05 [48:10]–[49:20]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m2a-tfL20261005-1-1eadr","type":"tf","topic":"m2a","q":"「香港的法定年齡定在 18 歲合理嗎？」與「什麼是法定年齡？」同屬概念問題。","ans":1,"exp":"講者：「什麼是法定年齡？」是概念問題；但「定在 18 歲合理嗎？」問的是合不合當——評價問題。分析哲學會拆開：是不是 18 歲？（事實）未到 18 歲是否犯法？（事實）只差兩天為甚麼犯法？（評價）。（課堂 2026-10-05 [48:10]–[49:20]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-tfL20261005-1-7inbr","type":"tf","topic":"m31","q":"講者指出：在香港，17 歲 11 個月的人做只有成年人才可以做的事是犯法的；但從分析哲學的角度，「18 歲」這個法定年齡本身沒有真假可言，只能判斷是否恰當。","ans":0,"exp":"講者：不同國家的法定年齡不同（16、17、18、20、21）；在香港 17 歲 11 個月做成年人才可做的事，犯法；但「18 歲」本身是社會約定出來的，沒有真假可言——可以判斷是否恰當，但沒有真假（釐定的定義）。（課堂 2026-10-05 [45:29]–[48:10]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-mcL20261005-4-1w1cp","type":"mc","topic":"m31","q":"講者解釋為何「法定年齡」「超速」「合適每週工作時間」這類釐定的定義沒有真假可言。他給的理由是：","opts":["它們都是新創的詞語，只有接受與否","它們都有歧義，所以無法判斷真假","它們全部是人為（社會約定）制定的界線，只能討論是否恰當","它們涉及未來的事，現時無法用經驗方法驗證"],"ans":2,"exp":"講者：「為甚麼這些沒有真假可言？全部人為的」——人類制定出來的東西，沒有真假可言；合不合當則可以談。釐定的定義處理「太快」「太慢」這類含混字眼，只是在社會中大概給一個應用範圍。「新創、只有接受與否」是規創的定義。（課堂 2026-10-05 [45:29]、[49:20]–[49:59]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-mcL20261005-5-1cevy","type":"mc","topic":"m31","q":"根據講者，分析哲學在定義的分類中主要強調哪一種定義？","opts":["規創的定義——因為分析哲學最重視創新","釐定的定義——因為分析哲學要為社會訂立恰當的法律界線","三種同樣重要，分析哲學沒有偏重","字詞定義——它消除歧義、說出被界定端應有的意思（不多不少），而且有真假可言；規創與釐定的定義都沒有真假可言"],"ans":3,"exp":"講者：分析哲學要做的定義主要是字詞定義，其他分類是告訴大家「這個不是他的討論範圍」；在他們眼中，一件事物有意義至少要講得上真或假——規創（創新）與釐定（含混、只能約定合理應用範圍）都釐清不到一個有真假可言的定義。（課堂 2026-10-05 [40:58]–[43:18]、[62:58]–[64:17]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-tfL20261005-2-14v8a","type":"tf","topic":"m31","q":"講者指出，「佛系」「0尊」這類規創的定義沒有真假可言，只有接受與否；但規創的意義經過一段時間的運用之後，可以變成有真假可言的字詞定義（例如「蘇絲黃」）。","ans":0,"exp":"講者：規創是講新東西，沒有真假可言，只是接受不接受（佛系、0尊）；規創的意義經過一段時間運用後，會變成有真假可言的字詞定義——「蘇絲黃」是較舊派的文學用語，代表某種文化、某種性別的形象，有真假可言。（課堂 2026-10-05 [43:18]–[45:03]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-mcL20261005-6-115cr","type":"mc","topic":"m31","q":"講者以「鳥」為例講解字詞定義的規則。以下哪一項正確？","opts":["「鳥是有翅膀的動物」太窄——把駝鳥踢走了","「鳥是有翅膀的動物」太闊——把蝙蝠等不應歸類為鳥的動物也包了進去","「鳥是有羽毛會飛的動物」太闊——把蝙蝠也包了進去","「鳥是有羽毛會飛的動物」犯了循環定義"],"ans":1,"exp":"講者：太闊 = 把不應歸類為該概念的東西包了進去（「有翅膀的動物」包括蝙蝠）；太窄 = 反過來把應該在該類別內的事物踢走（「有羽毛會飛的動物」排除了駝鳥）。循環的例子是「心理學是研究心理相關的學科」。（課堂 2026-10-05 [64:17]–[66:52]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-mcL20261005-7-1bz5x","type":"mc","topic":"m31","q":"朋友問你「甚麼是心理學？」，你答：「心理學就是研究心理相關的學科。」講者對這個定義的評語最接近：","opts":["說得「沒錯」，但只是把字面上已見到的意思說出來，犯了循環；維基百科的定義（研究人類和動物的心理現象、意識和外在行為的科學）提供了多得多的內容","這是一個太闊的定義，因為它把社會科學也包括了進去","這是一個規創的定義，所以沒有真假可言","這是一個好定義，因為它簡潔而且沒有錯"],"ans":0,"exp":"講者：「心理學就是研究心理相關的學科——沒錯」，但它只是講出你在字面上本來就看到的意思（違反不可循環）；他改引維基百科：心理學是一門研究人類和動物的心理現象、意識和外在行為的科學——多了很多東西：它是一門科學、包括人類和動物等。（課堂 2026-10-05 [66:13]–[69:30]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-tfL20261005-3-ju8a1","type":"tf","topic":"m31","q":"講者認為，像英文字母「A」這類符號沒有內涵。","ans":1,"exp":"講者問「有沒有一個無內涵的語詞或概念？」——英文字母 A 的內涵：是英文字母（不是中文字）、排第一；有這個概念，才能替幼稚園學生默寫 26 個字母打剔或打交叉。形而上的概念（如「道」）也有內涵——「很難沒有的」。（課堂 2026-10-05 [30:40]–[36:03]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m32-tfL20261005-1-ep1tq","type":"tf","topic":"m32","q":"講者以「九大行星變八大行星」對比 2020 年夏季奧運會延至 2021 年舉行卻沿用「2020」之名，指出科學的特質之一是肯認錯、修正，而科學認受性高正是因為它接受錯誤。","ans":0,"exp":"講者：科學家的態度是認錯——第一改掉它，第二說對不起，以前錯誤地將冥王星當成行星之一；奧運沿用「2020」可以有經濟上的解讀，若說成「紀念人類疫情的苦難、人類很團結」就是很著色的表達。「錯是無所謂的，而科學為何認受性高，是因為它接受錯誤」——下一個題目會再講。（課堂 2026-10-05 [24:06]–[30:40]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m2a-mcL20261005-2-1jkne","type":"mc","topic":"m2a","q":"講者把定義的分類與李天命的問題分類相比。根據他的說法，李天命與分析哲學傳統主要處理哪一類問題？","opts":["純邏輯分析的概念問題——評價問題不碰，事實問題也不碰（沒有能力碰）","評價問題——因為日常溝通最多是評價問題","事實問題——分析哲學家親自做經驗研究以推高科學的地位","三類問題都同樣處理"],"ans":0,"exp":"講者：其他定義分類是告訴大家「這個不是他的討論範圍」，等於李天命一開始的問題分類——要把評價問題劃分出來，但他自己和分析哲學的傳統是不碰評價問題的，「事實問題他們都不碰的，沒有能力碰」，於是變成處理純邏輯分析的概念問題。（課堂 2026-10-05 [40:58]–[42:16]）","tags":["lecture"],"src":"lecture 2026-10-05"},{"id":"m31-mcL20261009-1-18ssd","type":"mc","topic":"m31","q":"講者在課堂練習（亦作為考試 T/F 題的示範）中問：「正方形為四條邊的圖形」這個定義有甚麼問題？","opts":["太窄：排斥了某些應該是正方形的圖形","循環：被界定端「正方形」出現在界定端","太闊：會把長方形等不應是正方形的圖形也包括在內","沒有問題：這是一個合理的字詞定義"],"ans":2,"exp":"講者：判斷太闊，就是看定義會否包了不應是正方形的東西入去，例如長方形。他並以「這個定義太闊嗎？」示範考試的 True or False 題。（課堂 2026-10-09 [12:10]–[12:59]）","tags":["lecture"],"src":"lecture 2026-10-09"},{"id":"m31-tfL20261009-1-uvibl","type":"tf","topic":"m31","q":"講者分析「家屬指的是父母、兄弟」這個定義時指出，它把祖父母等應屬家屬的人排除在外，所以屬於定義太窄。","ans":0,"exp":"講者：家屬還包括兄弟姊妹、祖父母——「阿爺阿嫲不算家屬嗎？排除了他們在外」，即排斥了應包括的成員（太窄）；他亦提醒帶男／女朋友見家長時，小心有沒有把對方排斥在家屬之外。（課堂 2026-10-09 [12:59]–[14:40]）","tags":["lecture"],"src":"lecture 2026-10-09"},{"id":"m31-mcL20261009-2-ch0iy","type":"mc","topic":"m31","q":"若把定義改為「家屬指的是<strong>例如</
